<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a printed commentary page. One dense sheet: the passage sits in the middle in a large book
   face; comments on the text run down the inner column, comments on comments down the outer column,
   and both wrap above and beneath the passage. Type size and position carry the hierarchy. */
:root {
  --paper: #eef1f4; --sheet: #fdfdfb; --ink: #14181f; --ink-2: #505a69; --rule: #c9d0d9;
  --mark: #f0bf00; --warn: #8a5a00;
  --a0: #c2362b; --a1: #1565c0; --a2: #1b7f4b; --a3: #7b3fb5;
  --a4: #a85a00; --a5: #0b7c8c; --a6: #b02a78; --a7: #56606e;
  --text: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --gloss: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
  --small: "Alegreya Sans SC", "IBM Plex Sans", system-ui, sans-serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --lead: 3.9rem;   /* three commentary lines run above the passage */
  --flip: none;     /* dark theme: turns the black parts of a two-colour logo white and keeps its colour */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1216; --sheet: #171b21; --ink: #e7eaef; --ink-2: #9ba5b3; --rule: #333b46;
  --mark: #d9a800; --warn: #e6b450;
  --a0: #ff8a7a; --a1: #7fb4ff; --a2: #6fd39a; --a3: #c39bff;
  --a4: #f0a856; --a5: #5fd0de; --a6: #ff8cc6; --a7: #aab4c2; --flip: invert(1) hue-rotate(180deg); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1216; --sheet: #171b21; --ink: #e7eaef; --ink-2: #9ba5b3; --rule: #333b46;
  --mark: #d9a800; --warn: #e6b450;
  --a0: #ff8a7a; --a1: #7fb4ff; --a2: #6fd39a; --a3: #c39bff;
  --a4: #f0a856; --a5: #5fd0de; --a6: #ff8cc6; --a7: #aab4c2; --flip: invert(1) hue-rotate(180deg); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 0.9375rem; line-height: 1.5;
  padding-block: 1.25rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 92rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.banner { border: 1px dashed var(--warn); color: var(--warn); padding: 0.5rem 0.75rem; font-size: 0.85rem }

/* maker's marks */
.g { flex: none; display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--c); vertical-align: baseline }
img.g, .g.mark { width: 0.95em; height: 0.95em; border-radius: 0; background: none; vertical-align: -0.12em }
img.g.flip { filter: var(--flip) }
.g.mark { background: var(--c); -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat }
.tag { font-family: var(--small); font-style: normal; font-size: 0.78em; color: var(--ink-2); margin-left: 0.15em }

/* the sheet */
.daf { background: var(--sheet); border: 1px solid var(--rule); padding: 0.9rem 1.1rem 1.3rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.7rem 1.2rem }
.runhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: 1rem; border-bottom: 1px solid var(--ink); padding-bottom: 0.35rem }
.runhead h1 { font-family: var(--text); font-weight: 600; font-size: clamp(1.25rem, 1rem + 1.2vw, 1.8rem); line-height: 1.15; margin: 0; text-align: center; text-wrap: balance }
.runhead span { font-family: var(--small); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.06em; color: var(--ink-2) }
.runhead span:last-child { text-align: right }

.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.3rem 1.5rem; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--sheet); border-bottom: 1px solid var(--rule); padding-block: 0.3rem; margin-top: -0.7rem }
.key, .ctl { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; align-items: center; font-family: var(--small); font-size: 0.85rem; min-width: 0 }
/* a maker's mark names its model when pointed at */
.who { position: relative; white-space: nowrap }
.who:hover::after { content: attr(data-name); position: absolute; left: 0; bottom: 100%; z-index: 3; padding: 0.1rem 0.45rem; background: var(--ink); color: var(--sheet);
  font: 500 0.8rem/1.4 var(--small); letter-spacing: 0.02em; text-indent: 0; pointer-events: none }
.key button { display: inline-flex; align-items: center; gap: 0.35rem; background: none; border: none; padding: 0.1rem 0; text-align: left; line-height: 1.2 }
.key button b { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums }
.key button[aria-pressed="false"] { opacity: 0.4; text-decoration: line-through }
.ctl label { display: flex; align-items: center; gap: 0.4rem }
.ctl input { width: 6.5rem; accent-color: var(--ink) }
.ctl button, .all, .sheet-close { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 0.05rem 0.6rem; font-family: var(--small) }
.all { justify-self: start; border-color: var(--ink); padding: 0.4rem 1rem; font-weight: 700; font-size: 0.95rem }

.passage { min-width: 0; max-width: 34rem; margin: 0 auto }
.passage p { font-family: var(--text); font-size: 1.2rem; line-height: 1.5; margin: 0; text-align: justify; hyphens: auto; text-indent: 1.2em }
.passage p:first-of-type { text-indent: 0 }
.incipit { display: block; width: fit-content; margin: 0.35rem auto 0.7rem; padding: 0.2rem 1.5rem; border: 3px double var(--ink); outline: 1px solid var(--ink); outline-offset: 3px;
  font-size: 1.55em; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-indent: 0; line-height: 1.3 }
.seg { background-image: var(--ul); background-size: 100% 1px; background-position: 0 100%; background-repeat: no-repeat }
.seg.lit { background-color: color-mix(in srgb, var(--c, var(--mark)) 22%, transparent); background-size: 100% 3px }
sup.m { font-family: var(--small); font-weight: 700; font-size: 0.56em; line-height: 0; color: var(--c); cursor: pointer; padding: 0 0.08em; text-indent: 0 }
sup.m:hover, sup.m.lit { text-decoration: underline }

/* run-on commentary */
.col, .under { font-family: var(--gloss); font-size: 0.92rem; line-height: 1.4; text-align: justify; hyphens: auto; min-width: 0; overflow-wrap: break-word }
.c { cursor: pointer; border-radius: 2px; scroll-margin: 6rem }
.c { background: color-mix(in srgb, var(--c) 6%, transparent); -webkit-box-decoration-break: clone; box-decoration-break: clone }
.c:hover, .c.lit { background: color-mix(in srgb, var(--c) 17%, transparent) }
.c.kin { background: color-mix(in srgb, var(--c) 12%, transparent) }
.q { text-decoration: underline 1px var(--c); text-underline-offset: 2.5px }
.q.lit { text-decoration-thickness: 2.5px; background: color-mix(in srgb, var(--c) 22%, transparent) }
.c .n { font-family: var(--small); font-weight: 700; font-size: 0.72em; color: var(--c); vertical-align: 0.35em; line-height: 0; margin: 0 0.2em 0 0.1em }
.c .hd { white-space: nowrap }
.c .on { font-family: var(--small); font-size: 0.8em; color: var(--ink-2) }
.c .lemma { font-weight: 700 }
.c .end { color: var(--ink-2) }
.c code { font-size: 0.9em }
.c.flash { animation: flash 1.6s ease-out }
@keyframes flash { from { background: color-mix(in srgb, var(--mark) 55%, transparent) } to { background: transparent } }
@media (prefers-reduced-motion: reduce) { .c.flash { animation: none; outline: 2px solid var(--mark) } }
.push, .notch { display: none }
.under { border-top: 1px solid var(--ink); padding-top: 0.5rem; font-size: 0.85rem }
.colophon { font-family: var(--text); font-style: italic; color: var(--ink-2); font-size: 0.9rem; text-align: center }

/* reading view: one thread at a comfortable size */
dialog.sheet { margin: auto; width: min(44rem, calc(100% - 2rem)); max-height: 86dvh; padding: 0; border: 1px solid var(--ink); background: var(--sheet); color: var(--ink) }
dialog.sheet::backdrop { background: rgb(0 0 0 / 0.5) }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; background: var(--sheet); border-bottom: 1px solid var(--rule); padding: 0.8rem 1.1rem 0.7rem }
.sheet-title { font-family: var(--text); font-style: italic; font-size: 0.98rem; min-width: 0; background: none; border: none; padding: 0; text-align: left }
button.sheet-title:enabled:hover { text-decoration: underline }
.sheet-body { display: flex; flex-direction: column; gap: 1.2rem; padding: 1rem 1.1rem 1.5rem }
.thread { display: flex; flex-direction: column; gap: 0.7rem }
.thread + .thread { border-top: 1px solid var(--rule); padding-top: 1rem }
.t { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0 }
.t header { display: flex; align-items: baseline; gap: 0.5rem; font-weight: 600; font-size: 0.85rem }
.t header a { font-family: var(--small); font-weight: 500; color: var(--ink-2); text-decoration: none }
.t header a:hover { text-decoration: underline }
.t .tb { font-family: var(--gloss); font-size: 1.08rem; line-height: 1.5; overflow-wrap: anywhere }
.t .tb p { margin: 0 0 0.5em } .t .tb p:last-child { margin: 0 }
.t .lemma { font-weight: 700 } .t .lemma::after { content: "\00a0\2014\00a0"; font-weight: 400; color: var(--ink-2) }
.t.flash { animation: flash 1.6s ease-out }
.kids { display: flex; flex-direction: column; gap: 0.7rem; margin-left: 0.2rem; padding-left: 0.8rem; border-left: 1px solid var(--rule) }
.refs { font-family: var(--small); font-size: 0.85rem; color: var(--ink-2) }
.refs button { background: none; border: none; padding: 0; text-decoration: underline 2px; text-underline-offset: 3px }
html.sheet-open { overflow: hidden }

details { font-size: 0.85rem }
summary { cursor: pointer; font-weight: 600 }
.made { display: flex; flex-direction: column; gap: 1rem; padding-top: 0.75rem; max-width: 46rem }
.made h2 { font-family: var(--small); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 0.3rem }
.made p { margin: 0 } .made a { color: inherit }
.made pre { white-space: pre-wrap; font-size: 0.78rem; margin: 0; overflow-wrap: anywhere }
.tbl { overflow-x: auto }
table { border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums }
td, th { text-align: left; padding: 0.2rem 1rem 0.2rem 0; vertical-align: top; border-bottom: 1px solid var(--rule) }
th { font-weight: 500; color: var(--ink-2) }

/* Phone: the passage alone; commentary opens from the bottom. */
@media (max-width: 699px) {
  .runhead { grid-template-columns: 1fr } .runhead span { display: none }
  .col, .under { display: none }
  .passage p { font-size: 1.12rem; text-align: left }
  dialog.sheet { margin: auto 0 0; width: 100%; max-width: 100%; border: none; border-top: 2px solid var(--ink); border-radius: 0.9rem 0.9rem 0 0 }
  .sheet-head { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .sheet-body { padding: 1rem max(16px, env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
}
/* Tablet: passage on top, the two commentary columns beneath it. */
@media (min-width: 700px) {
  .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.9rem 1.1rem; align-items: start }
  .body > .passage { grid-column: 1 / -1 }
  .under { columns: 2; column-gap: 1.1rem }
}
/* Desktop: the full page. The passage is lifted into the middle and both columns flow around it. */
@media (min-width: 1100px) {
  .body { position: relative; container-type: inline-size; --pw: clamp(17rem, 40cqw, 27rem) }
  .body > .passage { position: absolute; top: calc(var(--lead) + 0.5rem); left: 50%; transform: translateX(-50%); width: var(--pw); max-width: none; margin: 0 }
  .push, .notch { display: block }
  .push { width: 0; height: var(--lead) }
  .notch { width: calc(var(--pw) / 2 + 0.35rem); height: calc(var(--ph, 30rem) + 1.1rem) }
  #inner .push, #inner .notch { float: right; clear: right } #outer .push, #outer .notch { float: left; clear: left }
  .passage p { font-size: 1.14rem }
  .under { columns: 3; column-gap: 1.1rem }
}
</style>

<div class="wrap">
  <div class="banner" id="mock" hidden>Placeholder run. These comments came from an offline stand-in used to test the page, not from real models.</div>
  <main class="daf">
    <header class="runhead"><span>On the text</span><h1 id="title"></h1><span>On the comments</span></header>
    <div class="bar">
      <aside class="key" id="key" aria-label="Readers"></aside>
      <aside class="ctl" aria-label="Rounds">
        <label for="layer">Rounds <input type="range" id="layer" min="1" max="1" step="1" value="1"></label>
        <button id="play" hidden>Play</button>
      </aside>
    </div>
    <div class="body" id="body">
      <section class="passage" id="passage" aria-label="Passage"></section>
      <section class="col" id="inner" aria-label="Comments on the text"></section>
      <section class="col" id="outer" aria-label="Comments on comments"></section>
    </div>
    <button class="all" id="all" hidden></button>
    <section class="under" id="under" hidden></section>
  </main>
  <div class="colophon" id="source"></div>
  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head"><button class="sheet-title" id="sheetTitle"></button><button class="sheet-close" id="sheetClose" autofocus>Close</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>
  <details><summary>How this page was made</summary><div class="made" id="made"></div></details>
</div>

<script>
const D = /*__PAGE_DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
const md = s => s.split(/\n\s*\n/).map(p => '<p>' + inline(p).replace(/\n/g, '<br>') + '</p>').join('');
const lemmaOf = (q, n = 8) => { const w = q.trim().split(/\s+/); return w.length > n + 1 ? w.slice(0, n).join(' ') + '…' : q.trim() };

function start() {
  if (!D) { $('title').textContent = 'No page data'; $('source').textContent = 'Build this file with: python3 -m radbinical render runs/<dir>'; return }
  const authors = [...new Set([...D.readers.map(r => r.name), ...D.comments.map(c => c.author)])];
  const BRANDS = /*__BRANDS__*/{};
  const ICONS = 'https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.101.0/icons/';
  const PREFIXES = ['openrouter', 'openai', 'nvidia', 'anthropic', 'mock'];
  const vendorOf = model => {
    const [head, ...rest] = model.split(':');
    const id = PREFIXES.includes(head) && rest.length ? rest.join(':') : model;
    return id.includes('/') ? id.split('/')[0] : (PREFIXES.includes(head) ? head : '');
  };
  const brandOf = a => { const r = D.readers.find(r => r.name === a); return (r && BRANDS[r.brand || vendorOf(r.model)]) || null };
  // A reader's colour is its maker's brand colour; single-colour marks take the page ink; unknown makers get a palette colour.
  const ink = a => { const b = brandOf(a); return b ? (b.color || 'var(--ink)') : `var(--a${authors.indexOf(a) % 8})` };
  // Two readers from one maker share a logo, so those also carry a short name.
  const shared = a => { const b = brandOf(a); return !!b && authors.some(o => o !== a && brandOf(o) === b) };
  const glyph = (a, named) => {
    const b = brandOf(a), tag = !named && shared(a) ? `<i class="tag">${esc(a.split(/[\s]+/).pop())}</i>` : '';
    const u = b && ICONS + b.icon + '.svg';
    const mark = !b || !S.icons ? '<i class="g"></i>' : b.icon.endsWith('-color') ? `<img class="g${b.flip ? ' flip' : ''}" src="${u}" alt="">` : `<i class="g mark" style="--u:url(${u})"></i>`;
    return named ? mark : `<span class="who" data-name="${esc(a)}">${mark}${tag}</span>`;
  };
  const byId = Object.fromEntries(D.comments.map(c => [c.id, c]));
  const num = id => id.replace(/^c/, '');
  const rounds = Math.max(1, D.layers_done || 1);
  const S = { upTo: rounds, off: new Set(), icons: false };
  const daf = matchMedia('(min-width: 1100px)'), phone = matchMedia('(max-width: 699px)');
  const sheet = $('sheet');

  $('title').textContent = D.passage.title;
  $('source').textContent = D.passage.source || '';
  $('mock').hidden = !D.readers.some(r => r.model.startsWith('mock:'));
  $('layer').max = rounds; $('layer').value = rounds; $('layer').disabled = rounds < 2;

  const rootOf = c => { while (c && c.target !== 'passage') c = byId[c.target]; return c };
  function shown() {
    const ok = new Set();
    for (const c of D.comments) // stored in the order they were written, so parents come first
      if (c.layer <= S.upTo && !S.off.has(c.author) && (c.target === 'passage' || ok.has(c.target))) ok.add(c.id);
    return D.comments.filter(c => ok.has(c.id));
  }
  const topsOf = vis => vis.filter(c => c.target === 'passage').sort((a, b) => a.start - b.start || a.n - b.n);

  // One thin underline per span, striped in the colours of the models that commented on it.
  const underline = on => {
    const inks = [...new Set(on.map(c => ink(c.author)))];
    return `repeating-linear-gradient(90deg, ${inks.map((c, i) => `${c} ${i * 14}px ${(i + 1) * 14}px`).join(', ')})`;
  };

  // The passage: clean text, with a small numbered mark where each comment on it begins.
  function drawPassage(vis) {
    const text = D.passage.text, tops = topsOf(vis);
    const cuts = new Set([0, text.length]);
    tops.forEach(c => { cuts.add(c.start); cuts.add(c.end) });
    let pos = 0; const paras = [];
    text.split('\n\n').forEach(p => { paras.push([pos, pos + p.length]); cuts.add(pos); cuts.add(pos + p.length); pos += p.length + 2 });
    const pts = [...cuts].sort((a, b) => a - b);
    let html = '', first = true;
    for (const [a, b] of paras) {
      html += '<p>';
      for (let i = 0; i < pts.length - 1; i++) {
        const s = pts[i], e = pts[i + 1];
        if (s < a || e > b) continue;
        let chunk = esc(text.slice(s, e)), box = '';
        if (first) { chunk = chunk.replace(/^(\S+)\s*/, (_, w) => { box = `<span class="incipit">${w}</span>`; return '' }); first = false }
        html += box + tops.filter(c => c.start === s).map(c => `<sup class="m" data-m="${c.id}" style="--c:${ink(c.author)}" aria-label="Comment ${num(c.id)} by ${esc(c.author)}" role="button" tabindex="0">${num(c.id)}</sup>`).join('');
        const on = tops.filter(c => c.start <= s && c.end >= e);
        html += on.length ? `<span class="seg" style="--ul:${underline(on)}" data-ids="${on.map(c => c.id).join(' ')}">${chunk}</span>` : chunk;
      }
      html += '</p>';
    }
    $('passage').innerHTML = html;
  }

  // A comment's text as one run. Where a reply quotes part of it, that part is underlined in the replier's colour.
  function bodyHTML(c, vis) {
    const raw = c.text.replace(/\s+/g, ' ').trim(), spans = [];
    for (const k of vis.filter(k => k.target === c.id && k.quote)) {
      const q = k.quote.replace(/\s+/g, ' ').trim(), i = q ? raw.indexOf(q) : -1;
      if (i >= 0 && !spans.some(s => i < s[1] && i + q.length > s[0])) spans.push([i, i + q.length, k]);
    }
    spans.sort((x, y) => y[0] - x[0]); // right to left, so earlier offsets stay valid
    let out = raw;
    for (const [i, j, k] of spans) out = out.slice(0, i) + '\uE000' + k.id + '\uE001' + out.slice(i, j) + '\uE002' + out.slice(j);
    return inline(out).replace(/\uE000(\w+)\uE001/g, (_, id) => `<span class="q" data-by="${id}" style="--c:${ink(byId[id].author)}">`).replace(/\uE002/g, '</span>');
  }

  // One comment as a run of text inside a column: mark, number, opening words in bold, then the comment.
  // Comments on the text need only a few opening words, since the number already locates them.
  function runHTML(c, vis) {
    const top = c.target === 'passage';
    const lemma = c.quote ? `<span class="lemma">${esc(lemmaOf(c.quote, top ? 3 : 5).replace(/[.,;:…]+$/, ''))}.</span> ` : '';
    const on = top ? '' : `<span class="on">on ${num(c.target)}</span> `;
    return `<span class="c" id="${c.id}" data-root="${rootOf(c).id}" ${top ? '' : `data-on="${c.target}" `}style="--c:${ink(c.author)}"><span class="hd">${glyph(c.author)}<span class="n">${num(c.id)}</span></span>${on}${lemma}${bodyHTML(c, vis)}<span class="end"> :</span></span> `;
  }

  function drawCols(vis) {
    const tops = topsOf(vis);
    const below = c => vis.filter(k => k.target === c.id).flatMap(k => [k, ...below(k)]);
    const replies = tops.flatMap(below);
    $('inner').innerHTML = '<i class="push"></i><i class="notch"></i>' + tops.map(c => runHTML(c, vis)).join('');
    $('outer').innerHTML = '<i class="push"></i><i class="notch"></i>' + replies.map(c => runHTML(c, vis)).join('');
    $('outer').hidden = !replies.length && !daf.matches;
    $('all').hidden = !phone.matches || !tops.length;
    $('all').textContent = `Read all ${vis.length} comments`;
    balance();
  }

  // On the full page, whichever column runs longer continues across the bottom, as on a printed page.
  function balance() {
    const a = $('inner'), b = $('outer'), u = $('under');
    u.innerHTML = ''; u.hidden = true;
    if (!daf.matches) return;
    $('body').style.setProperty('--ph', $('passage').offsetHeight + 'px');
    for (let i = 0; i < 200; i++) {
      const tall = a.offsetHeight >= b.offsetHeight ? a : b, runs = tall.querySelectorAll(':scope > .c');
      if (Math.abs(a.offsetHeight - b.offsetHeight) < 150 || runs.length < 2) break;
      u.prepend(document.createTextNode(' ')); u.prepend(runs[runs.length - 1]); u.hidden = false;
    }
  }

  function drawKey() {
    $('key').innerHTML = authors.map(a => {
      const n = D.comments.filter(c => c.author === a && c.layer <= S.upTo).length;
      return `<button style="--c:${ink(a)}" aria-pressed="${!S.off.has(a)}" data-author="${esc(a)}">${glyph(a, true)}<span>${esc(a)}</span><b>${n}</b></button>`;
    }).join('');
  }

  function draw() { const vis = shown(); drawKey(); drawPassage(vis); drawCols(vis) }

  // Reading view: whole threads at a comfortable size, replies nested under what they answer.
  function threadHTML(c, vis) {
    const kids = vis.filter(k => k.target === c.id);
    const lemma = c.quote ? `<span class="lemma" title="${esc(c.quote)}">${esc(lemmaOf(c.quote))}</span>` : '';
    const refs = (c.see_also || []).filter(r => byId[r]).map(r => `<button data-go="${r}" style="text-decoration-color:${ink(byId[r].author)}" title="${esc(byId[r].author)}">${num(r)}</button>`).join(', ');
    return `<div class="t" id="t-${c.id}" style="--c:${ink(c.author)}"><header><span>${glyph(c.author, true)} ${esc(c.author)}</span><a href="#${c.id}" title="Link to this comment">${num(c.id)}</a></header>
      <div class="tb">${md(c.text).replace('<p>', '<p>' + lemma)}</div>${refs ? `<div class="refs">see also ${refs}</div>` : ''}</div>
      ${kids.length ? `<div class="kids">${kids.map(k => threadHTML(k, vis)).join('')}</div>` : ''}`;
  }
  let sheetSpan = null;
  function openReader(rootIds, flashId) {
    const vis = shown(), tops = topsOf(vis).filter(t => !rootIds || rootIds.includes(t.id));
    if (!tops.length) return;
    sheetSpan = rootIds ? tops[0].id : null;
    $('sheetTitle').textContent = rootIds ? '“' + lemmaOf(D.passage.text.slice(Math.min(...tops.map(t => t.start)), Math.max(...tops.map(t => t.end))), 12) + '”' : 'All commentary';
    $('sheetTitle').disabled = !rootIds;
    $('sheetBody').innerHTML = tops.map(t => `<article class="thread">${threadHTML(t, vis)}</article>`).join('');
    if (!sheet.open) sheet.showModal();
    document.documentElement.classList.add('sheet-open');
    sheet.scrollTop = 0;
    const el = flashId && $('t-' + flashId);
    if (el) requestAnimationFrame(() => { el.scrollIntoView({ block: 'center' }); el.classList.add('flash') });
  }

  // Lighting: a comment lights its span in the passage and the comments it is tied to.
  function light(id, on) {
    const c = byId[id]; if (!c) return;
    const root = rootOf(c).id;
    document.querySelectorAll('.seg').forEach(s => { if (s.dataset.ids.split(' ').includes(root)) { s.classList.toggle('lit', on); s.style.setProperty('--c', ink(byId[root].author)) } });
    document.querySelectorAll(`sup.m[data-m="${root}"]`).forEach(m => m.classList.toggle('lit', on));
    document.querySelectorAll(`.c[data-on="${id}"]`).forEach(k => k.classList.toggle('kin', on));
    document.querySelectorAll(`.q[data-by="${id}"]`).forEach(q => q.classList.toggle('lit', on));
    if (c.target !== 'passage' && $(c.target)) $(c.target).classList.toggle('kin', on);
  }
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function go(id) {
    const c = byId[id]; if (!c) return;
    if (!shown().some(v => v.id === id)) { S.upTo = rounds; S.off.clear(); $('layer').value = rounds; draw() } // make sure a linked comment is visible
    if (phone.matches) return openReader([rootOf(c).id], id);
    if (sheet.open) sheet.close();
    flash($(id));
  }

  const hover = on => e => {
    const c = e.target.closest('.c'); if (c) light(c.id, on);
    const q = e.target.closest('.q'); if (q && $(q.dataset.by)) $(q.dataset.by).classList.toggle('lit', on); // a quoted phrase lights the reply that quotes it
    const m = e.target.closest('sup.m'); if (m) { light(m.dataset.m, on); const el = $(m.dataset.m); if (el) el.classList.toggle('lit', on) }
  };
  document.querySelector('.daf').addEventListener('mouseover', hover(true));
  document.querySelector('.daf').addEventListener('mouseout', hover(false));
  const pickMark = m => phone.matches ? openReader([m.dataset.m]) : flash($(m.dataset.m));
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const a = e.target.closest('.t header a'); if (a && a.hash === location.hash) return go(a.hash.slice(1)); // same link again: hashchange will not fire
    const m = e.target.closest('sup.m'); if (m) return pickMark(m);
    const c = e.target.closest('.c'); if (c && !getSelection().toString()) return openReader([c.dataset.root], c.id);
    const k = e.target.closest('[data-author]');
    if (k) { const n = k.dataset.author; S.off.has(n) ? S.off.delete(n) : S.off.add(n); draw() }
  });
  $('passage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('sup.m')) { e.preventDefault(); pickMark(e.target) } });
  $('all').addEventListener('click', () => openReader(null));
  $('sheetClose').addEventListener('click', () => sheet.close());
  $('sheetTitle').addEventListener('click', () => { const id = sheetSpan; sheet.close(); if (id) { light(id, true); flash(document.querySelector('.seg.lit')); setTimeout(() => light(id, false), 2500) } });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close() }); // click on the dimmed area
  sheet.addEventListener('close', () => document.documentElement.classList.remove('sheet-open'));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  const relayout = () => { if (sheet.open) sheet.close(); draw() };
  daf.addEventListener('change', relayout); phone.addEventListener('change', relayout);
  let pending = 0, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(pending); pending = setTimeout(() => drawCols(shown()), 150) });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawCols(shown())); // heights change once the faces load

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play' };
  $('play').hidden = rounds < 2;
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const show = n => { S.upTo = n; $('layer').value = n; draw() };
    show(1); $('play').textContent = 'Pause';
    timer = setInterval(() => { if (S.upTo >= rounds) return stop(); show(S.upTo + 1); if (S.upTo >= rounds) stop() }, 1800);
  });
  $('layer').addEventListener('input', e => { if (timer) stop(); S.upTo = +e.target.value; draw() });

  const f = D.flags, row = (k, v) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  $('made').innerHTML = `
    <div><h2>Reading the page</h2><p>The inner column holds comments on the passage, in the order of the words they attach to; small numbers in the passage show where each begins. The outer column holds comments on comments, each marked with the number it answers. Whichever column runs longer continues across the bottom. Select a comment to read its whole thread.</p></div>
    <div><h2>Readers</h2><div class="tbl"><table>${D.readers.map(r => row(r.name, r.model)).join('')}</table></div></div>
    <div><h2>Settings</h2><div class="tbl"><table>${Object.entries(f).map(([k, v]) => row(k, v === null ? 'none' : v)).join('')}</table></div></div>
    <div><h2>What each reader was told</h2><pre>${esc(D.prompt_example || '')}</pre></div>
    ${authors.some(brandOf) ? '<div><h2>Logos</h2><p>Each reader is marked with its maker\'s logo and brand colour, to show whose model wrote what. The marks belong to their owners. Icons are linked from the <a href="https://github.com/lobehub/lobe-icons">lobe-icons</a> set.</p></div>' : ''}
    <div><h2>Round by round</h2><div class="tbl"><table><tr><th>Round</th><th>Reader</th><th>Comments</th><th>Note</th></tr>${
      D.log.map(l => `<tr><td>${l.layer}</td><td>${esc(l.reader)}</td><td>${l.comments}</td><td>${esc(l.error ? 'Failed: ' + l.error : (l.closing || ''))}</td></tr>`).join('')}</table></div></div>`;
  draw();
  if (authors.some(brandOf)) { // logos are linked, not bundled: show them only once one is known to load
    const probe = new Image();
    probe.onload = () => { S.icons = true; draw() };
    probe.src = ICONS + 'claude.svg';
  }
  if (location.hash) go(location.hash.slice(1));
}
start();
</script>
