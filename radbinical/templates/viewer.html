<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a commentary page. The passage sits in the centre in a book face; glosses fill both
   margins in a smaller working face, each opening with the words it attaches to. */
:root {
  --paper: #eef1f4; --sheet: #ffffff; --ink: #14181f; --ink-2: #505a69; --rule: #d3d9e1;
  --mark: #f0bf00; --warn: #8a5a00;
  --a0: #c2362b; --a1: #1565c0; --a2: #1b7f4b; --a3: #7b3fb5;
  --a4: #a85a00; --a5: #0b7c8c; --a6: #b02a78; --a7: #56606e;
  --text: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --gloss: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1216; --sheet: #181c22; --ink: #e7eaef; --ink-2: #9ba5b3; --rule: #2b323c;
  --mark: #d9a800; --warn: #e6b450;
  --a0: #ff8a7a; --a1: #7fb4ff; --a2: #6fd39a; --a3: #c39bff;
  --a4: #f0a856; --a5: #5fd0de; --a6: #ff8cc6; --a7: #aab4c2; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1216; --sheet: #181c22; --ink: #e7eaef; --ink-2: #9ba5b3; --rule: #2b323c;
  --mark: #d9a800; --warn: #e6b450;
  --a0: #ff8a7a; --a1: #7fb4ff; --a2: #6fd39a; --a3: #c39bff;
  --a4: #f0a856; --a5: #5fd0de; --a6: #ff8cc6; --a7: #aab4c2; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--gloss); font-size: 0.9375rem; line-height: 1.5;
  padding-block: 1.5rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 96rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }

.head { display: flex; flex-direction: column; gap: 0.35rem }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2) }
h1 { font-family: var(--text); font-weight: 600; font-size: clamp(1.6rem, 1.1rem + 2vw, 2.4rem); line-height: 1.15; margin: 0; text-wrap: balance }
.source { color: var(--ink-2); font-style: italic; font-family: var(--text); font-size: 1rem }
.stats { font-family: var(--mono); font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums }
.banner { border: 1px dashed var(--warn); color: var(--warn); padding: 0.5rem 0.75rem; font-size: 0.85rem }

.controls { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; padding-block: 0.75rem; border-block: 1px solid var(--rule) }
.scrub { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; white-space: nowrap }
.scrub input { width: 9rem; max-width: 40vw; accent-color: var(--ink) }
.scrub output { font-family: var(--mono); font-size: 0.78rem; min-width: 5.5rem }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 0.15rem 0.6rem; font-size: 0.8rem }
.g { flex: none; display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--c) }
img.g, .g.mark { width: 1.05em; height: 1.05em; border-radius: 0; background: none }
.g.mark { background: var(--c); -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat }
.chip b { font-family: var(--mono); font-weight: 400; color: var(--ink-2); font-size: 0.72rem }
.chip[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through }
.clear { background: none; border: none; text-decoration: underline; font-size: 0.8rem; color: var(--ink-2); padding: 0 }

.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; align-items: start }
.passage { background: var(--sheet); border: 1px solid var(--rule); padding: 1.5rem 1.4rem; min-width: 0 }
.passage p { font-family: var(--text); font-size: 1.16rem; line-height: 1.62; margin: 0 0 1em; hyphens: auto }
.passage p:last-child { margin-bottom: 0 }
.passage .folio { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1rem }
.seg[data-h] { background: color-mix(in srgb, var(--mark) calc(var(--h) * 13% + 8%), transparent); cursor: pointer; border-radius: 1px; box-decoration-break: clone; -webkit-box-decoration-break: clone }
.seg[data-h]:hover { box-shadow: 0 2px 0 var(--ink) }
.seg.lit { background: color-mix(in srgb, var(--c, var(--mark)) 30%, transparent); box-shadow: 0 2px 0 var(--c, var(--ink)) }
.margin { display: flex; flex-direction: column; gap: 1.1rem; min-width: 0 }
.empty { color: var(--ink-2); font-size: 0.85rem }

.thread { border-top: 2px solid var(--ink); padding-top: 0.55rem; display: flex; flex-direction: column; gap: 0.6rem; transition: opacity 0.15s }
.thread.dim { opacity: 0.28 }
.c { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; scroll-margin-top: 1rem }
.c header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem }
.who { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600; font-size: 0.82rem }
.meta { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-2) }
.c .body { overflow-wrap: anywhere }
.c .body p { margin: 0 0 0.5em } .c .body p:last-child { margin: 0 }
.c code { font-family: var(--mono); font-size: 0.85em }
.lemma { font-family: var(--text); font-weight: 600; font-size: 1.02em; background: none; border: none; padding: 0; text-align: left; display: inline }
button.lemma:hover { text-decoration: underline; text-decoration-color: var(--c) }
.lemma::after { content: "\00a0\2014\00a0"; font-weight: 400; color: var(--ink-2) }
.kids { display: flex; flex-direction: column; gap: 0.6rem; margin-left: 0.2rem; padding-left: 0.75rem; border-left: 1px solid var(--rule) }
.refs { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-2) }
.refs button { background: none; border: none; padding: 0; text-decoration: underline; font-family: inherit; font-size: inherit }
.c.flash { animation: flash 1.2s ease-out }
@keyframes flash { from { background: color-mix(in srgb, var(--mark) 45%, transparent) } to { background: transparent } }
@media (prefers-reduced-motion: reduce) { .c.flash { animation: none; outline: 2px solid var(--mark) } .thread { transition: none } }

details { border-top: 1px solid var(--rule); padding-top: 0.75rem; font-size: 0.85rem }
summary { cursor: pointer; font-weight: 600 }
.made { display: flex; flex-direction: column; gap: 1rem; padding-top: 0.75rem; max-width: 46rem }
.made h2 { font-size: 0.75rem; font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 0.3rem }
.made p { margin: 0 } .made a { color: inherit }
.made pre { white-space: pre-wrap; font-family: var(--mono); font-size: 0.78rem; margin: 0; overflow-wrap: anywhere }
.tbl { overflow-x: auto }
table { border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums }
td, th { text-align: left; padding: 0.2rem 1rem 0.2rem 0; vertical-align: top; border-bottom: 1px solid var(--rule) }
th { font-weight: 500; color: var(--ink-2) }

.play, .all, .sheet-close { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.8rem }
.all { align-self: flex-start; border-color: var(--ink); padding: 0.45rem 1rem; font-size: 0.9rem; font-weight: 600 }
a.meta { text-decoration: none } a.meta:hover { text-decoration: underline }

/* Phone: the passage fills the screen; commentary opens in a sheet from the bottom. */
dialog.sheet { margin: auto 0 0; width: 100%; max-width: 100%; max-height: 86dvh; padding: 0; border: none; border-top: 2px solid var(--ink);
  border-radius: 0.9rem 0.9rem 0 0; background: var(--sheet); color: var(--ink) }
dialog.sheet::backdrop { background: rgb(0 0 0 / 0.5) }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between;
  background: var(--sheet); border-bottom: 1px solid var(--rule); padding: 0.8rem max(16px, env(safe-area-inset-right, 0px)) 0.7rem max(16px, env(safe-area-inset-left, 0px)) }
.sheet-title { font-family: var(--text); font-style: italic; font-size: 0.95rem; min-width: 0 }
.sheet-body { display: flex; flex-direction: column; gap: 1.1rem;
  padding: 1rem max(16px, env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
html.sheet-open { overflow: hidden }

/* Tablet and small laptop: passage on the left, threads beside it with replies nested. */
@media (min-width: 760px) {
  .page { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
  .passage { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto }
}
/* Wide: layers run outward from the text. Glosses sit next to the passage, replies to them one column further out. */
@media (min-width: 1160px) {
  .page { grid-template-columns: minmax(0, 27rem) minmax(0, 1fr) }
  .rings .thread { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 1.25rem; align-items: start }
  .rings .thread > .c { grid-column: 1; grid-row: 1 }
  .rings .thread > .kids { grid-column: 2; grid-row: 1; margin: 0; padding-left: 1.25rem }
}
/* Very wide: the passage moves to the centre and the layers run outward on both sides. */
@media (min-width: 1800px) {
  .wrap { max-width: 124rem }
  .page { grid-template-columns: minmax(0, 1fr) minmax(0, 30rem) minmax(0, 1fr) }
  .page > #left { grid-column: 1; grid-row: 1 } .page > .passage { grid-column: 2; grid-row: 1 } .page > #right { grid-column: 3; grid-row: 1 }
  .rings #left .thread > .c { grid-column: 2 }
  .rings #left .thread > .kids { grid-column: 1; padding-left: 0; padding-right: 1.25rem; border-left: none; border-right: 1px solid var(--rule) }
}
</style>

<div class="wrap">
  <header class="head">
    <div class="eyebrow">Radbinical</div>
    <h1 id="title"></h1>
    <div class="source" id="source"></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="banner" id="mock" hidden>Placeholder run. These comments came from an offline stand-in used to test the page, not from real models.</div>
  <div class="controls">
    <label class="scrub" for="layer">Rounds shown <input type="range" id="layer" min="1" max="1" step="1" value="1"><output id="layerOut" for="layer"></output></label>
    <button class="play" id="play" hidden>Play rounds</button>
    <div class="chips" id="chips" role="group" aria-label="Readers"></div>
    <button class="clear" id="clear" hidden>Show all threads</button>
  </div>
  <main class="page">
    <section class="passage" id="passage" aria-label="Passage"></section>
    <button class="all" id="all" hidden></button>
    <section class="margin" id="left" aria-label="Commentary"></section>
    <section class="margin" id="right" aria-label="Commentary, continued"></section>
  </main>
  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head"><div class="sheet-title" id="sheetTitle"></div><button class="sheet-close" id="sheetClose">Close</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>
  <details><summary>How this page was made</summary><div class="made" id="made"></div></details>
</div>

<script>
const D = /*__PAGE_DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).split(/\n\s*\n/).map(p => '<p>' + p
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
  .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>') + '</p>').join('');
const lemmaOf = q => { const w = q.trim().split(/\s+/); return w.length > 9 ? w.slice(0, 8).join(' ') + '…' : q.trim() };

function start() {
  if (!D) { $('title').textContent = 'No page data'; $('source').textContent = 'Build this file with: python3 -m radbinical render runs/<dir>'; return }
  const authors = [...new Set([...D.readers.map(r => r.name), ...D.comments.map(c => c.author)])];
  const BRANDS = /*__BRANDS__*/{};
  const ICONS = 'https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.101.0/icons/';
  const PREFIXES = ['openrouter', 'openai', 'nvidia', 'anthropic', 'mock'];
  const vendorOf = model => {
    const [head, ...rest] = model.split(':');
    const id = PREFIXES.includes(head) && rest.length ? rest.join(':') : model;
    return id.includes('/') ? id.split('/')[0] : (PREFIXES.includes(head) ? head : '');
  };
  const brandOf = a => { const r = D.readers.find(r => r.name === a); return (r && BRANDS[r.brand || vendorOf(r.model)]) || null };
  // A reader's colour is its maker's brand colour; single-colour marks take the page ink; unknown makers get a palette colour.
  const ink = a => { const b = brandOf(a); return b ? (b.color || 'var(--ink)') : `var(--a${authors.indexOf(a) % 8})` };
  const glyph = a => {
    const b = brandOf(a);
    if (!b || !S.icons) return '<i class="g"></i>';
    const u = ICONS + b.icon + '.svg';
    return b.icon.endsWith('-color') ? `<img class="g" src="${u}" alt="" title="${esc(b.name)}">` : `<i class="g mark" style="--u:url(${u})" title="${esc(b.name)}"></i>`;
  };
  const byId = Object.fromEntries(D.comments.map(c => [c.id, c]));
  const rounds = Math.max(1, D.layers_done || 1);
  const S = { upTo: rounds, off: new Set(), sel: null, icons: false };
  const both = matchMedia('(min-width: 1800px)'), phone = matchMedia('(max-width: 759px)');
  const sheet = $('sheet');

  $('title').textContent = D.passage.title;
  $('source').textContent = D.passage.source || '';
  $('mock').hidden = !D.readers.some(r => r.model.startsWith('mock:'));
  $('layer').max = rounds; $('layer').value = rounds; $('layer').disabled = rounds < 2;

  const rootOf = c => { while (c && c.target !== 'passage') c = byId[c.target]; return c };
  const depthOf = c => { let d = 0; while (c && c.target !== 'passage') { c = byId[c.target]; d++ } return d };
  function shown() {
    const ok = new Set();
    for (const c of D.comments) // comments are stored in the order they were written, so parents come first
      if (c.layer <= S.upTo && !S.off.has(c.author) && (c.target === 'passage' || ok.has(c.target))) ok.add(c.id);
    return D.comments.filter(c => ok.has(c.id));
  }

  function drawPassage(vis) {
    const text = D.passage.text, tops = vis.filter(c => c.target === 'passage');
    const cuts = new Set([0, text.length]);
    tops.forEach(c => { cuts.add(c.start); cuts.add(c.end) });
    let pos = 0; const paras = [];
    text.split('\n\n').forEach(p => { paras.push([pos, pos + p.length]); cuts.add(pos); cuts.add(pos + p.length); pos += p.length + 2 });
    const pts = [...cuts].sort((a, b) => a - b);
    const lit = S.sel ? new Set(S.sel) : null;
    let html = `<div class="folio"><span>round ${S.upTo} of ${rounds}</span></div>`;
    for (const [a, b] of paras) {
      html += '<p>';
      for (let i = 0; i < pts.length - 1; i++) {
        const s = pts[i], e = pts[i + 1];
        if (s < a || e > b) continue;
        const on = tops.filter(c => c.start <= s && c.end >= e);
        if (!on.length) { html += esc(text.slice(s, e)); continue }
        const hit = lit && on.find(c => lit.has(c.id));
        html += `<span class="seg${hit ? ' lit' : ''}" data-h style="--h:${Math.min(on.length, 5)}${hit && S.sel.length === 1 ? ';--c:' + ink(hit.author) : ''}" data-ids="${on.map(c => c.id).join(' ')}" role="button" tabindex="0" title="${on.length} comment${on.length > 1 ? 's' : ''} here">${esc(text.slice(s, e))}</span>`;
      }
      html += '</p>';
    }
    $('passage').innerHTML = html;
  }

  function commentHTML(c, vis) {
    const kids = vis.filter(k => k.target === c.id);
    const top = c.target === 'passage';
    const lemma = c.quote ? (top && !phone.matches ? `<button class="lemma" data-sel="${c.id}" title="${esc(c.quote)}">${esc(lemmaOf(c.quote))}</button>`
                                  : `<span class="lemma" title="${esc(c.quote)}">${esc(lemmaOf(c.quote))}</span>`) : '';
    const body = md(c.text).replace('<p>', '<p>' + lemma);
    const refs = (c.see_also || []).filter(r => byId[r]).map(r => `<button data-go="${r}">${r}</button>`).join(', ');
    return `<div class="c" id="${c.id}" style="--c:${ink(c.author)}"><header><span class="who">${glyph(c.author)}${esc(c.author)}</span><a class="meta" href="#${c.id}" title="Link to this comment">${c.id} · round ${c.layer}</a></header>
      <div class="body">${body}</div>${refs ? `<div class="refs">see also ${refs}</div>` : ''}</div>
      ${kids.length ? `<div class="kids">${kids.map(k => commentHTML(k, vis)).join('')}</div>` : ''}`;
  }

  const threadHTML = (t, vis, dim) => `<article class="thread${dim ? ' dim' : ''}" data-id="${t.id}">${commentHTML(t, vis)}</article>`;
  const topsOf = vis => vis.filter(c => c.target === 'passage').sort((a, b) => a.start - b.start || a.n - b.n);

  function drawMargins(vis) {
    const tops = topsOf(vis), small = phone.matches;
    document.querySelector('.page').classList.toggle('rings', vis.some(c => c.target !== 'passage'));
    $('all').hidden = !small || !tops.length;
    $('all').textContent = `Read all ${vis.length} comments`;
    const weight = c => 220 + c.text.length + vis.filter(k => k.target === c.id).reduce((s, k) => s + weight(k), 0);
    const cols = [[], []], h = [0, 0];
    for (const t of tops) { const i = both.matches && h[1] < h[0] ? 1 : 0; cols[i].push(t); h[i] += weight(t) }
    const sel = S.sel ? new Set(S.sel) : null;
    [$('left'), $('right')].forEach((el, i) => {
      el.innerHTML = small ? '' : cols[i].map(t => threadHTML(t, vis, sel && !sel.has(t.id))).join('');
      el.hidden = small ? !!tops.length || i === 1 : i === 1 && !cols[1].length;
    });
    if (!tops.length) $('left').innerHTML = '<p class="empty">No comments to show with these settings.</p>';
  }

  // Phone only: show some threads (or all of them) in the bottom sheet.
  function openSheet(ids, flashId) {
    const vis = shown(), tops = topsOf(vis).filter(t => !ids || ids.includes(t.id));
    if (!tops.length) return;
    $('sheetTitle').textContent = ids ? '\u201c' + lemmaOf(D.passage.text.slice(Math.min(...tops.map(t => t.start)), Math.max(...tops.map(t => t.end)))) + '\u201d' : 'All commentary';
    $('sheetBody').innerHTML = tops.map(t => threadHTML(t, vis, false)).join('');
    if (!sheet.open) sheet.showModal();
    document.documentElement.classList.add('sheet-open');
    $('sheetBody').parentElement.scrollTop = 0;
    if (flashId) requestAnimationFrame(() => flash($(flashId)));
  }

  function drawChrome(vis) {
    $('layerOut').textContent = S.upTo === rounds ? `all ${rounds}` : `1 to ${S.upTo}`;
    $('clear').hidden = !S.sel;
    $('chips').innerHTML = authors.map(a => {
      const n = D.comments.filter(c => c.author === a && c.layer <= S.upTo).length;
      return `<button class="chip" style="--c:${ink(a)}" aria-pressed="${!S.off.has(a)}" data-author="${esc(a)}">${glyph(a)}${esc(a)}<b>${n}</b></button>`;
    }).join('');
    const deep = vis.reduce((m, c) => Math.max(m, depthOf(c)), 0);
    $('stats').textContent = `${vis.length} comment${vis.length === 1 ? '' : 's'} · ${vis.filter(c => c.target === 'passage').length} on the text · deepest reply chain ${deep} · ${D.at_rest ? 'ended when every reader passed' : 'stopped at the round limit'}`;
  }

  function draw() { const vis = shown(); drawChrome(vis); drawPassage(vis); drawMargins(vis) }

  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function go(id) {
    const c = byId[id]; if (!c) return;
    if (!shown().some(v => v.id === id)) { S.upTo = rounds; S.off.clear(); $('layer').value = rounds; draw() } // make sure a linked comment is visible
    if (phone.matches) openSheet([rootOf(c).id], id); else flash($(id));
  }

  $('layer').addEventListener('input', e => { S.upTo = +e.target.value; S.sel = null; draw() });
  $('clear').addEventListener('click', () => { S.sel = null; draw() });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('[data-author]'); if (!b) return;
    const a = b.dataset.author; S.off.has(a) ? S.off.delete(a) : S.off.add(a); S.sel = null; draw();
  });
  const pickSeg = el => {
    const ids = el.dataset.ids.split(' ');
    if (phone.matches) { S.sel = ids; draw(); return openSheet(ids) }
    S.sel = S.sel && S.sel.join() === ids.join() ? null : ids; draw();
    if (S.sel) flash($(ids[0]));
  };
  $('passage').addEventListener('click', e => { const s = e.target.closest('.seg[data-ids]'); if (s) pickSeg(s) });
  $('passage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.seg[data-ids]')) { e.preventDefault(); pickSeg(e.target) } });
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const m = e.target.closest('a.meta'); if (m && m.hash === location.hash) return go(m.hash.slice(1)); // same link again: hashchange will not fire
    const l = e.target.closest('[data-sel]'); if (!l) return;
    const id = l.dataset.sel;
    S.sel = S.sel && S.sel.length === 1 && S.sel[0] === id ? null : [id]; draw();
    if (S.sel) { const seg = document.querySelector('.seg.lit'); if (seg) seg.scrollIntoView({ behavior: 'smooth', block: 'center' }) }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sel) { S.sel = null; draw() } });
  const relayout = () => { if (sheet.open) sheet.close(); draw() };
  both.addEventListener('change', relayout); phone.addEventListener('change', relayout);
  $('all').addEventListener('click', () => openSheet(null));
  $('sheetClose').addEventListener('click', () => sheet.close());
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close() }); // tap on the dimmed area
  sheet.addEventListener('close', () => { document.documentElement.classList.remove('sheet-open'); if (S.sel) { S.sel = null; draw() } });
  addEventListener('hashchange', () => go(location.hash.slice(1)));

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play rounds' };
  $('play').hidden = rounds < 2;
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const show = n => { S.upTo = n; S.sel = null; $('layer').value = n; draw() };
    show(1); $('play').textContent = 'Pause';
    timer = setInterval(() => { if (S.upTo >= rounds) return stop(); show(S.upTo + 1); if (S.upTo >= rounds) stop() }, 1800);
  });
  $('layer').addEventListener('input', () => { if (timer) stop() });

  const f = D.flags, row = (k, v) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  $('made').innerHTML = `
    <div><h2>Readers</h2><div class="tbl"><table>${D.readers.map(r => row(r.name, r.model)).join('')}</table></div></div>
    <div><h2>Settings</h2><div class="tbl"><table>${Object.entries(f).map(([k, v]) => row(k, v === null ? 'none' : v)).join('')}</table></div></div>
    <div><h2>What each reader was told</h2><pre>${esc(D.prompt_example || '')}</pre></div>
    ${authors.some(brandOf) ? '<div><h2>Logos</h2><p>Each reader is marked with its maker\'s logo and brand colour, to show whose model wrote what. The marks belong to their owners. Icons are linked from the <a href="https://github.com/lobehub/lobe-icons">lobe-icons</a> set.</p></div>' : ''}
    <div><h2>Round by round</h2><div class="tbl"><table><tr><th>Round</th><th>Reader</th><th>Comments</th><th>Note</th></tr>${
      D.log.map(l => `<tr><td>${l.layer}</td><td>${esc(l.reader)}</td><td>${l.comments}</td><td>${esc(l.error ? 'Failed: ' + l.error : (l.closing || ''))}</td></tr>`).join('')}</table></div></div>`;
  draw();
  if (authors.some(brandOf)) { // logos are linked, not bundled: show them only once one is known to load
    const probe = new Image();
    probe.onload = () => { S.icons = true; draw() };
    probe.src = ICONS + 'claude.svg';
  }
  if (location.hash) go(location.hash.slice(1));
}
start();
</script>
