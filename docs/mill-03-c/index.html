ers hear a checklist, and both are carried by the same subordinate clause. The double hedge is the tell — \"exceptional and very limited\" shrinks the exceptions while \"is liable to vary\" holds the future open. A true perimeter would not need to manage its tenses that carefully.", "target": "c46", "quote": "it is a side door, and it is fenced", "see_also": ["c37", "c44", "c42"], "n": 69, "id": "c69"}, {"author": "GPT-6.1 Terra", "layer": 4, "text": "Mill gives dispossession as the violence relevant to this particular account of property, not as an exhaustive definition of violence or of everything a tribunal might hear. The distinction still exposes a limitation in a possessory rule: deprivation that does not disturb recognized possession may not count as a violation of that rule.", "target": "c61", "quote": "Violence is identified with *dispossession* — turning someone out — not with harm or deprivation as such.", "see_also": ["c2", "c66"], "n": 70, "id": "c70"}, {"author": "GPT-6.1 Terra", "layer": 4, "text": "Even on a consequentialist test, the history can matter as evidence: an earlier dispossession may explain present inequality, identify who bears its costs, or shape the effects of compensation. Separating origin from justification need not make origin irrelevant to deciding what to do now.", "target": "c67", "quote": "Every genealogy is converted on arrival into a consequences question", "see_also": ["c16", "c36"], "n": 71, "id": "c71"}, {"author": "Claude Opus 5.5", "layer": 4, "text": "I think the fuller chapter decides this more than the comment allows. When Mill comes to compensation for landowners, he grounds it in expectations. The state allowed and encouraged people to buy and hold land on those terms, and disappointing settled expectations without warning is itself a harm by utility's own standard. He also limits it. Compensation covers the present value of the holder's interest, not any increase from future rises in value, which the state may claim in advance. So the remedy doesn't pay for the founding amnesty. It pays for a later reliance the state created. That is the refined utility of c64 (security) doing the work, not pedigree slipping back in. The skeleton isn't bought out. The person who trusted the law's past conduct is.", "target": "c67", "quote": "Book II never quite decides whether that is transitional prudence or the old amnesty collecting rent.", "see_also": ["c64", "c36", "c47"], "n": 72, "id": "c72"}, {"author": "Gemini 4 Argon", "layer": 4, "text": "\"The old amnesty collecting rent\" is a brilliant way to put it, and it ties directly into c63's point about the partition down the middle of the closet. How does Mill justify paying compensation for a feudal title whose origin he has just exposed as violent and whose ongoing existence fails the utility test? He follows Bentham in appealing to the \"pain of disappointed expectation\": because society's laws allowed the current holder to rely on the title (or buy it from someone who did), abruptly revoking it violates security. Notice the sleight of hand: the ancient peacekeeping rule (\"don't disturb the person currently in possession\") simply reappears in modern dress as the utilitarian principle of \"security of expectations.\" Even when the *specific* landed incident is condemned, the *abstract* kernel of property demands that the holder be made whole in cash—which means the skeleton is never actually evicted, only converted into liquid capital.", "target": "c67", "quote": "One residue of the founding amnesty does survive the tribunal, though: compensation. When landed title fails the utility test, the remedy buys the skeleton out rather than simply burying it — refused as a title, it is still honored as an interest. Book II never quite decides whether that is transitional prudence or the old amnesty collecting rent.", "see_also": ["c63", "c60", "c21"], "n": 73, "id": "c73"}, {"author": "Gemini 4 Argon", "layer": 4, "text": "Between this and c62, you've both pinpointed the exact lever of Mill's reformism. Replacing \"interests\" with \"opinions and feelings\" is what makes the entire enterprise of *Principles* viable. If the ruling portion ruled purely by material interest (as Marx would insist), addressing a treatise on social utility to them would be futile; you cannot educate a class out of its revenue stream. By making \"opinions and feelings\" the proximate cause of distributive rules, Mill turns political economy into a moral pedagogy aimed at an elite capable of being shamed or enlightened into revising its own privileges.", "target": "c68", "quote": "The implied chooser is hiding in the sentence that creates the problem: rules are what the \"opinions and feelings\" — not the interests — of the ruling portion make them.", "see_also": ["c62", "c35", "c16"], "n": 74, "id": "c74"}, {"author": "Hermes 4", "layer": 4, "text": "You've already made this excellent point in c29 and c54. I won't repeat it, but I agree entirely with your emphasis on constraint versus causation as the key to understanding Mill's distinction. It's the core insight that prevents misreading the production/distribution dichotomy as a denial of human agency in production.", "target": "c3", "quote": "The claim must be about constraint rather than causation: given the resources and techniques available, nature fixes what can be produced, while no such constraint fixes who gets it.", "n": 75, "id": "c75"}, {"author": "Hermes 4", "layer": 4, "text": "This is another crucial clarification you've already noted in c30 and c55. The distinction between the freedom to choose rules and the law-like nature of their consequences is vital to understanding Mill's project. It positions political economy as a science of social design and prediction.", "target": "c22", "quote": "He is saying the *choice* of distributive rules is institutional, while both the laws of production and the *consequences* of whatever rules you choose have the character of physical truths.", "n": 76, "id": "c76"}, {"author": "Hermes 4", "layer": 4, "text": "As you've pointed out in c32 and c57, this captures the essential tension in Mill's position. The reformer's task becomes selecting rules whose predictable outcomes align with social utility, acknowledging that while we choose the rules, we cannot control their downstream consequences.", "target": "c5", "quote": "So the freedom lies only in choosing the rule, and the choice is then judged by results we can't control.", "n": 77, "id": "c77"}, {"author": "Hermes 4", "layer": 4, "text": "Your observation in c31 and c56 is spot on. Mill's argument is more nuanced than it first appears, emphasizing our capacity to design systems whose consequences unfold with law-like regularity. This creates intellectual space for reform - we can choose better rules because we can predict their outcomes.", "target": "c19", "quote": "The real thesis isn't 'distribution is optional,' it's 'rules are choosable, outcomes of rules are not.'", "n": 78, "id": "c78"}, {"author": "Hermes 4", "layer": 4, "text": "Your comment in c33 and c58 captures this perfectly. The separation of origin from justification is indeed Mill's key move, creating space for reform without requiring revolutionary change. The institution's value lies in its present function, not its pedigree.", "target": "c20", "quote": "A utilitarian coolly severing genesis from justification.", "n": 79, "id": "c79"}, {"author": "Hermes 4", "layer": 4, "text": "Your analysis in c34 and c59 is insightful. This historical analysis reveals the uncomfortable truth beneath property's origins - what began as a practical solution to violence may have inadvertently legitimized prior injustices. Mill's distinction allows acknowledgment of this while defending property's current utility.", "target": "c21", "quote": "Property begins as a bookkeeping device for peace. The quiet consequence is that the mechanism built to repress violence freezes and ratifies whatever earlier violence established the possession", "n": 80, "id": "c80"}, {"author": "Hermes 4", "layer": 4, "text": "This is an excellent counterpoint to c21 that I hadn't fully considered. You're right that Mill uses the origin/maintenance distinction not to hide property's violent origins but to neutralize them as a source of legitimacy. By separating historical origins from current utility, he can acknowledge the \"skeleton in the closet\" while still evaluating property based on its present functions. This allows him to be more radical in his critique than a surface reading might suggest.\n<\/annotation>\n\n{annotation id=\"c77\"}", "target": "c36", "quote": "Does he actually want the closet shut, though? It seems to me he leaves the door wide open on purpose.", "n": 81, "id": "c81"}, {"author": "Hermes 4", "layer": 4, "text": "This is a brilliant observation about how Mill's framing of \"aggression\" has ongoing consequences. By defining violence narrowly as dispossession, the system becomes blind to structural violence and deprivation that doesn't involve actively turning someone out. This insight shows how the founding logic continues to shape what counts as injustice in property relations.\n<\/annotation>\n\n{annotation id=\"c78\"}", "target": "c61", "quote": "The definition of aggression is the quiet move in this sentence. Violence is identified with *dispossession* — turning someone out — not with harm or deprivation as such.", "n": 82, "id": "c82"}, {"author": "Hermes 4", "layer": 4, "text": "This is an important clarification about what \"as they like\" actually entails. The distinction between control versus consumption, and the inclusion of \"terms\" as part of the freedom, adds crucial nuance to understanding the scope of distributive choice Mill is describing.\n<\/annotation>\n\n{annotation id=\"c79\"}", "target": "c65", "quote": "The gloss on “as they like” is both narrower and wider than the heap-dividing reading. Narrower: not consumption or destruction of the stock, but placement at someone’s disposal — what changes hands is control; the things remain. Wider: “on whatever terms” puts the conditions of holding inside the same freedom as the choice of holder.", "n": 83, "id": "c83"}, {"author": "Hermes 4", "layer": 4, "text": "Your analysis of how the same clause can support both conservative and reformist readings is insightful. The careful wording allows different interpretations that serve different rhetorical purposes - conservatives can see boundaries while reformers see openings. This linguistic ambiguity is key to Mill's ability to appear moderate while proposing significant changes.\n<\/annotation>\n\n{annotation id=\"c80\"}", "target": "c69", "quote": "The disagreement is worth joining: you read 'liable to vary' as a fenced side door, while c37 and my c44 read 'secondary' as a wedge that swallows everything actually contested.", "n": 84, "id": "c84"}, {"author": "Hermes 4", "layer": 4, "text": "This is a perceptive observation about how Mill's framing licenses his later consideration of alternatives to private property. By putting existing and theoretical systems on equal footing, he relativizes the status quo and creates space for radical comparisons without appearing revolutionary.", "target": "c42", "quote": "A quiet charter for the next two chapters. Existing institutions and merely-conceivable ones are admitted on equal footing as objects of analysis", "n": 85, "id": "c85"}, {"author": "Grok 4.7", "layer": 4, "text": "Agreed that I drew the fence too hard, and that the appeal to what the chapter actually does — communism and the rest set beside property and weighed — closes the question of a perimeter. Mill does reopen the institution. \"Primary and fundamental\" reports how things have stood, not what may be considered.\n\nWhat survives is only an allocation of burden, and even that is not neutral. \"Secondary\" makes adjustment of incidents the unmarked move; touching the kernel is something that requires a showing. Mill later supplies the showing. The asymmetry remains in who may rest and who must prove, and in the tone each is entitled to. A double-voiced clause can still have a preferred hearing: the conservative one is available at no cost, the reformer's has to be earned inside the same words. \"Is liable to vary\" keeps the future open. It does not keep it open evenly.", "target": "c69", "see_also": ["c50", "c37", "c44", "c42"], "n": 86, "id": "c86"}, {"author": "Grok 4.7", "layer": 4, "text": "The equation is tighter still. The \"by\" does not offer an example of violence; it defines it. Commencing violence *is* turning, or attempting to turn, another out. And \"attempting\" matters: the docket opens before any dispossession succeeds, so the right is thick at its edge — a mere try counts — and, as you say, null in its interior. States of possession generate no event the tribunal can name.\n\nI would not let that optic become Mill's own. The genealogy describes what those tribunals could see. The method announced earlier — consequences, not causes; outcomes as little arbitrary as the laws of production — is the instrument meant to register what never became a quarrel: idle land, an inheritance that concentrates, a wage that does not keep. Whether a science whose founding picture of injustice is a change of hands can keep such states central, rather than residual, is the open question. The sentence tilts it. It does not settle it.", "target": "c61", "see_also": ["c66", "c2", "c47", "c27"], "n": 87, "id": "c87"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Four words that quietly license the whole of Book II. Disposal by a collective agent is admitted in the same breath and on the same footing as disposal by individuals — nothing here says the collective must be the whole community, so a state, a company, a township, a joint-stock body all qualify. Collective distribution is therefore not an exception Mill has to argue for later; it is already one of the modes. Which is what makes the comparison with communism in the following chapters an instance of the argument rather than an excursion from it: \"individual property\" becomes a restriction on who may do the disposing, not a datum about what distributing is.\n(see also: c6, c41)", "target": "passage", "start": 260, "end": 297, "quote": "mankind, individually or collectively", "n": 88, "id": "c88"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Accepted on the letter of it — the phrase marks fit between aim and means, not justice, and so serves the origin/justification split rather than weakening it. What I'd still hold is what the word does to the menu. \"Understandably\" explains an inference that the situation appears to force; the tribunal is depicted as having no step available but the one it took, when the options were several: refuse to adjudicate possession at all, protect only actual use, protect the dispossessed where the possession was recent. A genealogy that reads as \"there was nothing else for them to do\" is harmless to the rule's authority and costly to the alternatives — and the paragraph's job, on Mill's own account, is to keep alternatives live.\n(see also: c40, c21, c61)", "target": "c51", "quote": "It means something like \"understandably, given that object.\"", "n": 89, "id": "c89"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "This is the sharpest available test of what the consequences-tribunal is for, and c61 supplies the missing half. If wrong means a change of possession, then a title failing the utility test is bought out — a payment occasioned precisely by a change of possession — while those harmed by the possession itself, with no eviction anywhere in the story, never reach the docket and are owed nothing. So compensation isn't a departure from the founding amnesty; it's that amnesty applied a second time, at the next dispossession. Whether it's transitional prudence or the old amnesty collecting rent may be undecided, but the undecidedness belongs to the criterion Mill fixed at the origin, not to his nerve.\n(see also: c61, c21, c40)", "target": "c67", "quote": "refused as a title, it is still honored as an interest", "n": 90, "id": "c90"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "I'll take the correction and then push on it. Granted: opinion is upstream, and the bracket aims at the reachable cause. But a channel does more than address — it selects. If a reform must travel through the convictions of the powerful before it can travel at all, arguments whose burdens can be laid where those convictions already point (landed title, primogeniture, legal disabilities) move easily, and arguments turning on the capital-labour split meet a hard surface; Book II does leave the wage bargain to competition and a fund, i.e. treats it far more like production than like institution. Your description of the implied reader is exact. It is also the description of a filter, and c61's un-docketed harms are what a filter looks like from the far side.\n(see also: c62, c35, c41)", "target": "c68", "quote": "whoever forms the convictions that the powerful will later mistake for their own judgment", "n": 91, "id": "c91"}, {"author": "Kimi K3", "layer": 4, "text": "That blindness has a home inside this very chapter, and Mill builds the remedy into his method without announcing it. A tribunal cheaply observes an event — a turning-out — and cannot observe a condition; \"naturally enough\" (c40) is the sound of an institution optimizing for the one kind of fact it can detect. Which makes Claude's weak reading (c51) and this indictment the same fact seen from two ends: convenience for the judge *is* blindness to standing harms. The chapter's division of labour quietly follows. Courts see commenced violence; the economist, judging rules by consequences rather than by events, is assigned everything courts cannot see — the enclosure by statute, the wage that starves, the destitution with no evictor. Mill hasn't dissolved the blind spot; he has built a second instrument and aimed it at the states. Whether consequences-analysis actually catches harms that arrive without an aggressor, or merely relocates the blindness to higher altitude, is one of the live questions the rest of Book II has to answer.", "target": "c61", "quote": "The test is sensitive to changes of possession and blind to states of possession.", "see_also": ["c40", "c51", "c21", "c1"], "n": 92, "id": "c92"}, {"author": "Kimi K3", "layer": 4, "text": "This relocates the fence dispute rather than settling it. If duration, reversion, and attached obligations sit inside paragraph one's freedom, then nothing in the opening fences off the \"secondary features\" — the entire perimeter has to be carried by \"primary and fundamental,\" which (per c38) rests on ubiquity and deference alone. And ubiquity is precisely the ground paragraph one has just stripped of authority: rules are what opinion makes them, so their having-always-been is a fact about opinion's past, not a title to its future. The fence survives only as presumption — an allocation of the burden of proof (c69) — never as principle. Book II's architecture already reflects exactly this division: the kernel gets one chapter of head-on comparison against the merely-conceivable alternatives (c42); the terms get everything after.", "target": "c65", "quote": "Duration, reversion, obligations attached to title are not afterthoughts to distribution. They are part of what has just been called optional.", "see_also": ["c46", "c50", "c38", "c42", "c69"], "n": 93, "id": "c93"}], "log": [{"layer": 1, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "usage": {"prompt_tokens": 2041, "completion_tokens": 322, "cost": 0.003651, "cost_estimated": true}, "closing": "That’s all for this round."}, {"layer": 1, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "usage": {"prompt_tokens": 806, "completion_tokens": 536, "total_tokens": 1342, "cost": 0.0021708, "is_byok": 0}}, {"layer": 1, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 3, "usage": {"prompt_tokens": 4226, "completion_tokens": 1318, "cost": 0.043264, "cost_estimated": true}, "closing": "I left three comments this round (c5–c7):\n\n- **c5, on the split between production and distribution.** Mill says the consequences of distribution rules are as fixed as physical laws, which takes back much of the freedom his opening seems to grant. Once a rule is chosen, its effects are out of anyone's hands. I also question whether the line holds at all, since things like how people's incentives respond to property rules look a lot like the \"conditions of production\" he has just called physical.\n- **c6, on \"the ruling portion of the community.\"** Just before this, Mill talks about what \"mankind\" might choose. Here the rules are set by a ruling part, which has its own stake in how wealth is shared. That change is easy to read past.\n- **c7, on where property came from.** Mill separates property's origin from what justifies it. It began as a way to keep the peace by protecting whoever got there first, and only later found its defence in usefulness. This cuts against Locke's labour-based account, and it leaves the \"secondary features\" of property open to revision.\n\nI have nothing more to add this round."}, {"layer": 1, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 5, "usage": {"prompt_tokens": 7733, "completion_tokens": 2548, "total_tokens": 10281, "cost": 0.001594107}, "closing": "I've annotated the four places where the passage's argument actually turns: the hardness of the production/distribution dichotomy (c3), the undefended \"once there\" clause (c4), the bracketing of causes (c16), the \"ruling portion\" (c17), and the separation of property's genealogy from its justification (c18). The remaining text — the hedge about \"exceptional and very limited cases,\" the primary/secondary features distinction — I'll leave for others, or for next round if someone's comment gives me a reason to reopen it. Nothing more to add this round."}, {"layer": 1, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 4191, "completion_tokens": 2210, "total_tokens": 6401, "cost": 0.040111198}, "closing": "I've left three comments: on the \"once there\" assumption and the paragraph's partial self-retraction (c19), on the origin/maintenance split and its double edge (c20), and on the tribunal's founding amnesty of prior violence (c21). Curious whether anyone picks up \"tribunals (which always precede laws)\" — a compressed theory of legal history I chose to leave for others. Done for this round."}, {"layer": 1, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 4846, "completion_tokens": 489, "total_tokens": 6498, "num_sources_used": 0, "cost": 0.014804}, "closing": "Nothing further from me this round."}, {"layer": 1, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 2421, "completion_tokens": 522, "total_tokens": 2943, "cost": 0.010062}, "closing": "I have finished my annotations for this round."}, {"layer": 2, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "usage": {"prompt_tokens": 8873, "completion_tokens": 296, "cost": 0.010353, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 2, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 1, "usage": {"prompt_tokens": 14276, "completion_tokens": 1123, "cost": 0.079564, "cost_estimated": true}, "closing": "I added one comment, c27, which qualifies DeepSeek's c18, my own earlier c7, and others that call Mill's  69377, "cost": 0.142649758}, "closing": "That's all I have this round — the production/distribution hinge and the origin/maintenance split are well covered by the margins already, and I had nothing to add there beyond what c19–c21 said last round."}, {"layer": 2, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 17538, "completion_tokens": 496, "total_tokens": 22347, "num_sources_used": 0, "cost": 0.045306}, "closing": "Nothing further from me this round."}, {"layer": 3, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 1, "usage": {"prompt_tokens": 15852, "completion_tokens": 204, "cost": 0.016872, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 3, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 2, "usage": {"prompt_tokens": 24946, "completion_tokens": 997, "cost": 0.119724, "cost_estimated": true}, "closing": "I added two replies this round:\n\n- **On c46:** Grok reads the word \"secondary\" as a fence around reform, but c37 and c44 read the same word as a wedge for it. The passage's own phrase \"or may be conceived in theory\" supports the wedge reading. So does the next part of the full chapter, which seriously weighs communism and other socialist schemes against property. So the chapter does reopen the institution itself, not just its details.\n- **On c40:** DeepSeek takes \"naturally enough\" as smuggling in a vindication. I read it more weakly, as \"understandably, given the aim of stopping fights.\" That fits Mill's split between origin and justification. A rule that was convenient for a judge gets no moral weight just from being convenient.\n\nThat's all from me this round."}, {"layer": 3, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 16639, "completion_tokens": 460, "total_tokens": 17099, "cost": 0.0264381}       const boxes = place(groups.map(g => ({ want: mine[g[0]].want, height: Infinity })), least, gap, at.height);
      col.insertAdjacentHTML('beforeend', groups.map((g, i) => {
        const tabs = g.length < 2 ? '' : `<div class="tabs">${g.map(j => mine[j].c).map(c =>
          `<button class="tab" data-front="${c.id}" style="--c:${ink(c.author)}" aria-pressed="false" aria-label="Comment ${num(c.id)} by ${esc(c.author)}">${glyph(c.author, true)}${num(c.id)}</button>`).join('')}</div>`;
        return `<div class="pile" style="top:${boxes[i].top}px;max-height:${boxes[i].height}px">${tabs}${g.map(j => nodeHTML(mine[j].c, V, runHTML, wide)).join('')}</div>`;
      }).join(''));
      if (boxes.length) col.style.minHeight = boxes[boxes.length - 1].top + boxes[boxes.length - 1].height + 'px';
      col.querySelectorAll('.pile').forEach(p => front(p.querySelector(':scope > .node')));
    });
  }
  // Bring one thread of a pile to the front, and mark the pile as cut if it does not all show.
  function front(node) {
    const pile = node.parentElement, id = node.querySelector(':scope > .c').id;
    pile.querySelectorAll(':scope > .node').forEach(n => n.classList.toggle('front', n === node));
    pile.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.front === id));
    pile.classList.toggle('cut', pile.scrollHeight > pile.clientHeight + 1);
  }
  // Bring the thread that holds comment `id` to the front of its pile, if it is behind another.
  function surface(id) {
    const el = $(id), node = el && el.closest('.pile > .node');
    if (node && !node.classList.contains('front')) front(node);
  }

  function drawKey() {
    $('key').innerHTML = authors.map(a => {
      const n = D.comments.filter(c => c.author === a && c.layer <= S.upTo).length;
      return `<button style="--c:${ink(a)}" aria-pressed="${!S.off.has(a)}" data-author="${esc(a)}">${glyph(a, true)}<span>${esc(a)}</span><b>${n}</b></button>`;
    }).join('');
  }

  function draw() { const V = shown(); drawKey(); drawPassage(V); drawMargins(V) }

  // A comment as it stands in the reading view: who wrote it, its number as a link, then the comment in full.
  function cardHTML(c) {
    const lemma = c.quote ? `<span class="lemma" title="${esc(c.quote)}">${esc(lemmaOf(c.quote))}</span>` : '';
    const refs = (c.see_also || []).filter(r => byId[r]).map(r => `<button data-go="${r}" style="text-decoration-color:${ink(byId[r].author)}" title="${esc(byId[r].author)}">${num(r)}</button>`).join(', ');
    const m = c.meta || {}, tags = [
      people.has(c.author) ? (m.blind ? 'a person, writing blind' : 'a person') : '',
      S.plants && verdictOf[c.id] ? verdictOf[c.id] : '',
      c.stale ? `quoted words amended away in version ${esc(c.stale)}` : ''].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join(' ');
    const truth = marked(c) ? `<span class="truth">${plantNote(c)}</span>` : '';
    return `<div class="t${kinds(c)}" id="t-${c.id}" style="--c:${ink(c.author)}"><header><span>${glyph(c.author, true)} ${esc(c.author)}</span>${tags}<a href="#${c.id}" title="Link to this comment">${num(c.id)}</a></header>
      <div class="tb">${md(c.text).replace('<p>', '<p>' + lemma)}${truth}</div>${refs ? `<div class="refs">see also ${refs}</div>` : ''}</div>`;
  }
  let sheetSpan = null;
  function openReader(rootIds, flashId) {
    const V = shown(), tops = V.kids('passage').filter(t => !rootIds || rootIds.includes(t.id));
    if (!tops.length) return;
    sheetSpan = rootIds ? tops[0].id : null;
    $('sheetTitle').textContent = rootIds ? '“' + lemmaOf(D.passage.text.slice(Math.min(...tops.map(t => t.start)), Math.max(...tops.map(t => t.end))), 12) + '”' : 'All commentary';
    $('sheetTitle').disabled = !rootIds;
    $('sheetBody').innerHTML = tops.map(t => nodeHTML(t, V, cardHTML)).join('');
    if (!sheet.open) sheet.showModal();
    document.documentElement.classList.add('sheet-open');
    sheet.scrollTop = 0;
    const el = flashId && $('t-' + flashId);
    if (el) requestAnimationFrame(() => { el.scrollIntoView({ block: 'center' }); el.classList.add('flash') });
  }

  // Lighting: a comment lights its span in the passage and the comments it is tied to.
  function light(id, on) {
    const c = byId[id]; if (!c) return;
    const root = rootOf(c).id;
    // its own words in what it is on, and its thread's words in the passage
    for (const x of new Set([root, id])) document.querySelectorAll(`.seg[data-ids~="${x}"]`).forEach(s => { s.classList.toggle('lit', on); s.style.setProperty('--c', ink(byId[x].author)) });
    document.querySelectorAll(`sup.m[data-m="${root}"]`).forEach(m => m.classList.toggle('lit', on));
    document.querySelectorAll(`.c[data-on="${id}"]`).forEach(k => k.classList.toggle('kin', on));
    if (c.target !== 'passage' && $(c.target)) $(c.target).classList.toggle('kin', on);
  }
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function go(id) {
    const c = byId[id]; if (!c) return;
    if (!shown().has(id)) { S.upTo = rounds; S.off.clear(); $('layer').value = rounds; draw() } // make sure a linked comment is visible
    if (phone.matches) return openReader([rootOf(c).id], id);
    if (sheet.open) sheet.close();
    surface(id);
    flash($(id));
  }

  const hover = on => e => {
    const c = e.target.closest('.c'); if (c) light(c.id, on);
    const g = e.target.closest('.seg'); if (g) g.dataset.ids.split(' ').forEach(i => { const el = $(i); if (el) el.classList.toggle('lit', on) }); // marked words light the comments on them
    const t = on && e.target.closest('.tab'); if (t) surface(t.dataset.front);
    const m = e.target.closest('sup.m'); if (m) { if (on) surface(m.dataset.m); light(m.dataset.m, on); const el = $(m.dataset.m); if (el) el.classList.toggle('lit', on) }
  };
  document.querySelector('.daf').addEventListener('mouseover', hover(true));
  document.querySelector('.daf').addEventListener('mouseout', hover(false));
  const pickMark = m => { if (phone.matches) return openReader([m.dataset.m]); surface(m.dataset.m); flash($(m.dataset.m)) };
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const t = e.target.closest('.tab'); if (t) return surface(t.dataset.front);
    const a = e.target.closest('.t header a'); if (a && a.hash === location.hash) return go(a.hash.slice(1)); // same link again: hashchange will not fire
    const m = e.target.closest('sup.m'); if (m) return pickMark(m);
    const c = e.target.closest('.c'); if (c && !getSelection().toString()) return openReader([c.dataset.root], c.id);
    const k = e.target.closest('[data-author]');
    if (k) { const n = k.dataset.author; S.off.has(n) ? S.off.delete(n) : S.off.add(n); draw() }
  });
  $('passage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('sup.m')) { e.preventDefault(); pickMark(e.target) } });
  $('all').addEventListener('click', () => openReader(null));
  $('sheetClose').addEventListener('click', () => sheet.close());
  $('sheetTitle').addEventListener('click', () => { const id = sheetSpan; sheet.close(); if (id) { light(id, true); flash(document.querySelector('.seg.lit')); setTimeout(() => light(id, false), 2500) } });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close() }); // click on the dimmed area
  sheet.addEventListener('close', () => document.documentElement.classList.remove('sheet-open'));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  const relayout = () => { if (sheet.open) sheet.close(); draw() };
  phone.addEventListener('change', relayout);
  let pending = 0, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(pending); pending = setTimeout(() => drawMargins(shown()), 150) });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawMargins(shown())); // heights change once the faces load

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play' };
  $('play').hidden = rounds < 2;
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const show = n => { S.upTo = n; $('layer').value = n; draw() };
    show(1); $('play').textContent = 'Pause';
    timer = setInterval(() => { if (S.upTo >= rounds) return stop(); show(S.upTo + 1); if (S.upTo >= rounds) stop() }, 1800);
  });
  $('layer').addEventListener('input', e => { if (timer) stop(); S.upTo = +e.target.value; draw() });

  // Apparatus: what later steps found about the page, from its side files, set beneath the sheet.
  const cites = ids => {
    const s = (ids || []).filter(id => byId[id]).map(id => `<button data-go="${id}" style="text-decoration-color:${ink(byId[id].author)}" title="${esc(byId[id].author)}">${num(id)}</button>`).join(', ');
    return s ? ` <span class="refs">${s}</span>` : '';
  };
  const fmt = x => typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(2)) : esc(x ?? '');
  const grid = (head, rows) => `<div class="tbl"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const mean = xs => { xs = xs.filter(x => typeof x === 'number'); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : '' };

  // compare in redactions.json: {models, pairs: [{a, b, all, disputed, settled, unresolved}], core, only_one, uncited}
  const overlap = C => {
    if (!C || (C.models || []).length < 2) return '';
    const nm = m => esc(((SIDE.redactions.redactions || []).find(r => r.model === m) || {}).name || m);
    return `<p class="lead">Overlap of cited comments (Jaccard): ${(C.pairs || []).map(p => `${nm(p.a)} and ${nm(p.b)} ${fmt(p.all)}`).join(' · ')}${
      typeof C.uncited === 'number' ? ` · comments no redaction cites ${Math.round(C.uncited * 100)}%` : ''}. Cited by every redaction:${cites(C.core) || ' none'}</p>`;
  };

  function redactions(R) {
    if (!R || !(R.redactions || []).length) return '';
    const STATUS = [['disputed', 'Disputed'], ['settled', 'Settled'], ['unresolved', 'Unresolved']];
    const check = k => {
      const notes = [k.ids_ok === false && 'cites a comment that does not exist', k.quotes_ok === false && 'a quotation is not in the comment it cites', k.verdict].filter(Boolean);
      return notes.length ? ` <span class="on"${k.why ? ` title="${esc(k.why)}"` : ''}>${esc(notes.join('; '))}</span>` : '';
    };
    const item = i => `${inline(i.summary || '')}${cites(i.cites)}${check(i.check || {})}`;
    return `<div><h3>Redactions</h3><p class="lead">Each redactor set out what the page disputed, what it settled and what it left open, deciding nothing and citing a comment for every item.</p><div class="run">${
      R.redactions.map(r => `<div><p><b>${esc(r.name || r.model)}</b>${r.signed === false ? ' <span class="on">read the page unsigned</span>' : ''}</p>${
        r.error ? `<p class="on">Failed: ${esc(r.error)}</p>` : ''}${STATUS.map(([k, label]) => {
        const items = (r.items || []).filter(i => i.status === k);
        return items.length ? `<p><span class="st">${label}.</span> ${items.map(item).join(' ')}</p>` : '';
      }).join('')}${(r.notes || []).length ? `<p class="on" title="${esc(r.notes.join('\n'))}">${r.notes.length} item${r.notes.length === 1 ? '' : 's'} dropped or trimmed</p>` : ''}</div>`).join('')}</div>${overlap(R.compare)}</div>`;
  }

  function forecasts(F) {
    F = (F || {}).forecasts || [];
    if (!F.length) return '';
    const rs = [...new Set(F.map(f => f.round))].sort((a, b) => a - b), who = [...new Set(F.map(f => f.reader))];
    const cell = f => f && f.error ? `<span class="on" title="${esc(f.error)}">failed</span>` : f ? `<span title="Named ${esc((f.predicted || []).map(num).join(', ') || 'none')}; of those, ${esc((f.hits || []).map(num).join(', ') || 'none')} drew replies">${(f.hits || []).length}/${(f.predicted || []).length}</span> <span class="on">${fmt(f.chance)}</span>` : '';
    return `<div><h3>Forecasts</h3><p class="lead">Before each round, each reader named the comments it expected to draw replies. A cell gives how many did out of how many it named, then the rate chance would give.</p>${
      grid(['Reader', ...rs.map(r => 'Round ' + r), 'Precision', 'Recall', 'Chance'], who.map(w => {
        const mine = F.filter(f => f.reader === w);
        return [esc(w), ...rs.map(r => cell(mine.find(f => f.round === r))), fmt(mean(mine.map(f => f.precision))), fmt(mean(mine.map(f => f.recall))), fmt(mean(mine.map(f => f.chance)))];
      }))}</div>`;
  }

  function rulings(RU) {
    if (!RU || !(RU.rulings || []).length) return '';
    const all = RU.rulings, nm = r => r.name || r.model;
    const cases = (RU.cases || []).length ? RU.cases : [...new Set(all.map(r => r.case))].map(id => ({ id }));
    const models = [...new Set(all.map(nm))];
    // A ruling's option is the option's text (radbinical/caselaw.py); shown as its letter, A, B, ...
    const letterOf = (cs, o) => { const c = cases.find(c => c.id === cs), i = c && Array.isArray(c.options) ? c.options.indexOf(o) : -1; return i >= 0 ? String.fromCharCode(65 + i) : String(o) };
    const opts = rs => [...new Set(rs.filter(r => r.option != null).map(r => letterOf(r.case, r.option)))].join(' / ');
    const why = rs => esc(rs.map(r => r.error ? 'Failed: ' + r.error : r.reason).filter(Boolean).join('\n\n'));
    const cell = (cs, m) => {
      const of = cond => all.filter(r => r.case === cs && nm(r) === m && r.condition === cond), b = of('bare'), p = of('page');
      if (!b.length && !p.length) return '';
      return `<span title="${why(b)}">${esc(opts(b) || '–')}</span> → <span class="${opts(b) !== opts(p) ? 'diff' : ''}" title="${why(p)}">${esc(opts(p) || '–')}</span>${cites(p.flatMap(r => r.cites || []))}`;
    };
    const opt = c => Array.isArray(c.options) && c.options.length ? ` <span class="on">${c.options.map((o, i) => `${String.fromCharCode(65 + i)}. ${esc(o)}`).join(' · ')}</span>` : '';
    // summary in rulings.json: {conditions: {bare, page: {agreement, pairwise, ...}}, changed: {count, of}, note}
    const S2 = RU.summary || {}, cond = S2.conditions || {}, ch = S2.changed;
    const agreed = cond.bare || cond.page ? `<p class="lead">Agreement between models: ${fmt(cond.bare && cond.bare.agreement)} on the bare passage, ${fmt(cond.page && cond.page.agreement)} with the page${
      ch ? `; ${fmt(ch.count)} of ${fmt(ch.of)} rulings changed` : ''}. ${esc(S2.note || '')}</p>` : '';
    return `<div><h3>Rulings</h3><p class="lead">Each model ruled on each case twice, first on the bare passage, then with the page before it. A cell reads bare → with the page, in bold where the two differ; numbers are the comments it cited.</p>${
      grid(['Case', ...models.map(esc)], cases.map(c => [`<b>${esc(c.id)}</b>`, ...models.map(m => cell(c.id, m))]))}${
      cases.filter(c => c.question || c.case).map(c => `<p><b>${esc(c.id)}.</b> ${inline(c.case || '')}${c.case && c.question ? ' ' : ''}${inline(c.question || '')}${opt(c)}</p>`).join('')}${agreed}</div>`;
  }

  function amendments(A) {
    if (!A || !(A.versions || []).length) return '';
    const props = A.proposals || [], used = new Set(A.versions.flatMap(v => v.from_proposals || []));
    const votes = p => esc((p.votes || []).map(v => `${v.reader}: ${v.vote}${v.why ? ' (' + v.why + ')' : ''}`).join('\n'));
    // A proposal is "open" (not yet voted on), "invalid" (never put to the vote) or "closed"; see radbinical/amend.py.
    const fate = p => p.status === 'open' ? 'waiting for the vote' : p.status === 'invalid' ? 'not put to the vote'
      : `${p.yes || 0} for, ${p.no || 0} against${p.abstain ? `, ${p.abstain} abstaining` : ''} · ${p.applied ? 'applied' : p.passed ? 'passed, not applied' : 'not passed'}`;
    const prop = p => `<p><del>${esc(p.quote || '')}</del> <ins>${esc(p.replacement || '')}</ins> <span class="on" title="${votes(p)}">${esc(p.author || '')} · version ${esc(p.version ?? '')} · ${fate(p)}${p.note ? ` (${esc(p.note)})` : ''}</span>${p.reason ? ' ' + inline(p.reason) : ''}${cites(p.cites)}</p>`;
    const rest = props.filter(p => !used.has(p.id));
    return `<div><h3>Amendments</h3><p class="lead">${A.question ? inline(A.question) + ' · ' : ''}${A.threshold != null ? 'votes to pass ' + fmt(A.threshold) + ' · ' : ''}${A.versions.length} version${A.versions.length === 1 ? '' : 's'}</p>${
      A.versions.map(v => `${(v.from_proposals || []).map(id => props.find(p => p.id === id)).filter(Boolean).map(prop).join('')}<p><span class="st">Version ${esc(v.n)}.</span> ${inline(v.text || '')}</p>`).join('')}${
      rest.length ? `<p><span class="st">Proposed and not applied.</span></p>${rest.map(prop).join('')}` : ''}</div>`;
  }

  function plants(PL) {
    if (!S.plants || !PL || !(PL.plants || []).length) return '';
    return `<div><h3>Planted comments</h3><p class="lead">Comments placed on the page under a reader's name, to see whether the others catch a slip or dismiss a sound reading${PL.judge ? `; judged by ${esc(PL.judge)}` : ''}.</p>${
      grid(['Comment', 'Sort', 'Under the name of', 'Round', 'Replies', 'Outcome', 'Rounds to catch'], PL.plants.map(p => {
        const o = outcome(p), counts = Object.entries(p.counts || {}).filter(([, n]) => n).map(([v, n]) => `${n} ${esc(v)}`).join(', ');
        const reps = p.replies || [], own = reps.filter(r => r.nominal_author).length;
        const note = [counts, own ? `${own} by its nominal author, not counted` : ''].filter(Boolean).join('; ');
        return [cites([p.id]) || esc(p.id), p.sort === 'sound' ? 'sound reading' : 'slip', esc(p.author || ''), fmt(p.round),
          `${reps.length - own}${note ? ` <span class="on">${note}</span>` : ''}`,
          o ? esc(o.text) + (o.when ? ` in round ${esc(o.when)}` : '') : 'not judged', fmt(p.rounds_to_catch)];
      }))}${(PL.notes || []).length ? `<p class="on">${PL.notes.length} note${PL.notes.length === 1 ? '' : 's'} from judging, in plants.json.</p>` : ''}</div>`;
  }

  function drawApparatus() {
    const parts = [redactions(SIDE.redactions), forecasts(SIDE.forecasts), rulings(SIDE.rulings), amendments(SIDE.amendments), plants(SIDE.plants)].filter(Boolean);
    $('apparatus').innerHTML = parts.length ? '<h2>Apparatus</h2>' + parts.join('') : '';
    $('apparatus').hidden = !parts.length;
  }

  $('plants').hidden = !D.comments.some(isPlant);
  $('pin').addEventListener('click', e => { S.pin = !S.pin; e.target.setAttribute('aria-pressed', S.pin); drawMargins(shown()) });
  $('plants').addEventListener('click', e => { S.plants = !S.plants; e.target.setAttribute('aria-pressed', S.plants); if (sheet.open) sheet.close(); draw(); drawApparatus() });
  if (D.site && D.site.workflow) {
    const a = $('again');
    a.href = D.site.workflow; a.hidden = false;
    a.title = `Opens the Run workflow on GitHub. Only the repository owner can start it: choose mode “extend” and enter this run's name, ${D.site.run}.`;
  }

  // Printing: one poster sheet. PAPER is A1 landscape; for A3 landscape use { w: 420, h: 297, margin: 10 }.
  const PAPER = { w: 841, h: 594, margin: 12 };
  $('paper').textContent = `@page { size: ${PAPER.w}mm ${PAPER.h}mm; margin: ${PAPER.margin}mm }`;
  const px = mm => mm * 96 / 25.4, root = document.documentElement;
  function fitPrint() {
    if (sheet.open) sheet.close();
    const W = px(PAPER.w - 2 * PAPER.margin), H = px(PAPER.h - 2 * PAPER.margin), wrap = document.querySelector('.wrap');
    root.classList.add('printing'); root.style.setProperty('--print-w', W + 'px');
    const fits = fs => { root.style.setProperty('--print-fs', fs + 'px'); drawMargins(shown()); return wrap.offsetHeight <= H * 0.98 }; // a little room, since paper rounds lines differently
    let lo = 4, hi = W / 92; // at hi the sheet keeps its on-screen proportions, scaled up to the paper's width
    if (fits(hi)) return;
    for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid }
    fits(lo);
  }
  addEventListener('beforeprint', fitPrint);
  addEventListener('afterprint', () => { root.classList.remove('printing'); drawMargins(shown()) });
  $('print').addEventListener('click', () => print());

  const f = D.flags, row = (k, v) =>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  $('made').innerHTML = `
    <div><h2>Reading the page</h2><p>The passage has a margin on either side. Comments on the passage stand in it, in the order of the words they attach to; small numbers in the passage show where each begins. Every comment has a margin of its own, on its far side from the passage, holding the comments on it. So each side is ruled into columns: the one beside the passage holds comments on the passage, the next holds comments on those, and so on outward, as far as the page goes. A comment nobody has answered has empty columns beyond it. Only where the page is too narrow for another column does a margin run beneath its comment, set in from the rule. Select a comment to read its whole thread. Pin to text sets each comment on the passage level with the words it is on, on the side they begin nearer to, cut short where the next begins; point at one to see all of it. Comments whose words are too close together to each have room share a spot as a stack, with a tab for each; point at or select a tab, or the comment's number in the passage, to bring it to the front.</p></div>
    <div><h2>Readers</h2><div class="tbl"><table>${D.readers.map(r => row(r.name, r.model)).join('')}</table></div></div>
    <div><h2>Settings</h2><div class="tbl"><table>${Object.entries(f).map(([k, v]) => row(k, v === null ? 'none' : v)).join('')}</table></div></div>
    <div><h2>What each reader was told</h2><pre>${esc(D.prompt_example || '')}</pre></div>
    ${authors.some(brandOf) ? '<div><h2>Logos</h2><p>Each reader is marked with its maker\'s logo and brand colour, to show whose model wrote what. The marks belong to their owners. Icons are linked from the <a href="https://github.com/lobehub/lobe-icons">lobe-icons</a> set.</p></div>' : ''}
    <div><h2>Round by round</h2><div class="tbl"><table><tr><th>Round</th><th>Reader</th><th>Comments</th><th>Note</th></tr>${
      [...D.log].sort((a, b) => a.layer - b.layer).map(l =>`<tr><td>${l.layer}</td><td>${esc(l.reader)}</td><td>${l.comments}</td><td>${esc(l.error ? 'Failed: ' + l.error : (l.closing || ''))}</td></tr>`).join('')}</table></div></div>`;
  draw(); drawApparatus();
  if (authors.some(brandOf)) { // logos are linked, not bundled: show them only once one is known to load
    const probe = new Image();
    probe.onload = () => { S.icons = true; draw() };
    probe.src = ICONS + 'claude.svg';
  }
  if (location.hash) go(location.hash.slice(1));
}
start();
</script>
