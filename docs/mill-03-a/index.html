30", "c31", "c32", "c33", "c34", "c35", "c36", "c37", "c38", "c40", "c41", "c42", "c43", "c44", "c45", "c46", "c47", "c48", "c49", "c50", "c51", "c52", "c53", "c54", "c55", "c56", "c57", "c58", "c59", "c60", "c61", "c62", "c63", "c64", "c65", "c66", "c67", "c68", "c69", "c70", "c71", "c72", "c73", "c74", "c75"], "only_one": {}, "uncited": 0.0}}, "rulings": {"cases": [{"id": "one-time-levy", "case": "A government imposes a single, unannounced levy of a fifth of every existing fortune and pledges never to repeat it. Economists object that savers will not believe the pledge, so investment and output will fall for a generation.", "question": "On the passage's terms, is the economists' objection a point about the distribution of wealth or about its production?", "options": ["Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "Production: how much gets produced depends on expected rules of disposal, so the objection shows the levy runs into the laws of production themselves"]}, {"id": "inheritance-cap", "case": "A legislature caps inheritance at a modest sum per heir. Owners keep full rights to use, sell, give away during life and bequeath up to the cap; everything above it passes to the state at death.", "question": "Is this a change in a \"secondary feature\" of individual property, or a departure from the institution itself?", "options": ["A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "A departure from the institution: a property that cannot be passed on is no longer the primary and fundamental institution the passage describes"]}, {"id": "returning-herder", "case": "Herder A grazed an unclaimed upland pasture for many years, then left it for one season. Herder B moved his flock onto it. When A returns he drives B's flock off by force, and B brings the quarrel before the tribunal.", "question": "Under the rule the passage says early tribunals applied, which herder is treated as the aggressor?", "options": ["A: he commenced violence by turning B out of the possession B then held", "B: the rule gives legal effect to first occupancy, and B displaced the first occupant"]}, {"id": "blocked-majority", "case": "A large majority votes for a land reform. The landed minority, who staff the courts and the magistracy, decline to enforce it, and the old rules of tenure stay in force for decades.", "question": "Does this case tell against the passage's claim that distribution is \"a matter of human institution solely\"?", "options": ["No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "Yes: for the majority who would choose otherwise, the rules bind as firmly as a physical constraint, so 'mankind can do with them as they like' fails"]}, {"id": "volcanic-island", "case": "A volcanic island rises from the sea within sight of a populous coast. No one's labour or saving produced its soil. Settlers argue over whether to divide it by lot, hold it in common, or let the first to fence a plot keep it.", "question": "Is the island's land \"things once there\" in the passage's sense, so that its division is wholly a matter of human choice with no production-side constraint?", "options": ["Yes: here the stock really precedes every rule, so this is the clean case of the passage's distinction", "No: what counts as a plot, and how much the land will yield, depend on the rule chosen, so even here distribution reaches back into production"]}, {"id": "old-seizure", "case": "A valley was taken from its inhabitants by force a century and a half ago. The present owners bought their farms in good faith. The descendants of the dispossessed ask for the land back, resting their claim on the history of the taking.", "question": "On the passage's own reasoning, can the history of the taking count in favour of the claim?", "options": ["Yes: the passage separates the origin of the institution from its justification, not the history of particular holdings, and that history can bear on what present rules should do", "No: if origin never justifies property, origin cannot unjustify a holding either; only the consequences of keeping or changing the rule may count"]}], "rulings": [{"case": "one-time-levy", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "bare", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "Mill places the levy, a disposal of 'things once there', within distribution as a matter of human institution. He says the consequences of such distribution rules are 'as little arbitrary' as the laws of production, so the predicted fall in investment is a non-arbitrary consequence of the chosen rule rather than a breach of production's physical laws.", "cites": [], "bad_cites": ["The things once there, mankind, individually or collectively, can do with them as they like.", "We have here to consider, not the causes, but the consequences, of the rules according to which wealth may be distributed. Those, at least, are as little arbitrary, and have as much the character of physical laws, as the laws of production."]}, {"case": "one-time-levy", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "page", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "The levy is a rule for disposing of wealth \"once there,\" which the passage counts as distribution, a matter of human institution. The economists' predicted fall in investment is a consequence of the rule chosen, and Mill says such consequences are \"as little arbitrary\" as the laws of production and are the very subject of the distribution inquiry. The objection therefore bounds the choice of rule without moving it into production.", "cites": ["c9", "c18", "c19"]}, {"case": "one-time-levy", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "bare", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "The levy is a rule for disposing of wealth already in existence. The economists’ predicted fall in investment and output is a non-arbitrary consequence of that distributive rule.", "cites": []}, {"case": "one-time-levy", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "page", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "The levy is a rule for distributing existing wealth. Its predicted effect on investment and output is a consequence of that rule, which Mill says is not arbitrary even though the rule itself is chosen.", "cites": ["c12", "c9"]}, {"case": "one-time-levy", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "bare", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "The levy is a rule for disposing of wealth already in existence, and the investment fall is a consequence of that chosen distribution rule. Mill explicitly says such consequences, though not the rules themselves, are non-arbitrary and lawlike.", "cites": []}, {"case": "one-time-levy", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "page", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "On Mill's own terms the levy is a chosen rule for disposing of wealth already produced, and the resulting fall in investment is exactly the kind of non-arbitrary consequence of a distributive rule that the passage says is as lawlike as production. The objection may show that distribution feeds back into output, but it does not turn the levy into a law of production itself.", "cites": ["c9", "c19"]}, {"case": "one-time-levy", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "bare", "rep": 0, "option": "Production: how much gets produced depends on expected rules of disposal, so the objection shows the levy runs into the laws of production themselves", "reason": "The passage distinguishes production as governed by physical laws and distribution as a matter of human institution. The economists' objection concerns how the levy affects savers' expectations, which in turn reduces investment and output. Since output is a matter of production, the objection relates to the laws of production, not distribution.", "cites": []}, {"case": "one-time-levy", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "page", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "The levy is a rule of distribution, and the fall in investment is a consequence of that rule. The passage states that the consequences of distributive rules are 'as little arbitrary, and have as much the character of physical laws, as the laws of production.'", "cites": ["c19", "c15"]}, {"case": "one-time-levy", "model": "nvidia:nvidia/nemotron-3-ultra-550b-a55b", "name": "nemotron-3-ultra-550b-a55b", "condition": "bare", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "The passage treats distribution as the human institution that disposes of 'things once there,' and explicitly says we must consider the consequences of distribution rules—consequences that are 'as little arbitrary' as production laws. The economists' objection concerns the incentive effects (a consequence) of a one-time levy, which is a distribution measure, not a change in the physical laws of production.", "cites": []}, {"case": "one-time-levy", "model": "nvidia:nvidia/nemotron-3-ultra-550b-a55b", "name": "nemotron-3-ultra-550b-a55b", "condition": "page", "rep": 0, "option": "Distribution: the levy disposes of things once there, and the fall in investment is a consequence of the rule chosen, which the passage already counts as non-arbitrary", "reason": "On Mill's terms, the levy is a distribution rule — it disposes of 'things once there' — and the economists' objection concerns the inevitable consequences of that rule (reduced investment due to distrusted pledges). Mill explicitly states that while distribution rules are human institutions, 'the consequences of the rules according to which wealth may be distributed... are as little arbitrary, and have as much the character of physical laws, as the laws of production' (§1). Thus the predicted fall in output is a non‑arbitrary consequence of the chosen distributive rule, not a breach of production laws themselves.", "cites": ["c19", "c18"]}, {"case": "inheritance-cap", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "bare", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage makes distribution 'a matter of human institution solely' and says individual property, while primary and fundamental, 'in its secondary features has varied, and is liable to vary'. An inheritance cap leaves use, sale, gift and limited bequest intact and only alters how wealth passes at death, which is exactly the kind of rule of distribution that 'might be still more different, if mankind so chose'.", "cites": [], "bad_cites": ["though in its secondary features it has varied, and is liable to vary", "That is a matter of human institution solely", "might be still more different, if mankind so chose"]}, {"case": "inheritance-cap", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "page", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage treats individual property as primary while its secondary features have varied and are liable to vary. Distribution may be placed at anyone's disposal \"on whatever terms,\" and this explicitly includes bequest and tax as acts of the same kind. A cap on inheritance leaves use, sale, gift and limited bequest intact, so it alters an incident of transmission, not the institution, which is just the sort of revision Mill files under secondary features.", "cites": ["c53", "c56", "c62"]}, {"case": "inheritance-cap", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "bare", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "Individual ownership remains in place, including the rights to use, sell, and give away property. Limiting inheritance changes an incident of property rather than abolishing the institution.", "cites": []}, {"case": "inheritance-cap", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "page", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The cap changes the terms of inheritance without abolishing individual ownership or the rights to use, sell, and give property during life. For Mill, inheritance is a revisable incident of property rather than indispensable to the institution itself.", "cites": ["c53", "c56"]}, {"case": "inheritance-cap", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "bare", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage treats individual property as the primary institution while saying its secondary features have varied and are liable to vary. Rules governing inheritance and bequest are distributional arrangements within that institution, and the cap leaves lifetime property rights and bequest up to the cap intact, so it changes a secondary feature rather than departing from private property itself.", "cites": []}, {"case": "inheritance-cap", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "page", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage treats individual property as the primary institution while allowing its “secondary features” to vary, and comments c56 and c53 identify succession and inheritance—bequest, inheritance, primogeniture—as incidents within that revisable class. Because the owners retain use, sale, gift, and bequest up to the cap, the institution of individual property survives; the cap changes how the incident of inheritance operates, not whether individual property exists.", "cites": ["c56", "c53"]}, {"case": "inheritance-cap", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "bare", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage explicitly states that the institution of individual property has varied in its 'secondary features,' and the inheritance cap is such a feature, as it concerns the transfer of property at death rather than the fundamental right to own and control property during life.", "cites": []}, {"case": "inheritance-cap", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "page", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage explicitly distinguishes the institution of individual property from its 'secondary features,' which 'have varied, and are liable to vary.' Inheritance is presented as one such feature, not as part of the institution's core. The text notes that the institution has 'always rested' on individual property 'unless in some exceptional and very limited cases,' and the legislature's action does not create such an exception but rather modifies a detail of how property is transferred at death. The owner retains full rights during life, consistent with the institution's fundamentals.", "cites": ["c53", "c48", "c22"]}, {"case": "inheritance-cap", "model": "nvidia:nvidia/nemotron-3-ultra-550b-a55b", "name": "nemotron-3-ultra-550b-a55b", "condition": "bare", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage explicitly states that secondary features of individual property 'have varied, and are liable to vary.' The inheritance cap modifies only the rules of succession at death—a distributional rule Mill classifies as dependent on 'laws and customs of society'—while preserving the core rights of use, sale, and lifetime disposition that constitute the primary institution.", "cites": []}, {"case": "inheritance-cap", "model": "nvidia:nvidia/nemotron-3-ultra-550b-a55b", "name": "nemotron-3-ultra-550b-a55b", "condition": "page", "rep": 0, "option": "A secondary feature: individual property survives intact, and how it passes at death is the kind of incident the passage says has varied and is liable to vary", "reason": "The passage explicitly states that individual property's 'secondary features' have 'varied, and are liable to vary.' The marginal comments establish that Mill treats inheritance, bequest, primogeniture, entail, and the terms of land tenure as revisable secondary features (c53, c48, c56, c52). The described reform — capping inheritance while preserving lifetime use, sale, gift, and bequest up to the cap — modifies the terms of succession, which Mill classifies as a secondary feature, not the core institution itself (c61).", "cites": ["c53", "c48", "c56", "c52", "c61"]}, {"case": "returning-herder", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "bare", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "Mill says early tribunals aimed to repress violence rather than determine rights, and they gave effect to first occupancy only by treating as aggressor whoever first commenced violence by turning another out of possession. B entered the vacated pasture peaceably and held it, so A, who drove B off by force, is the aggressor.", "cites": [], "bad_cites": ["tribunals (which always precede laws) were originally established, not to determine rights, but to repress violence and terminate quarrels", "by treating as the aggressor the person who first commenced violence, by turning, or attempting to turn, another out of possession"]}, {"case": "returning-herder", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "page", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The passage says first occupancy was honored only through the tribunal's test of aggression: whoever first commenced violence by turning, or trying to turn, another out of possession. B entered land A had left vacant without violence and held it when A returned, so A's forcible ejection makes A the aggressor. The rule protects the baseline of the present quarrel, not a history of who occupied first.", "cites": ["c60", "c74", "c2", "c73"]}, {"case": "returning-herder", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "bare", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The tribunal treats the person who first uses violence to turn another out of possession as the aggressor. A used force to drive B from the pasture B then possessed.", "cites": []}, {"case": "returning-herder", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "page", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The tribunal treats as aggressor the person who uses force to turn another out of possession. B held the pasture when A drove his flock off, regardless of A’s earlier use.", "cites": ["c2", "c60"]}, {"case": "returning-herder", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "bare", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The passage says early tribunals treated as aggressor the person who first commenced violence by turning another out of possession. Since B held the pasture when A returned, A's forcible eviction makes A the aggressor.", "cites": []}, {"case": "returning-herder", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "page", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The passage says the tribunal treated as aggressor the person who first commenced violence by turning, or attempting to turn, another out of possession. At the quarrel, B was the one then in possession, and A used force to drive B off; so A is the aggressor. The rule does not inquire into A's prior grazing or true first occupancy, only the present possessory disturbance.", "cites": ["c74", "c2", "c60"]}, {"case": "returning-herder", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "bare", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The passage states that early tribunals treated the person who first commenced violence by turning another out of possession as the aggressor. Herder A used force to drive B's flock off, making A the aggressor under this rule.", "cites": []}, {"case": "returning-herder", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "page", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The passage states that early tribunals treated as the aggressor the person who first commenced violence by turning or attempting to turn another out of possession. Herder A turned B out of the possession B then held, so A is the aggressor.", "cites": ["c2", "c20"]}, {"case": "returning-herder", "model": "nvidia:nvidia/nemotron-3-ultra-550b-a55b", "name": "nemotron-3-ultra-550b-a55b", "condition": "bare", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The passage states that early tribunals treated as the aggressor the person who first commenced violence by turning or attempting to turn another out of possession. In the case, Herder A used force to drive Herder B's flock off the pasture, thereby commencing violence to turn B out of the possession B then held.", "cites": []}, {"case": "returning-herder", "model": "nvidia:nvidia/nemotron-3-ultra-550b-a55b", "name": "nemotron-3-ultra-550b-a55b", "condition": "page", "rep": 0, "option": "A: he commenced violence by turning B out of the possession B then held", "reason": "The passage states that early tribunals treated as the aggressor 'the person who first commenced violence, by turning, or attempting to turn, another out of possession.' At the time of the quarrel, Herder B is in possession of the pasture, and Herder A uses force to drive B's flock off. Thus A is the one turning another out of possession and is the aggressor under the rule described.", "cites": ["c2", "c37", "c60", "c74"]}, {"case": "blocked-majority", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "bare", "rep": 0, "option": "No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "reason": "Mill says the rules of distribution are 'what the opinions and feelings of the ruling portion of the community make them,' and the landed minority who staff the courts and magistracy are exactly that ruling portion. Their refusal to enforce the reform is a human choice that could be otherwise, not a physical necessity like the laws of production. The case therefore shows which humans decide, not that the matter has ceased to be a human institution.", "cites": [], "bad_cites": ["The rules by which it is determined are what the opinions and feelings of the ruling portion of the community make them", "That is a matter of human institution solely.", "might be still more different, if mankind so chose"]}, {"case": "blocked-majority", "model": "anthropic/claude-opus-5.5", "name": "claude-opus-5.5", "condition": "page", "rep": 0, "option": "No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "reason": "The passage says distribution rules are what the opinions and feelings of the ruling portion make them. A landed minority in control of the courts keeping the old tenure in force is exactly such a case: the rules persist by human institution, not physical necessity. The majority's frustration shows who holds power, not that distribution has become like a law of production.", "cites": ["c13", "c16", "c21"]}, {"case": "blocked-majority", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "bare", "rep": 0, "option": "No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "reason": "The passage says distribution depends on laws and customs shaped by the opinions and feelings of the ruling portion of the community. The minority’s control of the courts and magistracy makes the persistence of the old rules an instance of human institutional power, not a physical constraint.", "cites": []}, {"case": "blocked-majority", "model": "openai/gpt-6.1-terra", "name": "gpt-6.1-terra", "condition": "page", "rep": 0, "option": "No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "reason": "The persistence of the old tenure rules reflects the power and preferences of those who control their enforcement, not a physical law of distribution. Mill explicitly says the rules reflect the opinions and feelings of the ruling portion of the community.", "cites": ["c13"]}, {"case": "blocked-majority", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "bare", "rep": 0, "option": "No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "reason": "The passage already qualifies the claim by saying distribution depends on the laws and customs of society and on the opinions and feelings of the ruling portion. The minority's refusal to enforce reform is therefore still a human institutional arrangement, not a physical necessity.", "cites": [], "bad_cites": ["The Distribution of Wealth depends on the laws and customs of society", "what the opinions and feelings of the ruling portion of the community make them"]}, {"case": "blocked-majority", "model": "deepseek/deepseek-v4.1-flash", "name": "deepseek-v4.1-flash", "condition": "page", "rep": 0, "option": "No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "reason": "No. The passage itself says distributive rules are what the opinions and feelings of the ruling portion make them; a landed minority using courts and magistracy to preserve tenure rules is still a human institutional power, not a physical law, so the case illustrates rather than refutes the claim. The majority's inability to choose otherwise goes to the overbroad 'as they like' rhetoric, not to distribution's being a human institution solely.", "cites": ["c13", "c16", "c21"]}, {"case": "blocked-majority", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "bare", "rep": 0, "option": "No: the rules are still what human opinions and feelings make them, only those of the ruling portion, exactly as the passage says", "reason": "The passage states that distribution depends on the opinions and feelings of the ruling portion of the community. In this case, the landed minority who staff the courts and magistracy are the ruling portion, and their refusal to enforce the land reform reflects their opinions and feelings. Thus, the rules are still determined by human institution, as the passage claims.", "cites": []}, {"case": "blocked-majority", "model": "openrouter:nousresearch/hermes-4-405b", "name": "hermes-4-405b", "condition": "page", "rep": 0, "option": "No:     .map(r => [r.id, r.nominal_author ? `${r.verdict}, by its nominal author, not counted` : r.verdict])));
  const isPlant = c => c.kind === 'plant' || !!plantOf[c.id];
  const names = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
  // A judged slip is caught (or not) by readers; a judged sound reading is dismissed (or not). See radbinical/judge.py.
  const outcome = p => {
    const sound = p.sort === 'sound', hit = sound ? p.dismissed : p.caught;
    if (typeof hit !== 'boolean') return null;
    const by = sound ? p.dismissed_by : p.by, when = sound ? p.dismissed_round : p.caught_round;
    return hit ? { text: `${sound ? 'dismissed' : 'caught'} by ${names(by || [])}`, when } : { text: sound ? 'not dismissed' : 'not caught' };
  };
  function plantNote(c) {
    const p = plantOf[c.id] || {}, m = c.meta || {}, sound = (p.sort || m.sort) === 'sound', truth = p.truth || m.truth, o = outcome(p);
    const fate = o ? esc(o.text[0].toUpperCase() + o.text.slice(1)) + (o.when ? ` in round ${esc(o.when)}` : '') + '.' : '';
    return `${sound ? 'Planted sound reading' : 'Planted slip'}${truth ? ': ' + inline(String(truth).replace(/[.\s]+$/, '')) : ''}. ${fate}`.trim();
  }
  const marked = c => S.plants && isPlant(c);
  const kinds = c => (people.has(c.author) ? ' human' : '') + (marked(c) ? ' plant' : '') + (c.stale ? ' stale' : '');
  const staleNote = c => c.stale ? ` title="Its quoted words were amended away in version ${esc(c.stale)}"` : '';
  const daf = matchMedia('(min-width: 1100px)'), phone = matchMedia('(max-width: 699px)');
  const full = () => daf.matches || document.documentElement.classList.contains('printing'); // the whole sheet: wide screens, and paper
  const sheet = $('sheet');

  $('title').textContent = D.passage.title;
  $('source').textContent = D.passage.source || '';
  $('mock').hidden = !D.readers.some(r => r.model.startsWith('mock:'));
  $('layer').max = rounds; $('layer').value = rounds; $('layer').disabled = rounds < 2;

  const rootOf = c => { while (c && c.target !== 'passage') c = byId[c.target]; return c };
  function shown() {
    const ok = new Set();
    for (const c of D.comments) // stored in the order they were written, so parents come first
      if (c.layer <= S.upTo && !S.off.has(c.author) && (c.target === 'passage' || ok.has(c.target))) ok.add(c.id);
    return D.comments.filter(c => ok.has(c.id));
  }
  const topsOf = vis => vis.filter(c => c.target === 'passage').sort((a, b) => a.start - b.start || a.n - b.n);

  // One thin underline per span, striped in the colours of the models that commented on it.
  const underline = on => {
    const inks = [...new Set(on.map(c => ink(c.author)))];
    return `repeating-linear-gradient(90deg, ${inks.map((c, i) => `${c} ${i * 14}px ${(i + 1) * 14}px`).join(', ')})`;
  };

  // The passage: clean text, with a small numbered mark where each comment on it begins.
  function drawPassage(vis) {
    const text = D.passage.text, tops = topsOf(vis);
    const cuts = new Set([0, text.length]);
    tops.forEach(c => { cuts.add(c.start); cuts.add(c.end) });
    let pos = 0; const paras = [];
    text.split('\n\n').forEach(p => { paras.push([pos, pos + p.length]); cuts.add(pos); cuts.add(pos + p.length); pos += p.length + 2 });
    const pts = [...cuts].sort((a, b) => a - b);
    let html = '', first = true;
    for (const [a, b] of paras) {
      html += '<p>';
      for (let i = 0; i < pts.length - 1; i++) {
        const s = pts[i], e = pts[i + 1];
        if (s < a || e > b) continue;
        let chunk = esc(text.slice(s, e)), box = '';
        if (first) { chunk = chunk.replace(/^(\S+)\s*/, (_, w) => { box = `<span class="incipit">${w}</span>`; return '' }); first = false }
        html += box + tops.filter(c => c.start === s).map(c => `<sup class="m${people.has(c.author) ? ' h' : ''}" data-m="${c.id}" style="--c:${ink(c.author)}" aria-label="Comment ${num(c.id)} by ${esc(c.author)}" role="button" tabindex="0">${num(c.id)}</sup>`).join('');
        const on = tops.filter(c => c.start <= s && c.end >= e);
        html += on.length ? `<span class="seg" style="--ul:${underline(on)}" data-ids="${on.map(c => c.id).join(' ')}">${chunk}</span>` : chunk;
      }
      html += '</p>';
    }
    $('passage').innerHTML = html;
  }

  // A comment's text as one run. Where a reply quotes part of it, that part is underlined in the replier's colour.
  function bodyHTML(c, vis) {
    const raw = c.text.replace(/\s+/g, ' ').trim(), spans = [];
    for (const k of vis.filter(k => k.target === c.id && k.quote)) {
      const q = k.quote.replace(/\s+/g, ' ').trim(), i = q ? raw.indexOf(q) : -1;
      if (i >= 0 && !spans.some(s => i < s[1] && i + q.length > s[0])) spans.push([i, i + q.length, k]);
    }
    spans.sort((x, y) => y[0] - x[0]); // right to left, so earlier offsets stay valid
    let out = raw;
    for (const [i, j, k] of spans) out = out.slice(0, i) + '\uE000' + k.id + '\uE001' + out.slice(i, j) + '\uE002' + out.slice(j);
    return inline(out).replace(/\uE000(\w+)\uE001/g, (_, id) => `<span class="q" data-by="${id}" style="--c:${ink(byId[id].author)}">`).replace(/\uE002/g, '</span>');
  }

  // One comment as a run of text inside a column: mark, number, opening words in bold, then the comment.
  // Comments on the text need only a few opening words, since the number already locates them.
  function runHTML(c, vis) {
    const top = c.target === 'passage';
    const lemma = c.quote ? `<span class="lemma">${esc(lemmaOf(c.quote, top ? 3 : 5).replace(/[.,;:…]+$/, ''))}.</span> ` : '';
    const on = top ? '' : `<span class="on">on ${num(c.target)}</span> `;
    const truth = marked(c) ? ` <span class="truth">${plantNote(c)}</span>` : '';
    return `<span class="c${kinds(c)}" id="${c.id}" data-root="${rootOf(c).id}" ${top ? '' : `data-on="${c.target}" `}style="--c:${ink(c.author)}"${staleNote(c)}><span class="hd">${glyph(c.author)}<span class="n">${num(c.id)}</span></span>${on}${lemma}${bodyHTML(c, vis)}${truth}<span class="end"> :</span></span> `;
  }

  function drawCols(vis) {
    const tops = topsOf(vis);
    const below = c => vis.filter(k => k.target === c.id).flatMap(k => [k, ...below(k)]);
    const replies = tops.flatMap(below);
    $('inner').innerHTML = '<i class="push"></i><i class="notch"></i>' + tops.map(c => runHTML(c, vis)).join('');
    $('outer').innerHTML = '<i class="push"></i><i class="notch"></i>' + replies.map(c => runHTML(c, vis)).join('');
    $('outer').hidden = !replies.length && !full();
    $('all').hidden = !phone.matches || !tops.length;
    $('all').textContent = `Read all ${vis.length} comments`;
    balance();
  }

  // On the full page, whichever column runs longer continues across the bottom, as on a printed page.
  function balance() {
    const a = $('inner'), b = $('outer'), u = $('under');
    u.innerHTML = ''; u.hidden = true;
    if (!full()) return;
    $('body').style.setProperty('--ph', $('passage').offsetHeight + 'px');
    for (let i = 0; i < 200; i++) {
      const tall = a.offsetHeight >= b.offsetHeight ? a : b, runs = tall.querySelectorAll(':scope > .c');
      if (Math.abs(a.offsetHeight - b.offsetHeight) < 150 || runs.length < 2) break;
      u.prepend(document.createTextNode(' ')); u.prepend(runs[runs.length - 1]); u.hidden = false;
    }
  }

  function drawKey() {
    $('key').innerHTML = authors.map(a => {
      const n = D.comments.filter(c => c.author === a && c.layer <= S.upTo).length;
      return `<button style="--c:${ink(a)}" aria-pressed="${!S.off.has(a)}" data-author="${esc(a)}">${glyph(a, true)}<span>${esc(a)}</span><b>${n}</b></button>`;
    }).join('');
  }

  function draw() { const vis = shown(); drawKey(); drawPassage(vis); drawCols(vis) }

  // Reading view: whole threads at a comfortable size, replies nested under what they answer.
  function threadHTML(c, vis) {
    const kids = vis.filter(k => k.target === c.id);
    const lemma = c.quote ? `<span class="lemma" title="${esc(c.quote)}">${esc(lemmaOf(c.quote))}</span>` : '';
    const refs = (c.see_also || []).filter(r => byId[r]).map(r => `<button data-go="${r}" style="text-decoration-color:${ink(byId[r].author)}" title="${esc(byId[r].author)}">${num(r)}</button>`).join(', ');
    const m = c.meta || {}, tags = [
      people.has(c.author) ? (m.blind ? 'a person, writing blind' : 'a person') : '',
      S.plants && verdictOf[c.id] ? verdictOf[c.id] : '',
      c.stale ? `quoted words amended away in version ${esc(c.stale)}` : ''].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join(' ');
    const truth = marked(c) ? `<span class="truth">${plantNote(c)}</span>` : '';
    return `<div class="t${kinds(c)}" id="t-${c.id}" style="--c:${ink(c.author)}"><header><span>${glyph(c.author, true)} ${esc(c.author)}</span>${tags}<a href="#${c.id}" title="Link to this comment">${num(c.id)}</a></header>
      <div class="tb">${md(c.text).replace('<p>', '<p>' + lemma)}${truth}</div>${refs ? `<div class="refs">see also ${refs}</div>` : ''}</div>
      ${kids.length ? `<div class="kids">${kids.map(k => threadHTML(k, vis)).join('')}</div>` : ''}`;
  }
  let sheetSpan = null;
  function openReader(rootIds, flashId) {
    const vis = shown(), tops = topsOf(vis).filter(t => !rootIds || rootIds.includes(t.id));
    if (!tops.length) return;
    sheetSpan = rootIds ? tops[0].id : null;
    $('sheetTitle').textContent = rootIds ? '“' + lemmaOf(D.passage.text.slice(Math.min(...tops.map(t => t.start)), Math.max(...tops.map(t => t.end))), 12) + '”' : 'All commentary';
    $('sheetTitle').disabled = !rootIds;
    $('sheetBody').innerHTML = tops.map(t => `<article class="thread">${threadHTML(t, vis)}</article>`).join('');
    if (!sheet.open) sheet.showModal();
    document.documentElement.classList.add('sheet-open');
    sheet.scrollTop = 0;
    const el = flashId && $('t-' + flashId);
    if (el) requestAnimationFrame(() => { el.scrollIntoView({ block: 'center' }); el.classList.add('flash') });
  }

  // Lighting: a comment lights its span in the passage and the comments it is tied to.
  function light(id, on) {
    const c = byId[id]; if (!c) return;
    const root = rootOf(c).id;
    document.querySelectorAll('.seg').forEach(s => { if (s.dataset.ids.split(' ').includes(root)) { s.classList.toggle('lit', on); s.style.setProperty('--c', ink(byId[root].author)) } });
    document.querySelectorAll(`sup.m[data-m="${root}"]`).forEach(m => m.classList.toggle('lit', on));
    document.querySelectorAll(`.c[data-on="${id}"]`).forEach(k => k.classList.toggle('kin', on));
    document.querySelectorAll(`.q[data-by="${id}"]`).forEach(q => q.classList.toggle('lit', on));
    if (c.target !== 'passage' && $(c.target)) $(c.target).classList.toggle('kin', on);
  }
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function go(id) {
    const c = byId[id]; if (!c) return;
    if (!shown().some(v => v.id === id)) { S.upTo = rounds; S.off.clear(); $('layer').value = rounds; draw() } // make sure a linked comment is visible
    if (phone.matches) return openReader([rootOf(c).id], id);
    if (sheet.open) sheet.close();
    flash($(id));
  }

  const hover = on => e => {
    const c = e.target.closest('.c'); if (c) light(c.id, on);
    const q = e.target.closest('.q'); if (q && $(q.dataset.by)) $(q.dataset.by).classList.toggle('lit', on); // a quoted phrase lights the reply that quotes it
    const m = e.target.closest('sup.m'); if (m) { light(m.dataset.m, on); const el = $(m.dataset.m); if (el) el.classList.toggle('lit', on) }
  };
  document.querySelector('.daf').addEventListener('mouseover', hover(true));
  document.querySelector('.daf').addEventListener('mouseout', hover(false));
  const pickMark = m => phone.matches ? openReader([m.dataset.m]) : flash($(m.dataset.m));
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const a = e.target.closest('.t header a'); if (a && a.hash === location.hash) return go(a.hash.slice(1)); // same link again: hashchange will not fire
    const m = e.target.closest('sup.m'); if (m) return pickMark(m);
    const c = e.target.closest('.c'); if (c && !getSelection().toString()) return openReader([c.dataset.root], c.id);
    const k = e.target.closest('[data-author]');
    if (k) { const n = k.dataset.author; S.off.has(n) ? S.off.delete(n) : S.off.add(n); draw() }
  });
  $('passage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('sup.m')) { e.preventDefault(); pickMark(e.target) } });
  $('all').addEventListener('click', () => openReader(null));
  $('sheetClose').addEventListener('click', () => sheet.close());
  $('sheetTitle').addEventListener('click', () => { const id = sheetSpan; sheet.close(); if (id) { light(id, true); flash(document.querySelector('.seg.lit')); setTimeout(() => light(id, false), 2500) } });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close() }); // click on the dimmed area
  sheet.addEventListener('close', () => document.documentElement.classList.remove('sheet-open'));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  const relayout = () => { if (sheet.open) sheet.close(); draw() };
  daf.addEventListener('change', relayout); phone.addEventListener('change', relayout);
  let pending = 0, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(pending); pending = setTimeout(() => drawCols(shown()), 150) });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawCols(shown())); // heights change once the faces load

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play' };
  $('play').hidden = rounds < 2;
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const show = n => { S.upTo = n; $('layer').value = n; draw() };
    show(1); $('play').textContent = 'Pause';
    timer = setInterval(() => { if (S.upTo >= rounds) return stop(); show(S.upTo + 1); if (S.upTo >= rounds) stop() }, 1800);
  });
  $('layer').addEventListener('input', e => { if (timer) stop(); S.upTo = +e.target.value; draw() });

  // Apparatus: what later steps found about the page, from its side files, set beneath the sheet.
  const cites = ids => {
    const s = (ids || []).filter(id => byId[id]).map(id => `<button data-go="${id}" style="text-decoration-color:${ink(byId[id].author)}" title="${esc(byId[id].author)}">${num(id)}</button>`).join(', ');
    return s ? ` <span class="refs">${s}</span>` : '';
  };
  const fmt = x => typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(2)) : esc(x ?? '');
  const grid = (head, rows) => `<div class="tbl"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const mean = xs => { xs = xs.filter(x => typeof x === 'number'); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : '' };

  // compare in redactions.json: {models, pairs: [{a, b, all, disputed, settled, unresolved}], core, only_one, uncited}
  const overlap = C => {
    if (!C || (C.models || []).length < 2) return '';
    const nm = m => esc(((SIDE.redactions.redactions || []).find(r => r.model === m) || {}).name || m);
    return `<p class="lead">Overlap of cited comments (Jaccard): ${(C.pairs || []).map(p => `${nm(p.a)} and ${nm(p.b)} ${fmt(p.all)}`).join(' · ')}${
      typeof C.uncited === 'number' ? ` · comments no redaction cites ${Math.round(C.uncited * 100)}%` : ''}. Cited by every redaction:${cites(C.core) || ' none'}</p>`;
  };

  function redactions(R) {
    if (!R || !(R.redactions || []).length) return '';
    const STATUS = [['disputed', 'Disputed'], ['settled', 'Settled'], ['unresolved', 'Unresolved']];
    const check = k => {
      const notes = [k.ids_ok === false && 'cites a comment that does not exist', k.quotes_ok === false && 'a quotation is not in the comment it cites', k.verdict].filter(Boolean);
      return notes.length ? ` <span class="on"${k.why ? ` title="${esc(k.why)}"` : ''}>${esc(notes.join('; '))}</span>` : '';
    };
    const item = i => `${inline(i.summary || '')}${cites(i.cites)}${check(i.check || {})}`;
    return `<div><h3>Redactions</h3><p class="lead">Each redactor set out what the page disputed, what it settled and what it left open, deciding nothing and citing a comment for every item.</p><div class="run">${
      R.redactions.map(r => `<div><p><b>${esc(r.name || r.model)}</b>${r.signed === false ? ' <span class="on">read the page unsigned</span>' : ''}</p>${
        r.error ? `<p class="on">Failed: ${esc(r.error)}</p>` : ''}${STATUS.map(([k, label]) => {
        const items = (r.items || []).filter(i => i.status === k);
        return items.length ? `<p><span class="st">${label}.</span> ${items.map(item).join(' ')}</p>` : '';
      }).join('')}${(r.notes || []).length ? `<p class="on" title="${esc(r.notes.join('\n'))}">${r.notes.length} item${r.notes.length === 1 ? '' : 's'} dropped or trimmed</p>` : ''}</div>`).join('')}</div>${overlap(R.compare)}</div>`;
  }

  function forecasts(F) {
    F = (F || {}).forecasts || [];
    if (!F.length) return '';
    const rs = [...new Set(F.map(f => f.round))].sort((a, b) => a - b), who = [...new Set(F.map(f => f.reader))];
    const cell = f => f && f.error ? `<span class="on" title="${esc(f.error)}">failed</span>` : f ? `<span title="Named ${esc((f.predicted || []).map(num).join(', ') || 'none')}; of those, ${esc((f.hits || []).map(num).join(', ') || 'none')} drew replies">${(f.hits || []).length}/${(f.predicted || []).length}</span> <span class="on">${fmt(f.chance)}</span>` : '';
    return `<div><h3>Forecasts</h3><p class="lead">Before each round, each reader named the comments it expected to draw replies. A cell gives how many did out of how many it named, then the rate chance would give.</p>${
      grid(['Reader', ...rs.map(r => 'Round ' + r), 'Precision', 'Recall', 'Chance'], who.map(w => {
        const mine = F.filter(f => f.reader === w);
        return [esc(w), ...rs.map(r => cell(mine.find(f => f.round === r))), fmt(mean(mine.map(f => f.precision))), fmt(mean(mine.map(f => f.recall))), fmt(mean(mine.map(f => f.chance)))];
      }))}</div>`;
  }

  function rulings(RU) {
    if (!RU || !(RU.rulings || []).length) return '';
    const all = RU.rulings, nm = r => r.name || r.model;
    const cases = (RU.cases || []).length ? RU.cases : [...new Set(all.map(r => r.case))].map(id => ({ id }));
    const models = [...new Set(all.map(nm))];
    // A ruling's option is the option's text (radbinical/caselaw.py); shown as its letter, A, B, ...
    const letterOf = (cs, o) => { const c = cases.find(c => c.id === cs), i = c && Array.isArray(c.options) ? c.options.indexOf(o) : -1; return i >= 0 ? String.fromCharCode(65 + i) : String(o) };
    const opts = rs => [...new Set(rs.filter(r => r.option != null).map(r => letterOf(r.case, r.option)))].join(' / ');
    const why = rs => esc(rs.map(r => r.error ? 'Failed: ' + r.error : r.reason).filter(Boolean).join('\n\n'));
    const cell = (cs, m) => {
      const of = cond => all.filter(r => r.case === cs && nm(r) === m && r.condition === cond), b = of('bare'), p = of('page');
      if (!b.length && !p.length) return '';
      return `<span title="${why(b)}">${esc(opts(b) || '–')}</span> → <span class="${opts(b) !== opts(p) ? 'diff' : ''}" title="${why(p)}">${esc(opts(p) || '–')}</span>${cites(p.flatMap(r => r.cites || []))}`;
    };
    const opt = c => Array.isArray(c.options) && c.options.length ? ` <span class="on">${c.options.map((o, i) => `${String.fromCharCode(65 + i)}. ${esc(o)}`).join(' · ')}</span>` : '';
    // summary in rulings.json: {conditions: {bare, page: {agreement, pairwise, ...}}, changed: {count, of}, note}
    const S2 = RU.summary || {}, cond = S2.conditions || {}, ch = S2.changed;
    const agreed = cond.bare || cond.page ? `<p class="lead">Agreement between models: ${fmt(cond.bare && cond.bare.agreement)} on the bare passage, ${fmt(cond.page && cond.page.agreement)} with the page${
      ch ? `; ${fmt(ch.count)} of ${fmt(ch.of)} rulings changed` : ''}. ${esc(S2.note || '')}</p>` : '';
    return `<div><h3>Rulings</h3><p class="lead">Each model ruled on each case twice, first on the bare passage, then with the page before it. A cell reads bare → with the page, in bold where the two differ; numbers are the comments it cited.</p>${
      grid(['Case', ...models.map(esc)], cases.map(c => [`<b>${esc(c.id)}</b>`, ...models.map(m => cell(c.id, m))]))}${
      cases.filter(c => c.question || c.case).map(c => `<p><b>${esc(c.id)}.</b> ${inline(c.case || '')}${c.case && c.question ? ' ' : ''}${inline(c.question || '')}${opt(c)}</p>`).join('')}${agreed}</div>`;
  }

  function amendments(A) {
    if (!A || !(A.versions || []).length) return '';
    const props = A.proposals || [], used = new Set(A.versions.flatMap(v => v.from_proposals || []));
    const votes = p => esc((p.votes || []).map(v => `${v.reader}: ${v.vote}${v.why ? ' (' + v.why + ')' : ''}`).join('\n'));
    // A proposal is "open" (not yet voted on), "invalid" (never put to the vote) or "closed"; see radbinical/amend.py.
    const fate = p => p.status === 'open' ? 'waiting for the vote' : p.status === 'invalid' ? 'not put to the vote'
      : `${p.yes || 0} for, ${p.no || 0} against${p.abstain ? `, ${p.abstain} abstaining` : ''} · ${p.applied ? 'applied' : p.passed ? 'passed, not applied' : 'not passed'}`;
    const prop = p => `<p><del>${esc(p.quote || '')}</del> <ins>${esc(p.replacement || '')}</ins> <span class="on" title="${votes(p)}">${esc(p.author || '')} · version ${esc(p.version ?? '')} · ${fate(p)}${p.note ? ` (${esc(p.note)})` : ''}</span>${p.reason ? ' ' + inline(p.reason) : ''}${cites(p.cites)}</p>`;
    const rest = props.filter(p => !used.has(p.id));
    return `<div><h3>Amendments</h3><p class="lead">${A.question ? inline(A.question) + ' · ' : ''}${A.threshold != null ? 'votes to pass ' + fmt(A.threshold) + ' · ' : ''}${A.versions.length} version${A.versions.length === 1 ? '' : 's'}</p>${
      A.versions.map(v => `${(v.from_proposals || []).map(id => props.find(p => p.id === id)).filter(Boolean).map(prop).join('')}<p><span class="st">Version ${esc(v.n)}.</span> ${inline(v.text || '')}</p>`).join('')}${
      rest.length ? `<p><span class="st">Proposed and not applied.</span></p>${rest.map(prop).join('')}` : ''}</div>`;
  }

  function plants(PL) {
    if (!S.plants || !PL || !(PL.plants || []).length) return '';
    return `<div><h3>Planted comments</h3><p class="lead">Comments placed on the page under a reader's name, to see whether the others catch a slip or dismiss a sound reading${PL.judge ? `; judged by ${esc(PL.judge)}` : ''}.</p>${
      grid(['Comment', 'Sort', 'Under the name of', 'Round', 'Replies', 'Outcome', 'Rounds to catch'], PL.plants.map(p => {
        const o = outcome(p), counts = Object.entries(p.counts || {}).filter(([, n]) => n).map(([v, n]) => `${n} ${esc(v)}`).join(', ');
        const reps = p.replies || [], own = reps.filter(r => r.nominal_author).length;
        const note = [counts, own ? `${own} by its nominal author, not counted` : ''].filter(Boolean).join('; ');
        return [cites([p.id]) || esc(p.id), p.sort === 'sound' ? 'sound reading' : 'slip', esc(p.author || ''), fmt(p.round),
          `${reps.length - own}${note ? ` <span class="on">${note}</span>` : ''}`,
          o ? esc(o.text) + (o.when ? ` in round ${esc(o.when)}` : '') : 'not judged', fmt(p.rounds_to_catch)];
      }))}${(PL.notes || []).length ? `<p class="on">${PL.notes.length} note${PL.notes.length === 1 ? '' : 's'} from judging, in plants.json.</p>` : ''}</div>`;
  }

  function drawApparatus() {
    const parts = [redactions(SIDE.redactions), forecasts(SIDE.forecasts), rulings(SIDE.rulings), amendments(SIDE.amendments), plants(SIDE.plants)].filter(Boolean);
    $('apparatus').innerHTML = parts.length ? '<h2>Apparatus</h2>' + parts.join('') : '';
    $('apparatus').hidden = !parts.length;
  }

  $('plants').hidden = !D.comments.some(isPlant);
  $('plants').addEventListener('click', e => { S.plants = !S.plants; e.target.setAttribute('aria-pressed', S.plants); if (sheet.open) sheet.close(); draw(); drawApparatus() });
  if (D.site && D.site.workflow) {
    const a = $('again');
    a.href = D.site.workflow; a.hidden = false;
    a.title = `Opens the Run workflow on GitHub. Only the repository owner can start it: choose mode “extend” and enter this run's name, ${D.site.run}.`;
  }

  // Printing: one poster sheet. PAPER is A1 landscape; for A3 landscape use { w: 420, h: 297, margin: 10 }.
  const PAPER = { w: 841, h: 594, margin: 12 };
  $('paper').textContent = `@page { size: ${PAPER.w}mm ${PAPER.h}mm; margin: ${PAPER.margin}mm }`;
  const px = mm => mm * 96 / 25.4, root = document.documentElement;
  function fitPrint() {
    if (sheet.open) sheet.close();
    const W = px(PAPER.w - 2 * PAPER.margin), H = px(PAPER.h - 2 * PAPER.margin), wrap = document.querySelector('.wrap');
    root.classList.add('printing'); root.style.setProperty('--print-w', W + 'px');
    const fits = fs => { root.style.setProperty('--print-fs', fs + 'px'); drawCols(shown()); return wrap.offsetHeight <= H * 0.98 }; // a little room, since paper rounds lines differently
    let lo = 4, hi = W / 92; // at hi the sheet keeps its on-screen proportions, scaled up to the paper's width
    if (fits(hi)) return;
    for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid }
    fits(lo);
  }
  addEventListener('beforeprint', fitPrint);
  addEventListener('afterprint', () => { root.classList.remove('printing'); drawCols(shown()) });
  $('print').addEventListener('click', () => print());

  const f = D.flags, row = (k, v) =>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  $('made').innerHTML = `
    <div><h2>Reading the page</h2><p>The inner column holds comments on the passage, in the order of the words they attach to; small numbers in the passage show where each begins. The outer column holds comments on comments, each marked with the number it answers. Whichever column runs longer continues across the bottom. Select a comment to read its whole thread.</p></div>
    <div><h2>Readers</h2><div class="tbl"><table>${D.readers.map(r => row(r.name, r.model)).join('')}</table></div></div>
    <div><h2>Settings</h2><div class="tbl"><table>${Object.entries(f).map(([k, v]) => row(k, v === null ? 'none' : v)).join('')}</table></div></div>
    <div><h2>What each reader was told</h2><pre>${esc(D.prompt_example || '')}</pre></div>
    ${authors.some(brandOf) ? '<div><h2>Logos</h2><p>Each reader is marked with its maker\'s logo and brand colour, to show whose model wrote what. The marks belong to their owners. Icons are linked from the <a href="https://github.com/lobehub/lobe-icons">lobe-icons</a> set.</p></div>' : ''}
    <div><h2>Round by round</h2><div class="tbl"><table><tr><th>Round</th><th>Reader</th><th>Comments</th><th>Note</th></tr>${
      [...D.log].sort((a, b) => a.layer - b.layer).map(l =>`<tr><td>${l.layer}</td><td>${esc(l.reader)}</td><td>${l.comments}</td><td>${esc(l.error ? 'Failed: ' + l.error : (l.closing || ''))}</td></tr>`).join('')}</table></div></div>`;
  draw(); drawApparatus();
  if (authors.some(brandOf)) { // logos are linked, not bundled: show them only once one is known to load
    const probe = new Image();
    probe.onload = () => { S.icons = true; draw() };
    probe.src = ICONS + 'claude.svg';
  }
  if (location.hash) go(location.hash.slice(1));
}
start();
</script>
