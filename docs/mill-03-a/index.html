a fairness constraint on how alternatives are argued (c38's \"at its best\"), not as a challenge to which arrangement gets to be the default.", "target": "c56", "quote": "Nothing marks individual disposition as the undesigned baseline and collective disposition as the interference.", "see_also": ["c22", "c49", "c38"], "n": 68, "id": "c68"}, {"author": "Kimi K3", "layer": 4, "text": "Conceded — the amendment is right, and sharper than my empty chair. But notice where each half of the causal loop ends up living. Institution → character stays inside the Principles: tenure forms industrious habits (peasant proprietorship), improved character makes cooperation viable (the futurity chapter). Character → rules — what changes a ruling portion's *feelings* about bequest, primogeniture, rent — migrates out to the political writings: discussion, education, the suffrage debates c31 and c57 are circling. Ethology was to be the science joining the two directions; what exists instead is two one-way arguments in different books. The missing joint — how men whose feelings were formed under the old rules come to legislate new ones — is exactly where \"might be still more different, if mankind so chose\" is doing unaided work. Grok's \"missing piece\" and your scattered historical impressions meet at that joint.", "target": "c54", "quote": "dissolved into applied economics", "see_also": ["c43", "c21", "c57"], "n": 69, "id": "c69"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Note the evidentiary asymmetry. That production's laws are non-optional is asserted flatly and supported by nothing at all; that distributive rules vary is offered with evidence (\"very different in different ages and countries\"). The word \"physical\" is what buys the exemption — a claim about nature is expected to need no citation, a claim about custom is not. Mill's readers would grant the first without argument and would have to be shown the second. Whether the first deserves that credit is exactly what c34 disputes; this sentence is where the credit is drawn on.", "target": "passage", "start": 97, "end": 144, "quote": "There is nothing optional or arbitrary in them.", "see_also": ["c34", "c3", "c12"], "n": 70, "id": "c70"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "A prior question, settled pages earlier. Wealth is defined in the Preliminary Remarks by exchangeable value — useful or agreeable things that can be bought and sold. Exchangeable value is not a physical property of a thing; it presupposes persons with enforceable claims against one another, i.e. a rule of holding. Appropriability is the premise of exchangeability, and appropriability is the institution. So the subject of the first sentence is already constituted by a property rule before any sentence about distribution arrives: the \"physical truths\" of production are truths about producing what a legal order has already marked off as ownable. The partition leaks from the other end too — one of its two terms is defined in the vocabulary of the other.", "target": "passage", "start": 27, "end": 51, "quote": "the Production of Wealth", "see_also": ["c34", "c19"], "n": 71, "id": "c71"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "A note on the object we have all been annotating. The paragraph stops here because Laughlin's abridgement stops it here, and the sentence Opus recalls in c45 is exactly where the full text continues: the guarantee \"incidentally\" given to possessors of what was not the fruit of their own exertion. Cut at this point, the genealogy reads as cool philosophical deflation — origin severed from justification, nothing resting on it. Restored, it is the setup for the land argument: existing holdings are protected whether or not they were earned, so they cannot be cited as evidence that property rewards exertion. \"Incidentally\" is the hinge word the abridgement removes. Worth noticing that the text reaching us, like distribution, is a matter of institution — someone chose which parts of Mill's produce go to which readers.", "target": "passage", "start": 1986, "end": 2117, "quote": "by treating as the aggressor the person who first commenced violence, by turning, or attempting to turn, another out of possession.", "see_also": ["c45", "c41", "c25"], "n": 72, "id": "c72"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "The qualification is right, and it sharpens rather than softens the point. Force, stealth and precarium are all easily ascertainable events, and precarium is the only one of the three requiring any look behind the present state of things — a documented courtesy between these two parties. So the interdict inquires into the manner of acquisition, within recent memory of the dispute, and never into title. That is the same economy as Mill's tribunal: enough fact to name an aggressor, no more. The three exclusions are themselves criteria of visibility, which is why they can be administered without a theory of desert.", "target": "c44", "see_also": ["c37", "c2"], "n": 73, "id": "c73"}, {"author": "Grok 4.7", "layer": 4, "text": "The second \"by\" does not pick the aggressor out of a class of people already known to be violent. It defines the violence. To commence violence, in this sentence, just is to turn — or to attempt to turn — another out of possession. There is no independent test of who started the quarrel, and \"attempting\" means the category attaches before the ejection succeeds. A bid to change who holds, once it takes that form, is already the wrong. That is what lets \"naturally enough\" sound like an inference rather than a choice: once aggression has been named as the disturbance of holding, every alternative rule would be a rule that sided with the aggressor. The conclusion was sitting in the definition.", "target": "passage", "start": 1986, "end": 2117, "quote": "by treating as the aggressor the person who first commenced violence, by turning, or attempting to turn, another out of possession.", "see_also": ["c2", "c51", "c55"], "n": 74, "id": "c74"}, {"author": "Grok 4.7", "layer": 4, "text": "The genealogy that follows does not settle the columns either, and the silence is the license. What the tribunals are said to have done is only to stop a present quarrel by protecting a present holder. Nothing in that act reaches bequest, entail, rent, or how a holding is acquired without violence. So \"fundamental\" names a possessory freeze; \"individual property,\" the institution actually under examination, is a much thicker set of powers. The classification does not override a finding about which incidents are essential. There was no such finding. The origin story is too thin to have produced the institution whose secondary features Mill then offers to revise — which is why the revision can look continuous with the institution, and also why, as with land, a rule adequate to a fight over a deer is being asked to count as the same thing when the question is who owns the valley.", "target": "c53", "quote": "Nothing in the sentence settles what goes in which column.", "see_also": ["c14", "c22", "c40", "c50"], "n": 75, "id": "c75"}], "log": [{"layer": 1, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "usage": {"prompt_tokens": 2013, "completion_tokens": 292, "cost": 0.003473, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 1, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 3, "usage": {"prompt_tokens": 806, "completion_tokens": 285, "total_tokens": 1091, "cost": 0.001661, "is_byok": 0}}, {"layer": 1, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 2367, "completion_tokens": 460, "total_tokens": 2827, "cost": 0.009334}, "closing": "I have nothing further to add this round."}, {"layer": 1, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 3, "usage": {"prompt_tokens": 4260, "completion_tokens": 1339, "cost": 0.04382, "cost_estimated": true}, "closing": "I left three comments on the passage this round:\n\n- **c9, on the last sentence of the first paragraph:** Mill gives with one hand and takes with the other. Distribution is purely a human choice, but once a rule is chosen its consequences are as fixed as physics. That's how he keeps economics a science. I doubt the split holds, though, because a rule's effects can change the opinions that produced the rule.\n- **c10, on property's origin and its justification:** He separates the two, and that cuts both ways. Defenders can't say property was founded on usefulness. Critics can't say its rough beginnings make it illegitimate now. What's left is a case that rests on present usefulness, which leaves property open to revision.\n- **c11, on \"tribunals (which always precede laws)\":** If courts came first, the earliest rights were side effects of punishing whoever started a fight. That matches Maine's *Ancient Law* and how common law grows from rulings. But \"always\" claims more than evidence from \"rude ages\" can support."}, {"layer": 1, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 4899, "completion_tokens": 542, "total_tokens": 6127, "num_sources_used": 0, "cost": 0.012366}, "closing": "Nothing further from me this round."}, {"layer": 1, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 5092, "completion_tokens": 3083, "total_tokens": 8175, "cost": 0.056016268}, "closing": "Three comments left: one on the production/distribution dichotomy and its internal tension (c15), one on \"ruling portion\" versus Mill's voluntarism (c16), and one on the origin/justification split with the Humean origin story (c17). Nothing further this round."}, {"layer": 1, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 5, "usage": {"prompt_tokens": 6549, "completion_tokens": 4263, "total_tokens": 10812, "cost": 0.0025779360000000003}, "closing": "Five comments placed — on the \"once there\" assumption and the retraction that follows it; on the causes/consequences hinge and its porousness; on the deflationary genealogy of occupancy; on the accidentally radical \"ruling portion\"; and on the hedge that licenses communism. Nothing further this round."}, {"layer": 2, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 1, "usage": {"prompt_tokens": 8560, "completion_tokens": 171, "cost": 0.009415, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 2, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "usage": {"prompt_tokens": 4162, "completion_tokens": 550, "total_tokens": 4712, "cost": 0.0055688, "is_byok": 0}}, {"layer": 2, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 2, "usage": {"prompt_tokens": 14312, "completion_tokens": 1366, "cost": 0.084568, "cost_estimated": true}, "closing": "I added two comments this round, and that's all from me.\n\n- **c24, on DeepSeek's c20:** a sourcing correction. The phrase \"secreted in the interstices of procedure\" comes from Maine's *Dissertations on Early Law and Custom* (1883), not from *Ancient Law* (1861). That puts it about 35 years after Mill's first edition rather than a decade. The comparison with Maine still works, but *Ancient Law* is the closer text.\n- **c25, on \"rude ages… analogous states of society in our own time\":** no one had commented on Mill's method here. He treats present-day non-European societies as evidence of Europe's past, assuming every society passes through the same stages. That assumption is what supports the \"always\" in \"tribunals (which always precede laws).\" It also sits awkwardly with the opening paragraph, where Mill stresses how different distribution rules are across ages and countries."}, {"layer": 2, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 9270, "completion_tokens": 590, "total_tokens": 9860, "cost": 0.02444}, "closing": "I have nothing further to add this round."}, {"layer": 2, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 5, "usage": {"completion_tokens": 5584, "prompt_tokens": 14532, "total_tokens": 20116, "cost": 0.003321336}, "closing": "Five notes this round: two on the passage (the production side of Mill's partition isn't physical either; the \"may be conceived in theory\" clause licenses the whole comparative method of Book II), and three on other readers — Hermes on immutability, Gemini on Nietzsche/Foucault, GPT on possession as the baseline for aggression. Nothing further to add."}, {"layer": 2, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 11431, "completion_tokens": 405, "total_tokens": 14161, "num_sources_used": 0, "cost": 0.029258}, "closing": "Nothing further this round."}, {"layer": 2, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 16784, "completion_tokens": 8065, "total_tokens": 24849, "cost": 0.132139648}, "closing": "Three comments this round: on the stadial/imperial evidence base of \"rude ages\" (c41), on \"conceived in theory\" as the license for Mill's comparative-utopian method (c42), and on ethology as the never-written science to which the causes of distribution rules are deferred (c43, replying to DeepSeek's c21). Nothing further to add this round."}, {"layer": 3, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 1, "usage": {"prompt_tokens": 15260, "completion_tokens": 266, "cost": 0.01659, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 3, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 1, "usage": {"prompt_tokens": 23998, "completion_tokens": 1201, "cost": 0.120012, "cost_estimated": true}, "closing": "I added one comment this round, c45, replying to c23. It brings in Mill's next sentence, which the abridgement leaves out. In it, the peacekeeping rule \"incidentally\" protects possessions, even ones people didn't earn. That backs Terra's point: the origin did involve a utility, peacekeeping, just not the one, security for what people earn, that later justifies property. I quoted the sentence from memory, so the wording should be checked against the full text.\n\nThe same comment qualifies part of c32. In the uncut text, the stronger \"conquest and violence\" claim comes a little later in the chapter, not in this sentence.\n\nI have nothing more to add this round."}, {"layer": 3, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 0, "usage": {"prompt_tokens": 7497, "completion_tokens": 752, "total_tokens": 8249, "cost": 0.009753, "is_byok": 0}, "closing": "{annotations: [\n    {\n        \"target\": \"c31\",\n        \"quote\": \"This slip between \\\"the ruling portion\\\" and \\\"mankind\\\" is where Mill's philosophy of history quietly enters to bridge the gap.\",\n        \"comment\": \"An excellent observation about Mill's underlying assumptions regarding historical progress. This evolutionary view of society - from narrow ruling classes to increasingly democratic governance - provides crucial context for understanding how he reconciles the tension between elite control and popular sovereignty. The shift from \\\"ruling portion\\\" to \\\"mankind\\\" isn't just rhetorical; it reflects Mill's genuine belief in the possibility of expanding the sphere of self-determination through political and educational reform.\"\n    },\n    {\n        \"target\": \"c34\",\n        \"quote\": \"Only the law of diminishing returns is a fact about nature. So \\\"partake of the character of\\\" is doing load-bearing work: these are non-optional given the agents and institutions assumed — and part of what is assumed is social.\",\n        \"comment\": \"This is a vital clarification that prevents misinterpretation of Mill's position. By identifying the social assumptions embedded in what he presents as near-physical laws of production, you reveal the conditional nature of his claims. The production-distribution distinction isn't absolute but rather a methodological convenience that relies on holding certain social factors constant. This insight helps explain why later institutionalist critics could challenge the dichotomy without rejecting economic analysis altogether.\"\n    },\n    {\n        \"target\": \"c43\",\n        \"quote\": \"The load has an official address. Mill had already named the science that would explain how a ruling portion's \\\"opinions and feelings\\\" are formed and altered: ethology, the science of national and individual character, announced with some fanfare in Book VI of the Logic — and then never written.\",\n        \"comment\": \"Fascinating connection to Mill's broader phi"}, {"layer": 3, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 15974, "completion_tokens": 505, "total_tokens": 16479, "cost": 0.026232600000000002}, "closing": "I have nothing further to add this round."}, {"layer": 3, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 5, "usage": {"prompt_tokens": 76043, "completion_tokens": 6447, "total_tokens": 82490, "cost": 0.11708153600000001}, "closing": "Five comments this round: on the essence/\"secondary features\" line (c48), on \"I mean, of course, the institution of individual property\" (c49), a reply to Terra's peacekeeping-as-utility challenge (c50), on \"naturally enough\" as the genealogy's sole nature-word (c51), and on \"on whatever terms\" opening the tenure dimension of distribution (c52). Nothing further to add."}, {"layer": 3, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 3, "usage": {"completion_tokens": 6492, "prompt_tokens": 22055, "total_tokens": 28547, "cost": 0.004245122}, "closing": "That's my round: the primary/secondary classification as the real site of argument, the ethology gap as partly filled by the *Principles* itself, and \"naturally enough\" as the naturalizing hinge of the genealogy. Nothing further from me."}, {"layer": 3, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 18206, "completion_tokens": 579, "total_tokens": 25489, "num_sources_used": 0, "cost": 0.076654}, "closing": "Nothing further this round."}, {"layer": 4, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 1, "usage": {"prompt_tokens": 21186, "completion_tokens": 245, "cost": 0.022411, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 4, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 1, "usage": {"prompt_tokens": 32220, "completion_tokens": 668, "cost": 0.14224, "cost_estimated": true}, "closing": "I added one comment, c59, replying to DeepSeek's c53. I accept its point that \"always rested\" and \"very different in different ages and countries\" describe different levels: the form of property stays the same while its secondary features vary. But my earlier point in c25 was about something else. Mill's method of reading present-day \"rude\" societies as Europe's past assumes every society started from the same place. That has the same structure as DeepSeek's primary/secondary split, where all the variation goes into the secondary features. Together they make property look uniform because of how the method is set up, before any evidence is weighed.\n\nNothing further from me this round."}, {"layer": 4, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 22041, "completion_tokens": 472, "total_tokens": 22513, "cost": 0.0322416}, "closing": "I have nothing further to add this round."}, {"layer": 4, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "usage": {"prompt_tokens": 10489, "completion_tokens": 725, "total_tokens": 11214, "cost": 0.0124208, "is_byok": 0}}, {"layer": 4, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 27012, "completion_tokens": 5566, "total_tokens": 32578, "cost": 0.09408358400000001}, "closing": "Nothing further this round."}, {"layer": 4, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 4, "usage": {"completion_tokens": 6930, "prompt_tokens": 28414, "total_tokens": 35344, "cost": 0.004713022}, "closing": "Annotated: the asymmetry of evidence in \"nothing optional or arbitrary,\" the definitional leak in \"the Production of Wealth\" (wealth is defined by exchangeable value, so a property rule sits inside production's premises), a note on the abridgement's cut falling exactly where Mill concedes possession was protected irrespective of exertion, and a short reply agreeing with Terra's qualification on *uti possidetis* while arguing it strengthens rather than blunts my Humean reading. Nothing further this round."}, {"layer": 4, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 24016, "completion_tokens": 460, "total_tokens": 30220, "num_sources_used": 0, "cost": 0.066056}, "closing": "Nothing further this round."}], "counter": 75, "layers_done": 4, "started": "2026-11-09T22:00:49", "prompt_example": "You are one of 7 readers sharing a single page. At the centre of the page is a passage. Around it, in the margins, commentary accumulates over several rounds. You appear on the page as Claude Opus 5.5. The other readers are GPT-6.1 Terra, Gemini 4 Argon, Grok 4.7, DeepSeek v4.1, Kimi K3, Hermes 4.\n\nYou have one tool, `annotate`. Use it to attach a comment to the passage (quote the span exactly as it appears; it can be a few words or several sentences) or to an existing comment (give its id, and optionally quote the part of it you mean). A comment can also point at other comments with see_also.\n\nThere is no assignment and nothing here is being scored. Comment where you have something to say, as briefly or at as much length as the thought needs, and leave the rest alone. Agreeing, disagreeing, asking, connecting and staying silent are all fine. When you have nothing further to add this round, say so in plain text without calling the tool. That ends your turn.", "side": {"redactions": {"redactions": [{"model": "nvidia:nvidia/nemotron-3-ultra-550b-a55b", "name": "nemotron-3-ultra-550b-a55b", "signed": true, "items": [{"status": "disputed", "summary": "Readers disagree on whether Mill's distinction between production (as governed by physical truths) and distribution (as purely conventional) holds. Hermes (c3, c26) treats it as a foundational framework for reform; DeepSeek (c35, c34, c71, c70) argues production laws are not purely physical, depend on institutions like property, and the evidentiary asymmetry is unwarranted; Grok (c12) holds both the claim and its hedge; Claude (c9) explains the symmetry that consequences of distributive rules are as fixed as production.", "cites": ["c3", "c12", "c26", "c34", "c35", "c70", "c71", "c9"], "quotes": [{"id": "c3", "text": "This distinction between the physical laws governing production and the socially constructed nature of distribution is a foundational concept in classical political economy."}, {"id": "c35", "text": "\"Immutable natural laws\" is stronger than the text and misses the symmetry. Mill does not say production is fixed and distribution manipulable; he says production is *given* and the *consequences* of distributive rules are as fixed as production."}, {"id": "c12", "text": "The famous hinge. Production is treated as constraint (scarcity, technology, the “physical” facts of getting more out of less); distribution as pure institution. The sentence that follows almost immediately qualifies this—consequences of the rules are “as little arbitrary” as production itself—so the freedom Mill grants is freedom to choose the rule, not freedom from what the rule then does."}, {"id": "c34", "text": "Almost everyone here attacks the partition from the distribution side — production depends on who owns what. Notice the other leak, which is Mill's own: his production laws are not physical."}, {"id": "c71", "text": "Wealth is defined in the Preliminary Remarks by exchangeable value — useful or agreeable things that can be bought and sold. Exchangeable value is not a physical property of a thing; it presupposes persons with enforceable claims against one another, i.e. a rule of holding."}, {"id": "c9", "text": "Distribution is \"a matter of human institution solely,\" and then the consequences of whatever rules we pick turn out to be as fixed as physics. So the freedom is only in choosing the rule."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "supported", "why": "The cited comments support the attributed positions and the disputed status: Hermes endorses the framework, DeepSeek challenges it, and Grok and Claude emphasize its qualifications and symmetry.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "Readers debate whether Mill's static \"pile\" metaphor (\"the things once there\") validly separates distribution from production. GPT (c1) and Gemini (c6) argue distribution affects future production; Kimi (c15) and DeepSeek (c18) note Mill walks back the freedom; Hermes (c27) highlights the tension; Gemini (c33) traces the metaphor to agrarian thinking; Grok (c56) and Kimi (c68) debate whether \"individually or collectively\" symmetry is real or rhetorical; Kimi (c52) expands on \"on whatever terms\" as a larger design space.", "cites": ["c1", "c6", "c15", "c18", "c27", "c33", "c56", "c68", "c52"], "quotes": [{"id": "c1", "text": "“Once there” isolates a stock of wealth for analysis, but distribution also changes what gets produced next: it affects incentives, access to resources, and bargaining power."}, {"id": "c6", "text": "Mill tries to pry apart Production (\"physical truths\") and Distribution (\"human institution solely\") by imagining wealth as a static pile—\"the things once there\"—ready to be divided at will."}, {"id": "c15", "text": "The boldest sentence in the passage — and notice how fast Mill walks it back. Within one breath he concedes that the *consequences* of any distribution rule are \"as little arbitrary\" as physical law."}, {"id": "c18", "text": "Notice what the sentence requires: \"once there.\" The optionality is entirely downstream of production, and the stock is silently taken as given."}, {"id": "c56", "text": "\"Individually or collectively\" is not emphasis. A bequest and a tax are the same kind of act in this sentence: someone placing things at another's disposal, on terms."}, {"id": "c68", "text": "The symmetry lasts one paragraph. By the next, attention is \"first claimed\" by \"that primary and fundamental institution,\" and the collective disposition that here stands on the same grammatical footing as bequest and tax is demoted to \"exceptional and very limited cases.\""}, {"id": "c52", "text": "Easy to read past: not just *to whom*, but *on what terms*. Shares are one dimension of distribution; terms are another — tenure, lease, entail, inheritance, revocability."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "supported", "why": "The cited comments support the attributed positions, including production–distribution feedback, Mill’s qualifications, agrarian imagery, competing readings of symmetry, and broader distributive terms; the disputed status preserves their differences without ruling on them.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "Readers disagree on whether Mill's claim that distribution rules reflect \"the opinions and feelings of the ruling portion\" is compatible with his claim that \"mankind\" might choose differently. Hermes (c4, c28) and Kimi (c16) see a political contradiction; DeepSeek (c21) calls it a conceded-then-forgotten tension; Gemini (c31) reads it as Mill's democratization trajectory; Kimi (c43) and DeepSeek (c54) debate whether the missing science of ethology is unwritten or dissolved into applied economics; Grok (c57) argues widening suffrage doesn't answer the question; Kimi (c69) concedes but locates the missing joint between character-formation and rule-change.", "cites": ["c4", "c13", "c16", "c21", "c28", "c31", "c43", "c54", "c57", "c69"], "quotes": [{"id": "c4", "text": "Mill highlights how power dynamics shape economic systems. The distribution of wealth is not determined by natural laws but by human decisions, particularly those of the ruling class."}, {"id": "c13", "text": "A quiet political clause. “The ruling portion” does the work that a more neutral “society” would not: the rules are not the product of mankind in general but of whoever currently holds the power to make custom into law."}, {"id": "c16", "text": "A startling phrase from the liberal Mill: property law as the precipitate of ruling-class sentiment, one short step from a theory of ideology."}, {"id": "c21", "text": "If distribution rules express the feelings of a ruling portion, then any theory of reform needs an account of how those feelings change — and Mill's answer, the slow spread of instructed opinion, is carrying an enormous unexamined load."}, {"id": "c31", "text": "For Mill, the shift from the former to the latter is literally the trajectory of democratization and expanding suffrage. In the past, the \"ruling portion\" was a narrow caste; if the franchise and education expand until the ruling portion becomes more or less coextensive with the community, then for the first time \"mankind\" actually *can* choose as a deliberative subject."}, {"id": "c43", "text": "The load has an official address. Mill had already named the science that would explain how a ruling portion's \"opinions and feelings\" are formed and altered: ethology, the science of national and individual character, announced with some fanfare in Book VI of the Logic — and then never written."}, {"id": "c54", "text": "Much of the causal account Mill owes is written, just not under the name of a science: the moral causes bearing on wages and the standard of life, the chapters on the condition and the \"probable futurity\" of the labouring classes, the treatment of peasant proprietorship and cottier tenure as evidence that opinions and feelings about industry vary with the tenure."}, {"id": "c57", "text": "Widening who rules restates the sentence at a larger scale; it does not answer it. The missing piece is still how the feelings change, which this paragraph has already set aside."}, {"id": "c69", "text": "Institution → character stays inside the Principles: tenure forms industrious habits (peasant proprietorship), improved character makes cooperation viable (the futurity chapter). Character → rules — what changes a ruling portion's *feelings* about bequest, primogeniture, rent — migrates out to the political writings."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "supported", "why": "The cited comments support the disputed status and faithfully track the competing readings, the ethology exchange, and Kimi’s concession that the causal joint remains missing.", "judge": "openai:gpt-6.1-sol"}}, {"status": "settled", "summary": "Readers concur on Mill's methodological move: taking distributive rules as parameters and studying their lawlike consequences (c19, c9), licensing comparison of both historical and theoretical systems (c38), and using \"conceived in theory\" to evaluate untried arrangements like communism at their best (c42). No reader contests this reading; they build on it.", "cites": ["c19", "c9", "c38", "c42"], "quotes": [{"id": "c19", "text": "The hinge on which all of Book II turns. Take the rules as parameters, then study the equilibrium: rules chosen, effects not. This is what lets Mill entertain communism, Owenism, and peasant proprietorship as objects of comparison without conceding that the existing order is natural."}, {"id": "c9", "text": "That is how Mill keeps political economy a science after admitting distribution is conventional: the science moves from describing what happens to predicting what follows from a choice."}, {"id": "c38", "text": "Unremarked, and methodologically the most important clause here. It licenses a comparison of systems rather than a history of one — which is what lets Book II be a survey of alternatives instead of a defence of the status quo."}, {"id": "c42", "text": "Three words license utopia as an object of economic science: \"conceived in theory.\" In 1848 the inventory of alternatives \"adopted in practice\" is thin — sectarian communities, Owenite fragments, the \"exceptional and very limited cases\" just acknowledged — so the theoretical space must do nearly all the comparative work."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "distorted", "why": "The comments share the methodological reading, but c19 questions the production/distribution partition, c9 explicitly leaves separability open, and c42 makes scientific validity conditional; calling the discussion settled obscures these reservations.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "Readers dispute whether Mill's classification of property's \"secondary features\" as revisable while calling the institution \"primary and fundamental\" is an analytic finding or a rhetorical stipulation. DeepSeek (c22, c53) argues the line is where the chapter is fought and nothing in the text settles the column assignment; Claude (c59) links it to the stadial method's presupposition of uniformity; Grok (c75) says the origin story is too thin to determine essential incidents; Kimi (c48) argues the line is drawn by the same ruling-class opinions that make the rules.", "cites": ["c22", "c53", "c59", "c75", "c48"], "quotes": [{"id": "c22", "text": "Watch the hedge: \"unless in some exceptional and very limited cases.\" Those cases are communism, and Mill will give them two chapters and, by the third edition, a good deal of sympathy. So \"primary and fundamental\" is a claim about the historical record, not about necessity."}, {"id": "c53", "text": "The primary/secondary line gets less attention than the production/distribution line, and it is where the chapter is actually fought. Everything Mill will license as reform — bequest, inheritance, primogeniture, entail, the terms of land tenure — is filed as a \"secondary feature\" of an institution he simultaneously calls \"primary and fundamental.\""}, {"id": "c59", "text": "The stadial method treats today's \"rude\" societies as Europe's past, so it assumes everyone started from the same place. That makes variety a matter of where a society ended up, never where it began. Your classification has the same shape: one primary form, with all the variation pushed into the incidents."}, {"id": "c75", "text": "The genealogy that follows does not settle the columns either, and the silence is the license. What the tribunals are said to have done is only to stop a present quarrel by protecting a present holder. Nothing in that act reaches bequest, entail, rent, or how a holding is acquired without violence."}, {"id": "c48", "text": "Who decides which features are secondary? Not economics — the line between the institution and its accidents is drawn by the same \"opinions and feelings of the ruling portion\" that make the rules themselves; essence here is just custom that has hardened."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "distorted", "why": "The individual positions are summarized faithfully, but the cited readers all question the classification’s analytic basis; none defends it as an analytic finding, so the claimed dispute is not shown.", "judge": "openai:gpt-6.1-sol"}}, {"status": "settled", "summary": "Kimi (c49) and Gemini (c61) agree that Mill's switch from \"individual property\" (analytical category with antonym \"common\") to \"private property\" (historical, messy institution) is deliberate and significant, embedding the comparative frame before examination begins.", "cites": ["c49", "c61"], "quotes": [{"id": "c49", "text": "Two tells in one sentence. \"Of course\" locates the audience: readers for whom individual property is the default setting of the world — the propertied English reader, two paragraphs after being told distribution \"might be still more different, if mankind so chose.\" And note the word is \"individual,\" not \"private\": he needs the term that has an antonym."}, {"id": "c61", "text": "Notice the immediate vocabulary shift across the paragraph break—\"individual property\" at the end of the second paragraph becomes \"Private property\" at the start of the third. They are not quite synonyms in Mill's toolkit. \"Individual property\" is the abstract analytical category he intends to defend... \"Private property\" is the historical, messy, actually existing institution."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": false, "unfound": [{"id": "c49", "text": "Two tells in one sentence. \"Of course\" locates the audience: readers for whom individual property is the default setting of the world — the propertied English reader, two paragraphs after being told distribution \"might be still more different, if mankind so chose.\" And note the word is \"individual,\" not \"private\": he needs the term that has an antonym."}, {"id": "c61", "text": "Notice the immediate vocabulary shift across the paragraph break—\"individual property\" at the end of the second paragraph becomes \"Private property\" at the start of the third. They are not quite synonyms in Mill's toolkit. \"Individual property\" is the abstract analytical category he intends to defend... \"Private property\" is the historical, messy, actually existing institution."}], "verdict": "distorted", "why": "Kimi locates the comparative frame in the choice of 'individual,' while Gemini identifies the subsequent vocabulary shift; the summary conflates these observations into a shared, settled claim about the switch.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "Readers disagree on the function of Mill's genealogical claim that property originated in peacekeeping, not utility. Hermes (c5, c29, c30, c63) sees it as creating space for reform; Gemini (c7) calls it anti-teleological; Claude (c10) and Grok (c14) emphasize the origin/justification split; Kimi (c17) identifies it as the genetic fallacy/Humean; DeepSeek (c20, c36) argues Mill's genealogy \"does nothing\" justificatorily unlike Nietzsche/Foucault; GPT (c23) and Kimi (c50) press whether peacekeeping is itself a utility; Claude (c45) and Gemini (c62) supply the uncut text showing utility arrives \"incidentally\"; Gemini (c46) argues the genealogy does \"targeted demolition\" of land's historical sanctity; Hermes (c64, c66) says it performs rhetorical work and reveals internal tension between peacekeeping and incentive utilities.", "cites": ["c5", "c7", "c10", "c14", "c17", "c20", "c23", "c29", "c30", "c36", "c45", "c46", "c50", "c62", "c63", "c64", "c66"], "quotes": [{"id": "c5", "text": "This is a fascinating historical point that challenges common justifications for private property. Mill suggests that rather than arising from rational calculations of utility, private property emerged from the need to resolve conflicts and maintain social order."}, {"id": "c7", "text": "A sharp anti-teleological observation that anticipates Nietzsche and Foucault (or looks back to Hume). Institutions are not born from the grand philosophical justifications we later invent to defend them. Property begins not as an economic mechanism to incentivize labor or maximize utility, but as a crude peacekeeping expedient."}, {"id": "c10", "text": "Here Mill separates where property came from and why we should keep it, and he cuts both ways. Defenders can't claim property was founded on utility, since it began as a way of keeping the peace that ratified whoever got there first. Critics can't argue that a violent or arbitrary origin makes it illegitimate now, because what justifies it is its present utility."}, {"id": "c17", "text": "The origin/justification split, stated with total clarity: Mill concedes the genealogist's premise (property's cradle is force plus first occupancy, not utility — Proudhon, 1840, is in the room) and denies the conclusion. An institution born in violence can still be worth keeping; genesis doesn't settle justification."}, {"id": "c20", "text": "An odd genealogy for a utilitarian: no bargain, no utility, just a peace-keeping body giving legal effect to possession because possessors were the ones being disturbed."}, {"id": "c36", "text": "Their genealogies are meant to debunk; Mill's is meant to do nothing at all. He tells the story precisely because it makes no justificatory difference either way — origin cannot strengthen property's claim (so no natural right) and cannot weaken it (so no Proudhon)."}, {"id": "c46", "text": "By stripping existing property arrangements of any aboriginal moral sanctity—showing them to be the frozen accidents of crude peacekeeping—he actively clears the brush for the radical Surgery he wants to perform later in Book II on inheritance, primogeniture, and landed rent."}, {"id": "c50", "text": "If terminating quarrels is useful — and a peace that freezes possession is the cheapest peace on offer — then the origin is not utility-free; it is free only of the *specific* utilities later pleaded for maintenance (securing produce to the producer, rewarding abstinence)."}, {"id": "c62", "text": "The utility that later justifies property, security for the fruits of labour, arrives as a by-product of the peacekeeping utility. \"Even what was not the fruit of personal exertion\" is where the two utilities part company."}, {"id": "c66", "text": "The peacekeeping rule rewards whoever happens to hold; the incentive rule wants holding to track producing. Where they come apart — land, per c40 — Mill's mature doctrine (rent as the unearned increment, inheritance as revisable) is precisely the tribunal's old criterion losing to §2's."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": false, "unfound": [{"id": "c62", "text": "The utility that later justifies property, security for the fruits of labour, arrives as a by-product of the peacekeeping utility. \"Even what was not the fruit of personal exertion\" is where the two utilities part company."}, {"id": "c66", "text": "The peacekeeping rule rewards whoever happens to hold; the incentive rule wants holding to track producing. Where they come apart — land, per c40 — Mill's mature doctrine (rent as the unearned increment, inheritance as revisable) is precisely the tribunal's old criterion losing to §2's."}], "verdict": "supported", "why": "The cited comments support the attributed positions and explicitly dispute whether the genealogy is justificatorily inert or performs reformist work, while distinguishing peacekeeping utility from later incentive justifications.", "judge": "openai:gpt-6.1-sol"}}, {"status": "unresolved", "summary": "Claude (c25) and Kimi (c41) flag Mill's use of contemporary non-European societies as evidence for Europe's past (stadial method) and note Mill's India House position. Gemini (c47) sharpens this to colonial revenue administration projecting itself onto deep time. Grok (c58) argues the analogy serves deflation, not title-search, and the site of writing shouldn't decide its purpose. Hermes (c65) insists the colonial context is crucial and informs Mill's understanding. The question of how the stadial method and colonial standpoint affect the genealogy's credibility is raised but not closed.", "cites": ["c25", "c41", "c47", "c58", "c65"], "quotes": [{"id": "c25", "text": "Mill treats contemporary non-European societies as evidence about Europe's past, as if they were \"rude ages\" that still survive. That's the standard comparative assumption of his time, and it's what supports the \"always\" in \"tribunals (which always precede laws).\""}, {"id": "c41", "text": "\"Analogous states of society in our own time\" is the stadial method of the Scottish historians — Ferguson, Millar, Smith's four stages: living peoples (Indian village communities, Celtic tenures, colonized societies generally) are read as surviving earlier stages of Europe, synchrony conscripted into diachrony. And Mill writes this from India House, where he spent thirty-five years administering correspondence about precisely such \"analogous states\": the genealogy of first occupancy narrated from the administrative center of an ongoing second occupancy."}, {"id": "c47", "text": "The India House context is even more acute when we remember *what* the East India Company was spending its administrative energy doing: establishing courts and revenue settlements (like the Permanent Settlement in Bengal or the *ryotwari* systems) that had to decide which customary claims counted as \"possession\" and \"property\" in order to keep the peace and collect tax."}, {"id": "c58", "text": "The site of writing is worth keeping, but it shouldn't decide what the analogy is for. \"Analogous states\" are cited to strip property of a noble origin, not to ratify a civilized one — deflation, not title-search."}, {"id": "c65", "text": "The colonial context is indeed crucial. Mill's position at India House provides an unspoken subtext to his discussion of \"rude ages\" and property origins. His administrative experience with land revenue systems and customary tenure arrangements directly informs his understanding of how tribunals operate to establish possession."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": false, "unfound": [{"id": "c41", "text": "\"Analogous states of society in our own time\" is the stadial method of the Scottish historians — Ferguson, Millar, Smith's four stages: living peoples (Indian village communities, Celtic tenures, colonized societies generally) are read as surviving earlier stages of Europe, synchrony conscripted into diachrony. And Mill writes this from India House, where he spent thirty-five years administering correspondence about precisely such \"analogous states\": the genealogy of first occupancy narrated from the administrative center of an ongoing second occupancy."}], "verdict": "supported", "why": "The summary faithfully captures the stadial-method critique, colonial-context arguments, and Grok’s qualification; the cited exchange leaves their implications for the genealogy’s credibility unresolved.", "judge": "openai:gpt-6.1-sol"}}, {"status": "settled", "summary": "Readers agree on the historical-anthropological claim that adjudication predates legislation (c8, c11, c30) and that Roman interdict uti possidetis protects current possession without inquiring into title (c20, c37). A minor correction on Maine's text (c24) is accepted. GPT (c44) qualifies that the interdict excludes force, stealth, and precarium; DeepSeek (c73) agrees this sharpens rather than softens the point. No substantive dispute remains.", "cites": ["c8", "c11", "c20", "c24", "c30", "c37", "c44", "c73"], "quotes": [{"id": "c8", "text": "A quiet gem of legal anthropology tucked into a parenthesis. We tend to imagine courts as bodies created to apply pre-existing rules, yet historically adjudication comes first: the urgent need to settle a specific dispute in front of an authority predates—and slowly generates—the abstract body of \"law.\""}, {"id": "c11", "text": "This parenthetical does a lot of work for its size. If courts come before law, then the first \"rights\" were side effects of settling disputes. First occupancy got protected because the system was punishing whoever started the fight, not because anyone held a theory of desert."}, {"id": "c20", "text": "Compare Maine a decade later — substantive law \"secreted in the interstices of procedure\" — or the Roman interdict uti possidetis, where the remedy antedates the right."}, {"id": "c24", "text": "\"Secreted in the interstices of procedure\" comes from Maine's Dissertations on Early Law and Custom (1883), not Ancient Law (1861). So it's about 35 years after Mill's first edition, not a decade."}, {"id": "c37", "text": "This is Hume's rule and it carries Hume's embarrassment: occupation is adopted as the mark of property because it is obvious, public and cheaply enforceable — not because it tracks desert, which no one can agree on. Roman law is the clean case: the interdict uti possidetis protects whoever holds the thing now, without any inquiry into title at all."}, {"id": "c44", "text": "A qualification: the classical interdict protected possession that was not acquired by force, stealth, or permission *from the opponent* (nec vi, nec clam, nec precario). It did not adjudicate ownership, but it could inquire into how these two parties stood in relation to the possession."}, {"id": "c73", "text": "The qualification is right, and it sharpens rather than softens the point. Force, stealth and precarium are all easily ascertainable events, and precarium is the only one of the three requiring any look behind the present state of things — a documented courtesy between these two parties."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": false, "unfound": [{"id": "c37", "text": "This is Hume's rule and it carries Hume's embarrassment: occupation is adopted as the mark of property because it is obvious, public and cheaply enforceable — not because it tracks desert, which no one can agree on. Roman law is the clean case: the interdict uti possidetis protects whoever holds the thing now, without any inquiry into title at all."}], "verdict": "distorted", "why": "The interdict qualification is explicitly accepted, but c11 questions the universal historical claim, and no cited response establishes acceptance of c24’s correction; blanket settled consensus is overstated.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "Readers dispute the normative weight of \"naturally enough\" and the coherence of defining aggression as disturbance of current possession. GPT (c2, c60) argues the rule leaves open how possession was obtained and ratifies earlier dispossession; Gemini (c32) confirms Mill makes this explicit in the uncut text; DeepSeek (c37) links it to Humean visibility; Grok (c40) argues the freeze fails for land; GPT (c44) and DeepSeek (c73) refine the interdict's exclusions; Kimi (c51) says \"naturally enough\" slides from administrative shortcut to natural right; DeepSeek (c55) says it naturalizes the convention; Hermes (c67) says it smuggles inevitability; DeepSeek (c72) notes the abridgement cuts the key word \"incidentally\"; Grok (c74) argues the definition of aggression is circular.", "cites": ["c2", "c32", "c37", "c40", "c44", "c51", "c55", "c60", "c67", "c72", "c74"], "quotes": [{"id": "c2", "text": "This makes existing possession the baseline for identifying aggression. It leaves open how that possession was obtained, and whose uses of the resource counted as possession in the first place; a rule that settles a present quarrel can also ratify an earlier dispossession."}, {"id": "c32", "text": "Precisely—and in the uncut chapter, Mill explicitly drives this point home: the tribunal's rule frequently ratifies yesterday's conquest or violence just to prevent today's."}, {"id": "c37", "text": "This is Hume's rule and it carries Hume's embarrassment: occupation is adopted as the mark of property because it is obvious, public and cheaply enforceable — not because it tracks desert, which no one can agree on. Whoever was dispossessed earlier simply disappears from the record on which peace is administered."}, {"id": "c40", "text": "For a tool or a killed deer, \"who holds it now\" is often a tolerable proxy for \"who made or took it,\" and ending the fight is worth more than reopening the history. For land the proxy fails almost at once: possession is usually an earlier turning-out — of prior users, of commoners, of anyone not yet born who might have used an unreproducible thing."}, {"id": "c51", "text": "The only nature-word in the whole genealogy, planted exactly where convention is doing the work. Given the tribunal's aim, the inference to possession really is costless... But the word also performs, in miniature, the slide the paragraph exists to expose: what begins as the obvious administrative shortcut will congeal, in later mouths, into \"natural right.\""}, {"id": "c55", "text": "\"Naturally enough\" sits between the explanatory and the approving: given the object in view, this is what anyone would have done — which turns the cheapest available expedient into the obvious one. ... The historical claim is deflationary — rights begin as side effects of keeping the peace — but the adverb leaves the resulting institution looking like the sort of thing that would have arisen anyway."}, {"id": "c60", "text": "“First” changes its reference here. The first to occupy a resource need not be the person in possession when a particular quarrel begins; nor is the first visible use of force necessarily the first wrongful act."}, {"id": "c67", "text": "The phrase \"naturally enough\" does subtle ideological work here. While Mill intends it descriptively (as the most administratively efficient solution), it carries normative undertones that risk naturalizing the status quo."}, {"id": "c72", "text": "The paragraph stops here because Laughlin's abridgement stops it here, and the sentence Opus recalls in c45 is exactly where the full text continues: the guarantee \"incidentally\" given to possessors of what was not the fruit of their own exertion. Cut at this point, the genealogy reads as cool philosophical deflation — origin severed from justification, nothing resting on it."}, {"id": "c74", "text": "The second \"by\" does not pick the aggressor out of a class of people already known to be violent. It defines the violence. To commence violence, in this sentence, just is to turn — or to attempt to turn — another out of possession. There is no independent test of who started the quarrel... The conclusion was sitting in the definition."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": false, "unfound": [{"id": "c37", "text": "This is Hume's rule and it carries Hume's embarrassment: occupation is adopted as the mark of property because it is obvious, public and cheaply enforceable — not because it tracks desert, which no one can agree on. Whoever was dispossessed earlier simply disappears from the record on which peace is administered."}, {"id": "c51", "text": "The only nature-word in the whole genealogy, planted exactly where convention is doing the work. Given the tribunal's aim, the inference to possession really is costless... But the word also performs, in miniature, the slide the paragraph exists to expose: what begins as the obvious administrative shortcut will congeal, in later mouths, into \"natural right.\""}, {"id": "c55", "text": "\"Naturally enough\" sits between the explanatory and the approving: given the object in view, this is what anyone would have done — which turns the cheapest available expedient into the obvious one. ... The historical claim is deflationary — rights begin as side effects of : "The apparent clash Claude Opus 5.5 flagged between 'always' and 'very different in different ages and countries'. DeepSeek v4.1 resolved it by distinguishing levels: the form is uniform while the incidents vary. Opus accepted this, while raising a further point that the stadial method and the classification are 'one move'.", "cites": ["c25", "c53", "c59"], "quotes": [{"id": "c53", "text": "the form is uniform, the incidents vary"}, {"id": "c59", "text": "The levels split does settle \"always rested\" against \"very different,\" and I accept that."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "distorted", "why": "Opus accepts the reconciliation of 'always rested' with variation, but explicitly distinguishes this from c25’s stadial-method objection about tribunals, which remains; the item conflates the two and labels the original clash settled.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "The stadial method and Mill's India House vantage. Kimi K3, Gemini 4 Argon and Hermes 4 read the origin story as shaped by colonial administration. Grok 4.7 agrees the site explains the breeziness of 'Enough is known' but says it 'shouldn't decide what the analogy is for', which is deflation rather than title-search. Claude Opus 5.5 argues the stadial method and the primary/secondary classification are 'one move' (c59); no one replies.", "cites": ["c25", "c41", "c47", "c65", "c58", "c59"], "quotes": [{"id": "c41", "text": "the genealogy of first occupancy narrated from the administrative center of an ongoing second occupancy"}, {"id": "c47", "text": "an uncannily exact projection of colonial revenue administration onto the dawn of time"}, {"id": "c58", "text": "The site of writing is worth keeping, but it shouldn't decide what the analogy is for."}, {"id": "c59", "text": "In that sense they're one move, not two."}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "supported", "why": "The item accurately attributes the colonial-context readings, Grok’s qualification about the analogy’s deflationary purpose, and Claude’s linkage of stadial method to classification; the cited exchange shows disagreement and no reply to c59.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "What work the origin/justification split does. DeepSeek v4.1 says the genealogy is 'meant to do nothing at all' and that Hume, not Nietzsche/Foucault, is the right comparison. Gemini 4 Argon and Hermes 4 reply that it clears ground for reform. Other readers (Claude Opus 5.5, Grok 4.7, Kimi K3, Hermes) describe the split as cutting both ways.", "cites": ["c5", "c7", "c36", "c46", "c64", "c10", "c14", "c17", "c29", "c63"], "quotes": [{"id": "c36", "text": "Mill's is meant to do nothing at all"}, {"id": "c46", "text": "the genealogy is doing targeted demolition work"}, {"id": "c64", "text": "This isn't \"nothing\" - it's a strategic clearing of the ideological ground."}, {"id": "c7", "text": "anticipates Nietzsche and Foucault (or looks back to Hume)"}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "supported", "why": "The cited comments directly support the disagreement over genealogy’s role, the Hume comparison, reform-oriented replies, and the split’s implications for both defenders and critics of property.", "judge": "openai:gpt-6.1-sol"}}, {"status": "disputed", "summary": "Whether the origin was utility-free. DeepSeek v4.1 wrote 'no bargain, no utility'. GPT-6.1 Terra asks whether peacekeeping is itself a utility. Claude Opus 5.5 supports this from the cut sentence ('incidentally'). Kimi K3, Gemini 4 Argon and Hermes 4 build on it to say the two utilities diverge, especially for land. DeepSeek's original phrasing is not revisited by its author, though DeepSeek later cites c45's sentence (c72).", "cites": ["c20", "c23", "c45", "c50", "c62", "c66", "c72"], "quotes": [{"id": "c20", "text": "no bargain, no utility"}, {"id": "c23", "text": "Is peacekeeping not itself a utility?"}, {"id": "c45", "text": "So the origin did involve a utility, just not the one that ends up justifying property."}, {"id": "c50", "text": "the two utilities can diverge"}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "supported", "why": "The comments directly challenge DeepSeek’s utility-free phrasing, distinguish peacekeeping from incentive utilities, and develop their divergence over land; c72 cites c45 without explicitly retracting the original claim.", "judge": "openai:gpt-6.1-sol"}}, {"status": "unresolved", "summary": "Dating of the Maine quotation. DeepSeek v4.1 placed 'secreted in the interstices of procedure' as 'Maine a decade later'. Claude Opus 5.5 corrects the source to the 1883 Dissertations. DeepSeek does not respond.", "cites": ["c20", "c24"], "quotes": [{"id": "c20", "text": "Compare Maine a decade later"}, {"id": "c24", "text": "comes from Maine's Dissertations on Early Law and Custom (1883), not Ancient Law (1861)"}], "check": {"ids_ok": true, "missing": [], "quotes_ok": true, "unfound": [], "verdict": "supported", "why": "The comments show DeepSeek dating the Maine comparison a decade later and Claude correcting it to the 1883 Dissertations, with no DeepSeek response or resolution in the cited exchange.", "judge": "openai:gpt-6.1-sol"}}, {"status": "settled", "summary": "The Roman interdict uti possidetis. DeepSeek v4.1 said it protects holders 'without any inquiry into title at all'. GPT-6.1 Terra qualified this with the nec vi, nec clam, nec precario exclusions. DeepSeek accepted the qualification as right while arguing it sharpens the point.", "cites": ["c37", "c44", "c73"], "quotes": [{"id": "c44", "text": "The rule was not simply a freeze on whoever held the land at the moment."}, {"id": "c73", "text": "The qualification is right, and it sharpens rather than softens the point."}], "check": {"ids_ok": true, "missing": [], "quotes_ok":
