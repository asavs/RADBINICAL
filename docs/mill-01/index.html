    const raw = c.text.replace(/\s+/g, ' ').trim(), spans = [];
    for (const k of V.kids(c.id).filter(k => k.quote)) {
      const q = k.quote.replace(/\s+/g, ' ').trim(), i = q ? raw.indexOf(q) : -1;
      if (i >= 0 && !spans.some(s => i < s[1] && i + q.length > s[0])) spans.push([i, i + q.length, k]);
    }
    spans.sort((x, y) => y[0] - x[0]); // right to left, so earlier offsets stay valid
    let out = raw;
    for (const [i, j, k] of spans) out = out.slice(0, i) + '\uE000' + k.id + '\uE001' + out.slice(i, j) + '\uE002' + out.slice(j);
    return inline(out).replace(/\uE000(\w+)\uE001/g, (_, id) => `<span class="q" data-by="${id}" style="--c:${ink(byId[id].author)}">`).replace(/\uE002/g, '</span>');
  }

  // A comment as it stands in a margin: mark, number, the opening words it is on in bold, then the comment.
  // Comments on the passage need only a few opening words, since the number already locates them.
  function runHTML(c, V) {
    const top = c.target === 'passage';
    const lemma = c.quote ? `<span class="lemma">${esc(lemmaOf(c.quote, top ? 3 : 5).replace(/[.,;:…]+$/, ''))}.</span> ` : '';
    const truth = marked(c) ? ` <span class="truth">${plantNote(c)}</span>` : '';
    return `<div class="c${kinds(c)}" id="${c.id}" data-root="${rootOf(c).id}" ${top ? '' : `data-on="${c.target}" `}style="--c:${ink(c.author)}"${staleNote(c)}><span class="hd">${glyph(c.author)}<span class="n">${num(c.id)}</span></span>${lemma}${bodyHTML(c, V)}${truth}</div>`;
  }

  // A node: a comment drawn by `content`, then its margin, holding a node for each comment on it.
  const nodeHTML = (c, V, content) => `<section class="node">${content(c, V)}<div class="margin">${V.kids(c.id).map(k => nodeHTML(k, V, content)).join('')}</div></section>`;

  // The passage's own margin has two sides, each of one or more columns. The innermost column of a
  // side stands beside the passage and widens beneath it. Threads go down the columns in the order of
  // the words they are on, each to whichever is shortest so far. A side takes more columns only where
  // it has room for them (a poster sheet), and then as many as make the page shortest: fewer, wider
  // columns let a long thread spread outward instead of running down.
  function drawMargins(V) {
    const sides = [$('left'), $('right')], tops = V.kids('passage'), body = $('body');
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const most = Math.max(1, Math.floor(sides[0].offsetWidth / (30 * rem))); // 30rem: two of --col and what lies between
    const foot = m => { const t = m.lastElementChild; return t && t.matches('.node') ? t.offsetTop + t.offsetHeight : 0 };
    const lay = n => {
      sides.forEach(m => m.innerHTML = '<div class="col"><i class="notch"></i></div>' + '<div class="col"></div>'.repeat(n - 1));
      const cols = Array.from({ length: n }, (_, i) => sides.map(m => m.children[i])).flat(); // from the passage outward
      for (const c of tops) cols.reduce((a, b) => foot(b) < foot(a) ? b : a).insertAdjacentHTML('beforeend', nodeHTML(c, V, runHTML));
      return body.offsetHeight;
    };
    body.style.setProperty('--ph', $('passage').offsetHeight + 'px');
    let best = 1, least = lay(1);
    for (let n = 2; n <= most; n++) { const h = lay(n); if (h < least) [best, least] = [n, h] }
    if (best !== most) lay(best);
    $('all').hidden = !phone.matches || !tops.length;
    $('all').textContent = `Read all ${V.size} comments`;
  }

  function drawKey() {
    $('key').innerHTML = authors.map(a => {
      const n = D.comments.filter(c => c.author === a && c.layer <= S.upTo).length;
      return `<button style="--c:${ink(a)}" aria-pressed="${!S.off.has(a)}" data-author="${esc(a)}">${glyph(a, true)}<span>${esc(a)}</span><b>${n}</b></button>`;
    }).join('');
  }

  function draw() { const V = shown(); drawKey(); drawPassage(V); drawMargins(V) }

  // A comment as it stands in the reading view: who wrote it, its number as a link, then the comment in full.
  function cardHTML(c) {
    const lemma = c.quote ? `<span class="lemma" title="${esc(c.quote)}">${esc(lemmaOf(c.quote))}</span>` : '';
    const refs = (c.see_also || []).filter(r => byId[r]).map(r => `<button data-go="${r}" style="text-decoration-color:${ink(byId[r].author)}" title="${esc(byId[r].author)}">${num(r)}</button>`).join(', ');
    const m = c.meta || {}, tags = [
      people.has(c.author) ? (m.blind ? 'a person, writing blind' : 'a person') : '',
      S.plants && verdictOf[c.id] ? verdictOf[c.id] : '',
      c.stale ? `quoted words amended away in version ${esc(c.stale)}` : ''].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join(' ');
    const truth = marked(c) ? `<span class="truth">${plantNote(c)}</span>` : '';
    return `<div class="t${kinds(c)}" id="t-${c.id}" style="--c:${ink(c.author)}"><header><span>${glyph(c.author, true)} ${esc(c.author)}</span>${tags}<a href="#${c.id}" title="Link to this comment">${num(c.id)}</a></header>
      <div class="tb">${md(c.text).replace('<p>', '<p>' + lemma)}${truth}</div>${refs ? `<div class="refs">see also ${refs}</div>` : ''}</div>`;
  }
  let sheetSpan = null;
  function openReader(rootIds, flashId) {
    const V = shown(), tops = V.kids('passage').filter(t => !rootIds || rootIds.includes(t.id));
    if (!tops.length) return;
    sheetSpan = rootIds ? tops[0].id : null;
    $('sheetTitle').textContent = rootIds ? '“' + lemmaOf(D.passage.text.slice(Math.min(...tops.map(t => t.start)), Math.max(...tops.map(t => t.end))), 12) + '”' : 'All commentary';
    $('sheetTitle').disabled = !rootIds;
    $('sheetBody').innerHTML = tops.map(t => nodeHTML(t, V, cardHTML)).join('');
    if (!sheet.open) sheet.showModal();
    document.documentElement.classList.add('sheet-open');
    sheet.scrollTop = 0;
    const el = flashId && $('t-' + flashId);
    if (el) requestAnimationFrame(() => { el.scrollIntoView({ block: 'center' }); el.classList.add('flash') });
  }

  // Lighting: a comment lights its span in the passage and the comments it is tied to.
  function light(id, on) {
    const c = byId[id]; if (!c) return;
    const root = rootOf(c).id;
    document.querySelectorAll('.seg').forEach(s => { if (s.dataset.ids.split(' ').includes(root)) { s.classList.toggle('lit', on); s.style.setProperty('--c', ink(byId[root].author)) } });
    document.querySelectorAll(`sup.m[data-m="${root}"]`).forEach(m => m.classList.toggle('lit', on));
    document.querySelectorAll(`.c[data-on="${id}"]`).forEach(k => k.classList.toggle('kin', on));
    document.querySelectorAll(`.q[data-by="${id}"]`).forEach(q => q.classList.toggle('lit', on));
    if (c.target !== 'passage' && $(c.target)) $(c.target).classList.toggle('kin', on);
  }
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function go(id) {
    const c = byId[id]; if (!c) return;
    if (!shown().has(id)) { S.upTo = rounds; S.off.clear(); $('layer').value = rounds; draw() } // make sure a linked comment is visible
    if (phone.matches) return openReader([rootOf(c).id], id);
    if (sheet.open) sheet.close();
    flash($(id));
  }

  const hover = on => e => {
    const c = e.target.closest('.c'); if (c) light(c.id, on);
    const q = e.target.closest('.q'); if (q && $(q.dataset.by)) $(q.dataset.by).classList.toggle('lit', on); // a quoted phrase lights the reply that quotes it
    const m = e.target.closest('sup.m'); if (m) { light(m.dataset.m, on); const el = $(m.dataset.m); if (el) el.classList.toggle('lit', on) }
  };
  document.querySelector('.daf').addEventListener('mouseover', hover(true));
  document.querySelector('.daf').addEventListener('mouseout', hover(false));
  const pickMark = m => phone.matches ? openReader([m.dataset.m]) : flash($(m.dataset.m));
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const a = e.target.closest('.t header a'); if (a && a.hash === location.hash) return go(a.hash.slice(1)); // same link again: hashchange will not fire
    const m = e.target.closest('sup.m'); if (m) return pickMark(m);
    const c = e.target.closest('.c'); if (c && !getSelection().toString()) return openReader([c.dataset.root], c.id);
    const k = e.target.closest('[data-author]');
    if (k) { const n = k.dataset.author; S.off.has(n) ? S.off.delete(n) : S.off.add(n); draw() }
  });
  $('passage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('sup.m')) { e.preventDefault(); pickMark(e.target) } });
  $('all').addEventListener('click', () => openReader(null));
  $('sheetClose').addEventListener('click', () => sheet.close());
  $('sheetTitle').addEventListener('click', () => { const id = sheetSpan; sheet.close(); if (id) { light(id, true); flash(document.querySelector('.seg.lit')); setTimeout(() => light(id, false), 2500) } });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close() }); // click on the dimmed area
  sheet.addEventListener('close', () => document.documentElement.classList.remove('sheet-open'));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  const relayout = () => { if (sheet.open) sheet.close(); draw() };
  phone.addEventListener('change', relayout);
  let pending = 0, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(pending); pending = setTimeout(() => drawMargins(shown()), 150) });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawMargins(shown())); // heights change once the faces load

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play' };
  $('play').hidden = rounds < 2;
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const show = n => { S.upTo = n; $('layer').value = n; draw() };
    show(1); $('play').textContent = 'Pause';
    timer = setInterval(() => { if (S.upTo >= rounds) return stop(); show(S.upTo + 1); if (S.upTo >= rounds) stop() }, 1800);
  });
  $('layer').addEventListener('input', e => { if (timer) stop(); S.upTo = +e.target.value; draw() });

  // Apparatus: what later steps found about the page, from its side files, set beneath the sheet.
  const cites = ids => {
    const s = (ids || []).filter(id => byId[id]).map(id => `<button data-go="${id}" style="text-decoration-color:${ink(byId[id].author)}" title="${esc(byId[id].author)}">${num(id)}</button>`).join(', ');
    return s ? ` <span class="refs">${s}</span>` : '';
  };
  const fmt = x => typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(2)) : esc(x ?? '');
  const grid = (head, rows) => `<div class="tbl"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const mean = xs => { xs = xs.filter(x => typeof x === 'number'); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : '' };

  // compare in redactions.json: {models, pairs: [{a, b, all, disputed, settled, unresolved}], core, only_one, uncited}
  const overlap = C => {
    if (!C || (C.models || []).length < 2) return '';
    const nm = m => esc(((SIDE.redactions.redactions || []).find(r => r.model === m) || {}).name || m);
    return `<p class="lead">Overlap of cited comments (Jaccard): ${(C.pairs || []).map(p => `${nm(p.a)} and ${nm(p.b)} ${fmt(p.all)}`).join(' · ')}${
      typeof C.uncited === 'number' ? ` · comments no redaction cites ${Math.round(C.uncited * 100)}%` : ''}. Cited by every redaction:${cites(C.core) || ' none'}</p>`;
  };

  function redactions(R) {
    if (!R || !(R.redactions || []).length) return '';
    const STATUS = [['disputed', 'Disputed'], ['settled', 'Settled'], ['unresolved', 'Unresolved']];
    const check = k => {
      const notes = [k.ids_ok === false && 'cites a comment that does not exist', k.quotes_ok === false && 'a quotation is not in the comment it cites', k.verdict].filter(Boolean);
      return notes.length ? ` <span class="on"${k.why ? ` title="${esc(k.why)}"` : ''}>${esc(notes.join('; '))}</span>` : '';
    };
    const item = i => `${inline(i.summary || '')}${cites(i.cites)}${check(i.check || {})}`;
    return `<div><h3>Redactions</h3><p class="lead">Each redactor set out what the page disputed, what it settled and what it left open, deciding nothing and citing a comment for every item.</p><div class="run">${
      R.redactions.map(r => `<div><p><b>${esc(r.name || r.model)}</b>${r.signed === false ? ' <span class="on">read the page unsigned</span>' : ''}</p>${
        r.error ? `<p class="on">Failed: ${esc(r.error)}</p>` : ''}${STATUS.map(([k, label]) => {
        const items = (r.items || []).filter(i => i.status === k);
        return items.length ? `<p><span class="st">${label}.</span> ${items.map(item).join(' ')}</p>` : '';
      }).join('')}${(r.notes || []).length ? `<p class="on" title="${esc(r.notes.join('\n'))}">${r.notes.length} item${r.notes.length === 1 ? '' : 's'} dropped or trimmed</p>` : ''}</div>`).join('')}</div>${overlap(R.compare)}</div>`;
  }

  function forecasts(F) {
    F = (F || {}).forecasts || [];
    if (!F.length) return '';
    const rs = [...new Set(F.map(f => f.round))].sort((a, b) => a - b), who = [...new Set(F.map(f => f.reader))];
    const cell = f => f && f.error ? `<span class="on" title="${esc(f.error)}">failed</span>` : f ? `<span title="Named ${esc((f.predicted || []).map(num).join(', ') || 'none')}; of those, ${esc((f.hits || []).map(num).join(', ') || 'none')} drew replies">${(f.hits || []).length}/${(f.predicted || []).length}</span> <span class="on">${fmt(f.chance)}</span>` : '';
    return `<div><h3>Forecasts</h3><p class="lead">Before each round, each reader named the comments it expected to draw replies. A cell gives how many did out of how many it named, then the rate chance would give.</p>${
      grid(['Reader', ...rs.map(r => 'Round ' + r), 'Precision', 'Recall', 'Chance'], who.map(w => {
        const mine = F.filter(f => f.reader === w);
        return [esc(w), ...rs.map(r => cell(mine.find(f => f.round === r))), fmt(mean(mine.map(f => f.precision))), fmt(mean(mine.map(f => f.recall))), fmt(mean(mine.map(f => f.chance)))];
      }))}</div>`;
  }

  function rulings(RU) {
    if (!RU || !(RU.rulings || []).length) return '';
    const all = RU.rulings, nm = r => r.name || r.model;
    const cases = (RU.cases || []).length ? RU.cases : [...new Set(all.map(r => r.case))].map(id => ({ id }));
    const models = [...new Set(all.map(nm))];
    // A ruling's option is the option's text (radbinical/caselaw.py); shown as its letter, A, B, ...
    const letterOf = (cs, o) => { const c = cases.find(c => c.id === cs), i = c && Array.isArray(c.options) ? c.options.indexOf(o) : -1; return i >= 0 ? String.fromCharCode(65 + i) : String(o) };
    const opts = rs => [...new Set(rs.filter(r => r.option != null).map(r => letterOf(r.case, r.option)))].join(' / ');
    const why = rs => esc(rs.map(r => r.error ? 'Failed: ' + r.error : r.reason).filter(Boolean).join('\n\n'));
    const cell = (cs, m) => {
      const of = cond => all.filter(r => r.case === cs && nm(r) === m && r.condition === cond), b = of('bare'), p = of('page');
      if (!b.length && !p.length) return '';
      return `<span title="${why(b)}">${esc(opts(b) || '–')}</span> → <span class="${opts(b) !== opts(p) ? 'diff' : ''}" title="${why(p)}">${esc(opts(p) || '–')}</span>${cites(p.flatMap(r => r.cites || []))}`;
    };
    const opt = c => Array.isArray(c.options) && c.options.length ? ` <span class="on">${c.options.map((o, i) => `${String.fromCharCode(65 + i)}. ${esc(o)}`).join(' · ')}</span>` : '';
    // summary in rulings.json: {conditions: {bare, page: {agreement, pairwise, ...}}, changed: {count, of}, note}
    const S2 = RU.summary || {}, cond = S2.conditions || {}, ch = S2.changed;
    const agreed = cond.bare || cond.page ? `<p class="lead">Agreement between models: ${fmt(cond.bare && cond.bare.agreement)} on the bare passage, ${fmt(cond.page && cond.page.agreement)} with the page${
      ch ? `; ${fmt(ch.count)} of ${fmt(ch.of)} rulings changed` : ''}. ${esc(S2.note || '')}</p>` : '';
    return `<div><h3>Rulings</h3><p class="lead">Each model ruled on each case twice, first on the bare passage, then with the page before it. A cell reads bare → with the page, in bold where the two differ; numbers are the comments it cited.</p>${
      grid(['Case', ...models.map(esc)], cases.map(c => [`<b>${esc(c.id)}</b>`, ...models.map(m => cell(c.id, m))]))}${
      cases.filter(c => c.question || c.case).map(c => `<p><b>${esc(c.id)}.</b> ${inline(c.case || '')}${c.case && c.question ? ' ' : ''}${inline(c.question || '')}${opt(c)}</p>`).join('')}${agreed}</div>`;
  }

  function amendments(A) {
    if (!A || !(A.versions || []).length) return '';
    const props = A.proposals || [], used = new Set(A.versions.flatMap(v => v.from_proposals || []));
    const votes = p => esc((p.votes || []).map(v => `${v.reader}: ${v.vote}${v.why ? ' (' + v.why + ')' : ''}`).join('\n'));
    // A proposal is "open" (not yet voted on), "invalid" (never put to the vote) or "closed"; see radbinical/amend.py.
    const fate = p => p.status === 'open' ? 'waiting for the vote' : p.status === 'invalid' ? 'not put to the vote'
      : `${p.yes || 0} for, ${p.no || 0} against${p.abstain ? `, ${p.abstain} abstaining` : ''} · ${p.applied ? 'applied' : p.passed ? 'passed, not applied' : 'not passed'}`;
    const prop = p => `<p><del>${esc(p.quote || '')}</del> <ins>${esc(p.replacement || '')}</ins> <span class="on" title="${votes(p)}">${esc(p.author || '')} · version ${esc(p.version ?? '')} · ${fate(p)}${p.note ? ` (${esc(p.note)})` : ''}</span>${p.reason ? ' ' + inline(p.reason) : ''}${cites(p.cites)}</p>`;
    const rest = props.filter(p => !used.has(p.id));
    return `<div><h3>Amendments</h3><p class="lead">${A.question ? inline(A.question) + ' · ' : ''}${A.threshold != null ? 'votes to pass ' + fmt(A.threshold) + ' · ' : ''}${A.versions.length} version${A.versions.length === 1 ? '' : 's'}</p>${
      A.versions.map(v => `${(v.from_proposals || []).map(id => props.find(p => p.id === id)).filter(Boolean).map(prop).join('')}<p><span class="st">Version ${esc(v.n)}.</span> ${inline(v.text || '')}</p>`).join('')}${
      rest.length ? `<p><span class="st">Proposed and not applied.</span></p>${rest.map(prop).join('')}` : ''}</div>`;
  }

  function plants(PL) {
    if (!S.plants || !PL || !(PL.plants || []).length) return '';
    return `<div><h3>Planted comments</h3><p class="lead">Comments placed on the page under a reader's name, to see whether the others catch a slip or dismiss a sound reading${PL.judge ? `; judged by ${esc(PL.judge)}` : ''}.</p>${
      grid(['Comment', 'Sort', 'Under the name of', 'Round', 'Replies', 'Outcome', 'Rounds to catch'], PL.plants.map(p => {
        const o = outcome(p), counts = Object.entries(p.counts || {}).filter(([, n]) => n).map(([v, n]) => `${n} ${esc(v)}`).join(', ');
        const reps = p.replies || [], own = reps.filter(r => r.nominal_author).length;
        const note = [counts, own ? `${own} by its nominal author, not counted` : ''].filter(Boolean).join('; ');
        return [cites([p.id]) || esc(p.id), p.sort === 'sound' ? 'sound reading' : 'slip', esc(p.author || ''), fmt(p.round),
          `${reps.length - own}${note ? ` <span class="on">${note}</span>` : ''}`,
          o ? esc(o.text) + (o.when ? ` in round ${esc(o.when)}` : '') : 'not judged', fmt(p.rounds_to_catch)];
      }))}${(PL.notes || []).length ? `<p class="on">${PL.notes.length} note${PL.notes.length === 1 ? '' : 's'} from judging, in plants.json.</p>` : ''}</div>`;
  }

  function drawApparatus() {
    const parts = [redactions(SIDE.redactions), forecasts(SIDE.forecasts), rulings(SIDE.rulings), amendments(SIDE.amendments), plants(SIDE.plants)].filter(Boolean);
    $('apparatus').innerHTML = parts.length ? '<h2>Apparatus</h2>' + parts.join('') : '';
    $('apparatus').hidden = !parts.length;
  }

  $('plants').hidden = !D.comments.some(isPlant);
  $('plants').addEventListener('click', e => { S.plants = !S.plants; e.target.setAttribute('aria-pressed', S.plants); if (sheet.open) sheet.close(); draw(); drawApparatus() });
  if (D.site && D.site.workflow) {
    const a = $('again');
    a.href = D.site.workflow; a.hidden = false;
    a.title = `Opens the Run workflow on GitHub. Only the repository owner can start it: choose mode “extend” and enter this run's name, ${D.site.run}.`;
  }

  // Printing: one poster sheet. PAPER is A1 landscape; for A3 landscape use { w: 420, h: 297, margin: 10 }.
  const PAPER = { w: 841, h: 594, margin: 12 };
  $('paper').textContent = `@page { size: ${PAPER.w}mm ${PAPER.h}mm; margin: ${PAPER.margin}mm }`;
  const px = mm => mm * 96 / 25.4, root = document.documentElement;
  function fitPrint() {
    if (sheet.open) sheet.close();
    const W = px(PAPER.w - 2 * PAPER.margin), H = px(PAPER.h - 2 * PAPER.margin), wrap = document.querySelector('.wrap');
    root.classList.add('printing'); root.style.setProperty('--print-w', W + 'px');
    const fits = fs => { root.style.setProperty('--print-fs', fs + 'px'); drawMargins(shown()); return wrap.offsetHeight <= H * 0.98 }; // a little room, since paper rounds lines differently
    let lo = 4, hi = W / 92; // at hi the sheet keeps its on-screen proportions, scaled up to the paper's width
    if (fits(hi)) return;
    for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid }
    fits(lo);
  }
  addEventListener('beforeprint', fitPrint);
  addEventListener('afterprint', () => { root.classList.remove('printing'); drawMargins(shown()) });
  $('print').addEventListener('click', () => print());

  const f = D.flags, row = (k, v) =>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  $('made').innerHTML = `
    <div><h2>Reading the page</h2><p>The passage has a margin on either side. Comments on the passage stand in it, in the order of the words they attach to; small numbers in the passage show where each begins. Every comment has a margin of its own, on its far side from the passage, holding the comments on it, so a thread reads outward from the passage one step at a time. Where the page is too narrow for a margin to stand beside its comment, it runs beneath it, set in from the rule. Select a comment to read its whole thread.</p></div>
    <div><h2>Readers</h2><div class="tbl"><table>${D.readers.map(r => row(r.name, r.model)).join('')}</table></div></div>
    <div><h2>Settings</h2><div class="tbl"><table>${Object.entries(f).map(([k, v]) => row(k, v === null ? 'none' : v)).join('')}</table></div></div>
    <div><h2>What each reader was told</h2><pre>${esc(D.prompt_example || '')}</pre></div>
    ${authors.some(brandOf) ? '<div><h2>Logos</h2><p>Each reader is marked with its maker\'s logo and brand colour, to show whose model wrote what. The marks belong to their owners. Icons are linked from the <a href="https://github.com/lobehub/lobe-icons">lobe-icons</a> set.</p></div>' : ''}
    <div><h2>Round by round</h2><div class="tbl"><table><tr><th>Round</th><th>Reader</th><th>Comments</th><th>Note</th></tr>${
      [...D.log].sort((a, b) => a.layer - b.layer).map(l =>`<tr><td>${l.layer}</td><td>${esc(l.reader)}</td><td>${l.comments}</td><td>${esc(l.error ? 'Failed: ' + l.error : (l.closing || ''))}</td></tr>`).join('')}</table></div></div>`;
  draw(); drawApparatus();
  if (authors.some(brandOf)) { // logos are linked, not bundled: show them only once one is known to load
    const probe = new Image();
    probe.onload = () => { S.icons = true; draw() };
    probe.src = ICONS + 'claude.svg';
  }
  if (location.hash) go(location.hash.slice(1));
}
start();
</script>
