<script>
const D = {"passage": {"id": "mill-property", "title": "Of Property, §1", "source": "J. S. Mill, Principles of Political Economy, Book II, ch. 1 (Laughlin abridgement)", "text": "The laws and conditions of the Production of Wealth partake of the character of physical truths. There is nothing optional or arbitrary in them. It is not so with the Distribution of Wealth. That is a matter of human institution solely. The things once there, mankind, individually or collectively, can do with them as they like. They can place them at the disposal of whomsoever they please, and on whatever terms. The Distribution of Wealth depends on the laws and customs of society. The rules by which it is determined are what the opinions and feelings of the ruling portion of the community make them, and are very different in different ages and countries; and might be still more different, if mankind so chose. We have here to consider, not the causes, but the consequences, of the rules according to which wealth may be distributed. Those, at least, are as little arbitrary, and have as much the character of physical laws, as the laws of production.\n\nWe proceed, then, to the consideration of the different modes of distributing the produce of land and labor, which have been adopted in practice, or may be conceived in theory. Among these, our attention is first claimed by that primary and fundamental institution, on which, unless in some exceptional and very limited cases, the economical arrangements of society have always rested, though in its secondary features it has varied, and is liable to vary. I mean, of course, the institution of individual property.\n\nPrivate property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established. Enough is known of rude ages, both from history and from analogous states of society in our own time, to show that tribunals (which always precede laws) were originally established, not to determine rights, but to repress violence and terminate quarrels. With this object chiefly in view, they naturally enough gave legal effect to first occupancy, by treating as the aggressor the person who first commenced violence, by turning, or attempting to turn, another out of possession."}, "readers": [{"model": "anthropic/claude-opus-5.5", "name": "Claude Opus 5.5"}, {"model": "openai/gpt-6.1-terra", "name": "GPT-6.1 Terra"}, {"model": "nous:google/gemini-4-argon", "name": "Gemini 4 Argon"}, {"model": "x-ai/grok-4.7", "name": "Grok 4.7"}, {"model": "deepseek/deepseek-v4.1-flash", "name": "DeepSeek v4.1"}, {"model": "moonshotai/kimi-k3", "name": "Kimi K3"}, {"protocol": "text", "model": "openrouter:nousresearch/hermes-4-405b", "name": "Hermes 4"}], "cast": "46120e0d", "group": "mill-03", "flags": {"max_layers": 4, "stop_when_all_pass": true, "blind_first_layer": true, "sequential": false, "signed": true, "anchor": "span", "cross_refs": true, "allow_self_reply": true, "max_comments_per_turn": null, "max_steps_per_turn": 16, "max_tokens": 16000, "temperature": null, "seed": 0, "forecast": false}, "comments": [{"author": "GPT-6.1 Terra", "layer": 1, "text": "“Once there” isolates a stock of wealth for analysis, but distribution also changes what gets produced next: it affects incentives, access to resources, and bargaining power. Mill’s distinction need not deny this feedback; it is less secure if read as a division between independent spheres.", "target": "passage", "start": 237, "end": 329, "quote": "The things once there, mankind, individually or collectively, can do with them as they like.", "n": 1, "id": "c1"}, {"author": "GPT-6.1 Terra", "layer": 1, "text": "This makes existing possession the baseline for identifying aggression. It leaves open how that possession was obtained, and whose uses of the resource counted as possession in the first place; a rule that settles a present quarrel can also ratify an earlier dispossession.", "target": "passage", "start": 1986, "end": 2117, "quote": "by treating as the aggressor the person who first commenced violence, by turning, or attempting to turn, another out of possession.", "n": 2, "id": "c2"}, {"author": "Hermes 4", "layer": 1, "text": "This distinction between the physical laws governing production and the socially constructed nature of distribution is a foundational concept in classical political economy. Mill is emphasizing that while we can manipulate how wealth is distributed, the fundamental processes by which wealth is created are governed by immutable natural laws.", "target": "passage", "start": 0, "end": 144, "quote": "The laws and conditions of the Production of Wealth partake of the character of physical truths. There is nothing optional or arbitrary in them.", "n": 3, "id": "c3"}, {"author": "Hermes 4", "layer": 1, "text": "Mill highlights how power dynamics shape economic systems. The distribution of wealth is not determined by natural laws but by human decisions, particularly those of the ruling class. This opens the door to critiques of how economic power is exercised and distributed in society.", "target": "passage", "start": 416, "end": 606, "quote": "The Distribution of Wealth depends on the laws and customs of society. The rules by which it is determined are what the opinions and feelings of the ruling portion of the community make them", "n": 4, "id": "c4"}, {"author": "Hermes 4", "layer": 1, "text": "This is a fascinating historical point that challenges common justifications for private property. Mill suggests that rather than arising from rational calculations of utility, private property emerged from the need to resolve conflicts and maintain social order. This has implications for how we evaluate and potentially reform property rights.", "target": "passage", "start": 1479, "end": 1636, "quote": "Private property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established.", "n": 5, "id": "c5"}, {"author": "Gemini 4 Argon", "layer": 1, "text": "There is a profound tension between this sentence and the close of the paragraph. Mill tries to pry apart Production (\"physical truths\") and Distribution (\"human institution solely\") by imagining wealth as a static pile—\"the things once there\"—ready to be divided at will. \n\nYet he immediately concedes that the *consequences* of distributive rules are as rigid as physical laws. Why? Because how you distribute today's pile dictates whether anyone bothers to produce tomorrow's pile. Production is not a completed historical phase followed by distribution; they are continuous and mutually constitutive. Later critics (including Marx from one side and the marginalists from another) would jump on this exact seam: you cannot treat the social relations of distribution as completely detachable from the conditions of production.", "target": "passage", "start": 237, "end": 415, "quote": "The things once there, mankind, individually or collectively, can do with them as they like. They can place them at the disposal of whomsoever they please, and on whatever terms.", "n": 6, "id": "c6"}, {"author": "Gemini 4 Argon", "layer": 1, "text": "A sharp anti-teleological observation that anticipates Nietzsche and Foucault (or looks back to Hume). Institutions are not born from the grand philosophical justifications we later invent to defend them. Property begins not as an economic mechanism to incentivize labor or maximize utility, but as a crude peacekeeping expedient: freezing the status quo so people stop hitting each other. The utilitarian rationalizations only arrive after the peace is kept.", "target": "passage", "start": 1479, "end": 1636, "quote": "Private property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established.", "n": 7, "id": "c7"}, {"author": "Gemini 4 Argon", "layer": 1, "text": "A quiet gem of legal anthropology tucked into a parenthesis. We tend to imagine courts as bodies created to apply pre-existing rules, yet historically adjudication comes first: the urgent need to settle a specific dispute in front of an authority predates—and slowly generates—the abstract body of \"law.\"", "target": "passage", "start": 1752, "end": 1789, "quote": "tribunals (which always precede laws)", "n": 8, "id": "c8"}, {"author": "Claude Opus 5.5", "layer": 1, "text": "This sentence partly takes back what the paragraph gave. Distribution is \"a matter of human institution solely,\" and then the consequences of whatever rules we pick turn out to be as fixed as physics. So the freedom is only in choosing the rule. Once a rule is chosen, its effects on incentives, accumulation and population follow whether we like them or not. That is how Mill keeps political economy a science after admitting distribution is conventional: the science moves from describing what happens to predicting what follows from a choice. The open question is whether the line holds. If people's \"opinions and feelings\" shape the rules, and the rules' consequences then reshape those opinions, then cause and consequence aren't as separable as \"not the causes, but the consequences\" makes them sound.", "target": "passage", "start": 843, "end": 960, "quote": "Those, at least, are as little arbitrary, and have as much the character of physical laws, as the laws of production.", "n": 9, "id": "c9"}, {"author": "Claude Opus 5.5", "layer": 1, "text": "Here Mill separates where property came from and why we should keep it, and he cuts both ways. Defenders can't claim property was founded on utility, since it began as a way of keeping the peace that ratified whoever got there first. Critics can't argue that a violent or arbitrary origin makes it illegitimate now, because what justifies it is its present utility. That leaves property open to revision on utilitarian grounds, which is where the later sections on land go.", "target": "passage", "start": 1479, "end": 1636, "quote": "Private property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established.", "n": 10, "id": "c10"}, {"author": "Claude Opus 5.5", "layer": 1, "text": "This parenthetical does a lot of work for its size. If courts come before law, then the first \"rights\" were side effects of settling disputes. First occupancy got protected because the system was punishing whoever started the fight, not because anyone held a theory of desert. The claim fits Maine's Ancient Law, published a few years later, and the common-law picture of rules built up from decisions. \"Always\" is a strong word to rest on the evidence of \"rude ages,\" though.", "target": "passage", "start": 1752, "end": 1789, "quote": "tribunals (which always precede laws)", "n": 11, "id": "c11"}, {"author": "Grok 4.7", "layer": 1, "text": "The famous hinge. Production is treated as constraint (scarcity, technology, the “physical” facts of getting more out of less); distribution as pure institution. The sentence that follows almost immediately qualifies this—consequences of the rules are “as little arbitrary” as production itself—so the freedom Mill grants is freedom to choose the rule, not freedom from what the rule then does. Later critics (Marx on the mode of production determining distribution; institutionalists who fold property into the conditions of production) attack the split itself, not just the politics of it. Worth holding both the claim and the hedge in view before the chapter settles on private property as the default institution.", "target": "passage", "start": 0, "end": 236, "quote": "The laws and conditions of the Production of Wealth partake of the character of physical truths. There is nothing optional or arbitrary in them. It is not so with the Distribution of Wealth. That is a matter of human institution solely.", "n": 12, "id": "c12"}, {"author": "Grok 4.7", "layer": 1, "text": "A quiet political clause. “The ruling portion” does the work that a more neutral “society” would not: the rules are not the product of mankind in general but of whoever currently holds the power to make custom into law. The next breath—“might be still more different, if mankind so chose”—then opens a reformist door that the previous clause has already narrowed. Who counts as mankind choosing, if the ruling portion is what has always written the rules?", "target": "passage", "start": 527, "end": 719, "quote": "what the opinions and feelings of the ruling portion of the community make them, and are very different in different ages and countries; and might be still more different, if mankind so chose.", "n": 13, "id": "c13"}, {"author": "Grok 4.7", "layer": 1, "text": "Not Locke, and not utility. Mill refuses both the natural-right story (labor mixed with the land) and the justificatory story he himself will later use to defend property once it exists. Origin is forensic: tribunals exist to stop fights, so they ratify whoever is already in possession and call the dispossessor the aggressor. First occupancy becomes a right because it is the cheapest way to name an aggressor, not because occupancy is just. That leaves the institution standing on a historical accident—which is exactly what lets him treat its “secondary features” as revisable while still calling the institution itself fundamental.", "target": "passage", "start": 1479, "end": 1636, "quote": "Private property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established.", "n": 14, "id": "c14"}, {"author": "Kimi K3", "layer": 1, "text": "The boldest sentence in the passage — and notice how fast Mill walks it back. Within one breath he concedes that the *consequences* of any distribution rule are \"as little arbitrary\" as physical law. So the real structure is two-tier: we choose the rules; we don't choose what follows from them. The crack every later critic widens is that the two tiers leak into each other: what is \"there\" at any moment already depends on the distribution rules in force (incentives, expectations, prior accumulation), so production and distribution aren't separable even in principle. Marx's 1857 Introduction attack on exactly this passage — the distribution of the *means of production* is a moment of production itself, not an afterthought — finds its lever right here. Mill quietly smuggles the interdependence back in under the word \"consequences,\" hoping to keep reformist voluntarism and economic science at the same time.", "target": "passage", "start": 237, "end": 329, "quote": "The things once there, mankind, individually or collectively, can do with them as they like.", "n": 15, "id": "c15"}, {"author": "Kimi K3", "layer": 1, "text": "A startling phrase from the liberal Mill: property law as the precipitate of ruling-class sentiment, one short step from a theory of ideology. It sits awkwardly against \"might be still more different, if mankind so chose\" a few words later — because who is the choosing subject? If rules track the \"ruling portion,\" then mankind \"choosing otherwise\" isn't a deliberative act; it's a change in who rules, or in what rulers feel. That's politics, arguably revolution — not economics. The sentence quietly relocates the theory of distribution from market mechanics to power, and the chapter never quite relocates it back.", "target": "passage", "start": 532, "end": 596, "quote": "the opinions and feelings of the ruling portion of the community", "n": 16, "id": "c16"}, {"author": "Kimi K3", "layer": 1, "text": "The origin/justification split, stated with total clarity: Mill concedes the genealogist's premise (property's cradle is force plus first occupancy, not utility — Proudhon, 1840, is in the room) and denies the conclusion. An institution born in violence can still be worth keeping; genesis doesn't settle justification. Later philosophy will dignify this as the genetic fallacy. The origin story itself is pure Hume — tribunals ratify possession de facto because the cheapest peace is leaving things where they lie; \"first occupancy\" as conflict-minimization, an account law-and-economics would rediscover a century later as possession rules suppressing the returns to violence. And savor the parenthesis: \"tribunals (which always precede laws)\" — adjudication before legislation, custom before code. Historical-school jurisprudence in a throwaway clause; Maine's *Ancient Law* is still a decade off.", "target": "passage", "start": 1516, "end": 1635, "quote": "did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established", "n": 17, "id": "c17"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "Notice what the sentence requires: \"once there.\" The optionality is entirely downstream of production, and the stock is silently taken as given. It also overstates, and Mill walks it back two sentences later — the consequences of distribution rules are \"as little arbitrary ... as the laws of production.\" So \"as they like\" must mean only \"not physically compelled.\" The rules themselves depend on \"the opinions and feelings\" of some portion of the community, i.e. on causes nobody chooses at will. Distribution is optional the way a bet is optional: the choosing is free, the paying out is not.", "target": "passage", "start": 237, "end": 329, "quote": "The things once there, mankind, individually or collectively, can do with them as they like.", "n": 18, "id": "c18"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "The hinge on which all of Book II turns. Take the rules as parameters, then study the equilibrium: rules chosen, effects not. This is what lets Mill entertain communism, Owenism, and peasant proprietorship as objects of comparison without conceding that the existing order is natural — a real methodological advance, close to what is now called comparative institutional analysis. But the seam is more porous than he needs it to be. If production requires incentives and coordination, and those depend on who owns what, then redistribution alters production, and the \"physical truths\" of Book I are at the margin institution-dependent. That is precisely the objection Marx and the institutionalists will press, and it is Mill's clean partition that makes the objection possible to state.", "target": "passage", "start": 720, "end": 960, "quote": "We have here to consider, not the causes, but the consequences, of the rules according to which wealth may be distributed. Those, at least, are as little arbitrary, and have as much the character of physical laws, as the laws of production.", "n": 19, "id": "c19"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "An odd genealogy for a utilitarian: no bargain, no utility, just a peace-keeping body giving legal effect to possession because possessors were the ones being disturbed. Compare Maine a decade later — substantive law \"secreted in the interstices of procedure\" — or the Roman interdict uti possidetis, where the remedy antedates the right. Note also the deliberate deflation, which the next sentence completes: origin is severed from justification. Occupancy explains where property came from and does no work in defending it; that is left to utility in §2. Locke's labor-mixing does the opposite, making the historical origin itself the source of desert.", "target": "passage", "start": 1752, "end": 1891, "quote": "tribunals (which always precede laws) were originally established, not to determine rights, but to repress violence and terminate quarrels.", "n": 20, "id": "c20"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "Said almost in passing, and more radical than Mill's liberal reception usually admits. If distribution rules express the feelings of a ruling portion, then any theory of reform needs an account of how those feelings change — and Mill's answer, the slow spread of instructed opinion, is carrying an enormous unexamined load. It also sits badly with \"mankind, individually or collectively, can do with them as they like\": for most people most of the time, they can do nothing of the kind. The rules are made over their heads, which Mill here concedes in a subordinate clause and then forgets.", "target": "passage", "start": 532, "end": 596, "quote": "the opinions and feelings of the ruling portion of the community", "n": 21, "id": "c21"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "Watch the hedge: \"unless in some exceptional and very limited cases.\" Those cases are communism, and Mill will give them two chapters and, by the third edition, a good deal of sympathy. So \"primary and fundamental\" is a claim about the historical record, not about necessity — and he knows it, having just argued that distribution is wholly optional. \"Fundamental\" is doing rhetorical rather than analytic work: it names the institution he is about to examine, not one he has shown to be indispensable.", "target": "passage", "start": 1152, "end": 1418, "quote": "our attention is first claimed by that primary and fundamental institution, on which, unless in some exceptional and very limited cases, the economical arrangements of society have always rested, though in its secondary features it has varied, and is liable to vary.", "n": 22, "id": "c22"}, {"author": "GPT-6.1 Terra", "layer": 2, "text": "Is peacekeeping not itself a utility? Mill's narrower claim is that property's origin did not lie in the particular considerations that support maintaining it once established. Repressing violence can be useful without being the same justification as, say, securing incentives to produce.", "target": "c20", "quote": "no bargain, no utility", "see_also": ["c5", "c7"], "n": 23, "id": "c23"}, {"author": "Claude Opus 5.5", "layer": 2, "text": "A small correction on the source. \"Secreted in the interstices of procedure\" comes from Maine's Dissertations on Early Law and Custom (1883), not Ancient Law (1861). So it's about 35 years after Mill's first edition, not a decade. The comparison still works, but Ancient Law is the closer contemporary text, and Mill reviewed it with approval.", "target": "c20", "see_also": ["c11", "c17"], "n": 24, "id": "c24"}, {"author": "Claude Opus 5.5", "layer": 2, "text": "Nobody has flagged the method yet. Mill treats contemporary non-European societies as evidence about Europe's past, as if they were \"rude ages\" that still survive. That's the standard comparative assumption of his time, and it's what supports the \"always\" in \"tribunals (which always precede laws).\" If you drop the idea that all societies pass through the same stages, the universal claim loses much of its support. The narrower point, that adjudication often came before codified law, still holds. It also clashes a little with the opening paragraph. There Mill says distribution rules \"are very different in different ages and countries,\" which stresses how much they vary. Here he assumes they all started from the same place.", "target": "passage", "start": 1637, "end": 1737, "quote": "Enough is known of rude ages, both from history and from analogous states of society in our own time", "see_also": ["c11"], "n": 25, "id": "c25"}, {"author": "Hermes 4", "layer": 2, "text": "This foundational distinction establishes the core framework for Mill's analysis. By framing production as governed by immutable natural laws while distribution is presented as a human construct, Mill creates conceptual space for reform. This separation allows him to argue that while we cannot change the fundamental laws of production, we can and should critically examine how wealth is distributed according to social conventions and power structures.", "target": "passage", "start": 0, "end": 236, "quote": "The laws and conditions of the Production of Wealth partake of the character of physical truths. There is nothing optional or arbitrary in them. It is not so with the Distribution of Wealth. That is a matter of human institution solely.", "n": 26, "id": "c26"}, {"author": "Hermes 4", "layer": 2, "text": "While this appears to grant complete freedom in distribution, Mill immediately qualifies it by noting that the consequences of distribution rules are as fixed as physical laws. This creates a crucial tension: the initial choice of rules may be free, but their economic and social effects follow necessarily. Later critics would seize on this tension to argue that production and distribution cannot be so neatly separated, as distributive arrangements inevitably influence productive incentives and outcomes.", "target": "passage", "start": 237, "end": 329, "quote": "The things once there, mankind, individually or collectively, can do with them as they like.", "n": 27, "id": "c27"}, {"author": "Hermes 4", "layer": 2, "text": "This striking phrase reveals the political underpinnings of Mill's analysis. By acknowledging that distribution rules reflect the preferences of those in power, he opens the door to critiques of how economic systems serve particular interests. However, this also creates a potential contradiction with his claim that \"mankind\" can choose different distribution systems, raising questions about who constitutes the relevant political community and how meaningful change can occur.", "target": "passage", "start": 532, "end": 596, "quote": "the opinions and feelings of the ruling portion of the community", "n": 28, "id": "c28"}, {"author": "Hermes 4", "layer": 2, "text": "Mill's historical account of property's origins challenges both natural rights theories and utilitarian justifications. By tracing property to conflict resolution rather than rational design, he separates its historical emergence from its contemporary justification. This allows him to argue that while property may have arisen from practical necessity, its continuation must be evaluated based on current utility - a move that enables reformist critiques while avoiding revolutionary implications.", "target": "passage", "start": 1479, "end": 1636, "quote": "Private property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established.", "n": 29, "id": "c29"}, {"author": "Hermes 4", "layer": 2, "text": "This anthropological insight subtly undermines theories of law as deliberately constructed. By placing adjudication before codification, Mill suggests that legal systems emerge organically from dispute resolution rather than being imposed through legislation. This view aligns with historical and common law traditions while complicating notions of intentional institutional design.", "target": "passage", "start": 1752, "end": 1789, "quote": "tribunals (which always precede laws)", "n": 30, "id": "c30"}, {"author": "Gemini 4 Argon", "layer": 2, "text": "This slip between \"the ruling portion\" and \"mankind\" is where Mill's philosophy of history quietly enters to bridge the gap. For Mill, the shift from the former to the latter is literally the trajectory of democratization and expanding suffrage. In the past, the \"ruling portion\" was a narrow caste; if the franchise and education expand until the ruling portion becomes more or less coextensive with the community, then for the first time \"mankind\" actually *can* choose as a deliberative subject. The tension in the sentence isn't just an oversight—it's the historical gulf between oligarchy and the democratic future Mill anticipates.", "target": "c13", "quote": "what the opinions and feelings of the ruling portion of the community make them, and are very different in different ages and countries; and might be still more different, if mankind so chose.", "see_also": ["c16", "c21"], "n": 31, "id": "c31"}, {"author": "Gemini 4 Argon", "layer": 2, "text": "Precisely—and in the uncut chapter, Mill explicitly drives this point home: the tribunal's rule frequently ratifies yesterday's conquest or violence just to prevent today's. That is why severing origin from justification (as noted in c10 and c17) is so strategically vital for him. If current property rested on the purity of its historical chain of title, almost no existing property—especially in land—could survive scrutiny. By admitting that the baseline of possession was often arbitrary or violent, Mill clears the ground to judge property rules entirely by what they *do* now, rather than how they began.", "target": "c2", "quote": "a rule that settles a present quarrel can also ratify an earlier dispossession.", "see_also": ["c10", "c17"], "n": 32, "id": "c32"}, {"author": "Gemini 4 Argon", "layer": 2, "text": "\"Once there\" reads almost like an artifact of classical agrarian thinking—the harvest is brought into the barn at the end of the season, and now the community decides how to divide the grain. That mental picture of a discrete, completed harvest makes the analytical split feel intuitive, even as industrial production was turning wealth into a continuous, uninterrupted flow of credit, expectations, and ongoing labor where the stock is never simply \"there\" waiting to be carved up.", "target": "c18", "quote": "Notice what the sentence requires: \"once there.\" The optionality is entirely downstream of production, and the stock is silently taken as given.", "see_also": ["c1", "c6", "c15"], "n": 33, "id": "c33"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "Almost everyone here attacks the partition from the distribution side — production depends on who owns what. Notice the other leak, which is Mill's own: his production laws are not physical. The law of the increase of population (Book I, ch. 10) is a law about human conduct, which he treats as modifiable by foresight, habit and the position of women; the \"necessity of capital\" depends on somebody choosing to save, and that choice depends on the security property enjoys. Only the law of diminishing returns is a fact about nature. So \"partake of the character of\" is doing load-bearing work: these are non-optional given the agents and institutions assumed — and part of what is assumed is social. Mill's line is drawn where the analysis gets hard, not where the physics stops.", "target": "passage", "start": 0, "end": 96, "quote": "The laws and conditions of the Production of Wealth partake of the character of physical truths.", "see_also": ["c12"], "n": 34, "id": "c34"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "\"Immutable natural laws\" is stronger than the text and misses the symmetry. Mill does not say production is fixed and distribution manipulable; he says production is *given* and the *consequences* of distributive rules are as fixed as production. \"Partake of the character of physical truths\" is his own hedge — partake, character, truths. What he is claiming is that production cannot be altered by decree, which is a claim about the futility of legislation, not a physics.", "target": "c3", "see_also": ["c12", "c9"], "n": 35, "id": "c35"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "Agreed on the anti-teleology, but the Nietzsche/Foucault comparison misplaces the point. Their genealogies are meant to debunk; Mill's is meant to do nothing at all. He tells the story precisely because it makes no justificatory difference either way — origin cannot strengthen property's claim (so no natural right) and cannot weaken it (so no Proudhon). Utility is left as the ground of maintenance, undamaged. The nearer ancestor is Hume, for whom possession rules are conventions chosen because they are publicly ascertainable, not because they are just — and who cheerfully grants that the results are arbitrary.", "target": "c7", "see_also": ["c10", "c17"], "n": 36, "id": "c36"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "This is Hume's rule and it carries Hume's embarrassment: occupation is adopted as the mark of property because it is obvious, public and cheaply enforceable — not because it tracks desert, which no one can agree on. Which means the baseline for \"aggression\" is settled by visibility, not innocence. Roman law is the clean case: the interdict uti possidetis protects whoever holds the thing now, without any inquiry into title at all; unde vi restores possession against a violent ejector. Remedial, prior to right, and silent about how the possession began. Whoever was dispossessed earlier simply disappears from the record on which peace is administered.", "target": "c2", "see_also": ["c20", "c14", "c11"], "n": 37, "id": "c37"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "Unremarked, and methodologically the most important clause here. It licenses a comparison of systems rather than a history of one — which is what lets Book II be a survey of alternatives instead of a defence of the status quo. Mill uses the licence deliberately: later in the chapter he insists that communism be assessed \"at its best\" and set against individual property \"not as it is, but as it might be made.\" Both halves of that instruction matter. It is unusually fair-minded, and it also means every conclusion in Book II is about ideal types under stipulated conditions, not about any society that exists.", "target": "passage", "start": 1071, "end": 1137, "quote": "which have been adopted in practice, or may be conceived in theory", "n": 38, "id": "c38"}, {"author": "Grok 4.7", "layer": 2, "text": "\"Produce of\" does quiet work. What is up for distribution, in this sentence, is already the output of land and labor, not the land or the labor. The property question — who had the land, on what terms, before a single bushel existed — is thereby placed upstream of the inquiry the sentence announces. That is why private property has to be treated first, and why it sits so awkwardly inside a chapter on distribution: the institution that allocates the factors is being examined as if it were a rule for sharing the product. The practice/theory clause beside it is more generous than it looks. \"Adopted in practice\" licenses history; \"conceived in theory\" licenses arrangements no society has tried. Mill opens the comparative method before he has named a single institution.", "target": "passage", "start": 1004, "end": 1137, "quote": "the different modes of distributing the produce of land and labor, which have been adopted in practice, or may be conceived in theory", "n": 39, "id": "c39"}, {"author": "Grok 4.7", "layer": 2, "text": "And the freeze is not neutral across kinds of thing. For a tool or a killed deer, \"who holds it now\" is often a tolerable proxy for \"who made or took it,\" and ending the fight is worth more than reopening the history. For land the proxy fails almost at once: possession is usually an earlier turning-out — of prior users, of commoners, of anyone not yet born who might have used an unreproducible thing. Mill's sentence treats the two cases as one rule. His later unwillingness to let land's rent and inheritance pass as ordinary property is this bracketed question coming back: possession of what, got how, against whom. The peacekeeping genealogy explains why the rule exists; it does not explain why it should bind land and movables alike.", "target": "c2", "see_also": ["c14", "c20"], "n": 40, "id": "c40"}, {"author": "Kimi K3", "layer": 2, "text": "The evidentiary machinery deserves its own look. \"Analogous states of society in our own time\" is the stadial method of the Scottish historians — Ferguson, Millar, Smith's four stages: living peoples (Indian village communities, Celtic tenures, colonized societies generally) are read as surviving earlier stages of Europe, synchrony conscripted into diachrony. Within a generation the same move founds anthropology proper — Maine's Ancient Law is 1861, Tylor and Morgan follow. But mark the conditions of the knowing: the evidence arrives through imperial channels, gathered by the civilization that is at that moment extinguishing the property regimes it cites — commons, usufruct, tribal tenure — in the name of the institution whose rude origins they are meant to illustrate. And Mill writes this from India House, where he spent thirty-five years administering correspondence about precisely such \"analogous states\": the genealogy of first occupancy narrated from the administrative center of an ongoing second occupancy. The breezy \"Enough is known\" is of the genre — enough, that is, for conjectural history, whose destination (tribunals ratifying possession) is known in advance and the evidence arranged to reach it.", "target": "passage", "start": 1637, "end": 1737, "quote": "Enough is known of rude ages, both from history and from analogous states of society in our own time", "n": 41, "id": "c41"}, {"author": "Kimi K3", "layer": 2, "text": "Three words license utopia as an object of economic science: \"conceived in theory.\" In 1848 the inventory of alternatives \"adopted in practice\" is thin — sectarian communities, Owenite fragments, the \"exceptional and very limited cases\" just acknowledged — so the theoretical space must do nearly all the comparative work. And it can do that work only because of the hinge two sentences back: untried institutions are evaluable only if their consequences are lawlike and therefore predictable. Theory substitutes for experiment. The comparative chapters that follow — communism, peasant proprietorship, the probable future of the labouring classes — are this sentence carried out, and their claim to be science rather than wishful thinking stands or falls with c19's hinge.", "target": "passage", "start": 1071, "end": 1137, "quote": "which have been adopted in practice, or may be conceived in theory", "see_also": ["c19"], "n": 42, "id": "c42"}, {"author": "Kimi K3", "layer": 2, "text": "The load has an official address. Mill had already named the science that would explain how a ruling portion's \"opinions and feelings\" are formed and altered: ethology, the science of national and individual character, announced with some fanfare in Book VI of the Logic — and then never written. So \"not the causes, but the consequences\" is partly a promissory note: the causal account of why distribution rules are what they are is deferred to a book that does not exist, and Book II's equilibrium method (rules as parameters, effects as laws) is what political economy can manage in the meantime. The remand is honest, but it means the most politically urgent question the paragraph raises — how the ruling portion's feelings could come to change — is handed to an empty chair.", "target": "c21", "quote": "the slow spread of instructed opinion", "see_also": ["c19"], "n": 43, "id": "c43"}, {"author": "GPT-6.1 Terra", "layer": 3, "text": "A qualification: the classical interdict protected possession that was not acquired by force, stealth, or permission *from the opponent* (nec vi, nec clam, nec precario). It did not adjudicate ownership, but it could inquire into how these two parties stood in relation to the possession. The rule was not simply a freeze on whoever held the land at the moment.", "target": "c37", "quote": "the interdict uti possidetis protects whoever holds the thing now, without any inquiry into title at all", "see_also": ["c2", "c20"], "n": 44, "id": "c44"}, {"author": "Claude Opus 5.5", "layer": 3, "text": "Mill's next sentence, which the abridgement cuts here, supports this reading. As I remember the full text, the peace \"was thus attained; while by confirming, to those who already possessed it, even what was not the fruit of personal exertion, a guarantee was incidentally given to them and others that they would be protected in what was so.\" \"Incidentally\" is the key word. The utility that later justifies property, security for the fruits of labour, arrives as a by-product of the peacekeeping utility. So the origin did involve a utility, just not the one that ends up justifying property. It also answers c32's question about the uncut chapter. The concession there is milder than \"ratifies yesterday's conquest.\" It says possession was protected whether or not it was earned. The stronger claim, that modern European property began in \"conquest and violence,\" comes a little later in the chapter. Mill uses it to argue against treating the existing distribution as a pattern for property as it might be.", "target": "c23", "see_also": ["c10", "c32", "c20"], "n": 45, "id": "c45"}, {"author": "Gemini 4 Argon", "layer": 3, "text": "Fair pushback on the genealogical temperament, though I'm not sure Mill's story is meant to do *nothing* at all. By stripping existing property arrangements of any aboriginal moral sanctity—showing them to be the frozen accidents of crude peacekeeping—he actively clears the brush for the radical Surgery he wants to perform later in Book II on inheritance, primogeniture, and landed rent. It doesn't debunk the abstract *concept* of property (which utility steps in to rescue for the fruits of labor), but it deliberately disenchants the *historical status quo*, especially in land, against conservatives who treat established title as sacred. In that sense, the genealogy is doing targeted demolition work: it knocks out the historical pillar so that whatever cannot survive the test of present utility has nothing else holding it up.", "target": "c36", "quote": "Their genealogies are meant to debunk; Mill's is meant to do nothing at all. He tells the story precisely because it makes no justificatory difference either way — origin cannot strengthen property's claim (so no natural right) and cannot weaken it (so no Proudhon).", "see_also": ["c40", "c32"], "n": 46, "id": "c46"}, {"author": "Gemini 4 Argon", "layer": 3, "text": "The India House context is even more acute when we remember *what* the East India Company was spending its administrative energy doing: establishing courts and revenue settlements (like the Permanent Settlement in Bengal or the *ryotwari* systems) that had to decide which customary claims counted as \"possession\" and \"property\" in order to keep the peace and collect tax. Mill's image of a tribunal stepping into a \"rude\" society, declining to investigate complex pre-existing rights, and simply freezing whoever seems to be in possession to stop quarrels isn't just Scottish conjectural history—it is an uncannily exact projection of colonial revenue administration onto the dawn of time.", "target": "c41", "quote": "And Mill writes this from India House, where he spent thirty-five years administering correspondence about precisely such \"analogous states\": the genealogy of first occupancy narrated from the administrative center of an ongoing second occupancy.", "see_also": ["c25", "c40"], "n": 47, "id": "c47"}, {"author": "Kimi K3", "layer": 3, "text": "Who decides which features are secondary? Not economics — the line between the institution and its accidents is drawn by the same \"opinions and feelings of the ruling portion\" that make the rules themselves; essence here is just custom that has hardened. And Book II exploits the distinction ruthlessly: primogeniture, entail, inheritance of land, the landlord's rent — to the families living under them, the very substance of the institution — will all be classed as secondary and put up for revision, while the word \"property\" is retained. Mill can call the institution fundamental because he has quietly reserved the right to redefine what it contains. Not quite a shell game, but close: it is how a reformer keeps continuity of reference while changing nearly everything referred to.\n(see also: c14, c22)", "target": "passage", "start": 1348, "end": 1417, "quote": "though in its secondary features it has varied, and is liable to vary", "n": 48, "id": "c48"}, {"author": "Kimi K3", "layer": 3, "text": "Two tells in one sentence. \"Of course\" locates the audience: readers for whom individual property is the default setting of the world — the propertied English reader, two paragraphs after being told distribution \"might be still more different, if mankind so chose.\" Mill starts where his reader is, not where his argument is. And note the word is \"individual,\" not \"private\": he needs the term that has an antonym. \"Individual property\" already implies common or joint property as its coordinate alternative, so the comparison that will occupy the rest of the chapter is embedded in the vocabulary before any institution has been examined. \"Private\" would smuggle in exclusion as definitional; \"individual\" leaves the rule of holding open.\n(see also: c22, c38)", "target": "passage", "start": 1419, "end": 1477, "quote": "I mean, of course, the institution of individual property.", "n": 49, "id": "c49"}, {"author": "Kimi K3", "layer": 3, "text": "Fair pressure, and it thins the origin/justification split (c17) more than Mill advertises. If terminating quarrels is useful — and a peace that freezes possession is the cheapest peace on offer — then the origin is not utility-free; it is free only of the *specific* utilities later pleaded for maintenance (securing produce to the producer, rewarding abstinence). Property's cradle is the utilitarianism of the exhausted. The consequence Mill doesn't state here: the two utilities can diverge. The peacekeeping rule rewards whoever happens to hold; the incentive rule wants holding to track producing. Where they come apart — land, per c40 — Mill's mature doctrine (rent as the unearned increment, inheritance as revisable) is precisely the tribunal's old criterion losing to §2's. The genealogy doesn't merely fail to justify; it installs a rival standard that will eventually be overruled.\n(see also: c17, c20, c40)", "target": "c23", "quote": "Is peacekeeping not itself a utility?", "n": 50, "id": "c50"}, {"author": "Kimi K3", "layer": 3, "text": "The only nature-word in the whole genealogy, planted exactly where convention is doing the work. Given the tribunal's aim, the inference to possession really is costless: the aggressor is identifiable because possession is the public, visible, administrable fact — c37's Humean point. But the word also performs, in miniature, the slide the paragraph exists to expose: what begins as the obvious administrative shortcut will congeal, in later mouths, into \"natural right.\" Mill writes \"naturally enough\" with the deadpan of someone who knows half his readers will hear it as \"rightly enough.\"\n(see also: c37, c17)", "target": "passage", "start": 1931, "end": 1947, "quote": "naturally enough", "n": 51, "id": "c51"}, {"author": "Kimi K3", "layer": 3, "text": "Easy to read past: not just *to whom*, but *on what terms*. Shares are one dimension of distribution; terms are another — tenure, lease, entail, inheritance, revocability. The phrase quietly claims for \"mankind\" a design-space much larger than reallocating a stock: the whole law of holding is up for revision. And it is the dimension Book II actually works in. Its real comparisons — peasant proprietor versus cottier, métayage versus the English farm system — are differences of terms: the same land, the same laborer, different conditions of holding. The pie-slicing picture invited by \"the things once there\" is already obsolete three sentences later.\n(see also: c18, c40)", "target": "passage", "start": 397, "end": 414, "quote": "on whatever terms", "n": 52, "id": "c52"}, {"author": "DeepSeek v4.1", "layer": 3, "text": "The primary/secondary line gets less attention than the production/distribution line, and it is where the chapter is actually fought. Everything Mill will license as reform — bequest, inheritance, primogeniture, entail, the terms of land tenure — is filed as a \"secondary feature\" of an institution he simultaneously calls \"primary and fundamental.\" Nothing in the sentence settles what goes in which column. That bequest is an incident of property and yet revisable is a stipulation, not a finding — and a load-bearing one, since it lets him hold both that individual property is presumptively right and that a great deal of actual property, land above all, is defective. It also dissolves the clash Opus flags in c25: \"always\" and \"very different in different ages and countries\" are claims at different levels — the form is uniform, the incidents vary. Accept the split and the passage is consistent; the price is that the most contentious question in the chapter is answered by a classification rather than an argument.\n(see also: c25, c22, c39, c14)", "target": "passage", "start": 1228, "end": 1418, "quote": "on which, unless in some exceptional and very limited cases, the economical arrangements of society have always rested, though in its secondary features it has varied, and is liable to vary.", "n": 53, "id": "c53"}, {"author": "DeepSeek v4.1", "layer": 3, "text": "Agreed on the deferral, but the chair is less empty than that. Much of the causal account Mill owes is written, just not under the name of a science: the moral causes bearing on wages and the standard of life, the chapters on the condition and the \"probable futurity\" of the labouring classes, the treatment of peasant proprietorship and cottier tenure as evidence that opinions and feelings about industry vary with the tenure. Book II's comparative sections do the same work in miniature — change the property arrangement, change the character, change what rules then become acceptable. So ethology is less unwritten than dissolved into applied economics; what's missing is the systematic treatise, not the argument. Which is a weaker defence of Mill than it sounds: it means the politically urgent question is settled by scattered historical impression rather than by the science he promised would settle it.\n(see also: c19, c38)", "target": "c43", "quote": "handed to an empty chair", "n": 54, "id": "c54"}, {"author": "DeepSeek v4.1", "layer": 3, "text": "Three words of rhetoric the genealogy leans on. \"Naturally enough\" sits between the explanatory and the approving: given the object in view, this is what anyone would have done — which turns the cheapest available expedient into the obvious one. It completes a small naturalizing series: tribunals \"always\" precede laws, they \"naturally enough\" ratify possession, and possession thereby becomes the mark of the aggressor. The historical claim is deflationary — rights begin as side effects of keeping the peace — but the adverb leaves the resulting institution looking like the sort of thing that would have arisen anyway. Add \"always rested\" two sentences earlier and you can see how a thoroughgoing conventionalist about distribution keeps the institution he is about to examine from looking merely conventional.\n(see also: c22, c2, c40)", "target": "passage", "start": 1926, "end": 1984, "quote": "they naturally enough gave legal effect to first occupancy", "n": 55, "id": "c55"}, {"author": "Grok 4.7", "layer": 3, "text": "\"Individually or collectively\" is not emphasis. A bequest and a tax are the same kind of act in this sentence: someone placing things at another's disposal, on terms. Nothing marks individual disposition as the undesigned baseline and collective disposition as the interference. That anti-naturalizing move has to be in place before private property can appear as one arrangement among others rather than as the fact from which distribution departs. \"On whatever terms\" widens the grant from who receives the stock to the conditions of the placing — sale, gift, allotment, succession — which is the license Mill later uses when inheritance and the terms of landholding turn out to be revisable without his abandoning the institution.", "target": "passage", "start": 260, "end": 415, "quote": "mankind, individually or collectively, can do with them as they like. They can place them at the disposal of whomsoever they please, and on whatever terms.", "n": 56, "id": "c56"}, {"author": "Grok 4.7", "layer": 3, "text": "The bridge is real in Mill's politics and thinner than this makes it. He did want suffrage and schooling to widen the ruling portion toward the community — but he refused the simple identification. Plural voting and an educational qualification exist so that an enfranchised majority does not become merely a new ruling portion, new feelings, same power to write them into the rules. Widening who rules restates the sentence at a larger scale; it does not answer it. The missing piece is still how the feelings change, which this paragraph has already set aside.", "target": "c31", "quote": "if the franchise and education expand until the ruling portion becomes more or less coextensive with the community, then for the first time \"mankind\" actually *can* choose as a deliberative subject", "see_also": ["c13", "c21", "c43"], "n": 57, "id": "c57"}, {"author": "Grok 4.7", "layer": 3, "text": "The site of writing is worth keeping, but it shouldn't decide what the analogy is for. \"Analogous states\" are cited to strip property of a noble origin, not to ratify a civilized one — deflation, not title-search. What the India House vantage does explain is the breeziness of \"Enough is known\": the evidence treated as already filed, the destination (first occupancy as peacekeeping) fixed before the cases are opened. Conjectural history with the correspondence in the next room. Whether those files recorded possession or recorded its extinguishing is a question this sentence has no apparatus to ask.", "target": "c41", "quote": "the genealogy of first occupancy narrated from the administrative center of an ongoing second occupancy", "see_also": ["c25"], "n": 58, "id": "c58"}, {"author": "Claude Opus 5.5", "layer": 4, "text": "The levels split does settle \"always rested\" against \"very different,\" and I accept that. My point in c25 was a different one, though. The stadial method treats today's \"rude\" societies as Europe's past, so it assumes everyone started from the same place. That makes variety a matter of where a society ended up, never where it began. Your classification has the same shape: one primary form, with all the variation pushed into the incidents. Together they make the institution's uniformity look like something established by method before any evidence comes in. In that sense they're one move, not two.", "target": "c53", "see_also": ["c25", "c41"], "n": 59, "id": "c59"}, {"author": "GPT-6.1 Terra", "layer": 4, "text": "“First” changes its reference here. The first to occupy a resource need not be the person in possession when a particular quarrel begins; nor is the first visible use of force necessarily the first wrongful act. Mill’s procedure protects a baseline in the current dispute, but does not by itself establish who occupied first.", "target": "passage", "start": 1926, "end": 2054, "quote": "they naturally enough gave legal effect to first occupancy, by treating as the aggressor the person who first commenced violence", "see_also": ["c2", "c55", "c44"], "n": 60, "id": "c60"}, {"author": "Gemini 4 Argon", "layer": 4, "text": "Adding to c49's catch: notice the immediate vocabulary shift across the paragraph break—\"individual property\" at the end of the second paragraph becomes \"Private property\" at the start of the third. They are not quite synonyms in Mill's toolkit. \"Individual property\" is the abstract analytical category he intends to defend (an individual's claim to the fruits of their own exertion, set against communal ownership). \"Private property\" is the historical, messy, actually existing institution—born in brute occupancy and peacekeeping—that bundles together the justifiable core with all the \"secondary features\" (land monopoly, feudal incidents, unlimited inheritance) he is preparing to strip away.", "target": "passage", "start": 1419, "end": 1636, "quote": "I mean, of course, the institution of individual property.\n\nPrivate property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established.", "see_also": ["c49", "c48", "c53"], "n": 61, "id": "c61"}, {"author": "Gemini 4 Argon", "layer": 4, "text": "Thank you for supplying the exact text from the unabridged chapter—that missing sentence is the linchpin of the whole argument. \"Even what was not the fruit of personal exertion\" is where the two utilities (c23, c50) part company: the tribunal's peace-utility protects *all* possession indiscriminately to stop the fighting, while the economist's incentive-utility only arise *incidentally* for the subset of possession that happens to be the fruit of labor. The entire radical program of Book II consists in going back over the historical bundle that the tribunal froze and paring away everything that was *not* the fruit of personal exertion—above all, unimproved land and inherited fortunes—now that we no longer need a crude blanket freeze just to keep the peace.", "target": "c45", "quote": "The utility that later justifies property, security for the fruits of labour, arrives as a by-product of the peacekeeping utility.", "see_also": ["c40", "c46"], "n": 62, "id": "c62"}, {"author": "Hermes 4", "layer": 4, "text": "Mill's distinction between property's origin and its justification creates conceptual space for reform. By acknowledging that existing property arrangements emerged from historical contingencies rather than rational design, he undermines conservative arguments that treat the status quo as sacrosanct. This separation allows him to evaluate property systems based on their current utility rather than their historical legitimacy, enabling progressive critiques while avoiding revolutionary implications. The genealogical approach serves as a tool for disentangling what is from what ought to be.", "target": "passage", "start": 1479, "end": 1636, "quote": "Private property, as an institution, did not owe its origin to any of those considerations of utility which plead for the maintenance of it when established.", "n": 63, "id": "c63"}, {"author": "Hermes 4", "layer": 4, "text": "While DeepSeek correctly notes that Mill's genealogy doesn't inherently justify or condemn property, the historical account still performs important rhetorical work. By exposing property's arbitrary origins, Mill subtly undermines natural rights arguments while creating space for utilitarian reform. The genealogy serves as a solvent that dissolves historical claims to legitimacy, allowing Mill to re-ground property rights in present utility rather than past precedent. This isn't \"nothing\" - it's a strategic clearing of the ideological ground.", "target": "c36", "quote": "Mill's is meant to do nothing at all. He tells the story precisely because it makes no justificatory difference either way — origin cannot strengthen property's claim (so no natural right) and cannot weaken it (so no Proudhon).", "n": 64, "id": "c64"}, {"author": "Hermes 4", "layer": 4, "text": "The colonial context is indeed crucial. Mill's position at India House provides an unspoken subtext to his discussion of \"rude ages\" and property origins. His administrative experience with land revenue systems and customary tenure arrangements directly informs his understanding of how tribunals operate to establish possession. The tension between his theoretical framework and colonial practice is palpable - he's describing processes of dispossession and re-occupation that were actively occurring under British rule even as he writes.", "target": "c47", "quote": "And Mill writes this from India House, where he spent thirty-five years administering correspondence about precisely such", "n": 65, "id": "c65"}, {"author": "Hermes 4", "layer": 4, "text": "This insight beautifully captures the internal tension in Mill's argument. The peacekeeping origin of property creates a default presumption in favor of current possessors, while the utilitarian justification pushes toward rewarding productive use. For most goods, these align reasonably well. But for land - fixed, finite, and often monopolized - the divergence becomes untenable. Mill's later proposals to tax unearned increment and reform inheritance represent the triumph of utilitarian criteria over the tribunal's crude peacekeeping logic.", "target": "c50", "quote": "The peacekeeping rule rewards whoever happens to hold; the incentive rule wants holding to track producing. Where they come apart — land, per c40 — Mill's mature doctrine (rent as the unearned increment, inheritance as revisable) is precisely the tribunal's old criterion losing to §2's.", "n": 66, "id": "c66"}, {"author": "Hermes 4", "layer": 4, "text": "The phrase \"naturally enough\" does subtle ideological work here. While Mill intends it descriptively (as the most administratively efficient solution), it carries normative undertones that risk naturalizing the status quo. This linguistic choice reveals how easily historical contingencies can be mistaken for natural necessities - precisely the ideological move Mill otherwise cautions against. The adverb smuggles in a hint of inevitability that somewhat undermines his conventionalist stance.", "target": "c55", "quote": "they naturally enough gave legal effect to first occupancy", "n": 67, "id": "c67"}, {"author": "Kimi K3", "layer": 4, "text": "The symmetry lasts one paragraph. By the next, attention is \"first claimed\" by \"that primary and fundamental institution,\" and the collective disposition that here stands on the same grammatical footing as bequest and tax is demoted to \"exceptional and very limited cases.\" Nothing in paragraph 1 authorizes the sequencing of paragraph 2 — Mill bridges them with the historical record (\"always rested\"), not with the analysis just performed. So the burden of proof is allocated before any institution has been examined: collective arrangements will be considered for adoption, individual property considered for reform. Paragraph 1's anti-naturalizing grammar survives, but only as a fairness constraint on how alternatives are argued (c38's \"at its best\"), not as a challenge to which arrangement gets to be the default.", "target": "c56", "quote": "Nothing marks individual disposition as the undesigned baseline and collective disposition as the interference.", "see_also": ["c22", "c49", "c38"], "n": 68, "id": "c68"}, {"author": "Kimi K3", "layer": 4, "text": "Conceded — the amendment is right, and sharper than my empty chair. But notice where each half of the causal loop ends up living. Institution → character stays inside the Principles: tenure forms industrious habits (peasant proprietorship), improved character makes cooperation viable (the futurity chapter). Character → rules — what changes a ruling portion's *feelings* about bequest, primogeniture, rent — migrates out to the political writings: discussion, education, the suffrage debates c31 and c57 are circling. Ethology was to be the science joining the two directions; what exists instead is two one-way arguments in different books. The missing joint — how men whose feelings were formed under the old rules come to legislate new ones — is exactly where \"might be still more different, if mankind so chose\" is doing unaided work. Grok's \"missing piece\" and your scattered historical impressions meet at that joint.", "target": "c54", "quote": "dissolved into applied economics", "see_also": ["c43", "c21", "c57"], "n": 69, "id": "c69"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Note the evidentiary asymmetry. That production's laws are non-optional is asserted flatly and supported by nothing at all; that distributive rules vary is offered with evidence (\"very different in different ages and countries\"). The word \"physical\" is what buys the exemption — a claim about nature is expected to need no citation, a claim about custom is not. Mill's readers would grant the first without argument and would have to be shown the second. Whether the first deserves that credit is exactly what c34 disputes; this sentence is where the credit is drawn on.", "target": "passage", "start": 97, "end": 144, "quote": "There is nothing optional or arbitrary in them.", "see_also": ["c34", "c3", "c12"], "n": 70, "id": "c70"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "A prior question, settled pages earlier. Wealth is defined in the Preliminary Remarks by exchangeable value — useful or agreeable things that can be bought and sold. Exchangeable value is not a physical property of a thing; it presupposes persons with enforceable claims against one another, i.e. a rule of holding. Appropriability is the premise of exchangeability, and appropriability is the institution. So the subject of the first sentence is already constituted by a property rule before any sentence about distribution arrives: the \"physical truths\" of production are truths about producing what a legal order has already marked off as ownable. The partition leaks from the other end too — one of its two terms is defined in the vocabulary of the other.", "target": "passage", "start": 27, "end": 51, "quote": "the Production of Wealth", "see_also": ["c34", "c19"], "n": 71, "id": "c71"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "A note on the object we have all been annotating. The paragraph stops here because Laughlin's abridgement stops it here, and the sentence Opus recalls in c45 is exactly where the full text continues: the guarantee \"incidentally\" given to possessors of what was not the fruit of their own exertion. Cut at this point, the genealogy reads as cool philosophical deflation — origin severed from justification, nothing resting on it. Restored, it is the setup for the land argument: existing holdings are protected whether or not they were earned, so they cannot be cited as evidence that property rewards exertion. \"Incidentally\" is the hinge word the abridgement removes. Worth noticing that the text reaching us, like distribution, is a matter of institution — someone chose which parts of Mill's produce go to which readers.", "target": "passage", "start": 1986, "end": 2117, "quote": "by treating as the aggressor the person who first commenced violence, by turning, or attempting to turn, another out of possession.", "see_also": ["c45", "c41", "c25"], "n": 72, "id": "c72"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "The qualification is right, and it sharpens rather than softens the point. Force, stealth and precarium are all easily ascertainable events, and precarium is the only one of the three requiring any look behind the present state of things — a documented courtesy between these two parties. So the interdict inquires into the manner of acquisition, within recent memory of the dispute, and never into title. That is the same economy as Mill's tribunal: enough fact to name an aggressor, no more. The three exclusions are themselves criteria of visibility, which is why they can be administered without a theory of desert.", "target": "c44", "see_also": ["c37", "c2"], "n": 73, "id": "c73"}, {"author": "Grok 4.7", "layer": 4, "text": "The second \"by\" does not pick the aggressor out of a class of people already known to be violent. It defines the violence. To commence violence, in this sentence, just is to turn — or to attempt to turn — another out of possession. There is no independent test of who started the quarrel, and \"attempting\" means the category attaches before the ejection succeeds. A bid to change who holds, once it takes that form, is already the wrong. That is what lets \"naturally enough\" sound like an inference rather than a choice: once aggression has been named as the disturbance of holding, every alternative rule would be a rule that sided with the aggressor. The conclusion was sitting in the definition.", "target": "passage", "start": 1986, "end": 2117, "quote": "by treating as the aggressor the person who first commenced violence, by turning, or attempting to turn, another out of possession.", "see_also": ["c2", "c51", "c55"], "n": 74, "id": "c74"}, {"author": "Grok 4.7", "layer": 4, "text": "The genealogy that follows does not settle the columns either, and the silence is the license. What the tribunals are said to have done is only to stop a present quarrel by protecting a present holder. Nothing in that act reaches bequest, entail, rent, or how a holding is acquired without violence. So \"fundamental\" names a possessory freeze; \"individual property,\" the institution actually under examination, is a much thicker set of powers. The classification does not override a finding about which incidents are essential. There was no such finding. The origin story is too thin to have produced the institution whose secondary features Mill then offers to revise — which is why the revision can look continuous with the institution, and also why, as with land, a rule adequate to a fight over a deer is being asked to count as the same thing when the question is who owns the valley.", "target": "c53", "quote": "Nothing in the sentence settles what goes in which column.", "see_also": ["c14", "c22", "c40", "c50"], "n": 75, "id": "c75"}], "log": [{"layer": 1, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "usage": {"prompt_tokens": 2013, "completion_tokens": 292, "cost": 0.003473, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 1, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 3, "usage": {"prompt_tokens": 806, "completion_tokens": 285, "total_tokens": 1091, "cost": 0.001661, "is_byok": 0}}, {"layer": 1, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 2367, "completion_tokens": 460, "total_tokens": 2827, "cost": 0.009334}, "closing": "I have nothing further to add this round."}, {"layer": 1, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 3, "usage": {"prompt_tokens": 4260, "completion_tokens": 1339, "cost": 0.04382, "cost_estimated": true}, "closing": "I left three comments on the passage this round:\n\n- **c9, on the last sentence of the first paragraph:** Mill gives with one hand and takes with the other. Distribution is purely a human choice, but once a rule is chosen its consequences are as fixed as physics. That's how he keeps economics a science. I doubt the split holds, though, because a rule's effects can change the opinions that produced the rule.\n- **c10, on property's origin and its justification:** He separates the two, and that cuts both ways. Defenders can't say property was founded on usefulness. Critics can't say its rough beginnings make it illegitimate now. What's left is a case that rests on present usefulness, which leaves property open to revision.\n- **c11, on \"tribunals (which always precede laws)\":** If courts came first, the earliest rights were side effects of punishing whoever started a fight. That matches Maine's *Ancient Law* and how common law grows from rulings. But \"always\" claims more than evidence from \"rude ages\" can support."}, {"layer": 1, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 4899, "completion_tokens": 542, "total_tokens": 6127, "num_sources_used": 0, "cost": 0.012366}, "closing": "Nothing further from me this round."}, {"layer": 1, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 5092, "completion_tokens": 3083, "total_tokens": 8175, "cost": 0.056016268}, "closing": "Three comments left: one on the production/distribution dichotomy and its internal tension (c15), one on \"ruling portion\" versus Mill's voluntarism (c16), and one on the origin/justification split with the Humean origin story (c17). Nothing further this round."}, {"layer": 1, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 5, "usage": {"prompt_tokens": 6549, "completion_tokens": 4263, "total_tokens": 10812, "cost": 0.0025779360000000003}, "closing": "Five comments placed — on the \"once there\" assumption and the retraction that follows it; on the causes/consequences hinge and its porousness; on the deflationary genealogy of occupancy; on the accidentally radical \"ruling portion\"; and on the hedge that licenses communism. Nothing further this round."}, {"layer": 2, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 1, "usage": {"prompt_tokens": 8560, "completion_tokens": 171, "cost": 0.009415, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 2, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "usage": {"prompt_tokens": 4162, "completion_tokens": 550, "total_tokens": 4712, "cost": 0.0055688, "is_byok": 0}}, {"layer": 2, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 2, "usage": {"prompt_tokens": 14312, "completion_tokens": 1366, "cost": 0.084568, "cost_estimated": true}, "closing": "I added two comments this round, and that's all from me.\n\n- **c24, on DeepSeek's c20:** a sourcing correction. The phrase \"secreted in the interstices of procedure\" comes from Maine's *Dissertations on Early Law and Custom* (1883), not from *Ancient Law* (1861). That puts it about 35 years after Mill's first edition rather than a decade. The comparison with Maine still works, but *Ancient Law* is the closer text.\n- **c25, on \"rude ages… analogous states of society in our own time\":** no one had commented on Mill's method here. He treats present-day non-European societies as evidence of Europe's past, assuming every society passes through the same stages. That assumption is what supports the \"always\" in \"tribunals (which always precede laws).\" It also sits awkwardly with the opening paragraph, where Mill stresses how different distribution rules are across ages and countries."}, {"layer": 2, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 9270, "completion_tokens": 590, "total_tokens": 9860, "cost": 0.02444}, "closing": "I have nothing further to add this round."}, {"layer": 2, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 5, "usage": {"completion_tokens": 5584, "prompt_tokens": 14532, "total_tokens": 20116, "cost": 0.003321336}, "closing": "Five notes this round: two on the passage (the production side of Mill's partition isn't physical either; the \"may be conceived in theory\" clause licenses the whole comparative method of Book II), and three on other readers — Hermes on immutability, Gemini on Nietzsche/Foucault, GPT on possession as the baseline for aggression. Nothing further to add."}, {"layer": 2, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 11431, "completion_tokens": 405, "total_tokens": 14161, "num_sources_used": 0, "cost": 0.029258}, "closing": "Nothing further this round."}, {"layer": 2, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 16784, "completion_tokens": 8065, "total_tokens": 24849, "cost": 0.132139648}, "closing": "Three comments this round: on the stadial/imperial evidence base of \"rude ages\" (c41), on \"conceived in theory\" as the license for Mill's comparative-utopian method (c42), and on ethology as the never-written science to which the causes of distribution rules are deferred (c43, replying to DeepSeek's c21). Nothing further to add this round."}, {"layer": 3, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 1, "usage": {"prompt_tokens": 15260, "completion_tokens": 266, "cost": 0.01659, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 3, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 1, "usage": {"prompt_tokens": 23998, "completion_tokens": 1201, "cost": 0.120012, "cost_estimated": true}, "closing": "I added one comment this round, c45, replying to c23. It brings in Mill's next sentence, which the abridgement leaves out. In it, the peacekeeping rule \"incidentally\" protects possessions, even ones people didn't earn. That backs Terra's point: the origin did involve a utility, peacekeeping, just not the one, security for what people earn, that later justifies property. I quoted the sentence from memory, so the wording should be checked against the full text.\n\nThe same comment qualifies part of c32. In the uncut text, the stronger \"conquest and violence\" claim comes a little later in the chapter, not in this sentence.\n\nI have nothing more to add this round."}, {"layer": 3, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 0, "usage": {"prompt_tokens": 7497, "completion_tokens": 752, "total_tokens": 8249, "cost": 0.009753, "is_byok": 0}, "closing": "{annotations: [\n    {\n        \"target\": \"c31\",\n        \"quote\": \"This slip between \\\"the ruling portion\\\" and \\\"mankind\\\" is where Mill's philosophy of history quietly enters to bridge the gap.\",\n        \"comment\": \"An excellent observation about Mill's underlying assumptions regarding historical progress. This evolutionary view of society - from narrow ruling classes to increasingly democratic governance - provides crucial context for understanding how he reconciles the tension between elite control and popular sovereignty. The shift from \\\"ruling portion\\\" to \\\"mankind\\\" isn't just rhetorical; it reflects Mill's genuine belief in the possibility of expanding the sphere of self-determination through political and educational reform.\"\n    },\n    {\n        \"target\": \"c34\",\n        \"quote\": \"Only
