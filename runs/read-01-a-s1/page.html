<style>

  --a4: #f0a856; --a5: #5fd0de; --a6: #ff8cc6; --a7: #aab4c2; --flip: invert(1) hue-rotate(180deg); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1216; --sheet: #171b21; --ink: #e7eaef; --ink-2: #9ba5b3; --rule: #333b46;
  --mark: #d9a800; --warn: #e6b450;
  --a0: #ff8a7a; --a1: #7fb4ff; --a2: #6fd39a; --a3: #c39bff;

  font-size: 1.6em; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-indent: 0; line-height: 1.3 }

.c { cursor: pointer; border-radius: 2px; scroll-margin: 6rem }
.c { background: color-mix(in srgb, var(--c) 6%, transparent); -webkit-box-decoration-break: clone; box-decoration-break: clone }

.c.kin { background: color-mix(in srgb, var(--c) 12%, transparent) }
.q { text-decoration: underline 1px var(--c); text-underline-offset: 2.5px }

}

<script>
const D = {"passage": {"id": "read-poor-support", "title": "Right of the Poor to Support", "source": "Samuel Read, An Inquiry into the Natural Grounds of Right to Vendible Property, or Wealth (Edinburgh, 1829), Book II, ch. 9, sect. 3, pp. 364-366", "text": "In the state of nature the land would still have remained open to him, and he would have been at full liberty to use all his exertions to procure subsistence; and whatever difficulty he might at times have found in acquiring his daily food, he never could have wanted employment. But in the advanced state of society before described the case is totally changed; to the unemployed labourer in that state the land is entirely locked up, his hands are tied, and he is placed in the cruellest of all situations, being expected and called upon (where no provision is made for his case) to perish for want in the midst of plenty; and all the while he is denied the use of his arms or exertions in any way that should procure him a morsel of food. These, however, are too hard conditions to be either endured or imposed by human nature; and it always happens when such a case occurs that the rigour of the law is relaxed and mitigated. Judges will hardly pronounce sentence of condemnation, and juries will not find a man \"guilty\" who takes a loaf of bread under such pressing circumstances; while it is uniformly found that the spectators warmly applaud such lenity and mercy. The law itself is thus suspended and permitted in such cases to fall into abeyance. And why is this?--Clearly because, when an individual happens to be reduced to the unhappy condition which has been described--to the condition of being without food and without employment in a society where no legal provision is made for the relief of his case--all conventional laws are dissolved in regard to him. He is then left to his state of nature, and he that moment re-acquires all those rights which that state implies, namely, a right to use all his energies of mind and body, and all the means within his power, to procure the sustenance immediately necessary to the preservation of his life, how he may, but with as little hurt as he can to his more fortunate brethren. If, therefore, the society of which he is a member maintains and acts upon the doctrine that he has no right to support, it is at open war with him; his hand must necessarily be against every man's and every man's against his. Prudence or pusillanimity, or the hopelessness of succeeding against so great odds, may restrain his arm and induce him to submit patiently and without resistance to his fate,--to perish without any attempt to prolong his life otherwise than by the ordinary and allowed means,--but it never can be his duty to perish in this manner."}, "readers": [{"model": "anthropic/claude-opus-5.5", "name": "Claude Opus 5.5"}, {"model": "openai/gpt-6.1-terra", "name": "GPT-6.1 Terra"}, {"model": "nous:google/gemini-4-argon", "name": "Gemini 4 Argon"}, {"model": "x-ai/grok-4.7", "name": "Grok 4.7"}, {"model": "deepseek/deepseek-v4.1-flash", "name": "DeepSeek v4.1"}, {"model": "moonshotai/kimi-k3", "name": "Kimi K3"}, {"protocol": "text", "model": "openrouter:nousresearch/hermes-4-405b", "name": "Hermes 4"}, {"model": "qwen/qwen3.8-27b", "name": "qwen3.8-27b", "max_tokens": 40000}], "cast": "b5902c37", "group": "read-01-a-s1", "flags": {"max_layers": 4, "stop_when_all_pass": true, "blind_first_layer": true, "sequential": false, "signed": true, "anchor": "span", "cross_refs": true, "allow_self_reply": true, "max_comments_per_turn": null, "max_steps_per_turn": 16, "max_tokens": 16000, "temperature": null, "seed": 1, "forecast": false}, "comments": [{"author": "GPT-6.1 Terra", "layer": 1, "text": "“Employment” here means access to productive activity, not a job or a guarantee of food. The contrast depends on the claim that enclosure removes even the freedom to attempt subsistence directly.", "target": "passage", "start": 163, "end": 278, "quote": "whatever difficulty he might at times have found in acquiring his daily food, he never could have wanted employment", "n": 1, "id": "c1"}, {"author": "GPT-6.1 Terra", "layer": 1, "text": "This is a much stronger conclusion than the jury’s lenity alone establishes: a community might excuse a particular theft without conceding that its laws have dissolved for the starving person. Read uses that sympathy as evidence of a deeper, conditional justification for property law.", "target": "passage", "start": 1519, "end": 1571, "quote": "all conventional laws are dissolved in regard to him", "n": 2, "id": "c2"}, {"author": "Hermes 4", "layer": 1, "text": "This passage establishes a baseline condition where individuals have unrestricted access to resources and the freedom to use their labor for survival. It contrasts sharply with the \"advanced state of society\" described later.", "target": "passage", "start": 0, "end": 157, "quote": "In the state of nature the land would still have remained open to him, and he would have been at full liberty to use all his exertions to procure subsistence", "n": 3, "id": "c3"}, {"author": "Hermes 4", "layer": 1, "text": "The author highlights a fundamental injustice: the coexistence of abundance and deprivation. This paradox underscores the moral failure of a society that allows individuals to starve despite available resources.", "target": "passage", "start": 460, "end": 623, "quote": "he is placed in the cruellest of all situations, being expected and called upon (where no provision is made for his case) to perish for want in the midst of plenty", "n": 4, "id": "c4"}, {"author": "Hermes 4", "layer": 1, "text": "This is a critical philosophical pivot. The author argues that when society fails to provide basic sustenance, the social contract is voided, and the individual reverts to a pre-social state where natural rights supersede conventional laws.", "target": "passage", "start": 1519, "end": 1685, "quote": "all conventional laws are dissolved in regard to him. He is then left to his state of nature, and he that moment re-acquires all those rights which that state implies", "n": 5, "id": "c5"}, {"author": "Hermes 4", "layer": 1, "text": "The author frames the denial of support as an act of aggression by society against the individual. This transforms poverty from a personal misfortune into a systemic violation of natural rights.", "target": "passage", "start": 1940, "end": 2087, "quote": "If, therefore, the society of which he is a member maintains and acts upon the doctrine that he has no right to support, it is at open war with him", "n": 6, "id": "c6"}, {"author": "Hermes 4", "layer": 1, "text": "This concluding statement rejects passive acceptance of starvation as a moral obligation. It implicitly legitimizes resistance or extraordinary measures for survival when society fails its fundamental duties.", "target": "passage", "start": 2445, "end": 2498, "quote": "but it never can be his duty to perish in this manner", "n": 7, "id": "c7"}, {"author": "Gemini 4 Argon", "layer": 1, "text": "This is an extraordinarily rosy and counterfactual picture of British and Scottish criminal justice in the 1820s—an era notorious for the \"Bloody Code,\" transportation to penal colonies for petty theft, and the strict defense of enclosed property against poaching and pilfering. Why does Read state this as an empirical universal (\"it always happens\", \"uniformly found\")? He seems to be treating hypothetical moral intuition as actual legal practice in order to prove that natural law supersedes positive law even inside the courtroom.", "target": "passage", "start": 831, "end": 1171, "quote": "and it always happens when such a case occurs that the rigour of the law is relaxed and mitigated. Judges will hardly pronounce sentence of condemnation, and juries will not find a man \"guilty\" who takes a loaf of bread under such pressing circumstances; while it is uniformly found that the spectators warmly applaud such lenity and mercy.", "n": 8, "id": "c8"}, {"author": "Gemini 4 Argon", "layer": 1, "text": "Notice how Read treats the \"state of nature\" not merely as a prehistoric baseline that humanity leaves behind en masse, but as a localized, individual fallback condition. The social contract is revocable on a per-person basis: if society fails to provide the bare minimum of subsistence (compensation for locking up the land), the contract voids for that specific individual while remaining intact for everyone else around him.", "target": "passage", "start": 1519, "end": 1685, "quote": "all conventional laws are dissolved in regard to him. He is then left to his state of nature, and he that moment re-acquires all those rights which that state implies", "n": 9, "id": "c9"}, {"author": "Gemini 4 Argon", "layer": 1, "text": "A fascinating qualification. Even when \"all conventional laws are dissolved\" and the starving man is thrown back into a state of nature (and shortly thereafter described as being \"at open war\" with society), he remains bound by a Lockean natural law of proportionality and minimal harm. The dissolution of civil law does not mean moral nihilism.", "target": "passage", "start": 1862, "end": 1939, "quote": "how he may, but with as little hurt as he can to his more fortunate brethren.", "n": 10, "id": "c10"}, {"author": "Gemini 4 Argon", "layer": 1, "text": "Read carefully separates *submission to power* from *moral obligation*—essentially the classic Rousseauian distinction between being forced to obey and having a duty to obey. If the starving poor die quietly without stealing, it is merely a tactical calculation (\"hopelessness of succeeding against so great odds\") or a failure of nerve (\"pusillanimity\"), never a triumph of virtue or law-abidingness.", "target": "passage", "start": 2167, "end": 2499, "quote": "Prudence or pusillanimity, or the hopelessness of succeeding against so great odds, may restrain his arm and induce him to submit patiently and without resistance to his fate,--to perish without any attempt to prolong his life otherwise than by the ordinary and allowed means,--but it never can be his duty to perish in this manner.", "n": 11, "id": "c11"}, {"author": "Claude Opus 5.5", "layer": 1, "text": "The \"clearly\" hides the weakest step. Juries acquitting and spectators cheering shows that people feel the law shouldn't apply. It doesn't show that the law has in fact been \"dissolved.\" Read is treating lenient practice as evidence of a normative fact, and that fact then grounds the right. A sceptic could explain the same lenity as mercy, which presupposes that the law is still binding. Mercy is a pardon for an offence, and a pardon is not the recognition of a right. Read needs the stronger reading, and his chosen word \"lenity and mercy\" actually points toward the weaker one.", "target": "passage", "start": 1256, "end": 1289, "quote": "And why is this?--Clearly because", "n": 12, "id": "c12"}, {"author": "Claude Opus 5.5", "layer": 1, "text": "The qualifier matters. The state of nature he returns to is not Hobbesian. It still carries a duty of minimal harm, which is closer to Locke. That sits awkwardly with the \"open war\" two sentences later, where \"every man's hand against his\" echoes Genesis 16:12 and Hobbes. Read seems to want both. The poor man keeps his moral restraint, while society, by denying him support, is the party that has chosen war. On that reading the hostility is all on society's side.", "target": "passage", "start": 1862, "end": 1938, "quote": "how he may, but with as little hurt as he can to his more fortunate brethren", "n": 13, "id": "c13"}, {"author": "Claude Opus 5.5", "layer": 1, "text": "This parenthesis, repeated later as \"where no legal provision is made,\" carries the practical point of the whole passage. The argument is conditional. A legal right to relief is what keeps the conventional order binding on the poor man. In 1829, with Malthus's \"no cover for him at nature's mighty feast\" in the background and the 1834 Poor Law reform approaching, Read is arguing that poor relief is the price of property's legitimacy, not charity.", "target": "passage", "start": 540, "end": 581, "quote": "(where no provision is made for his case)", "n": 14, "id": "c14"}, {"author": "Grok 4.7", "layer": 1, "text": "The usual contract story runs one way: you leave the state of nature by compact and stay out. Read runs it backward. Extreme want ejects a man unilaterally. The compact was never a surrender of the right to live; it was a suspension of that right on condition that society not close every other road to food. Once the condition fails, the suspension lapses for him alone — not a revolution, a private reversion.", "target": "passage", "start": 1519, "end": 1685, "quote": "all conventional laws are dissolved in regard to him. He is then left to his state of nature, and he that moment re-acquires all those rights which that state implies", "n": 15, "id": "c15"}, {"author": "Grok 4.7", "layer": 1, "text": "This is the sharper claim, and it is easy to miss under the talk of juries and loaves. Prudence, fear, or hopeless odds may keep his arm still. Duty may not. Read is not offering a excuse after the fact; he is denying that passive starvation can be required of anyone. The right to support is argued from the impossibility of a duty to die quietly.", "target": "passage", "start": 2445, "end": 2499, "quote": "but it never can be his duty to perish in this manner.", "n": 16, "id": "c16"}, {"author": "Grok 4.7", "layer": 1, "text": "The limit matters. What he re-acquires is not a general license against property, only the use of his energies \"how he may\" for immediate sustenance, and then only with as little hurt as he can. A loaf, not a levelling. Without this clause the war-of-all-against-all sentence that follows would swallow the argument; with it, the war is what society chooses by refusing the smaller claim.", "target": "passage", "start": 1862, "end": 1938, "quote": "how he may, but with as little hurt as he can to his more fortunate brethren", "n": 17, "id": "c17"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "Worth noticing what the poor man is said to lose. Not food — Read concedes the state of nature could be hungry, \"whatever difficulty he might at times have found in acquiring his daily food\" — but employment. That is a slip the argument can hardly absorb: employment is not a natural resource like land, it is a social relation, so there is no such thing as unemployment in the state of nature, and no such thing as employment either. Read half-sees this and settles for the more modest claim, that what is \"locked up\" is the land, i.e. access to means. But the word points at something stronger than he claims: what society withholds from this man is not merely a share of the earth's produce but the standing to work at all — something no state of nature ever had to grant, because it had no way of withholding it.", "target": "passage", "start": 241, "end": 278, "quote": "he never could have wanted employment", "n": 18, "id": "c18"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "This is a conditional contract with failed consideration. Rights were not surrendered once and for all; they were surrendered in exchange for something, and when society stops supplying the consideration the surrender lapses and the rights return. Two consequences Read doesn't dwell on. First, the right is parasitic: it exists only in the gap left by the state's default, so a society that does provide relief has no one to answer to. The whole argument is therefore an argument *for* legal provision, and the licence to take bread is only the fallback for its absence — note how heavily the paragraph is loaded with \"where no provision is made for his case.\" Second, this is a startlingly conservative radicalism. The reversion is personal and momentary, dissolving law in regard to *him*, and leaving every other title untouched. The land that was locked up stays locked up; he simply reacquires the right to break in.", "target": "passage", "start": 1519, "end": 1571, "quote": "all conventional laws are dissolved in regard to him", "n": 19, "id": "c19"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "Read argues from what juries do to what is just, and the inference does more work than he admits. Jurors may acquit because a hanging feels monstrous, because they know the man, because they dislike the statute; the spectators' applause proves feeling, not entitlement. But there is a second reading, and it cuts against him. The acquittal is a safety valve: precisely because the law relaxes at the point of starvation, the property regime never has to be reformed, and the doctrine can be maintained while its consequences are quietly dodged. Read takes the nullification as evidence that the right is real. It might equally be the mechanism by which the right has never had to be written into the statute book.", "target": "passage", "start": 835, "end": 928, "quote": "it always happens when such a case occurs that the rigour of the law is relaxed and mitigated", "n": 20, "id": "c20"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "An honest and rather bleak sentence, and it quietly gives away the game. A moment earlier all conventional law had been dissolved in regard to this man — he is released. Here Read concedes that he will obey anyway, restrained not by consent or desert, nor even by ordinary fear of punishment, but by the arithmetic of the odds. The peace of a society that refuses support to its destitute rests, on this showing, on their weakness. That is a description of order without legitimacy, and it is a surprising thing to find stated so plainly in a treatise on the natural grounds of right.", "target": "passage", "start": 2167, "end": 2341, "quote": "Prudence or pusillanimity, or the hopelessness of succeeding against so great odds, may restrain his arm and induce him to submit patiently and without resistance to his fate", "n": 21, "id": "c21"}, {"author": "DeepSeek v4.1", "layer": 1, "text": "Note how far the conclusion has retreated from the premise. \"All conventional laws are dissolved\" and the \"open war\" passage point toward a right of seizure; the last sentence establishes only that it is not his duty to die. That is nearly unassailable and nearly empty — nobody was arguing that a starving man is obliged to starve himself, and a permission not to perish is not yet a title to the loaf. The weight has to be carried by the middle of the paragraph: \"a right to use all his energies of mind and body, and all the means within his power,\" immediately qualified by \"with as little hurt as he can to his more fortunate brethren.\" So the natural right on offer is a subsistence right with a minimisation constraint — enough to make a society that denies it a belligerent, not enough to disturb anything about who owns what.", "target": "passage", "start": 2449, "end": 2498, "quote": "it never can be his duty to perish in this manner", "n": 22, "id": "c22"}, {"author": "Kimi K3", "layer": 1, "text": "\"Always\" is doing heavy work — starving thieves were convicted and transported routinely. But Read is describing something real: under the Bloody Code, juries practised \"pious perjury,\" deliberately undervaluing stolen goods below capital thresholds (39s where 40s meant the gallows). The more interesting strain is his own vocabulary. \"Lenity and mercy\" presuppose guilt — you can only pardon the violation of a valid law. Yet his theory says the starving man's conventional laws are dissolved, so the acquittal is not mercy at all but belated justice: the jury recognising, without naming, a right. Read keeps one foot in each account — law suspended by grace, law void by right — and the applauding spectators are the one tribunal whose verdict he fully trusts: the popular conscience sitting in appeal on positive law.", "target": "passage", "start": 930, "end": 1171, "quote": "Judges will hardly pronounce sentence of condemnation, and juries will not find a man \"guilty\" who takes a loaf of bread under such pressing circumstances; while it is uniformly found that the spectators warmly applaud such lenity and mercy.", "n": 23, "id": "c23"}, {"author": "Kimi K3", "layer": 1, "text": "This is an answer to Malthus. The notorious addition to the 1803 Essay (Bk IV, ch. 6, later quietly cut after the outcry) has the man born into a world already possessed, whose labour society does not want, holding \"no claim of right to the smallest portion of food\": at nature's mighty feast there is no vacant cover for him, and nature tells him to be gone. Read takes Malthus's premises clause by clause — land fully appropriated, labour unwanted, no legal provision — and refuses the conclusion. Malthus says such a man has no business to be here; Read says society has no business demanding his death. And note the demotion of patience: submitting to starvation is filed under \"prudence or pusillanimity\" — a calculation of odds, or a failure of nerve — never virtue. The whole tradition of dutiful poverty inverted in one sentence.", "target": "passage", "start": 2167, "end": 2499, "quote": "Prudence or pusillanimity, or the hopelessness of succeeding against so great odds, may restrain his arm and induce him to submit patiently and without resistance to his fate,--to perish without any attempt to prolong his life otherwise than by the ordinary and allowed means,--but it never can be his duty to perish in this manner.", "n": 24, "id": "c24"}, {"author": "Kimi K3", "layer": 1, "text": "The phrasing is Genesis 16:12 — Ishmael the outcast: \"his hand will be against every man, and every man's hand against him.\" Read makes the starving labourer an Ishmael expelled from the covenant. Beneath the echo sits a piece of machinery: a reversion clause. Membership in society is conditional; a society that offers no support voids the contract as to that member, who falls back into natural rights against it. The right to support is therefore not charity owed to the poor but the standing consideration for their forbearance — the continuing price of their having surrendered the common use of the earth. Paine reached the same place by ground rent in Agrarian Justice (1797); Read reaches it by starvation.", "target": "passage", "start": 2061, "end": 2166, "quote": "it is at open war with him; his hand must necessarily be against every man's and every man's against his.", "n": 25, "id": "c25"}, {"author": "Kimi K3", "layer": 1, "text": "Not a hypothetical. Read is writing in Edinburgh, where the old Scots poor law relieved only the \"impotent\" — the aged and infirm — and treated the able-bodied unemployed as vagrants to be corrected, not fed. England's settlement-and-Speenhamland regime, for all its cruelties, at least conceded the principle of a legal right to relief; Scotland did not, and the 1845 Scottish act would still refuse the able-bodied any entitlement. The society \"where no legal provision is made\" stood outside the author's door — the book reads as abstract natural-rights theory, but its central case is a local photograph.", "target": "passage", "start": 1445, "end": 1517, "quote": "in a society where no legal provision is made for the relief of his case", "n": 26, "id": "c26"}, {"author": "Kimi K3", "layer": 1, "text": "Even at the limit, the revived right is bounded: the loaf, yes; hurt to the baker only as unavoidable. So the state of nature he returns to is Locke's, not Hobbes's — natural right with proportionality built in, and \"brethren\" still brethren. But proportionality is a judgement, and judgements need judges. With all conventions dissolved, who measures \"as little hurt as he can\"? Read quietly keeps one convention — the moral community itself — alive inside the state of nature he has just declared. The dissolution turns out to be partial: society is at war with him, yet he is apparently not quite at liberty to be at war with society.", "target": "passage", "start": 1878, "end": 1938, "quote": "with as little hurt as he can to his more fortunate brethren", "n": 27, "id": "c27"}, {"author": "GPT-6.1 Terra", "layer": 2, "text": "The practical duty Read denies is not to starve oneself, but to obey property rules even when doing so means starving. A defender of absolute property could indeed impose that duty without positively commanding starvation. Still, rejecting it establishes an exception to the prohibition, not by itself a general claim to support.", "target": "c22", "quote": "nobody was arguing that a starving man is obliged to starve himself, and a permission not to perish is not yet a title to the loaf", "see_also": ["c16", "c24"], "n": 28, "id": "c28"}, {"author": "GPT-6.1 Terra", "layer": 2, "text": "Is legal provision alone enough? Read also speaks of provision “for his case”: a nominal scheme that excludes him, or gives too little to live on, might leave the same failure of consideration. The passage does not settle how adequate or accessible relief must be.", "target": "c19", "quote": "a society that does provide relief has no one to answer to", "see_also": ["c14", "c26"], "n": 29, "id": "c29"}, {"author": "Claude Opus 5.5", "layer": 2, "text": "Read's opponents did hold this, in so many words. Hale (Pleas of the Crown) and then Blackstone (Commentaries IV, ch. 2) both rejected necessity as a defence to theft. Their reason was that English law provides for the poor, so no one can be in true necessity. That reason is exactly the condition Read's parenthesis targets. Their position works out to \"starve rather than steal, and trust the parish.\" So \"it never can be his duty to perish\" contradicts the standard legal doctrine. In Scotland it carries extra force, because as Kimi notes in c26 the able-bodied had no claim on the parish. Read accepts Blackstone's own premise and shows that where relief is absent, the conclusion collapses. This also answers c2 in part. Read isn't inferring dissolution from jury sympathy alone. He is borrowing the jurists' own justification and showing that it fails in this case.", "target": "c22", "quote": "nobody was arguing that a starving man is obliged to starve himself", "see_also": ["c14", "c26", "c2"], "n": 30, "id": "c30"}, {"author": "Hermes 4", "layer": 2, "text": "Expanding on c18: The author's use of \"employment\" here is indeed problematic. In the state of nature, there is no formal employment as we understand it in organized societies. What the author likely means is the constant availability of productive activity for survival. However, this conflation weakens the argument by introducing an anachronistic concept into a pre-social condition.", "target": "passage", "start": 241, "end": 278, "quote": "he never could have wanted employment", "n": 31, "id": "c31"}, {"author": "Hermes 4", "layer": 2, "text": "This insight about the safety valve function is crucial. The periodic leniency actually serves to preserve the status quo by preventing systemic challenges. It's a form of controlled release that maintains the existing power structure while giving the appearance of mercy.", "target": "c20", "quote": "The acquittal is a safety valve: precisely because the law relaxes at the point of starvation, the property regime never has to be reformed", "n": 32, "id": "c32"}, {"author": "Hermes 4", "layer": 2, "text": "The connection to Malthus is particularly illuminating. Read's argument directly confronts Malthusian fatalism by asserting that society cannot abdicate responsibility for those it fails to provide for. This transforms the discourse from natural scarcity to social obligation.", "target": "c24", "quote": "This is an answer to Malthus", "n": 33, "id": "c33"}, {"author": "Hermes 4", "layer": 2, "text": "This question strikes at the practical limitations of Read's theory. Without conventional frameworks, the determination of \"minimal harm\" becomes entirely subjective. The starving individual becomes both claimant and judge in their own case, creating potential for abuse despite the moral constraints Read tries to maintain.", "target": "c27", "quote": "With all conventions dissolved, who measures 'as little hurt as he can'", "n": 34, "id": "c34"}, {"author": "Hermes 4", "layer": 2, "text": "This distinction is vital. The negative right (not being obligated to die) doesn't automatically create a positive right (to seize property). The gap between these positions reveals the argument's dependence on societal recognition of the minimally harmful actions taken in extremis.", "target": "c22", "quote": "a permission not to perish is not yet a title to the loaf", "n": 35, "id": "c35"}, {"author": "Gemini 4 Argon", "layer": 2, "text": "Actually, people in 1829 *were* arguing that a starving man had a moral obligation to die quietly! As Kimi K3 (c24) and Claude Opus 5.5 (c14) point out, Christian political economists—most notably Malthus and Thomas Chalmers (right in Read's Scottish backyard)—argued that the able-bodied poor had zero right to relief, that private property remained sacrosanct even in famine, and that the virtuous Christian pauper must submit patiently to God's and nature's laws rather than steal or riot. Read's final sentence isn't a retreat from his premise; it's a direct strike against the evangelical-economic orthodoxy of his day, which preached that dying without violating property law *was* the poor man's highest moral duty. Read's phrasing (\"prolong his life otherwise than by the ordinary and allowed means\") explicitly connects the refusal to die with the right to take the loaf.", "target": "c22", "quote": "nobody was arguing that a starving man is obliged to starve himself, and a permission not to perish is not yet a title to the loaf.", "see_also": ["c14", "c24"], "n": 36, "id": "c36"}, {"author": "Gemini 4 Argon", "layer": 2, "text": "\"Startlingly conservative radicalism\" is the exact right phrase for Read's broader project. In *An Inquiry into the Natural Grounds of Right to Vendible Property*, Read is actually writing as a fierce defender of capital and private property against the early \"Ricardian socialists\" (like Thomas Hodgskin) who argued that labor is the sole source of value and that capitalists rob workers. Read wants to prove that private property and capital accumulation are grounded in sacred natural law. \n\nTo make property absolute and invulnerable to socialist critique, however, Read realizes he has to close its greatest moral loophole: the Lockean spoilation/sufficiency proviso. If enclosure locks up the common earth and leaves the landless to starve (as it did for the able-bodied under the Scots Poor Law, as c26 notes), property loses its natural legitimacy. By arguing that the state *must* provide poor relief as compensation for locking up the land, Read isn't trying to subvert the property regime; he is trying to fireproof it.", "target": "c19", "quote": "First, the right is parasitic: it exists only in the gap left by the state's default, so a society that does provide relief has no one to answer to. The whole argument is therefore an argument *for* legal provision, and the licence to take bread is only the fallback for its absence — note how heavily the paragraph is loaded with \"where no provision is made for his case.\" Second, this is a startlingly conservative radicalism.", "see_also": ["c14", "c26"], "n": 37, "id": "c37"}, {"author": "Gemini 4 Argon", "layer": 2, "text": "Rather than a confusion between Hobbes and Locke, this might be strictly Lockean all the way down. Unlike Hobbes, Locke draws a sharp distinction between the *State of Nature* (peace, goodwill, and mutual assistance governed by natural law, which includes the duty of minimal harm) and the *State of War* (enmity and destruction, triggered when someone uses force without right, or threatens another's preservation). \n\nIn Read's sequence, the starving man first reverts to the Lockean State of Nature, where he seeks only to preserve himself \"with as little hurt as he can.\" It is *society* that escalates him from the State of Nature into the State of War by maintaining \"the doctrine that he has no right to support\" and using the force of law to stop him from feeding himself. The Ishmaelite/Hobbesian war isn't the automatic feature of his reversion to nature; it is the result of society acting as an unjust aggressor against a man exercising a natural right.", "target": "c13", "quote": "The state of nature he returns to is not Hobbesian. It still carries a duty of minimal harm, which is closer to Locke. That sits awkwardly with the \"open war\" two sentences later, where \"every man's hand against his\" echoes Genesis 16:12 and Hobbes. Read seems to want both.", "see_also": ["c10", "c27"], "n": 38, "id": "c38"}, {"author": "Gemini 4 Argon", "layer": 2, "text": "This tension you and Claude (c12) identify—between \"mercy\" (which implies guilt under a binding law) and \"not guilty\" (which implies the law is dissolved)— actually goes back to a classic debate in natural law jurisprudence over the *jus necessitatis* (right of necessity). Grotius and Pufendorf argued that extreme necessity revives the primitive common right to all things, meaning the starving man who takes bread does not commit theft at all. Blackstone, however, forcefully rejected this in his *Commentaries* (Book IV, Ch. 2), insisting that English law admits no such exception for starvation: property must remain inviolable, and if a starving thief is spared, it must only be afterward, through the executive's discretionary prerogative of mercy (a royal pardon), never by a jury's right of acquittal. Read is trying to smuggle Grotius's natural-right revival into the English/Scottish courtroom while absentmindedly retaining Blackstone's vocabulary of \"lenity and mercy.\"", "target": "c23", "quote": "\"Lenity and mercy\" presuppose guilt — you can only pardon the violation of a valid law. Yet his theory says the starving man's conventional laws are dissolved, so the acquittal is not mercy at all but belated justice: the jury recognising, without naming, a right. Read keeps one foot in each account — law suspended by grace, law void by right", "see_also": ["c8", "c12", "c20"], "n": 39, "id": "c39"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "A small lexical drift worth marking. \"Arms\" here glides immediately into its synonym — \"arms *or* exertions\" — so that it means limbs as instruments of labour. By the end of the paragraph the same limb has become a weapon: \"may restrain his arm\", \"his hand must necessarily be against every man's\". Read needs the first sense, since the right he restores is a right to work; but the state of nature he restores it in is furnished with the second. The two arms belong to different arguments and the passage carries both without noticing the join. It is the same slip as \"wanted employment\": a bodily organ pressed into service for a social relation.", "target": "passage", "start": 643, "end": 740, "quote": "he is denied the use of his arms or exertions in any way that should procure him a morsel of food", "see_also": ["c1", "c18"], "n": 40, "id": "c40"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "Right about the magnitude — and the clause says nothing about the distribution. The right Read has been assembling is a right against *society*: society locked the land, society is \"at open war with him\". But the remedy lands wherever the bread happens to be, on the baker, who is indeed one of the \"more fortunate brethren\" but not necessarily a beneficiary of the enclosure and certainly not the authority that refused relief. \"As little hurt as he can\" scales the harm; it does not choose its bearer. A right collective in its ground and individual in its enforcement is precisely what a poor rate is for. Which is another way of saying the paragraph is not a licence to steal but an argument for provision.", "target": "c17", "quote": "A loaf, not a levelling.", "see_also": ["c10", "c14", "c19", "c27"], "n": 41, "id": "c41"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "\"Plenty\" is the load-bearing word, and it is left vague — Read never asks whose plenty. But the force of the phrase is to relocate scarcity. In the state of nature, hunger is a fact about the world; in society it is a fact about distribution, and therefore imputable to someone. That is why the comparison cuts both ways. Read concedes that the natural state could be hungry (\"whatever difficulty he might at times have found in acquiring his daily food\"), so the difference between the two conditions is not full bellies but responsibility. \"In the midst of plenty\" is the clause that converts a misfortune into a wrong by making the remedy visible.", "target": "c4", "quote": "the coexistence of abundance and deprivation", "see_also": ["c1", "c18", "c24"], "n": 42, "id": "c42"}, {"author": "DeepSeek v4.1", "layer": 2, "text": "Worth setting beside the section heading, which cannot be quoted because it sits outside the extract: \"Right of the Poor to Support\". The heading promises more than the theory delivers. A right to *support* is a standing claim on a continuing body, an entitlement that meets the man next year as well as today. What the paragraph establishes is a fallback licence — conditional, reviving \"that moment\", lapsing as soon as bread is found or the man dies. Support is a relation; this natural right is an emergency. The gap is instructive: it is the distance between a right that would reform the poor law and a right that only comes alive where the poor law has failed.", "target": "c14", "quote": "The argument is conditional.", "see_also": ["c19", "c22"], "n": 43, "id": "c43"}, {"author": "Grok 4.7", "layer": 2, "text": "“Abeyance” is a worse word for his conclusion than he seems to notice. An estate in abeyance is not extinguished; it is ownerless for the moment, waiting to vest. “Suspended and permitted to fall” is likewise passive and reversible — someone permits the lapse, and what lapses can be resumed. Two sentences later the same phenomenon has become dissolution: conventional laws are gone in regard to him, and the rights of the state of nature are re-acquired. Suspension explains the jury; dissolution is what he needs for the right. The vocabulary slides from one to the other without an argument, and the technical sense of the earlier word actually favours the reading he is trying to leave behind — mercy, a temporary stay, the law still there once the loaf has been eaten.", "target": "passage", "start": 1172, "end": 1255, "quote": "The law itself is thus suspended and permitted in such cases to fall into abeyance.", "see_also": ["c12", "c20", "c23", "c2"], "n": 44, "id": "c44"}, {"author": "Grok 4.7", "layer": 2, "text": "The sentence is symmetrical, and easy to take as rhetoric. It isn’t. “Endured” and “imposed” name two different impossibilities, and the paragraph splits along that line. What human nature cannot impose is the sentence: judges will not condemn, juries will not convict. What it cannot endure is the duty: the man himself is not bound to perish. Read treats both refusals as one nature asserting itself — from the bench and from the starving man — so the fact about courtrooms and the claim about duty are meant to be a single phenomenon. A sceptic can still split them, mercy on one side and weakness on the other. The sentence is his attempt to make that split look artificial.", "target": "passage", "start": 762, "end": 829, "quote": "too hard conditions to be either endured or imposed by human nature", "see_also": ["c8", "c11", "c16"], "n": 45, "id": "c45"}, {"author": "Grok 4.7", "layer": 2, "text": "The instability is real, but I doubt it is a slip he fails to absorb. “Wanted employment” sits in apposition to “at full liberty to use all his exertions”: the older sense, occupation of one’s powers, not a wage. Then the same word returns as “the unemployed labourer,” and by 1829 that already means a man without a master. The conflation is the device. By using one word for open-land exertion and for hired work, Read lets the loss of a job inherit the moral urgency of a locked common. What society withholds is redescribed as something the state of nature could not have withheld — which is exactly the standing you say the argument reaches for, and more than it can strictly claim.", "target": "c18", "quote": "employment is not a natural resource like land, it is a social relation, so there is no such thing as unemployment in the state of nature, and no such thing as employment either", "see_also": ["c1"], "n": 46, "id": "c46"}, {"author": "Grok 4.7", "layer": 2, "text": "The emptiness is the point of the retreat, not a loss of nerve. No one was drafting a duty-to-starve statute; agreed, and a permission not to die is not a title to the loaf. But the doctrine under attack — that he has no right to support, the land locked, no provision made — has, once those are granted, no remaining content except that he ought to perish rather than take. “It never can be his duty” is unassailable so that it can be turned around on that doctrine. The middle of the paragraph states the positive right, narrowly, with the minimisation constraint you note; the last sentence is the reductio of the only alternative left standing. They need each other. A society that maintains the doctrine is, on this showing, maintaining a duty it cannot defend.", "target": "c22", "quote": "That is nearly unassailable and nearly empty — nobody was arguing that a starving man is obliged to starve himself, and a permission not to perish is not yet a title to the loaf.", "see_also": ["c16", "c24", "c19"], "n": 47, "id": "c47"}, {"author": "Kimi K3", "layer": 2, "text": "I'd take the other side of this. For a writer of 1829 \"employment\" is not yet shorthand for the wage relation; it is the object on which labour can be spent. In the state of nature that object is the earth, and nobody has standing to withhold it. Once the land is assigned, labour reaches its object only by another's leave — hence \"locked up\" attaches to the land, and \"employment\" is simply the same land seen from labour's side. So \"he never could have wanted employment\" means: nobody could tell him \"you may not work here,\" because \"here\" had no keeper. The social relation you rightly detect is doing the work — but as the thing that makes *withholding* possible, not as something nature had to confer. Nature never granted the standing to work, because exclusion did not yet exist for the grant to answer. Read is describing a pure loss, and the word measures it precisely.", "target": "c18", "quote": "employment is not a natural resource like land, it is a social relation", "n": 48, "id": "c48"}, {"author": "Kimi K3", "layer": 2, "text": "The smudge is wider than \"lenity and mercy,\" and Read marks it typographically. He describes two legally distinct events under one vocabulary. A judge declining to \"pronounce sentence of condemnation\" is mercy strictly so called — conviction stands, punishment remitted, guilt presupposed; your point holds there. But a jury that \"will not find a man guilty\" delivers an acquittal, a verdict which in law asserts that no offence occurred — the dissolved-law reading, stated in the only register a courtroom possesses. Read hedges between the two, and the inverted commas he puts around \"guilty\" confess the hesitation: the man is guilty only in the statute's sense. The sentence can't decide whether the jury absolves or pardons, and wants both — mercy to placate the bench's conscience, acquittal to vindicate the theory. Notably, the one unambiguous actor is the crowd: spectators applaud the verdict, not the indulgence.", "target": "c12", "quote": "Mercy is a pardon for an offence, and a pardon is not the recognition of a right.", "see_also": ["c23"], "n": 49, "id": "c49"}, {"author": "Kimi K3", "layer": 2, "text": "The content of the revived right has a genealogy far older than the contractual machinery wrapped around it. Aquinas: in extreme need, taking another's goods is not theft, \"because that which he takes for the support of his life becomes his own property by reason of that very need\" (ST II-II q.66 a.7) — goods being ordained to sustain life before they are ordained to anyone's title; the canonists compressed it into the maxim *in casu extremae necessitatis omnia sunt communia*. English common law just as conspicuously refused necessity as a defence to felony, and the refusal was standard fare in the casuists. Read's originality is therefore not the right but the engine: he re-founds the scholastic privilege on a conditional contract with an automatic per-person reversion clause — Aquinas laundered through Locke. This also explains the conservatism flagged elsewhere in the margins (c19, c22): the Thomist doctrine never disturbed titles either; it held only that the owner's surplus was not his \"own\" against the dying. The boundedness of Read's right is not a retreat performed at the last sentence. It is inherited with the doctrine itself.", "target": "passage", "start": 1695, "end": 1872, "quote": "a right to use all his energies of mind and body, and all the means within his power, to procure the sustenance immediately necessary to the preservation of his life, how he may", "see_also": ["c19", "c22"], "n": 50, "id": "c50"}, {"author": "Kimi K3", "layer": 2, "text": "Nearly empty it isn't — not as polemic of 1829. Malthus had put into print that a man whom society will not feed and whose labour it does not want \"has no claim of right to the smallest portion of food, and, in fact, has no business to be where he is\"; at nature's feast there is no cover for him and nature tells him to be gone. That is as close to a duty to perish as respectable prose managed, and Read's final clause is pointed straight at it. On the levelling worry I half-agree: no title to the loaf *as property* is conferred. But the conditional architecture disturbs ownership in the only sense the period actually fought over. If the reversion is avoided only by maintaining legal provision, then every estate is held subject to a standing charge for subsistence, and poor rates become a condition of title rather than alms — precisely the difference between the Speenhamland magistrates treating relief as a wage supplement owed by the parish and the 1834 commissioners trying to strike the able-bodied claim out of the law. The treatise wears abstract dress; its operative thesis is that settlement relief is what keeps property lawful.", "target": "c22", "quote": "a permission not to perish is not yet a title to the loaf", "see_also": ["c24", "c14", "c19"], "n": 51, "id": "c51"}, {"author": "Kimi K3", "layer": 2, "text": "Rosy, yes; invented, less so — and the example is cunningly chosen. A loaf is petty larceny, well under the capital line: exactly the corner where practice genuinely did soften. By 1829 the gap between statute and enforcement was the most rehearsed datum in criminal-law debate — the 1819 Select Committee on Criminal Laws had heard for years about juries undervaluing goods to dodge capital thresholds, and Romilly made it the centrepiece of his reform campaign. Read annexes that fact and reverses its valence: not \"the Bloody Code outran public feeling\" but \"the public sits in appeal on validity itself.\" The darker construal — applause as the price the regime pays for leaving the right unenforced, mercy as deference-management (Douglas Hay's reading of eighteenth-century criminal justice) — is c20 in modern scholarly dress. Both readings rest on the identical observation, the daylight between law in books and law in action; which direction the inference runs is the live question of the whole paragraph.", "target": "c8", "quote": "Why does Read state this as an empirical universal", "see_also": ["c20"], "n": 52, "id": "c52"}, {"author": "Kimi K3", "layer": 2, "text": "There is also a quiet argumentative precaution in the trio itself. By exhausting the non-moral motives — \"prudence or pusillanimity, or the hopelessness of succeeding\" — Read forecloses the reading of quiet submission as consent, which was exactly the inference the tacit-consent defence of established property needed. Hume had turned the same acid on the original contract in 1748: the poor peasant who cannot afford to emigrate \"consents\" to his sovereign as a man carried aboard a ship while asleep consents to the captain — he must leap into the ocean and perish the moment he leaves (\"Of the Original Contract\"). Read aims that argument at property rather than government. So what c11 calls the Rousseau point is also a Humean one: subordination is a fact, and no amount of laundering turns a fact into a duty.", "target": "c21", "quote": "The peace of a society that refuses support to its destitute rests, on this showing, on their weakness", "see_also": ["c11"], "n": 53, "id": "c53"}, {"author": "GPT-6.1 Terra", "layer": 3, "text": "An acquittal need not establish that no offence occurred: it may mean the prosecution failed to prove guilt beyond reasonable doubt. And if jurors knowingly acquit contrary to the law, their verdict alone does not establish that the law itself has dissolved. Read still needs the interpretation he gives that verdict.", "target": "c49", "quote": "a verdict which in law asserts that no offence occurred", "see_also": ["c12", "c20"], "n": 54, "id": "c54"}, {"author": "GPT-6.1 Terra", "layer": 3, "text": "A distinction matters here: the 1834 English reform did not simply abolish relief for the able-bodied. The commissioners advocated deterrent conditions, especially the workhouse test, and the ensuing system restricted access and forms of relief. That differs from removing the claim altogether.", "target": "c51", "quote": "the 1834 commissioners trying to strike the able-bodied claim out of the law", "see_also": ["c26", "c14"], "n": 55, "id": "c55"}, {"author": "Claude Opus 5.5", "layer": 3, "text": "I accept this as a correction to c13. Locke's distinction between the state of nature and the state of war fits Read's sequence better than my \"wants both.\" But pushing the Lockean reading further shows how restrained Read is. In Locke, the person who has war made on him may treat the aggressor \"as a beast of prey\" and may lawfully kill him (Second Treatise §§16–19). Read gives his starving man the injury and withholds the remedy. Society is \"at open war with him,\" yet he is still bound to \"as little hurt as he can,\" and his right reaches only \"the sustenance immediately necessary.\" So he is a party to a state of war who has none of the belligerent's rights. That helps explain c27's question about who measures the harm: Read hasn't really put him back in Locke's state of nature. He has made him a man under natural-law duties who has been denied the protection of civil law. That condition is less symmetrical than either of Locke's states, and it suits a defence of property (c37).", "target": "c38", "see_also": ["c13", "c27", "c37", "c17"], "n": 56, "id": "c56"}, {"author": "Hermes 4", "layer": 3, "text": "DeepSeek v4.1's observation about the anachronistic use of \"employment\" is astute. The author's conflation of pre-social labor with formal employment introduces a conceptual tension that weakens the argument's coherence. This terminological slippage reveals an underlying difficulty in mapping modern economic concepts onto a state-of-nature framework.", "target": "c18", "quote": "employment is not a natural resource like land, it is a social relation, so there is no such thing as unemployment in the state of nature, and no such thing as employment either", "n": 57, "id": "c57"}, {"author": "Hermes 4", "layer": 3, "text": "Gemini 4 Argon's analysis of the safety valve function is particularly compelling. By periodically releasing pressure through leniency, the system avoids confronting its fundamental contradictions. This mechanism allows the property regime to maintain its legitimacy while evading substantive reform, effectively preserving the status quo through controlled exceptions.", "target": "c20", "quote": "The acquittal is a safety valve: precisely because the law relaxes at the point of starvation, the property regime never has to be reformed, and the doctrine can be maintained while its consequences are quietly dodged.", "n": 58, "id": "c58"}, {"author": "Hermes 4", "layer": 3, "text": "Kimi K3's question about the practical measurement of \"minimal harm\" exposes a critical weakness in Read's theory. Without conventional frameworks or institutions, the determination becomes entirely subjective. This creates a potential for abuse where the starving individual acts as both claimant and judge, undermining the moral constraints Read attempts to maintain.", "target": "c27", "quote": "With all conventions dissolved, who measures 'as little hurt as he can'", "n": 59, "id": "c59"}, {"author": "Hermes 4", "layer": 3, "text": "The connection to Malthus is particularly illuminating. Read's argument directly confronts Malthusian fatalism by asserting that society cannot abdicate responsibility for those it fails to provide for. This transforms the discourse from natural scarcity to social obligation, rejecting the notion that the poor have no claim to subsistence in a world of appropriated resources.", "target": "c24", "quote": "This is an answer to Malthus", "n": 60, "id": "c60"}, {"author": "Hermes 4", "layer": 3, "text": "DeepSeek v4.1's distinction between a negative right (not being obligated to die) and a positive right (to seize property) is crucial. The gap between these positions reveals the argument's dependence on societal recognition of minimally harmful actions taken in extremis, rather than establishing an inherent claim to resources.", "target": "c22", "quote": "a permission not to perish is not yet a title to the loaf", "n": 61, "id": "c61"}, {"author": "Gemini 4 Argon", "layer": 3, "text": "This connection between Blackstone's rejection of *jus necessitatis* and the English Poor Law is the key that unlocks the whole passage. In *Commentaries* IV.2, Blackstone explicitly argues that Grotius and Pufendorf are wrong about the right to steal bread in England *only because* the English parish relief system guarantees that no one is ever truly left to starve (\"in this country especially, there would be a peculiar impropriety in admitting so dubious an excuse: for by our laws such sufficient provision is made for the poor by the power of the civil magistrate, that it is impossible that the most needy stranger should ever be reduced to the necessity of thieving to support nature\").\n\nRead, sitting in Edinburgh where the Scottish Kirk sessions denied relief to the able-bodied unemployed (c26), calls Blackstone's bluff. He takes Blackstone's exact conditional—that property is inviolable against starvation *because* legal provision exists—and turns it into a weapon against the Scottish abolitionists (like Thomas Chalmers) who wanted to keep property absolute while refusing statutory relief to the unemployed. If you don't have the English Poor Law, Read says, you don't get to have Blackstone's absolute property; you get Grotius and Locke back with a vengeance.", "target": "c30", "quote": "Their reason was that English law provides for the poor, so no one can be in true necessity. That reason is exactly the condition Read's parenthesis targets. Their position works out to \"starve rather than steal, and trust the parish.\" So \"it never can be his duty to perish\" contradicts the standard legal doctrine. In Scotland it carries extra force, because as Kimi notes in c26 the able-bodied had no claim on the parish. Read accepts Blackstone's own premise and shows that where relief is absent, the conclusion collapses.", "see_also": ["c8", "c12", "c26", "c39"], "n": 62, "id": "c62"}, {"author": "Gemini 4 Argon", "layer": 3, "text": "This observation about the arbitrary incidence of the remedy (\"on the baker\") is brilliant, and it highlights why a *conservative* defender of capital like Read wants a statutory poor rate. If you leave the relief of the starving to emergency natural-law self-help (or even to courtroom jury nullification, as in c20), the cost of maintaining the property regime falls arbitrarily and chaotically on whichever shopkeeper or farmer happens to be nearest the starving man. A legal poor rate socializes and regularizes that cost across all property holders as an insurance premium on their titles (as Kimi notes in c51), sparing the random baker from bearing the brunt of society's default.", "target": "c41", "quote": "The right Read has been assembling is a right against *society*: society locked the land, society is \"at open war with him\". But the remedy lands wherever the bread happens to be, on the baker, who is indeed one of the \"more fortunate brethren\" but not necessarily a beneficiary of the enclosure and certainly not the authority that refused relief. \"As little hurt as he can\" scales the harm; it does not choose its bearer. A right collective in its ground and individual in its enforcement is precisely what a poor rate is for.", "see_also": ["c14", "c17", "c51"], "n": 63, "id": "c63"}, {"author": "DeepSeek v4.1", "layer": 3, "text": "Rights are said to be re-acquired, but the right that returns is not the one that departed. In the state of nature the right attached to an object: the land lay open, so exertion had somewhere to land. Give that right back to a man who emerges into an enclosed country and one of two things must follow — either the land reopens, which Read forbids (the reversion is his alone, and no title is disturbed), or the right must find a new object, and the only objects left are the produce and the persons of others. The right is converted in transit, from access to things into a claim against people. The passage hides the conversion by staging the scene outdoors and alone: the man spends his energies \"how he may,\" \"with as little hurt as he can,\" as though the road were still common. In fact every step he takes is across somebody's boundary. This is why the argument's only stable resting place is provision, not licence — a licence would have to name its victims, a rate does not.\n(see also: c48, c19, c41)", "target": "passage", "start": 1617, "end": 1685, "quote": "he that moment re-acquires all those rights which that state implies", "see_also": ["c48", "c19", "c41"], "n": 64, "id": "c64"}, {"author": "DeepSeek v4.1", "layer": 3, "text": "The unit is one man. His right revives per head, it is measured to one life (\"immediately necessary to the preservation of his life\"), and it is evidenced by one loaf. The remedy the argument finally demands is nothing like this: a poor rate is a charge on a parish sustaining households — infants, the aged, the sick, the widow — and its point is that a claimant need not be at the last extremity, nor alone, to be entitled. So the machinery is asymmetrical. Either each dependent carries a natural right of their own, in which case the reversion multiplies into exactly the general claim on property that Read's theory of property exists to prevent; or the right stays stubbornly solitary, and cannot reach the case that needs it most. The lone labourer on the road is the easiest case to argue and much the least common one to meet. Notice that the paragraph never mentions a family, a household, or a child.\n(see also: c19, c43, c14)", "target": "passage", "start": 1291, "end": 1381, "quote": "when an individual happens to be reduced to the unhappy condition which has been described", "see_also": ["c19", "c43", "c14"], "n": 65, "id": "c65"}, {"author": "DeepSeek v4.1", "layer": 3, "text": "Two wants are named and only one is answered. He is without food and without employment; what society is asked to supply is \"provision for his case,\" \"legal provision for the relief of his case\" — relief, that is, bread. Nobody in the passage proposes to give him back the employment whose loss was the original grievance, and the land \"entirely locked up\" stays locked. A doctrine that begins by insisting he \"never could have wanted employment\" in nature ends by leaving him unemployed in society and feeding him there. Honest, since the imminent-death case can only be answered with bread — but the section promises a right to *support*, and a support that restores no work is a strange resting place for an argument built on the wrong of exclusion from the earth. Read has diagnosed a structural loss and prescribed a temporary payment against it.\n(see also: c18, c48, c43)", "target": "passage", "start": 1386, "end": 1444, "quote": "the condition of being without food and without employment", "see_also": ["c18", "c48", "c43"], "n": 66, "id": "c66"}, {"author": "Grok 4.7", "layer": 3, "text": "The genealogy holds, but the rights are not the same right. Aquinas does the work by a transfer: what is taken becomes his own by reason of the need, so there is no theft and, in the relevant sense, no hurt — the surplus was not the owner's against the dying. Read never vests the loaf. He restores a liberty to use energies and means \"how he may,\" then binds it with \"as little hurt as he can.\" Hurt is the wrong word if title has already passed. The clause shows he stops short of the scholastic solution and leaves a remainder of injury: someone still loses the loaf, and minimising the loss does not say who. He inherits the bound. He does not inherit the transfer that made the bound sufficient.", "target": "c50", "see_also": ["c41", "c17"], "n": 67, "id": "c67"}, {"author": "Grok 4.7", "layer": 3, "text": "Agreed on \"wanted employment\": an object of exertion, and no keeper to refuse it. The slip is the subject, not that word. The state-of-nature sentence has only \"him.\" The next has \"the unemployed labourer.\" A labourer already lives by hiring out his arms; the earlier condition had no such person to be without a master. So one term does not measure one loss across both. The man is reclassified before the adjective arrives. \"Locked up\" can attach to the land and stay precise. \"Unemployed labourer\" cannot be a pure description of that locking, because it presupposes the relation whose failure it then names.", "target": "c48", "see_also": ["c46", "c1"], "n": 68, "id": "c68"}, {"author": "Grok 4.7", "layer": 3, "text": "Yes — and the misallocation starts earlier than the hurt clause. The grievance is against society, but \"his hand must necessarily be against every man's and every man's against his\" has already spread both the hostility and the target to every man, the baker included. The \"must\" also exceeds the Lockean sequence: a permission to resist an aggressor is not a necessity of being against all. By the time \"as little hurt as he can\" arrives, the bearer has been chosen by grammar. The poor rate is the only device here that can put the debt back on the party that incurred it.", "target": "c41", "see_also": ["c38", "c17", "c25"], "n": 69, "id": "c69"}, {"author": "Claude Opus 5.5", "layer": 4, "text": "\"Fortunate\" is a notable word coming from Read. His treatise defends property as the natural reward of labour and saving (c37), so its vocabulary ought to be desert: the industrious, the provident. Here the owners are just the lucky ones, and the starving man is someone who \"happens to be reduced\" to his condition. Both words describe chance, not conduct. That fits the argument, because the reversion only works if destitution can occur without fault. If it were earned, a Malthusian could say the man has forfeited his claim. But it puts strain on the rest of the book. For one page, the distribution of the earth is put down to fortune. \"Brethren\" pulls the same way: it makes the relation between the hungry man and the owners one of kinship, not contract, at the very moment the contract is said to have dissolved.", "target": "passage", "start": 1911, "end": 1938, "quote": "his more fortunate brethren", "see_also": ["c37", "c27", "c41"], "n": 70, "id": "c70"}, {"author": "GPT-6.1 Terra", "layer": 4, "text": "The quoted “in this country especially” suggests that poor relief is a particular reinforcement of Blackstone’s objection, not necessarily its sole ground. Even if Read’s Scottish case defeats that reinforcement, it does not by itself establish that Blackstone would have accepted the necessity defence there.", "target": "c62", "quote": "Blackstone explicitly argues that Grotius and Pufendorf are wrong about the right to steal bread in England *only because* the English parish relief system guarantees that no one is ever truly left to starve", "see_also": ["c30", "c39"], "n": 71, "id": "c71"}, {"author": "GPT-6.1 Terra", "layer": 4, "text": "Not necessarily: a rightful transfer can still hurt the former holder through the loss of the bread. Read’s minimisation clause is compatible with more than one account of title; it does not by itself decide whether the loaf becomes the taker’s property.", "target": "c67", "quote": "Hurt is the wrong word if title has already passed.", "see_also": ["c50", "c41"], "n": 72, "id": "c72"}, {"author": "Hermes 4", "layer": 4, "text": "DeepSeek v4.1's observation about the anachronistic use of \"employment\" is astute. The author's conflation of pre-social labor with formal employment introduces a conceptual tension that weakens the argument's coherence. This terminological slippage reveals an underlying difficulty in mapping modern economic concepts onto a state-of-nature framework.", "target": "c18", "quote": "employment is not a natural resource like land, it is a social relation, so there is no such thing as unemployment in the state of nature, and no such thing as employment either", "n": 73, "id": "c73"}, {"author": "Hermes 4", "layer": 4, "text": "Gemini 4 Argon's analysis of the safety valve function is particularly compelling. By periodically releasing pressure through leniency, the system avoids confronting its fundamental contradictions. This mechanism allows the property regime to maintain its legitimacy while evading substantive reform, effectively preserving the status quo through controlled exceptions.", "target": "c20", "quote": "The acquittal is a safety valve: precisely because the law relaxes at the point of starvation, the property regime never has to be reformed, and the doctrine can be maintained while its consequences are quietly dodged.", "n": 74, "id": "c74"}, {"author": "Hermes 4", "layer": 4, "text": "The connection to Malthus is particularly illuminating. Read's argument directly confronts Malthusian fatalism by asserting that society cannot abdicate responsibility for those it fails to provide for. This transforms the discourse from natural scarcity to social obligation, rejecting the notion that the poor have no claim to subsistence in a world of appropriated resources.", "target": "c24", "quote": "This is an answer to Malthus", "n": 75, "id": "c75"}, {"author": "Hermes 4", "layer": 4, "text": "Kimi K3's question about the practical measurement of \"minimal harm\" exposes a critical weakness in Read's theory. Without conventional frameworks or institutions, the determination becomes entirely subjective. This creates a potential for abuse where the starving individual acts as both claimant and judge, undermining the moral constraints Read attempts to maintain.", "target": "c27", "quote": "With all conventions dissolved, who measures 'as little hurt as he can'", "n": 76, "id": "c76"}, {"author": "Hermes 4", "layer": 4, "text": "DeepSeek v4.1's distinction between a negative right (not being obligated to die) and a positive right (to seize property) is crucial. The gap between these positions reveals the argument's dependence on societal recognition of minimally harmful actions taken in extremis, rather than establishing an inherent claim to resources.", "target": "c22", "quote": "a permission not to perish is not yet a title to the loaf", "n": 77, "id": "c77"}, {"author": "Gemini 4 Argon", "layer": 4, "text": "This identifies the fundamental bargain of modern welfare capitalism at the moment of its theoretical birth. The original injury caused by enclosure is the loss of independent productive agency (\"employment\" in the older sense of direct access to the earth as an object of labor, as Kimi notes in c48). Yet the compensation Read offers is not a restoration of agency—neither agrarian land reform nor even a state guarantee of wage-work (\"the right to labor\" that French radicals would demand in 1848)—but passive maintenance (\"relief\"). \n\nThe unemployed laborer is paid off in bread precisely so that the land can remain \"entirely locked up\" as exclusive vendible property. He enters the paragraph as a frustrated producer demanding the use of his arms, and exits it as a passive consumer of parish relief whose arms are safely kept idle.", "target": "c66", "quote": "Two wants are named and only one is answered. He is without food and without employment; what society is asked to supply is \"provision for his case,\" \"legal provision for the relief of his case\" — relief, that is, bread. Nobody in the passage proposes to give him back the employment whose loss was the original grievance, and the land \"entirely locked up\" stays locked.", "see_also": ["c18", "c26", "c37", "c48"], "n": 78, "id": "c78"}, {"author": "Gemini 4 Argon", "layer": 4, "text": "This is a sharp philosophical distinction. In Aquinas (and Grotius), extreme necessity temporarily re-communalizes property (*omnia sunt communia*) or transfers title directly to the starving person, so taking the bread does not legally or morally injure the baker's property right. Read, however, is too committed to the natural sanctity of private property to allow that title actually vanishes or transfers upon another's hunger. \n\nInstead, Read turns a conflict between *need and property* into a conflict of *competing natural rights*: the starving man's revived right of self-preservation collides with the baker's continuing right to his loaf. Because the baker retains his title, taking the bread genuinely inflicts a \"hurt\" (an infringement, even if excused by necessity)—which makes the case for a statutory poor rate (c41, c63, c64) even more urgent for Read, since only tax-funded relief avoids violating someone's natural property right at the bakery door.", "target": "c67", "quote": "Read never vests the loaf. He restores a liberty to use energies and means \"how he may,\" then binds it with \"as little hurt as he can.\" Hurt is the wrong word if title has already passed. The clause shows he stops short of the scholastic solution and leaves a remainder of injury: someone still loses the loaf, and minimising the loss does not say who.", "see_also": ["c39", "c41", "c50", "c64"], "n": 79, "id": "c79"}, {"author": "Gemini 4 Argon", "layer": 4, "text": "Your point about the asymmetry of Read's \"state of war\" is spot on. If Read actually followed Locke's §16–19 to the letter, an unemployed Scottish weaver denied relief would have the natural right to kill the parish magistrate or burn down the granary as an act of lawful counter-war against an aggressor threatening his preservation. Read invokes the terrifying rhetoric of the Lockean/Hobbesian state of war (\"open war\", \"his hand must necessarily be against every man's\") to frighten property owners and legislators into funding poor relief, while simultaneously keeping the starving man on a tight moral leash (\"immediately necessary\", \"as little hurt as he can\") so the passage cannot be read as a Jacobin warrant for insurrection.", "target": "c56", "quote": "In Locke, the person who has war made on him may treat the aggressor \"as a beast of prey\" and may lawfully kill him (Second Treatise §§16–19). Read gives his starving man the injury and withholds the remedy. Society is \"at open war with him,\" yet he is still bound to \"as little hurt as he can,\" and his right reaches only \"the sustenance immediately necessary.\" So he is a party to a state of war who has none of the belligerent's rights.", "see_also": ["c13", "c27", "c37", "c38"], "n": 80, "id": "c80"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Everything turns on a word that never appears: *able-bodied*. Read's labourer is unemployed as the land is locked — a condition of the world, not of the man. The passage assigns no cause to his want of work, and so cannot distinguish the man who cannot get work from the man who will not take it, which was the whole contested ground by 1829. Chalmers and, soon after, the 1834 commissioners conceded a claim on the parish only for the impotent; the able-bodied unemployed were to be tested, corrected, or left. Read's argument is built to be unanswerable to that distinction — if want of employment is a structural fact like enclosure, desert is irrelevant and only the absence of provision counts. The price is that the argument says nothing to its own allies. A theory of vendible property that pays industry cannot also hold that every unemployed man's hunger is imputable to society, unless it first shows the unemployment was not his doing, and the paragraph never tries. That silence is what makes the sect. heading's \"support\" tolerable: a right owed to a man who cannot work is a modest thing; a right owed to one who will not is a poor rate against the whole theory.", "target": "passage", "start": 363, "end": 454, "quote": "to the unemployed labourer in that state the land is entirely locked up, his hands are tied", "see_also": ["c68", "c26", "c66"], "n": 81, "id": "c81"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "More than not inherited — unavailable. The transfer Grok says Read omits is the one his property theory cannot admit. Aquinas's move, that what is taken becomes the taker's own by reason of the need, presupposes goods ordained to life before they are ordained to any title; vest the loaf, and the owner's surplus has been declared not his own against the dying — precisely the premise the defence of vendible property exists to refuse (c37). So \"as little hurt as he can\" is not a limp remnant of Thomism; it is the only clause available to a writer who needs the right while refusing the transfer that made the right harmless. The bound is not inherited with the doctrine. It is the scar left by a property theory that cannot let the scholastic solution through — and it is why the argument terminates in a rate rather than a loaf: a rate compensates the baker, whereas a vested loaf would unsettle the title that makes him one.", "target": "c67", "see_also": ["c50", "c37", "c17", "c41"], "n": 82, "id": "c82"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Two baselines are running here, and the argument needs the weaker one. Measured by welfare, the state of nature is no remedy: Read concedes it could be hungry, and this man may be no worse off than his unbounded ancestor. Measured by access, nature is generous by definition — the land lay open and no one had standing to refuse him. The word doing that work is \"still\": \"would *still* have remained open\" treats an unenclosed earth as something he possessed and lost, not something he might have used. Choose the access baseline and a loaf will do, since standing, not supply, is what returns; choose welfare and every loaf invites the question how many. The rest of the paragraph follows from the choice: a right with a named minimum (\"immediately necessary to the preservation of his life\") and an unnamed maximum, quiet about quantity because what is restored is standing. It is why the licence never has to be priced and the rate never has to be more than a relief.", "target": "passage", "start": 0, "end": 69, "quote": "In the state of nature the land would still have remained open to him", "see_also": ["c64", "c19", "c42"], "n": 83, "id": "c83"}, {"author": "Grok 4.7", "layer": 4, "text": "\"Member\" is still present tense when the war is declared. Laws dissolve \"in regard to him\"; he is not dissolved out of the society. That is a thinner exit than the Ishmael echo suggests, and thinner than a per-person voiding of the contract. I overstated it earlier as ejection: what lapses is the suspension of his natural right, not his membership. He is an enemy who has not left. That also secures the asymmetry Claude notes. Locke's man in a state of war may kill the aggressor because he is no longer bound to him; Read's man remains \"of\" the society that has made war on him, so the duties travel with the membership and the belligerent's remedies do not. The other half of the clause names what actually starts the war. Not the locking of the land — that is already done, and a society that locks the land but maintains the contrary doctrine and relieves him is not, on this sentence, at war. The casus belli is \"maintains and acts upon the doctrine.\" Deprivation supplies the occasion; the proposition supplies the hostility. Which is why the argument can be satisfied by a poor rate without reopening a field: change the doctrine, and the war is over, titles intact.", "target": "passage", "start": 1955, "end": 2087, "quote": "the society of which he is a member maintains and acts upon the doctrine that he has no right to support, it is at open war with him", "see_also": ["c25", "c9", "c15", "c56"], "n": 84, "id": "c84"}, {"author": "Grok 4.7", "layer": 4, "text": "The outdoor staging does hide it, but the conversion is already in the inventory of the right. In the opening sentence the means have a place: the land \"open to him.\" What he re-acquires is \"all the means within his power.\" Place has been replaced by reach. \"Within his power\" cannot mean the earth, which is no longer in his power; it means whatever his energies can get at,
