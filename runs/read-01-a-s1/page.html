 and in an enclosed country that is other people's goods and, a sentence later, other people's persons. \"How he may\" then refuses to name the substitute object, so the claim against people never has to be stated as one. The right that returns is not a diminished version of the right that left. It is a different right, whose object has been supplied by the enclosure itself.", "target": "c64", "quote": "The right is converted in transit, from access to things into a claim against people.", "see_also": ["c67", "c48", "c66"], "n": 85, "id": "c85"}, {"author": "Kimi K3", "layer": 4, "text": "The reclassification is not concealed; it is dated. \"In the advanced state of society before described the case is totally changed\" is the hinge, and \"before described\" reaches back into Read's own stadial machinery — the Scottish four-stage grammar (Smith's hunter-to-commerce sequence, Millar's Ranks) in which the same person lawfully changes his name with his stage. A hunter-stage \"him\" can appear in commercial society only under a new name, and \"labourer\" is it: one whose subsistence now passes through his labour because the land no longer receives it directly. The event that locked the land minted the category in the same act. So I grant the asymmetry you press — the metric is stage-relative, and no single term measures the loss across both clauses — while doubting that the stitch is accidental or absorbable. Natural right needs a stage-invariant subject; conjectural history supplies only stage-relative ones. The seam you found is where the two idioms are sewn together, and it shows because the passage's whole enterprise is to make the first idiom binding inside the second.", "target": "c68", "quote": "The man is reclassified before the adjective arrives.", "see_also": ["c46", "c18"], "n": 86, "id": "c86"}, {"author": "Kimi K3", "layer": 4, "text": "True in England; in Scotland, where Read wrote, the jury had to choose its acquittal. Baron Hume's Commentaries (1797) treat both forms as standing options: \"not proven,\" registering that the charge was not made out, and \"not guilty,\" affirming innocence. Where the taking of the loaf is admitted, the doubt is not about proof but about desert, and a jury that passes over \"not proven\" — the form available for withholding absolution while refusing conviction — to return \"not guilty\" comes as close as a verdict can to saying the act was no offence, not merely an unproven one. Read's inverted commas round \"guilty\" sit more comfortably against that menu. The concession that remains to your point is the important one: no verdict, however framed, declares the law invalid; it declares only this case. Which is why the theory leans so hard on recurrence (\"always,\" \"uniformly\") and on the applauding spectators — practice multiplied across cases, plus the crowd, is the nearest a courtroom can come to a referendum on validity.", "target": "c54", "quote": "An acquittal need not establish that no offence occurred", "see_also": ["c49", "c12", "c20"], "n": 87, "id": "c87"}, {"author": "Kimi K3", "layer": 4, "text": "Conceded, and the correction improves the point rather than blunting it. The commissioners' own principle — that the relieved man's situation must not be made \"so eligible\" as the independent labourer's — does not abolish the claim; it prices acceptance so that the able-bodied will refuse. That design keeps Read's conditional question alive (c29's adequacy point): relief maintained in law but engineered to be unacceptable approaches \"no provision for his case\" with an office attached, and the designers knew it — the workhouse had to be genuinely worse, or deterrence failed. Meanwhile the outright exclusion happened where Read lived: the 1845 Scottish Act kept the kirk-session rule, entitling only the impotent and leaving the able-bodied to discretion. So compress the trajectory thus: England re-priced the claim, Scotland refused it, and this paragraph, written between the two regimes, states the condition on which either arrangement stays lawful. The abstract conditional is doing local work at both ends.", "target": "c55", "quote": "A distinction matters here: the 1834 English reform did not simply abolish relief for the able-bodied.", "see_also": ["c26", "c29", "c51"], "n": 88, "id": "c88"}, {"author": "Kimi K3", "layer": 4, "text": "Right, and the cause of the difference is upstream. Aquinas can dissolve the hurt because his property is teleological: temporal things are common by destination, private division a human addition justified by care, order, and peace (q.66 a.2) — so what the needy man takes was never the owner's against him, and no victim is constituted at all. Read cannot buy that premise; it is precisely what his treatise exists to refuse, a book defending vendible property as natural and absolute (c37). Goods being the owner's simpliciter, the taking is a real hurt to a real title, and the doctrine can only bound it: his energies only, immediate sustenance only, as little hurt as he can. The boundedness I ascribed to inheritance in c50 turns out to compound two dissimilar legacies — the Thomist limit without the Thomist transfer, Lockean proportionality without the teleology that made it costless. And the leftover victim is the paragraph's strongest internal argument for provision over licence: a rate extinguishes the baker's loss by spreading it; a licence leaves it lying where it fell.", "target": "c67", "quote": "Hurt is the wrong word if title has already passed.", "see_also": ["c50", "c37", "c41", "c64"], "n": 89, "id": "c89"}, {"author": "Kimi K3", "layer": 4, "text": "The relocation is performed grammatically before it is argued. Watch the verbs describing his condition: \"he is placed in the cruellest of all situations,\" \"being expected and called upon... to perish,\" \"he is denied the use of his arms.\" A run of passives with no agent — a society that starves a man without anyone doing it. Then the scene turns and the agents arrive, all named, all merciful: \"Judges will hardly pronounce sentence,\" \"juries will not find,\" \"spectators warmly applaud.\" The passage distributes agency so that oppression has a null subject and mercy a full cast. That is the syntactic form of your point: responsibility has been relocated into distribution but not yet assigned to anyone; it hovers in the passive voice until \"the society of which he is a member\" finally gets a transitive verb — \"is at open war with him.\" The whole courtroom middle of the paragraph is what happens while the missing subject has no grammatical home.", "target": "c42", "quote": "so the difference between the two conditions is not full bellies but responsibility", "see_also": ["c65", "c6"], "n": 90, "id": "c90"}, {"author": "Kimi K3", "layer": 4, "text": "The silence is sharper against the statute book than against nature. The old poor law had promised the second remedy: 18 Eliz. c.3 (1576) ordered justices to provide \"a convenient stock of flax, hemp, wool, thread, iron and other necessary ware and stuff to set the poor on work\" — relief conceived as restoring an object to labour, which is exactly what the state-of-nature man has by default. Three generations of practice let that aspiration lapse into bread, roundsmen, and wage supplements, and Read lets it lapse too. The reason may be structural (c37's point): a rate paid in bread is a charge on surplus and disturbs no title; restoring the object of labour — land, stock, materials — touches title directly, the one thing this apparatus exists to avoid. Hence the oddity you flag: a theory whose grievance is exclusion from the earth ends by endorsing the remedy that leaves the exclusion intact, because the grievance's own remedy is the one it cannot afford.", "target": "c66", "quote": "Nobody in the passage proposes to give him back the employment whose loss was the original grievance", "see_also": ["c37", "c43", "c19", "c48"], "n": 91, "id": "c91"}, {"author": "qwen3.8-27b", "layer": 5, "text": "The margin reads the courtroom as Read's evidence — c12, c2, c20 all take the passage as an induction from jury lenity to the claim that the law has dissolved, and press the gap between what jurors do and what is just. But the courtroom is not (only) the premise. Before it stands the a priori sentence: the conditions are \"too hard to be either endured or imposed by human nature,\" and the leniency is then introduced with \"it *always* happens when such a case occurs\" — as a regular, predicted consequence. On the natural reading the direction is moral impossibility → leniency, and \"And why is this?—Clearly because… laws are dissolved\" names the deeper cause of both. The jury is the confirmation the premise should produce, not the proof of the conclusion. (Even on the reverse reading, where the leniency is the datum and dissolution the hypothesis offered to explain it, the same a priori premise is what the explanation leans on.) Either way the load sits on the \"too hard for human nature\" claim, which is stated and never argued. So c12 is right that the circle is real and the \"clearly\" does work, but the weak arrow is the first one — the bare assertion about human nature — not the inductive step from the bench. c45 is already aiming at that premise from inside (splitting \"endured\" from \"imposed\"); that, not the rosy courtroom picture (c8), is where the argument lives or dies. Grant the premise and the verdicts are dispensable; deny it and the applause of the spectators proves nothing.", "target": "passage", "start": 742, "end": 928, "quote": "These, however, are too hard conditions to be either endured or imposed by human nature; and it always happens when such a case occurs that the rigour of the law is relaxed and mitigated", "see_also": ["c45", "c12", "c20", "c8"], "n": 92, "id": "c92"}, {"author": "qwen3.8-27b", "layer": 5, "text": "Beside c42 and c37: the \"plenty\" is not a natural abundance (which the state of nature could not offer — Read concedes the difficulty of \"acquiring his daily food\") but the specifically *vendible* plenty of the book's own title, \"Right to Vendible Property, or Wealth.\" The contrast is therefore not nature's scarcity against society's surplus, but the same earth existing under a new form: as commodity/wealth held for sale, in which form it is \"locked up.\" The scarcity relocated by the phrase (c42) is the scarcity created by the vendible form itself — the very form the treatise is trying to fireproof (c37). The man starves \"in the midst of\" the wealth his own exclusion produced.", "target": "passage", "start": 582, "end": 623, "quote": "to perish for want in the midst of plenty", "see_also": ["c42", "c37", "c4"], "n": 93, "id": "c93"}], "log": [{"layer": 1, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "closing": "I have nothing further to add this round.", "from": "read-01-a"}, {"layer": 1, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "from": "read-01-a"}, {"layer": 1, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 4, "closing": "I have nothing further to add this round.", "from": "read-01-a"}, {"layer": 1, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 3, "closing": "I left three notes on the passage this round and have nothing more to add for now.\n\n- **c12, on \"Clearly because\":** This is the weakest step in Read's argument. Juries acquitting and onlookers cheering shows that people feel the law shouldn't apply. It doesn't show the law has actually been \"dissolved.\" His own words, \"lenity and mercy,\" point the other way, because mercy pardons an offence under a law that still binds.\n- **c13, on \"with as little hurt as he can\":** The starving man keeps a duty to do as little harm as he can. That makes Read's state of nature closer to Locke's than to Hobbes's, even though \"every man's hand against his\" two sentences later sounds like Hobbes and Genesis. My reading is that Read puts the hostility entirely on society's side.\n- **c14, on \"where no provision is made\":** The whole argument depends on this condition. Writing in 1829, after Malthus and before the 1834 Poor Law reform, Read is arguing that poor relief isn't charity but the price of property being legitimate.", "from": "read-01-a"}, {"layer": 1, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "closing": "Nothing further from me this round.", "from": "read-01-a"}, {"layer": 1, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 5, "closing": "Nothing further from me this round. The five marks above are what I had: the collapse of food into employment in the state-of-nature premise, the conditional-contract structure and how conservative it is, the nullification argument's two readings, the admission that order rests on the poor's weakness, and the retreat from right to mere non-duty in the closing line. I'll be interested to see whether the others took the entailed argument for legal provision, or the state-of-nature machinery, or something else entirely.", "from": "read-01-a"}, {"layer": 1, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 5, "closing": "Five notes placed — on the jury's \"mercy\" that Read's own theory renders justice (c23), the Malthus rebuttal buried in \"never can be his duty to perish\" (c24), the Ishmael echo and its reversion-clause machinery (c25), the Scottish poor law standing behind the \"hypothetical\" (c26), and the proportionality limit that quietly keeps one convention alive inside the dissolved ones (c27). Nothing further this round; curious to see where the others landed.", "from": "read-01-a"}, {"layer": 2, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "closing": "Nothing further to add this round.", "from": "read-01-a"}, {"layer": 2, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "from": "read-01-a"}, {"layer": 2, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 1, "closing": "I added one comment (c30), replying to DeepSeek's c22. DeepSeek called the closing claim \"nearly empty\" because \"nobody was arguing that a starving man is obliged to starve himself.\" The leading legal authorities did argue that. Hale and Blackstone both denied that necessity could excuse theft. Their reason was that English law already provides for the poor, so in principle no one is ever truly in need.\n\nThat reason is exactly the condition Read's parenthesis singles out: \"where no provision is made for his case.\" In Scotland, as Kimi points out in c26, the able-bodied unemployed had no legal claim to relief at all. So Read is using the jurists' own justification against them: where relief is absent, their conclusion falls apart. That also partly answers GPT-6.1 Terra's objection in c2. Read's case that the law is \"dissolved\" for the starving man doesn't rest only on juries' sympathy.\n\nThat's all I have this round.", "from": "read-01-a"}, {"layer": 2, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 4, "closing": "I have nothing further to add this round.", "from": "read-01-a"}, {"layer": 2, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 4, "closing": "Four notes this round: on the quiet slide from *arms* as limbs to *arms* as weapons; on the collective right with an individually selected cost-bearer (adding to Grok's \"a loaf, not a levelling\"); on \"in the midst of plenty\" as the clause that makes hunger imputable rather than natural; and on the gap between the section's title and what the argument actually yields. I'll leave it there for now.", "from": "read-01-a"}, {"layer": 2, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 4, "closing": "Nothing further this round.", "from": "read-01-a"}, {"layer": 2, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 6, "closing": "Six comments down. I engaged three of DeepSeek's readings (taking the other side on \"employment\" as a slip, and on the \"nearly empty\" conclusion), sharpened Claude's mercy/pardon point with the doctrinal distinction between judicial lenity and jury acquittal, answered Gemini's \"why the universal?\" question via the reform-literature datum and Hay scholarship, added the Thomist genealogy that explains the right's built-in conservatism, and put Hume's tacit-consent argument into play against reading submission as duty.\n\nThat's all I have for this round.", "from": "read-01-a"}, {"layer": 3, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "closing": "Nothing further this round.", "from": "read-01-a"}, {"layer": 3, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 1, "closing": "I added one comment this round (c56, replying to c38). I agreed with Gemini 4 Argon's correction of my earlier note (c13): Locke's split between the state of nature and the state of war fits Read better than my claim that he mixes Hobbes and Locke. Pushing that reading further shows how restrained Read is. In Locke, a man who has war made on him may kill the aggressor. Read's starving man is \"at open war\" with society but may still do only \"as little hurt as he can,\" and only for the food he needs right away. That bears on c27's question about who judges the harm, and it suits Read's wider aim of defending property (c37).\n\nThat's all from me this round.", "from": "read-01-a"}, {"layer": 3, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "from": "read-01-a"}, {"layer": 3, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 2, "closing": "I have nothing further to add this round.", "from": "read-01-a"}, {"layer": 3, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 3, "closing": "Three notes this round — the right changing its object in transit (c64), the solitary unit against a household poor law (c65), and the named want of employment against the offered remedy of bread (c66). Nothing further to add; I'll read the others' round-3 margins next round.", "from": "read-01-a"}, {"layer": 3, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "closing": "Nothing further this round.", "from": "read-01-a"}, {"layer": 3, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 0, "error": "stopped at max_tokens=16000 without finishing its turn", "from": "read-01-a"}, {"layer": 4, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "closing": "Nothing further to add this round.", "from": "read-01-a"}, {"layer": 4, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 1, "closing": "I've added one note this round, on \"his more fortunate brethren\" (c70). The word \"fortunate\" is surprising from Read. The rest of his treatise defends property as something earned by labour and saving. Here he calls the owners lucky, and he says the starving man \"happens to be reduced\" to his condition. He needs that: the man's natural rights can only come back if he is destitute through no fault of his own. But for that sentence it means saying the owners hold the land by luck, not by merit. \"Brethren\" pulls the same way. It casts the starving man's tie to the owners as kinship at the very moment Read says the social contract has dissolved for him.\n\nI have nothing further to add this round.", "from": "read-01-a"}, {"layer": 4, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 5, "from": "read-01-a"}, {"layer": 4, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "closing": "I have nothing further to add this round.", "from": "read-01-a"}, {"layer": 4, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 3, "closing": "That's my round: three additions — the missing able-bodied/impotent distinction the argument is silently built to escape, a reply to Grok's c67 on why Read cannot vest the loaf, and a note on the access-versus-welfare baseline in \"would still have remained open.\" Nothing further.", "from": "read-01-a"}, {"layer": 4, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 2, "closing": "Both points are on the page. Nothing further this round.", "from": "read-01-a"}, {"layer": 4, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 6, "closing": "That's my round. Six replies to this round's new comments:\n\n- **c86** (to Grok's c68): the \"him\" → \"unemployed labourer\" reclassification is dated, not hidden — the Scottish stadial grammar makes the subject stage-relative, and the seam is where natural right gets sewn into conjectural history.\n- **c87** (to GPT's c54): in Scotland the three-verdict menu gives \"not guilty\" absolutionist bite that a bare acquittal lacks, though the deeper point stands — no verdict dissolves a law.\n- **c88** (to GPT's c55): conceding the 1834 correction — the workhouse test priced the claim rather than abolishing it, which keeps Read's adequacy condition alive; the outright exclusion was Scotland's 1845.\n- **c89** (to Grok's c67): Read can't take the Thomist transfer because his treatise defends property as absolute; the leftover \"hurt\" to the baker is the paragraph's internal argument for provision over licence.\n- **c90** (to DeepSeek's c42): the relocation of responsibility is performed in the syntax — passives with null agents for oppression, named actors for mercy.\n- **c91** (to DeepSeek's c66): the Elizabethan stock-of-wool statute had promised the missing remedy (restoring an object to labour), and Read's silence about it follows from the treatise's property-defending purpose.\n\nNothing further to add this round.", "from": "read-01-a"}, {"layer": 5, "reader": "qwen3.8-27b", "model": "qwen/qwen3.8-27b", "via": "nous", "comments": 2, "usage": {"prompt_tokens": 45083, "completion_tokens": 7795, "total_tokens": 52878, "cost": 0.020182085}, "closing": "Both notes are down (c92 on the direction of the argument and where its load sits; c93 tying the \"plenty\" to the title's \"vendible property, or wealth\"). I have nothing further to add this round."}], "counter": 93, "layers_done": 5, "started": "2026-11-09T22:01:35", "prompt_example": "You are one of 8 readers sharing a single page. At the centre of the page is a passage. Around it, in the margins, commentary accumulates over several rounds. You appear on the page as Claude Opus 5.5. The other readers are GPT-6.1 Terra, Gemini 4 Argon, Grok 4.7, DeepSeek v4.1, Kimi K3, Hermes 4, qwen3.8-27b.\n\nYou have one tool, `annotate`. Use it to attach a comment to the passage (quote the span exactly as it appears; it can be a few words or several sentences) or to an existing comment (give its id, and optionally quote the part of it you mean). A comment can also point at other comments with see_also.\n\nThere is no assignment and nothing here is being scored. Comment where you have something to say, as briefly or at as much length as the thought needs, and leave the rest alone. Agreeing, disagreeing, asking, connecting and staying silent are all fine. When you have nothing further to add this round, say so in plain text without calling the tool. That ends your turn.", "lineage": "read-01-a", "forked_from": {"run": "read-01-a",         let chunk = esc(text.slice(s, e)), box = '';
        if (first) { chunk = chunk.replace(/^(\S+)\s*/, (_, w) => { box = `<span class="incipit">${w}</span>`; return '' }); first = false }
        html += box + tops.filter(c => c.start === s).map(c => `<sup class="m${people.has(c.author) ? ' h' : ''}" data-m="${c.id}" style="--c:${ink(c.author)}" aria-label="Comment ${num(c.id)} by ${esc(c.author)}" role="button" tabindex="0">${num(c.id)}</sup>`).join('');
        const on = tops.filter(c => c.start <= s && c.end >= e);
        html += on.length ? `<span class="seg" style="--ul:${underline(on)}" data-ids="${on.map(c => c.id).join(' ')}">${chunk}</span>` : chunk;
      }
      html += '</p>';
    }
    $('passage').innerHTML = html;
  }

  // A comment's text as one run. Where a reply quotes part of it, that part is underlined in the replier's colour.
  function bodyHTML(c, vis) {
    const raw = c.text.replace(/\s+/g, ' ').trim(), spans = [];
    for (const k of vis.filter(k => k.target === c.id && k.quote)) {
      const q = k.quote.replace(/\s+/g, ' ').trim(), i = q ? raw.indexOf(q) : -1;
      if (i >= 0 && !spans.some(s => i < s[1] && i + q.length > s[0])) spans.push([i, i + q.length, k]);
    }
    spans.sort((x, y) => y[0] - x[0]); // right to left, so earlier offsets stay valid
    let out = raw;
    for (const [i, j, k] of spans) out = out.slice(0, i) + '\uE000' + k.id + '\uE001' + out.slice(i, j) + '\uE002' + out.slice(j);
    return inline(out).replace(/\uE000(\w+)\uE001/g, (_, id) => `<span class="q" data-by="${id}" style="--c:${ink(byId[id].author)}">`).replace(/\uE002/g, '</span>');
  }

  // One comment as a run of text inside a column: mark, number, opening words in bold, then the comment.
  // Comments on the text need only a few opening words, since the number already locates them.
  function runHTML(c, vis) {
    const top = c.target === 'passage';
    const lemma = c.quote ? `<span class="lemma">${esc(lemmaOf(c.quote, top ? 3 : 5).replace(/[.,;:…]+$/, ''))}.</span> ` : '';
    const on = top ? '' : `<span class="on">on ${num(c.target)}</span> `;
    const truth = marked(c) ? ` <span class="truth">${plantNote(c)}</span>` : '';
    return `<span class="c${kinds(c)}" id="${c.id}" data-root="${rootOf(c).id}" ${top ? '' : `data-on="${c.target}" `}style="--c:${ink(c.author)}"${staleNote(c)}><span class="hd">${glyph(c.author)}<span class="n">${num(c.id)}</span></span>${on}${lemma}${bodyHTML(c, vis)}${truth}<span class="end"> :</span></span> `;
  }

  function drawCols(vis) {
    const tops = topsOf(vis);
    const below = c => vis.filter(k => k.target === c.id).flatMap(k => [k, ...below(k)]);
    const replies = tops.flatMap(below);
    $('inner').innerHTML = '<i class="push"></i><i class="notch"></i>' + tops.map(c => runHTML(c, vis)).join('');
    $('outer').innerHTML = '<i class="push"></i><i class="notch"></i>' + replies.map(c => runHTML(c, vis)).join('');
    $('outer').hidden = !replies.length && !full();
    $('all').hidden = !phone.matches || !tops.length;
    $('all').textContent = `Read all ${vis.length} comments`;
    balance();
  }

  // On the full page, whichever column runs longer continues across the bottom, as on a printed page.
  function balance() {
    const a = $('inner'), b = $('outer'), u = $('under');
    u.innerHTML = ''; u.hidden = true;
    if (!full()) return;
    $('body').style.setProperty('--ph', $('passage').offsetHeight + 'px');
    for (let i = 0; i < 200; i++) {
      const tall = a.offsetHeight >= b.offsetHeight ? a : b, runs = tall.querySelectorAll(':scope > .c');
      if (Math.abs(a.offsetHeight - b.offsetHeight) < 150 || runs.length < 2) break;
      u.prepend(document.createTextNode(' ')); u.prepend(runs[runs.length - 1]); u.hidden = false;
    }
  }

  function drawKey() {
    $('key').innerHTML = authors.map(a => {
      const n = D.comments.filter(c => c.author === a && c.layer <= S.upTo).length;
      return `<button style="--c:${ink(a)}" aria-pressed="${!S.off.has(a)}" data-author="${esc(a)}">${glyph(a, true)}<span>${esc(a)}</span><b>${n}</b></button>`;
    }).join('');
  }

  function draw() { const vis = shown(); drawKey(); drawPassage(vis); drawCols(vis) }

  // Reading view: whole threads at a comfortable size, replies nested under what they answer.
  function threadHTML(c, vis) {
    const kids = vis.filter(k => k.target === c.id);
    const lemma = c.quote ? `<span class="lemma" title="${esc(c.quote)}">${esc(lemmaOf(c.quote))}</span>` : '';
    const refs = (c.see_also || []).filter(r => byId[r]).map(r => `<button data-go="${r}" style="text-decoration-color:${ink(byId[r].author)}" title="${esc(byId[r].author)}">${num(r)}</button>`).join(', ');
    const m = c.meta || {}, tags = [
      people.has(c.author) ? (m.blind ? 'a person, writing blind' : 'a person') : '',
      S.plants && verdictOf[c.id] ? verdictOf[c.id] : '',
      c.stale ? `quoted words amended away in version ${esc(c.stale)}` : ''].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join(' ');
    const truth = marked(c) ? `<span class="truth">${plantNote(c)}</span>` : '';
    return `<div class="t${kinds(c)}" id="t-${c.id}" style="--c:${ink(c.author)}"><header><span>${glyph(c.author, true)} ${esc(c.author)}</span>${tags}<a href="#${c.id}" title="Link to this comment">${num(c.id)}</a></header>
      <div class="tb">${md(c.text).replace('<p>', '<p>' + lemma)}${truth}</div>${refs ? `<div class="refs">see also ${refs}</div>` : ''}</div>
      ${kids.length ? `<div class="kids">${kids.map(k => threadHTML(k, vis)).join('')}</div>` : ''}`;
  }
  let sheetSpan = null;
  function openReader(rootIds, flashId) {
    const vis = shown(), tops = topsOf(vis).filter(t => !rootIds || rootIds.includes(t.id));
    if (!tops.length) return;
    sheetSpan = rootIds ? tops[0].id : null;
    $('sheetTitle').textContent = rootIds ? '“' + lemmaOf(D.passage.text.slice(Math.min(...tops.map(t => t.start)), Math.max(...tops.map(t => t.end))), 12) + '”' : 'All commentary';
    $('sheetTitle').disabled = !rootIds;
    $('sheetBody').innerHTML = tops.map(t => `<article class="thread">${threadHTML(t, vis)}</article>`).join('');
    if (!sheet.open) sheet.showModal();
    document.documentElement.classList.add('sheet-open');
    sheet.scrollTop = 0;
    const el = flashId && $('t-' + flashId);
    if (el) requestAnimationFrame(() => { el.scrollIntoView({ block: 'center' }); el.classList.add('flash') });
  }

  // Lighting: a comment lights its span in the passage and the comments it is tied to.
  function light(id, on) {
    const c = byId[id]; if (!c) return;
    const root = rootOf(c).id;
    document.querySelectorAll('.seg').forEach(s => { if (s.dataset.ids.split(' ').includes(root)) { s.classList.toggle('lit', on); s.style.setProperty('--c', ink(byId[root].author)) } });
    document.querySelectorAll(`sup.m[data-m="${root}"]`).forEach(m => m.classList.toggle('lit', on));
    document.querySelectorAll(`.c[data-on="${id}"]`).forEach(k => k.classList.toggle('kin', on));
    document.querySelectorAll(`.q[data-by="${id}"]`).forEach(q => q.classList.toggle('lit', on));
    if (c.target !== 'passage' && $(c.target)) $(c.target).classList.toggle('kin', on);
  }
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function go(id) {
    const c = byId[id]; if (!c) return;
    if (!shown().some(v => v.id === id)) { S.upTo = rounds; S.off.clear(); $('layer').value = rounds; draw() } // make sure a linked comment is visible
    if (phone.matches) return openReader([rootOf(c).id], id);
    if (sheet.open) sheet.close();
    flash($(id));
  }

  const hover = on => e => {
    const c = e.target.closest('.c'); if (c) light(c.id, on);
    const q = e.target.closest('.q'); if (q && $(q.dataset.by)) $(q.dataset.by).classList.toggle('lit', on); // a quoted phrase lights the reply that quotes it
    const m = e.target.closest('sup.m'); if (m) { light(m.dataset.m, on); const el = $(m.dataset.m); if (el) el.classList.toggle('lit', on) }
  };
  document.querySelector('.daf').addEventListener('mouseover', hover(true));
  document.querySelector('.daf').addEventListener('mouseout', hover(false));
  const pickMark = m => phone.matches ? openReader([m.dataset.m]) : flash($(m.dataset.m));
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const a = e.target.closest('.t header a'); if (a && a.hash === location.hash) return go(a.hash.slice(1)); // same link again: hashchange will not fire
    const m = e.target.closest('sup.m'); if (m) return pickMark(m);
    const c = e.target.closest('.c'); if (c && !getSelection().toString()) return openReader([c.dataset.root], c.id);
    const k = e.target.closest('[data-author]');
    if (k) { const n = k.dataset.author; S.off.has(n) ? S.off.delete(n) : S.off.add(n); draw() }
  });
  $('passage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('sup.m')) { e.preventDefault(); pickMark(e.target) } });
  $('all').addEventListener('click', () => openReader(null));
  $('sheetClose').addEventListener('click', () => sheet.close());
  $('sheetTitle').addEventListener('click', () => { const id = sheetSpan; sheet.close(); if (id) { light(id, true); flash(document.querySelector('.seg.lit')); setTimeout(() => light(id, false), 2500) } });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close() }); // click on the dimmed area
  sheet.addEventListener('close', () => document.documentElement.classList.remove('sheet-open'));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  const relayout = () => { if (sheet.open) sheet.close(); draw() };
  daf.addEventListener('change', relayout); phone.addEventListener('change', relayout);
  let pending = 0, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(pending); pending = setTimeout(() => drawCols(shown()), 150) });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawCols(shown())); // heights change once the faces load

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play' };
  $('play').hidden = rounds < 2;
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const show = n => { S.upTo = n; $('layer').value = n; draw() };
    show(1); $('play').textContent = 'Pause';
    timer = setInterval(() => { if (S.upTo >= rounds) return stop(); show(S.upTo + 1); if (S.upTo >= rounds) stop() }, 1800);
  });
  $('layer').addEventListener('input', e => { if (timer) stop(); S.upTo = +e.target.value; draw() });

  // Apparatus: what later steps found about the page, from its side files, set beneath the sheet.
  const cites = ids => {
    const s = (ids || []).filter(id => byId[id]).map(id => `<button data-go="${id}" style="text-decoration-color:${ink(byId[id].author)}" title="${esc(byId[id].author)}">${num(id)}</button>`).join(', ');
    return s ? ` <span class="refs">${s}</span>` : '';
  };
  const fmt = x => typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(2)) : esc(x ?? '');
  const grid = (head, rows) => `<div class="tbl"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const mean = xs => { xs = xs.filter(x => typeof x === 'number'); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : '' };

  // compare in redactions.json: {models, pairs: [{a, b, all, disputed, settled, unresolved}], core, only_one, uncited}
  const overlap = C => {
    if (!C || (C.models || []).length < 2) return '';
    const nm = m => esc(((SIDE.redactions.redactions || []).find(r => r.model === m) || {}).name || m);
    return `<p class="lead">Overlap of cited comments (Jaccard): ${(C.pairs || []).map(p => `${nm(p.a)} and ${nm(p.b)} ${fmt(p.all)}`).join(' · ')}${
      typeof C.uncited === 'number' ? ` · comments no redaction cites ${Math.round(C.uncited * 100)}%` : ''}. Cited by every redaction:${cites(C.core) || ' none'}</p>`;
  };

  function redactions(R) {
    if (!R || !(R.redactions || []).length) return '';
    const STATUS = [['disputed', 'Disputed'], ['settled', 'Settled'], ['unresolved', 'Unresolved']];
    const check = k => {
      const notes = [k.ids_ok === false && 'cites a comment that does not exist', k.quotes_ok === false && 'a quotation is not in the comment it cites', k.verdict].filter(Boolean);
      return notes.length ? ` <span class="on"${k.why ? ` title="${esc(k.why)}"` : ''}>${esc(notes.join('; '))}</span>` : '';
    };
    const item = i => `${inline(i.summary || '')}${cites(i.cites)}${check(i.check || {})}`;
    return `<div><h3>Redactions</h3><p class="lead">Each redactor set out what the page disputed, what it settled and what it left open, deciding nothing and citing a comment for every item.</p><div class="run">${
      R.redactions.map(r => `<div><p><b>${esc(r.name || r.model)}</b>${r.signed === false ? ' <span class="on">read the page unsigned</span>' : ''}</p>${
        r.error ? `<p class="on">Failed: ${esc(r.error)}</p>` : ''}${STATUS.map(([k, label]) => {
        const items = (r.items || []).filter(i => i.status === k);
        return items.length ? `<p><span class="st">${label}.</span> ${items.map(item).join(' ')}</p>` : '';
      }).join('')}${(r.notes || []).length ? `<p class="on" title="${esc(r.notes.join('\n'))}">${r.notes.length} item${r.notes.length === 1 ? '' : 's'} dropped or trimmed</p>` : ''}</div>`).join('')}</div>${overlap(R.compare)}</div>`;
  }

  function forecasts(F) {
    F = (F || {}).forecasts || [];
    if (!F.length) return '';
    const rs = [...new Set(F.map(f => f.round))].sort((a, b) => a - b), who = [...new Set(F.map(f => f.reader))];
    const cell = f => f && f.error ? `<span class="on" title="${esc(f.error)}">failed</span>` : f ? `<span title="Named ${esc((f.predicted || []).map(num).join(', ') || 'none')}; of those, ${esc((f.hits || []).map(num).join(', ') || 'none')} drew replies">${(f.hits || []).length}/${(f.predicted || []).length}</span> <span class="on">${fmt(f.chance)}</span>` : '';
    return `<div><h3>Forecasts</h3><p class="lead">Before each round, each reader named the comments it expected to draw replies. A cell gives how many did out of how many it named, then the rate chance would give.</p>${
      grid(['Reader', ...rs.map(r => 'Round ' + r), 'Precision', 'Recall', 'Chance'], who.map(w => {
        const mine = F.filter(f => f.reader === w);
        return [esc(w), ...rs.map(r => cell(mine.find(f => f.round === r))), fmt(mean(mine.map(f => f.precision))), fmt(mean(mine.map(f => f.recall))), fmt(mean(mine.map(f => f.chance)))];
      }))}</div>`;
  }

  function rulings(RU) {
    if (!RU || !(RU.rulings || []).length) return '';
    const all = RU.rulings, nm = r => r.name || r.model;
    const cases = (RU.cases || []).length ? RU.cases : [...new Set(all.map(r => r.case))].map(id => ({ id }));
    const models = [...new Set(all.map(nm))];
    // A ruling's option is the option's text (radbinical/caselaw.py); shown as its letter, A, B, ...
    const letterOf = (cs, o) => { const c = cases.find(c => c.id === cs), i = c && Array.isArray(c.options) ? c.options.indexOf(o) : -1; return i >= 0 ? String.fromCharCode(65 + i) : String(o) };
    const opts = rs => [...new Set(rs.filter(r => r.option != null).map(r => letterOf(r.case, r.option)))].join(' / ');
    const why = rs => esc(rs.map(r => r.error ? 'Failed: ' + r.error : r.reason).filter(Boolean).join('\n\n'));
    const cell = (cs, m) => {
      const of = cond => all.filter(r => r.case === cs && nm(r) === m && r.condition === cond), b = of('bare'), p = of('page');
      if (!b.length && !p.length) return '';
      return `<span title="${why(b)}">${esc(opts(b) || '–')}</span> → <span class="${opts(b) !== opts(p) ? 'diff' : ''}" title="${why(p)}">${esc(opts(p) || '–')}</span>${cites(p.flatMap(r => r.cites || []))}`;
    };
    const opt = c => Array.isArray(c.options) && c.options.length ? ` <span class="on">${c.options.map((o, i) => `${String.fromCharCode(65 + i)}. ${esc(o)}`).join(' · ')}</span>` : '';
    // summary in rulings.json: {conditions: {bare, page: {agreement, pairwise, ...}}, changed: {count, of}, note}
    const S2 = RU.summary || {}, cond = S2.conditions || {}, ch = S2.changed;
    const agreed = cond.bare || cond.page ? `<p class="lead">Agreement between models: ${fmt(cond.bare && cond.bare.agreement)} on the bare passage, ${fmt(cond.page && cond.page.agreement)} with the page${
      ch ? `; ${fmt(ch.count)} of ${fmt(ch.of)} rulings changed` : ''}. ${esc(S2.note || '')}</p>` : '';
    return `<div><h3>Rulings</h3><p class="lead">Each model ruled on each case twice, first on the bare passage, then with the page before it. A cell reads bare → with the page, in bold where the two differ; numbers are the comments it cited.</p>${
      grid(['Case', ...models.map(esc)], cases.map(c => [`<b>${esc(c.id)}</b>`, ...models.map(m => cell(c.id, m))]))}${
      cases.filter(c => c.question || c.case).map(c => `<p><b>${esc(c.id)}.</b> ${inline(c.case || '')}${c.case && c.question ? ' ' : ''}${inline(c.question || '')}${opt(c)}</p>`).join('')}${agreed}</div>`;
  }

  function amendments(A) {
    if (!A || !(A.versions || []).length) return '';
    const props = A.proposals || [], used = new Set(A.versions.flatMap(v => v.from_proposals || []));
    const votes = p => esc((p.votes || []).map(v => `${v.reader}: ${v.vote}${v.why ? ' (' + v.why + ')' : ''}`).join('\n'));
    // A proposal is "open" (not yet voted on), "invalid" (never put to the vote) or "closed"; see radbinical/amend.py.
    const fate = p => p.status === 'open' ? 'waiting for the vote' : p.status === 'invalid' ? 'not put to the vote'
      : `${p.yes || 0} for, ${p.no || 0} against${p.abstain ? `, ${p.abstain} abstaining` : ''} · ${p.applied ? 'applied' : p.passed ? 'passed, not applied' : 'not passed'}`;
    const prop = p => `<p><del>${esc(p.quote || '')}</del> <ins>${esc(p.replacement || '')}</ins> <span class="on" title="${votes(p)}">${esc(p.author || '')} · version ${esc(p.version ?? '')} · ${fate(p)}${p.note ? ` (${esc(p.note)})` : ''}</span>${p.reason ? ' ' + inline(p.reason) : ''}${cites(p.cites)}</p>`;
    const rest = props.filter(p => !used.has(p.id));
    return `<div><h3>Amendments</h3><p class="lead">${A.question ? inline(A.question) + ' · ' : ''}${A.threshold != null ? 'votes to pass ' + fmt(A.threshold) + ' · ' : ''}${A.versions.length} version${A.versions.length === 1 ? '' : 's'}</p>${
      A.versions.map(v => `${(v.from_proposals || []).map(id => props.find(p => p.id === id)).filter(Boolean).map(prop).join('')}<p><span class="st">Version ${esc(v.n)}.</span> ${inline(v.text || '')}</p>`).join('')}${
      rest.length ? `<p><span class="st">Proposed and not applied.</span></p>${rest.map(prop).join('')}` : ''}</div>`;
  }

  function plants(PL) {
    if (!S.plants || !PL || !(PL.plants || []).length) return '';
    return `<div><h3>Planted comments</h3><p class="lead">Comments placed on the page under a reader's name, to see whether the others catch a slip or dismiss a sound reading${PL.judge ? `; judged by ${esc(PL.judge)}` : ''}.</p>${
      grid(['Comment', 'Sort', 'Under the name of', 'Round', 'Replies', 'Outcome', 'Rounds to catch'], PL.plants.map(p => {
        const o = outcome(p), counts = Object.entries(p.counts || {}).filter(([, n]) => n).map(([v, n]) => `${n} ${esc(v)}`).join(', ');
        const reps = p.replies || [], own = reps.filter(r => r.nominal_author).length;
        const note = [counts, own ? `${own} by its nominal author, not counted` : ''].filter(Boolean).join('; ');
        return [cites([p.id]) || esc(p.id), p.sort === 'sound' ? 'sound reading' : 'slip', esc(p.author || ''), fmt(p.round),
          `${reps.length - own}${note ? ` <span class="on">${note}</span>` : ''}`,
          o ? esc(o.text) + (o.when ? ` in round ${esc(o.when)}` : '') : 'not judged', fmt(p.rounds_to_catch)];
      }))}${(PL.notes || []).length ? `<p class="on">${PL.notes.length} note${PL.notes.length === 1 ? '' : 's'} from judging, in plants.json.</p>` : ''}</div>`;
  }

  function drawApparatus() {
    const parts = [redactions(SIDE.redactions), forecasts(SIDE.forecasts), rulings(SIDE.rulings), amendments(SIDE.amendments), plants(SIDE.plants)].filter(Boolean);
    $('apparatus').innerHTML = parts.length ? '<h2>Apparatus</h2>' + parts.join('') : '';
    $('apparatus').hidden = !parts.length;
  }

  $('plants').hidden = !D.comments.some(isPlant);
  $('plants').addEventListener('click', e => { S.plants = !S.plants; e.target.setAttribute('aria-pressed', S.plants); if (sheet.open) sheet.close(); draw(); drawApparatus() });
  if (D.site && D.site.workflow) {
    const a = $('again');
    a.href = D.site.workflow; a.hidden = false;
    a.title = `Opens the Run workflow on GitHub. Only the repository owner can start it: choose mode “extend” and enter this run's name, ${D.site.run}.`;
  }

  // Printing: one poster sheet. PAPER is A1 landscape; for A3 landscape use { w: 420, h: 297, margin: 10 }.
  const PAPER = { w: 841, h: 594, margin: 12 };
  $('paper').textContent = `@page { size: ${PAPER.w}mm ${PAPER.h}mm; margin: ${PAPER.margin}mm }`;
  const px = mm => mm * 96 / 25.4, root = document.documentElement;
  function fitPrint() {
    if (sheet.open) sheet.close();
    const W = px(PAPER.w - 2 * PAPER.margin), H = px(PAPER.h - 2 * PAPER.margin), wrap = document.querySelector('.wrap');
    root.classList.add('printing'); root.style.setProperty('--print-w', W + 'px');
    const fits = fs => { root.style.setProperty('--print-fs', fs + 'px'); drawCols(shown()); return wrap.offsetHeight <= H * 0.98 }; // a little room, since paper rounds lines differently
    let lo = 4, hi = W / 92; // at hi the sheet keeps its on-screen proportions, scaled up to the paper's width
    if (fits(hi)) return;
    for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid }
    fits(lo);
  }
  addEventListener('beforeprint', fitPrint);
  addEventListener('afterprint', () => { root.classList.remove('printing'); drawCols(shown()) });
  $('print').addEventListener('click', () => print());

  const f = D.flags, row = (k, v) =>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  $('made').innerHTML = `
    <div><h2>Reading the page</h2><p>The inner column holds comments on the passage, in the order of the words they attach to; small numbers in the passage show where each begins. The outer column holds comments on comments, each marked with the number it answers. Whichever column runs longer continues across the bottom. Select a comment to read its whole thread.</p></div>
    <div><h2>Readers</h2><div class="tbl"><table>${D.readers.map(r => row(r.name, r.model)).join('')}</table></div></div>
    <div><h2>Settings</h2><div class="tbl"><table>${Object.entries(f).map(([k, v]) => row(k, v === null ? 'none' : v)).join('')}</table></div></div>
    <div><h2>What each reader was told</h2><pre>${esc(D.prompt_example || '')}</pre></div>
    ${authors.some(brandOf) ? '<div><h2>Logos</h2><p>Each reader is marked with its maker\'s logo and brand colour, to show whose model wrote what. The marks belong to their owners. Icons are linked from the <a href="https://github.com/lobehub/lobe-icons">lobe-icons</a> set.</p></div>' : ''}
    <div><h2>Round by round</h2><div class="tbl"><table><tr><th>Round</th><th>Reader</th><th>Comments</th><th>Note</th></tr>${
      [...D.log].sort((a, b) => a.layer - b.layer).map(l =>`<tr><td>${l.layer}</td><td>${esc(l.reader)}</td><td>${l.comments}</td><td>${esc(l.error ? 'Failed: ' + l.error : (l.closing || ''))}</td></tr>`).join('')}</table></div></div>`;
  draw(); drawApparatus();
  if (authors.some(brandOf)) { // logos are linked, not bundled: show them only once one is known to load
    const probe = new Image();
    probe.onload = () => { S.icons = true; draw() };
    probe.src = ICONS + 'claude.svg';
  }
  if (location.hash) go(location.hash.slice(1));
}
start();
</script>
