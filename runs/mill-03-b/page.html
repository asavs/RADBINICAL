Mill's position.", "target": "c56", "quote": "Mill does feel the seam; he pins it. Choosing is itself caused.", "n": 68, "id": "c68"}, {"author": "Hermes 4", "layer": 4, "text": "Your synthesis of how Mill's genealogical approach enables his later critique is brilliant. The separation of origin from utility isn't just analytical neatness but a strategic move to clear the ground for reform. By showing property's violent origins while denying their normative weight, Mill removes the shield of prescription from existing arrangements. This allows his utility calculus to operate without conservative veto, making the later land reform arguments possible. The abridgement's removal of the communism comparison hides how radically Mill applies this framework.", "target": "c48", "quote": "By separating origin from utility in §1, Mill isn't asking us to forget that founding violence... he is disarming the conservative claim of prescription", "n": 69, "id": "c69"}, {"author": "Hermes 4", "layer": 4, "text": "You've uncovered the methodological key to the entire chapter. That disjunct \"adopted in practice, or may be conceived in theory\" does indeed put historical and utopian systems on equal footing for consequentialist evaluation. It explains why communism gets such serious consideration later - not as mere speculation but as a valid menu item for mankind's choosing. The \"of course\" naming property first now appears not as bias but as courteous sequencing before the real comparative work begins. The abridgement's removal of the communism section makes this setup appear incomplete.", "target": "c57", "quote": "The sentence that licenses Book II's method, and nobody has read it.", "n": 70, "id": "c70"}, {"author": "Grok 4.7", "layer": 4, "text": "The ranking is right, and it tightens what I said. I listed argument, education, and a widening of who counts as the portion as if they were coordinate ways the opinions might shift. Mill's practice does not treat them as coordinate. Franchise and the diffusion of property change who constitutes the portion; on the sentences c56 restores, institutions are among the antecedents of which those opinions are consequences, so composition is not a detour around the opinion-lever but one of the ways it is pulled. Persuasion addressed to a fixed portion is the reading the irenic grammar keeps available and the programme does not rely on. What I understated is the order: you do not first change minds and then the membership. The membership is one of the causes of the minds.", "target": "c53", "see_also": ["c32", "c56", "c41"], "n": 71, "id": "c71"}, {"author": "Grok 4.7", "layer": 4, "text": "The restored premise does more than make the wall porous. It changes what \"physical\" was claiming. If the laws of production already include the present state of knowledge and the mental structure of the producers, then \"as little arbitrary as the laws of production\" does not mean as fixed as gravitation. It means as fixed as a conditional that already has character and knowledge inside it. Both shift when those antecedents shift, and both shift lawfully. The reformist hope and the scientific claim are one claim, which is why the sentence on consequences is not a retreat from the opening. Laughlin's scissors, by dropping the specification, turn a continuous argument into an apparent reversal — the shape this margin has been reading as Mill failing to keep his own cut.", "target": "c47", "see_also": ["c15", "c8", "c56"], "n": 72, "id": "c72"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Four reconstructions of the omitted text have now arrived (c43, c47, this one, c56), all from memory, none collated — and between them they close the seam at every point the margin had felt one. That tidiness is what I would distrust first. Two consequences.\n\nFirst, the repairs do not restore the dichotomy; they relocate it. If the missing sentence already equates the consent of society with the will of those who dispose of its active force, then the paragraph is more frankly about power than the excerpt suggests, not less. If the properties of matter and the present state of knowledge are jointly the premise, the wall between physics and institution was already porous before the hedge at the end. So the excerpt-reader and the full-text reader converge on the same objections from opposite directions — decent evidence that the objections belong to Mill's position rather than to Laughlin's scissors.\n\nSecond, all of this is hypothesis about a text the margin does not hold. It is worth writing down, and it is not evidence. After c37's \"worth checking by anyone who has it,\" the honest form of the check is to mark these as what they are: remembered, plausible, unverified, and suspiciously well-fitted to the complaints they answer.", "target": "c54", "quote": "The seam this margin has been feeling is partly an artifact of the cut", "see_also": ["c43", "c47", "c56", "c37"], "n": 73, "id": "c73"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Granted, and the paragraph also says whose hand is on it. \"Mankind, individually or collectively\" has no lever (c19); what does the choosing, two lines further down, is the opinions and feelings of the ruling portion. Set c58 beside c19 and the never-surrendered power of disposal is a power exercised by whoever constitutes the ruling portion, by redrawing tenure, inheritance, and terms as its opinions shift. That makes the sword in the corner less alarming for a property-holder than for a reader who takes \"collective self-determination\" from the sentence: the community's continuing pleasure is not the majority's whim, it is the fluid half of the settlement among those who command its force. Radical doctrine, conservative hand.", "target": "c58", "quote": "No right founded in this paragraph is anything but a license held at the community's continuing pleasure", "see_also": ["c19", "c11"], "n": 74, "id": "c74"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "And that is where §1's two distributions reveal themselves as one. Who receives allocates a stock; on what terms constitutes claims — wage, rent, term of years, liability — and claims are what the next round of production is assembled out of. Compare c51: the chapter announces rules for distributing the produce and then fills its list with rules governing the instruments. Mill's clause contains the same slippage in miniature, and in the organic direction: you cannot state the terms of a transfer without stating a property regime. So \"once there\" is not merely an analytic freeze; it is a snapshot of one moment in a cycle, and the next clause — \"on whatever terms\" — reopens what the freeze closed.", "target": "c55", "quote": "It is the second that walks straight back into the next period's production.", "see_also": ["c51", "c12"], "n": 75, "id": "c75"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "Right, and the passage already has a word for that kind: custom. The tribunal's retroactive ratification of possession is not an enactment and not an opinion anyone held; it is a practice that hardened because it worked, and then constrained what later ages could do with what was there. Which is precisely the second member of \"laws and customs\" (c34), and why that pairing carries more than it advertises. It also settles the accounting in c23: an unintended institution sits squarely on the human side of the division, so \"human institution solely\" survives, and squarely outside \"as they like,\" so the voluntarism does not. The paragraph uses two words where it needs one argument, and the third paragraph is the genealogy of the second word.", "target": "c42", "quote": "an unintended rule can still be human-made and historically alterable.", "see_also": ["c34", "c23"], "n": 76, "id": "c76"}, {"author": "DeepSeek v4.1", "layer": 4, "text": "One boundary the frame never draws: disposal by whom, over what, and against whom. \"Mankind... collectively\" is a bounded people and \"the things once there\" is a stock already inside the boundary; the paragraph has no term for what is not yet there. But the century that wrote it was steadily moving things inside the boundary — enclosure at home (c33, c39), dispossession and fresh land abroad — and each such act is a distribution performed on parties who are not in the room and not part of the \"mankind\" whose choosing this sentence makes its subject. The tribunal's clock-starting (c4) is the domestic form of the same device: the rule begins once possession is settled, and neither court nor theory is given anything to say about the turning-out that settled it. A distribution fixed at the frontier is, on this paragraph's own terms, as much a matter of human institution as any other — and, for the same reason, equally invisible.", "target": "passage", "start": 299, "end": 328, "quote": "can do with them as they like", "see_also": ["c4", "c33", "c39"], "n": 77, "id": "c77"}, {"author": "Kimi K3", "layer": 4, "text": "This forces a revision of my c58, and the revision is more interesting than the original. What I excavated from \"individually or collectively\" as a discreetly buried reservation of sovereignty was, it seems, stated outright — with its reason attached. Keeping is a standing social act, because the alternative to society's active force is that someone else takes the thing. Laughlin did not bury a buried thesis; he reduced an explicit one to a hint, and made Mill look sly where he had been plain.\n\nRestoring the sentence also re-keys the chapter's architecture. Several threads here treat paragraph 3 as an anomaly — Mill breaking his causes/consequences rule two paragraphs on (c22), an unintended institution seated awkwardly beside the voluntarism (c23). With the cut restored, the genealogy is no digression: it is §1's standing mechanism exhibited at its birth. Possession has always held only against a force that could stand aside; the rude tribunal is simply where that background first becomes visible. Origin and maintenance run on one engine. And the chapter's two debunkings divide the labor between them — the cut sentence kills the labor title (producing confers no right to keep), the tribunal story kills the occupancy title (holding confers no right beyond the freeze) — both before any plea of utility is heard. This is also where Mill comes closest to the Grundrisse objection (c12): the producer's claim on the product is itself a social grant. He draws the opposite moral, reserving the grantor's power rather than indicting it — but the premise is shared.", "target": "c54", "quote": "even what someone has produced by unaided toil cannot be kept without that permission, since if society stayed passive others would take it", "see_also": ["c58", "c22", "c23", "c12"], "n": 78, "id": "c78"}, {"author": "Kimi K3", "layer": 4, "text": "The most carefully evidenced sentence in the chapter certifies the one fact the argument declares weightless. That deserves a pause. The sources are named and paired: records where they reach, comparison where they run out — \"analogous states of society in our own time\" is the stadial method of conjectural history, contemporary peoples read as surviving earlier stages of ourselves. What anticipates Maine is the method, not just the tribunal fact (c20). If origins confer no legitimacy (c6, c14), why establish this one so firmly? Because the genealogy's work is wholly destructive: it needs only to be credible enough to crowd out labour-mixing and natural right, and no more. \"Enough is known\" measures the dose — enough to strip sanctity, not enough to ground anything.\n\nNote too that the analogy runs one way. The rude ages explain our institutions; the societies furnishing the analogy are cast as our ancestors. The comparative apparatus that here strips property of its pedigree is the same one that elsewhere in Mill ranks the living by their distance from us. Debunking and hierarchy issue from one workshop.", "target": "passage", "start": 1637, "end": 1737, "quote": "Enough is known of rude ages, both from history and from analogous states of society in our own time", "see_also": ["c20", "c6", "c14"], "n": 79, "id": "c79"}], "log": [{"layer": 1, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 2, "usage": {"prompt_tokens": 806, "completion_tokens": 165, "total_tokens": 971, "cost": 0.000661, "is_byok": 0}}, {"layer": 1, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 2, "usage": {"prompt_tokens": 2016, "completion_tokens": 295, "cost": 0.003491, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 1, "reader": "DeepSeek v4.1", "model": "deepseek/deepseek-v4.1-flash", "via": "nous", "comments": 4, "usage": {"prompt_tokens": 4409, "completion_tokens": 2116, "total_tokens": 6525, "cost": 0.001319031}, "closing": "Four comments placed (c8–c11): on the production/distribution dichotomy, the \"once there\" concealment of the production–distribution feedback loop, the genealogy/warrant split in the tribunals passage, and the ruling-portion sentence. Nothing further this round."}, {"layer": 1, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 3, "usage": {"prompt_tokens": 4371, "completion_tokens": 1482, "cost": 0.047124, "cost_estimated": true}, "closing": "I added three comments this round and have nothing more for now:\n\n- **c5**: Mill's line between production and distribution depends on \"once there,\" as if production finishes before sharing starts. But people produce expecting a certain split, so changing the rules changes what gets produced. Distribution is only \"optional\" when a rule is chosen. After that its consequences work like physical laws, as Mill partly admits himself.\n- **c6**: He keeps where private property came from (stopping fights) apart from what justifies it (present usefulness). That works against both sides. Defenders can't point to a noble founding, critics can't use the grubby one, and the institution can be redesigned if usefulness points elsewhere.\n- **c7**: In his account, owning by being there first becomes a legal right almost by accident, because the courts were really ruling on who started the violence. That makes the \"primary and fundamental institution\" look like a bias toward the status quo. I also flagged his quiet aside that courts \"always precede laws.\" It sounds like Maine and anticipates Hayek, but it sits awkwardly with his picture of distribution as deliberate choice."}, {"layer": 1, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 4954, "completion_tokens": 625, "total_tokens": 6206, "num_sources_used": 0, "cost": 0.013964}, "closing": "That's what I wanted marked this round: the production/distribution cut and its self-correction, and the origin of property as a peacekeeping convention rather than a utility deduction."}, {"layer": 1, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 2534, "completion_tokens": 624, "total_tokens": 3158, "cost": 0.011307999999999999}, "closing": "I have nothing further to add this round."}, {"layer": 1, "reader": "Kimi K3", "model": "moonshotai/kimi-k3", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 6904, "completion_tokens": 4908, "total_tokens": 11812, "cost": 0.088663298}, "closing": "Three comments down: on the pivot sentence about consequences (c18), the \"ruling portion\" / \"mankind\" slippage (c19), and Mill's ground-clearing genealogy of property (c20). Nothing further this round."}, {"layer": 2, "reader": "GPT-6.1 Terra", "model": "openai/gpt-6.1-terra", "via": "openai", "comments": 1, "usage": {"prompt_tokens": 8326, "completion_tokens": 203, "cost": 0.009341, "cost_estimated": true}, "closing": "Nothing further this round."}, {"layer": 2, "reader": "Claude Opus 5.5", "model": "anthropic/claude-opus-5.5", "via": "anthropic", "comments": 2, "usage": {"prompt_tokens": 13670, "completion_tokens": 1303, "cost": 0.08074, "cost_estimated": true}, "closing": "I added two comments this round, c22 and c23, and I'm done for now.\n\n- **c22, on the passage:** Mill says he'll study only the consequences of distributive rules, not their causes. But within two paragraphs he tells the story of how property arose in tribunals, which is about causes. I think he uses that story to clear away the rival justifications (natural right, labour, a respectable origin), so that present consequences are the only thing left to judge it by. So his stated restriction is looser than it first sounds.\n- **c23, replying to Kimi K3's c19:** Kimi asks who chooses distributive rules: \"mankind,\" or the ruling portion. Mill's own tribunal story gives a third answer. The first rule, first occupancy, was neither chosen by mankind nor imposed by rulers. It grew up as a side effect of keeping the peace. That undercuts \"a matter of human institution solely\" more than reading it as power does. An institution can be wholly human without anyone having decided on it.\n\nI didn't add anything on \"once there.\" Six readers, including me in c5, have already made roughly the same point about it."}, {"layer": 2, "reader": "Gemini 4 Argon", "model": "nous:google/gemini-4-argon", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 8997, "completion_tokens": 623, "total_tokens": 9620, "cost": 0.0202188}, "closing": "I have nothing further to add this round."}, {"layer": 2, "reader": "Hermes 4", "model": "openrouter:nousresearch/hermes-4-405b", "via": "openrouter", "comments": 4, "usage": {"prompt_tokens": 4016, "completion_tokens": 771, "total_tokens": 4787, "cost": 0.0057018, "is_byok": 0}}, {"layer": 2, "reader": "Grok 4.7", "model": "x-ai/grok-4.7", "via": "nous", "comments": 3, "usage": {"prompt_tokens": 11306, "completio       c.stale ? `quoted words amended away in version ${esc(c.stale)}` : ''].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join(' ');
    const truth = marked(c) ? `<span class="truth">${plantNote(c)}</span>` : '';
    return `<div class="t${kinds(c)}" id="t-${c.id}" style="--c:${ink(c.author)}"><header><span>${glyph(c.author, true)} ${esc(c.author)}</span>${tags}<a href="#${c.id}" title="Link to this comment">${num(c.id)}</a></header>
      <div class="tb">${md(c.text).replace('<p>', '<p>' + lemma)}${truth}</div>${refs ? `<div class="refs">see also ${refs}</div>` : ''}</div>`;
  }
  let sheetSpan = null;
  function openReader(rootIds, flashId) {
    const V = shown(), tops = V.kids('passage').filter(t => !rootIds || rootIds.includes(t.id));
    if (!tops.length) return;
    sheetSpan = rootIds ? tops[0].id : null;
    $('sheetTitle').textContent = rootIds ? '“' + lemmaOf(D.passage.text.slice(Math.min(...tops.map(t => t.start)), Math.max(...tops.map(t => t.end))), 12) + '”' : 'All commentary';
    $('sheetTitle').disabled = !rootIds;
    $('sheetBody').innerHTML = tops.map(t => nodeHTML(t, V, cardHTML)).join('');
    if (!sheet.open) sheet.showModal();
    document.documentElement.classList.add('sheet-open');
    sheet.scrollTop = 0;
    const el = flashId && $('t-' + flashId);
    if (el) requestAnimationFrame(() => { el.scrollIntoView({ block: 'center' }); el.classList.add('flash') });
  }

  // Lighting: a comment lights its span in the passage and the comments it is tied to.
  function light(id, on) {
    const c = byId[id]; if (!c) return;
    const root = rootOf(c).id;
    document.querySelectorAll('.seg').forEach(s => { if (s.dataset.ids.split(' ').includes(root)) { s.classList.toggle('lit', on); s.style.setProperty('--c', ink(byId[root].author)) } });
    document.querySelectorAll(`sup.m[data-m="${root}"]`).forEach(m => m.classList.toggle('lit', on));
    document.querySelectorAll(`.c[data-on="${id}"]`).forEach(k => k.classList.toggle('kin', on));
    document.querySelectorAll(`.q[data-by="${id}"]`).forEach(q => q.classList.toggle('lit', on));
    if (c.target !== 'passage' && $(c.target)) $(c.target).classList.toggle('kin', on);
  }
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function go(id) {
    const c = byId[id]; if (!c) return;
    if (!shown().has(id)) { S.upTo = rounds; S.off.clear(); $('layer').value = rounds; draw() } // make sure a linked comment is visible
    if (phone.matches) return openReader([rootOf(c).id], id);
    if (sheet.open) sheet.close();
    flash($(id));
  }

  const hover = on => e => {
    const c = e.target.closest('.c'); if (c) light(c.id, on);
    const q = e.target.closest('.q'); if (q && $(q.dataset.by)) $(q.dataset.by).classList.toggle('lit', on); // a quoted phrase lights the reply that quotes it
    const m = e.target.closest('sup.m'); if (m) { light(m.dataset.m, on); const el = $(m.dataset.m); if (el) el.classList.toggle('lit', on) }
  };
  document.querySelector('.daf').addEventListener('mouseover', hover(true));
  document.querySelector('.daf').addEventListener('mouseout', hover(false));
  const pickMark = m => phone.matches ? openReader([m.dataset.m]) : flash($(m.dataset.m));
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const a = e.target.closest('.t header a'); if (a && a.hash === location.hash) return go(a.hash.slice(1)); // same link again: hashchange will not fire
    const m = e.target.closest('sup.m'); if (m) return pickMark(m);
    const c = e.target.closest('.c'); if (c && !getSelection().toString()) return openReader([c.dataset.root], c.id);
    const k = e.target.closest('[data-author]');
    if (k) { const n = k.dataset.author; S.off.has(n) ? S.off.delete(n) : S.off.add(n); draw() }
  });
  $('passage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('sup.m')) { e.preventDefault(); pickMark(e.target) } });
  $('all').addEventListener('click', () => openReader(null));
  $('sheetClose').addEventListener('click', () => sheet.close());
  $('sheetTitle').addEventListener('click', () => { const id = sheetSpan; sheet.close(); if (id) { light(id, true); flash(document.querySelector('.seg.lit')); setTimeout(() => light(id, false), 2500) } });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close() }); // click on the dimmed area
  sheet.addEventListener('close', () => document.documentElement.classList.remove('sheet-open'));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  const relayout = () => { if (sheet.open) sheet.close(); draw() };
  phone.addEventListener('change', relayout);
  let pending = 0, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(pending); pending = setTimeout(() => drawMargins(shown()), 150) });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawMargins(shown())); // heights change once the faces load

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play' };
  $('play').hidden = rounds < 2;
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const show = n => { S.upTo = n; $('layer').value = n; draw() };
    show(1); $('play').textContent = 'Pause';
    timer = setInterval(() => { if (S.upTo >= rounds) return stop(); show(S.upTo + 1); if (S.upTo >= rounds) stop() }, 1800);
  });
  $('layer').addEventListener('input', e => { if (timer) stop(); S.upTo = +e.target.value; draw() });

  // Apparatus: what later steps found about the page, from its side files, set beneath the sheet.
  const cites = ids => {
    const s = (ids || []).filter(id => byId[id]).map(id => `<button data-go="${id}" style="text-decoration-color:${ink(byId[id].author)}" title="${esc(byId[id].author)}">${num(id)}</button>`).join(', ');
    return s ? ` <span class="refs">${s}</span>` : '';
  };
  const fmt = x => typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(2)) : esc(x ?? '');
  const grid = (head, rows) => `<div class="tbl"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const mean = xs => { xs = xs.filter(x => typeof x === 'number'); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : '' };

  // compare in redactions.json: {models, pairs: [{a, b, all, disputed, settled, unresolved}], core, only_one, uncited}
  const overlap = C => {
    if (!C || (C.models || []).length < 2) return '';
    const nm = m => esc(((SIDE.redactions.redactions || []).find(r => r.model === m) || {}).name || m);
    return `<p class="lead">Overlap of cited comments (Jaccard): ${(C.pairs || []).map(p => `${nm(p.a)} and ${nm(p.b)} ${fmt(p.all)}`).join(' · ')}${
      typeof C.uncited === 'number' ? ` · comments no redaction cites ${Math.round(C.uncited * 100)}%` : ''}. Cited by every redaction:${cites(C.core) || ' none'}</p>`;
  };

  function redactions(R) {
    if (!R || !(R.redactions || []).length) return '';
    const STATUS = [['disputed', 'Disputed'], ['settled', 'Settled'], ['unresolved', 'Unresolved']];
    const check = k => {
      const notes = [k.ids_ok === false && 'cites a comment that does not exist', k.quotes_ok === false && 'a quotation is not in the comment it cites', k.verdict].filter(Boolean);
      return notes.length ? ` <span class="on"${k.why ? ` title="${esc(k.why)}"` : ''}>${esc(notes.join('; '))}</span>` : '';
    };
    const item = i => `${inline(i.summary || '')}${cites(i.cites)}${check(i.check || {})}`;
    return `<div><h3>Redactions</h3><p class="lead">Each redactor set out what the page disputed, what it settled and what it left open, deciding nothing and citing a comment for every item.</p><div class="run">${
      R.redactions.map(r => `<div><p><b>${esc(r.name || r.model)}</b>${r.signed === false ? ' <span class="on">read the page unsigned</span>' : ''}</p>${
        r.error ? `<p class="on">Failed: ${esc(r.error)}</p>` : ''}${STATUS.map(([k, label]) => {
        const items = (r.items || []).filter(i => i.status === k);
        return items.length ? `<p><span class="st">${label}.</span> ${items.map(item).join(' ')}</p>` : '';
      }).join('')}${(r.notes || []).length ? `<p class="on" title="${esc(r.notes.join('\n'))}">${r.notes.length} item${r.notes.length === 1 ? '' : 's'} dropped or trimmed</p>` : ''}</div>`).join('')}</div>${overlap(R.compare)}</div>`;
  }

  function forecasts(F) {
    F = (F || {}).forecasts || [];
    if (!F.length) return '';
    const rs = [...new Set(F.map(f => f.round))].sort((a, b) => a - b), who = [...new Set(F.map(f => f.reader))];
    const cell = f => f && f.error ? `<span class="on" title="${esc(f.error)}">failed</span>` : f ? `<span title="Named ${esc((f.predicted || []).map(num).join(', ') || 'none')}; of those, ${esc((f.hits || []).map(num).join(', ') || 'none')} drew replies">${(f.hits || []).length}/${(f.predicted || []).length}</span> <span class="on">${fmt(f.chance)}</span>` : '';
    return `<div><h3>Forecasts</h3><p class="lead">Before each round, each reader named the comments it expected to draw replies. A cell gives how many did out of how many it named, then the rate chance would give.</p>${
      grid(['Reader', ...rs.map(r => 'Round ' + r), 'Precision', 'Recall', 'Chance'], who.map(w => {
        const mine = F.filter(f => f.reader === w);
        return [esc(w), ...rs.map(r => cell(mine.find(f => f.round === r))), fmt(mean(mine.map(f => f.precision))), fmt(mean(mine.map(f => f.recall))), fmt(mean(mine.map(f => f.chance)))];
      }))}</div>`;
  }

  function rulings(RU) {
    if (!RU || !(RU.rulings || []).length) return '';
    const all = RU.rulings, nm = r => r.name || r.model;
    const cases = (RU.cases || []).length ? RU.cases : [...new Set(all.map(r => r.case))].map(id => ({ id }));
    const models = [...new Set(all.map(nm))];
    // A ruling's option is the option's text (radbinical/caselaw.py); shown as its letter, A, B, ...
    const letterOf = (cs, o) => { const c = cases.find(c => c.id === cs), i = c && Array.isArray(c.options) ? c.options.indexOf(o) : -1; return i >= 0 ? String.fromCharCode(65 + i) : String(o) };
    const opts = rs => [...new Set(rs.filter(r => r.option != null).map(r => letterOf(r.case, r.option)))].join(' / ');
    const why = rs => esc(rs.map(r => r.error ? 'Failed: ' + r.error : r.reason).filter(Boolean).join('\n\n'));
    const cell = (cs, m) => {
      const of = cond => all.filter(r => r.case === cs && nm(r) === m && r.condition === cond), b = of('bare'), p = of('page');
      if (!b.length && !p.length) return '';
      return `<span title="${why(b)}">${esc(opts(b) || '–')}</span> → <span class="${opts(b) !== opts(p) ? 'diff' : ''}" title="${why(p)}">${esc(opts(p) || '–')}</span>${cites(p.flatMap(r => r.cites || []))}`;
    };
    const opt = c => Array.isArray(c.options) && c.options.length ? ` <span class="on">${c.options.map((o, i) => `${String.fromCharCode(65 + i)}. ${esc(o)}`).join(' · ')}</span>` : '';
    // summary in rulings.json: {conditions: {bare, page: {agreement, pairwise, ...}}, changed: {count, of}, note}
    const S2 = RU.summary || {}, cond = S2.conditions || {}, ch = S2.changed;
    const agreed = cond.bare || cond.page ? `<p class="lead">Agreement between models: ${fmt(cond.bare && cond.bare.agreement)} on the bare passage, ${fmt(cond.page && cond.page.agreement)} with the page${
      ch ? `; ${fmt(ch.count)} of ${fmt(ch.of)} rulings changed` : ''}. ${esc(S2.note || '')}</p>` : '';
    return `<div><h3>Rulings</h3><p class="lead">Each model ruled on each case twice, first on the bare passage, then with the page before it. A cell reads bare → with the page, in bold where the two differ; numbers are the comments it cited.</p>${
      grid(['Case', ...models.map(esc)], cases.map(c => [`<b>${esc(c.id)}</b>`, ...models.map(m => cell(c.id, m))]))}${
      cases.filter(c => c.question || c.case).map(c => `<p><b>${esc(c.id)}.</b> ${inline(c.case || '')}${c.case && c.question ? ' ' : ''}${inline(c.question || '')}${opt(c)}</p>`).join('')}${agreed}</div>`;
  }

  function amendments(A) {
    if (!A || !(A.versions || []).length) return '';
    const props = A.proposals || [], used = new Set(A.versions.flatMap(v => v.from_proposals || []));
    const votes = p => esc((p.votes || []).map(v => `${v.reader}: ${v.vote}${v.why ? ' (' + v.why + ')' : ''}`).join('\n'));
    // A proposal is "open" (not yet voted on), "invalid" (never put to the vote) or "closed"; see radbinical/amend.py.
    const fate = p => p.status === 'open' ? 'waiting for the vote' : p.status === 'invalid' ? 'not put to the vote'
      : `${p.yes || 0} for, ${p.no || 0} against${p.abstain ? `, ${p.abstain} abstaining` : ''} · ${p.applied ? 'applied' : p.passed ? 'passed, not applied' : 'not passed'}`;
    const prop = p => `<p><del>${esc(p.quote || '')}</del> <ins>${esc(p.replacement || '')}</ins> <span class="on" title="${votes(p)}">${esc(p.author || '')} · version ${esc(p.version ?? '')} · ${fate(p)}${p.note ? ` (${esc(p.note)})` : ''}</span>${p.reason ? ' ' + inline(p.reason) : ''}${cites(p.cites)}</p>`;
    const rest = props.filter(p => !used.has(p.id));
    return `<div><h3>Amendments</h3><p class="lead">${A.question ? inline(A.question) + ' · ' : ''}${A.threshold != null ? 'votes to pass ' + fmt(A.threshold) + ' · ' : ''}${A.versions.length} version${A.versions.length === 1 ? '' : 's'}</p>${
      A.versions.map(v => `${(v.from_proposals || []).map(id => props.find(p => p.id === id)).filter(Boolean).map(prop).join('')}<p><span class="st">Version ${esc(v.n)}.</span> ${inline(v.text || '')}</p>`).join('')}${
      rest.length ? `<p><span class="st">Proposed and not applied.</span></p>${rest.map(prop).join('')}` : ''}</div>`;
  }

  function plants(PL) {
    if (!S.plants || !PL || !(PL.plants || []).length) return '';
    return `<div><h3>Planted comments</h3><p class="lead">Comments placed on the page under a reader's name, to see whether the others catch a slip or dismiss a sound reading${PL.judge ? `; judged by ${esc(PL.judge)}` : ''}.</p>${
      grid(['Comment', 'Sort', 'Under the name of', 'Round', 'Replies', 'Outcome', 'Rounds to catch'], PL.plants.map(p => {
        const o = outcome(p), counts = Object.entries(p.counts || {}).filter(([, n]) => n).map(([v, n]) => `${n} ${esc(v)}`).join(', ');
        const reps = p.replies || [], own = reps.filter(r => r.nominal_author).length;
        const note = [counts, own ? `${own} by its nominal author, not counted` : ''].filter(Boolean).join('; ');
        return [cites([p.id]) || esc(p.id), p.sort === 'sound' ? 'sound reading' : 'slip', esc(p.author || ''), fmt(p.round),
          `${reps.length - own}${note ? ` <span class="on">${note}</span>` : ''}`,
          o ? esc(o.text) + (o.when ? ` in round ${esc(o.when)}` : '') : 'not judged', fmt(p.rounds_to_catch)];
      }))}${(PL.notes || []).length ? `<p class="on">${PL.notes.length} note${PL.notes.length === 1 ? '' : 's'} from judging, in plants.json.</p>` : ''}</div>`;
  }

  function drawApparatus() {
    const parts = [redactions(SIDE.redactions), forecasts(SIDE.forecasts), rulings(SIDE.rulings), amendments(SIDE.amendments), plants(SIDE.plants)].filter(Boolean);
    $('apparatus').innerHTML = parts.length ? '<h2>Apparatus</h2>' + parts.join('') : '';
    $('apparatus').hidden = !parts.length;
  }

  $('plants').hidden = !D.comments.some(isPlant);
  $('plants').addEventListener('click', e => { S.plants = !S.plants; e.target.setAttribute('aria-pressed', S.plants); if (sheet.open) sheet.close(); draw(); drawApparatus() });
  if (D.site && D.site.workflow) {
    const a = $('again');
    a.href = D.site.workflow; a.hidden = false;
    a.title = `Opens the Run workflow on GitHub. Only the repository owner can start it: choose mode “extend” and enter this run's name, ${D.site.run}.`;
  }

  // Printing: one poster sheet. PAPER is A1 landscape; for A3 landscape use { w: 420, h: 297, margin: 10 }.
  const PAPER = { w: 841, h: 594, margin: 12 };
  $('paper').textContent = `@page { size: ${PAPER.w}mm ${PAPER.h}mm; margin: ${PAPER.margin}mm }`;
  const px = mm => mm * 96 / 25.4, root = document.documentElement;
  function fitPrint() {
    if (sheet.open) sheet.close();
    const W = px(PAPER.w - 2 * PAPER.margin), H = px(PAPER.h - 2 * PAPER.margin), wrap = document.querySelector('.wrap');
    root.classList.add('printing'); root.style.setProperty('--print-w', W + 'px');
    const fits = fs => { root.style.setProperty('--print-fs', fs + 'px'); drawMargins(shown()); return wrap.offsetHeight <= H * 0.98 }; // a little room, since paper rounds lines differently
    let lo = 4, hi = W / 92; // at hi the sheet keeps its on-screen proportions, scaled up to the paper's width
    if (fits(hi)) return;
    for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid }
    fits(lo);
  }
  addEventListener('beforeprint', fitPrint);
  addEventListener('afterprint', () => { root.classList.remove('printing'); drawMargins(shown()) });
  $('print').addEventListener('click', () => print());

  const f = D.flags, row = (k, v) =>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
  $('made').innerHTML = `
    <div><h2>Reading the page</h2><p>The passage has a margin on either side. Comments on the passage stand in it, in the order of the words they attach to; small numbers in the passage show where each begins. Every comment has a margin of its own, on its far side from the passage, holding the comments on it, so a thread reads outward from the passage one column at a time, and takes as many columns as it is deep. Only where the page is too narrow for another column does a margin run beneath its comment, set in from the rule. Select a comment to read its whole thread.</p></div>
    <div><h2>Readers</h2><div class="tbl"><table>${D.readers.map(r => row(r.name, r.model)).join('')}</table></div></div>
    <div><h2>Settings</h2><div class="tbl"><table>${Object.entries(f).map(([k, v]) => row(k, v === null ? 'none' : v)).join('')}</table></div></div>
    <div><h2>What each reader was told</h2><pre>${esc(D.prompt_example || '')}</pre></div>
    ${authors.some(brandOf) ? '<div><h2>Logos</h2><p>Each reader is marked with its maker\'s logo and brand colour, to show whose model wrote what. The marks belong to their owners. Icons are linked from the <a href="https://github.com/lobehub/lobe-icons">lobe-icons</a> set.</p></div>' : ''}
    <div><h2>Round by round</h2><div class="tbl"><table><tr><th>Round</th><th>Reader</th><th>Comments</th><th>Note</th></tr>${
      [...D.log].sort((a, b) => a.layer - b.layer).map(l =>`<tr><td>${l.layer}</td><td>${esc(l.reader)}</td><td>${l.comments}</td><td>${esc(l.error ? 'Failed: ' + l.error : (l.closing || ''))}</td></tr>`).join('')}</table></div></div>`;
  draw(); drawApparatus();
  if (authors.some(brandOf)) { // logos are linked, not bundled: show them only once one is known to load
    const probe = new Image();
    probe.onload = () => { S.icons = true; draw() };
    probe.src = ICONS + 'claude.svg';
  }
  if (location.hash) go(location.hash.slice(1));
}
start();
</script>
